services:
  media-origin-preview:
    image: nginx:1.28-alpine
    container_name: mad4b-tenant-media-origin-preview
    user: "33:33"
    entrypoint: ["/usr/sbin/nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m
    ports:
      - "127.0.0.1:8097:8080"
    volumes:
      - ./generated/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${MEDIA_SOURCE_ROOT:?set_media_source_root}:/srv/media/etg:ro
    restart: unless-stopped
