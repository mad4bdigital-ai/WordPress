worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;
    default_type application/octet-stream;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        autoindex off;
        disable_symlinks on;

        add_header X-Content-Type-Options nosniff always;

        location = /__health {
            default_type text/plain;
            return 200 "media-preview-ok\n";
        }

        # ONE non-sensitive fixture is exposed for loopback proof only.
        # Every other image, directory, PHP, JSON, SQL, backup,
        # unreviewed attachment or tenant path remains inaccessible.
        location = /2026/10/placeholder-3-100x100.png {
            alias /srv/media-origin/2026/10/placeholder-3-100x100.png;
            default_type image/png;
            add_header Cache-Control "private, max-age=60" always;
        }

        location / {
            return 404;
        }
    }
}
