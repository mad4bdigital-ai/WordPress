# BEGIN MAD4B COMPANY PERFORMANCE PRESET v1 — verified synthetic public only
# Host-scoped and cookie/query/auth/HTTP-method fail-closed.
fastcgi_cache_path /var/cache/nginx/etg_woo_perf_v1 levels=1:2 keys_zone=etg_woo_perf_v1:8m inactive=10m max_size=64m use_temp_path=off;
map $host $company_perf_wrong_host { default 1; tours.dev.mad4b.com 0; }
map $http_cookie $company_perf_has_cookie { default 1; "" 0; }
map $http_authorization $company_perf_has_auth { default 1; "" 0; }
map $args $company_perf_has_query { default 1; "" 0; }
map $request_method $company_perf_unsafe_method { default 1; GET 0; HEAD 0; }
map $upstream_http_x_mad4b_cache_eligibility $company_perf_no_origin_optin { default 1; "public-static-v1" 0; }
map "$http_x_mad4b_bypass_cache$http_x_wp_nonce$http_x_mad4b_currency$http_x_geo_country$http_cf_ipcountry$http_x_forwarded_geo_country$http_x_requested_with" $company_perf_has_context_headers { default 1; "" 0; }
map "$company_perf_wrong_host$company_perf_has_cookie$company_perf_has_auth$company_perf_has_query$company_perf_unsafe_method$company_perf_has_context_headers" $company_perf_skip { default 1; "000000" 0; }
# END MAD4B COMPANY PERFORMANCE PRESET
limit_req_zone $binary_remote_addr zone=etg_lab_seo_ajax:1m rate=6r/s;
server {
 listen 8080;
 server_name _;
 # Lab-only wire compression; no page cache or personalized-data storage.
 # Mobile Lighthouse otherwise downloads 1.5+ MiB of uncompressed markup.
 gzip on;
 gzip_vary on;
 gzip_proxied any;
 gzip_comp_level 5;
 gzip_min_length 1024;
 gzip_types text/plain text/css text/javascript application/javascript application/x-javascript application/json application/xml text/xml image/svg+xml;
 root /var/www/html;
 index index.php;
 autoindex off;
 client_max_body_size 64m;
 # Isolated WooCommerce Lab: protect public SEO AJAX even without WordPress object cache.
 location = /wp-json/etg-dfsb/v1/ajax-presentation {
   limit_req zone=etg_lab_seo_ajax burst=12 nodelay;
   limit_req_status 429;
   include fastcgi_params;
   fastcgi_param SCRIPT_FILENAME $document_root/index.php;
   fastcgi_param SCRIPT_NAME /index.php;
   fastcgi_pass etg-commerce-staging-php:9000;
   fastcgi_read_timeout 120s;
 }
 # BEGIN MAD4B COMPANY PERFORMANCE PRESET v1 — ONLY synthetic probe
 location = /__mad4b_public_perf_probe__/ {
   include fastcgi_params;
   fastcgi_param SCRIPT_FILENAME $document_root/index.php;
   fastcgi_param SCRIPT_NAME /index.php;
   fastcgi_pass etg-commerce-staging-php:9000;
   fastcgi_read_timeout 30s;
   fastcgi_cache etg_woo_perf_v1;
   fastcgi_cache_key "$host|$request_uri|$request_method";
   fastcgi_cache_methods GET HEAD;
   fastcgi_cache_valid 200 60s;
   fastcgi_cache_lock on;
   fastcgi_cache_lock_timeout 10s;
   fastcgi_cache_use_stale off;
   fastcgi_cache_bypass $company_perf_skip;
   fastcgi_no_cache $company_perf_skip $company_perf_no_origin_optin $upstream_http_set_cookie;
   add_header X-MAD4B-Preset-Cache $upstream_cache_status always;
 }
 # END MAD4B COMPANY PERFORMANCE PRESET
 # BEGIN MAD4B ANONYMOUS HOMEPAGE MICROCACHE STAGING v1
 # WP sends eligibility only for anonymous cookie-free base-currency/default-address GET.
 # Auth, cookies, query, geo, currency and AJAX/bypass headers fail closed.
 # WP-generated guest nonces remain valid longer than this bounded 30-second TTL.
 location = / {
   include fastcgi_params;
   fastcgi_param SCRIPT_FILENAME $document_root/index.php;
   fastcgi_param SCRIPT_NAME /index.php;
   fastcgi_pass etg-commerce-staging-php:9000;
   fastcgi_read_timeout 120s;
   fastcgi_cache etg_woo_perf_v1;
   fastcgi_cache_key "$host|$request_uri|$request_method";
   fastcgi_cache_methods GET HEAD;
   fastcgi_cache_valid 200 30s;
   fastcgi_cache_lock on;
   fastcgi_cache_lock_timeout 10s;
   fastcgi_cache_use_stale off;
   fastcgi_cache_bypass $company_perf_skip;
   fastcgi_no_cache $company_perf_skip $company_perf_no_origin_optin $upstream_http_set_cookie;
   add_header X-MAD4B-Preset-Cache $upstream_cache_status always;
 }
 location ~ ^/(?:ar|fr|de|it|es)/$ {
