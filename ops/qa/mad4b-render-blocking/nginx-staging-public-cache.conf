   fastcgi_param SCRIPT_NAME /index.php;
   fastcgi_pass etg-commerce-staging-php:9000;
   fastcgi_read_timeout 120s;
   fastcgi_cache etg_woo_perf_v1;
   fastcgi_cache_key "$host|$request_uri|$request_method";
   fastcgi_cache_methods GET HEAD;
   fastcgi_cache_valid 200 30s;
   fastcgi_cache_lock on;
   fastcgi_cache_lock_timeout 10s;
   fastcgi_cache_use_stale off;
   fastcgi_cache_bypass $company_perf_skip;
   fastcgi_no_cache $company_perf_skip $company_perf_no_origin_optin $upstream_http_set_cookie;
   add_header X-MAD4B-Preset-Cache $upstream_cache_status always;
 }
 location ~ ^/(?:ar/|fr/|de/|es/|it/)?tours-and-activities/$ {
   include fastcgi_params;
   fastcgi_param SCRIPT_FILENAME $document_root/index.php;
   fastcgi_param SCRIPT_NAME /index.php;
   fastcgi_pass etg-commerce-staging-php:9000;
   fastcgi_read_timeout 120s;
   fastcgi_cache etg_woo_perf_v1;
   fastcgi_cache_key "$host|$request_uri|$request_method";
   fastcgi_cache_methods GET HEAD;
   fastcgi_cache_valid 200 15s;
   fastcgi_cache_lock on;
   fastcgi_cache_lock_timeout 10s;
   fastcgi_cache_use_stale off;
   fastcgi_cache_bypass $company_perf_skip;
   fastcgi_no_cache $company_perf_skip $company_perf_no_origin_optin $upstream_http_set_cookie;
   add_header X-MAD4B-Preset-Cache $upstream_cache_status always;
 }
 # END MAD4B ANONYMOUS HOMEPAGE MICROCACHE STAGING
 # BEGIN MAD4B COMPANY PERFORMANCE PRESET — STATIC BROWSER CACHE STAGING
 # Hashed LiteSpeed bundles are content-addressed, safe for immutable caching.
 location ~* "^/wp-content/litespeed/(?:css|js)/[a-f0-9]{32}\.(?:css|js)$" {
   try_files $uri =404;
   access_log off;
   add_header Cache-Control "public, max-age=31536000, immutable" ;
 }
 # WP plugin/theme/core resources may change in place; keep a bounded TTL.
 location ~* ^/(?:wp-content/(?:plugins|themes)|wp-includes)/.+\.(?:css|js|woff2?|ttf|otf|svg|png|jpe?g|webp|avif|gif|ico)$ {
   try_files $uri =404;
   access_log off;
   add_header Cache-Control "public, max-age=604800" ;
 }
 # Uploaded media can be overwritten via WordPress; avoid immutable policy.
 location ~* ^/wp-content/uploads/.+\.(?:png|jpe?g|webp|avif|gif|ico|svg|woff2?|ttf|otf)$ {
   try_files $uri =404;
   access_log off;
   add_header Cache-Control "public, max-age=604800" ;
 }
 # END MAD4B COMPANY PERFORMANCE PRESET — STATIC BROWSER CACHE
 # BEGIN MAD4B STAGING — PRIVATE COMMERCE HTML NO-STORE
 # Only the three known public WooCommerce commerce entrypoints; passes all
 # request methods and cookies to WordPress, without response page caching.
 location ~* "^/(?:cart|checkout|my-account)/?$" {
   include fastcgi_params;
   fastcgi_param SCRIPT_FILENAME $document_root/index.php;
   fastcgi_param SCRIPT_NAME /index.php;
   fastcgi_pass etg-commerce-staging-php:9000;
   fastcgi_read_timeout 120s;
   fastcgi_hide_header Cache-Control;
   fastcgi_hide_header Expires;
   add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
   add_header Pragma "no-cache" always;
 }
 # END MAD4B STAGING — PRIVATE COMMERCE HTML NO-STORE
 # Public ARD v0.91 manifest: JSON delivered as the registered ARD media type.
 location = /.well-known/ard.json {
   types { application/ard+json json; }
   default_type application/ard+json;
   try_files $uri =404;
   access_log off;
   add_header Cache-Control "public, max-age=300";
 }
 location / { try_files $uri $uri/ /index.php?$args; }
 # Deny sensitive config and backup files BEFORE the generic PHP handler.
 location ~* (^|/)(wp-config\.php|\.env|composer\.(json|lock)|[^/]+\.sql)$ { deny all; }
 # Uploaded PHP is never executable, even through a legitimate public URL.
 location ~* ^/wp-content/uploads/.*\.php(?:$|/) { deny all; }
 location ~ \.php$ {
   try_files $uri =404;
   include fastcgi_params;
   fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
   fastcgi_pass etg-commerce-staging-php:9000;
   fastcgi_read_timeout 120s;
 }
 location ~ /\.(?!well-known) { deny all; }
}
