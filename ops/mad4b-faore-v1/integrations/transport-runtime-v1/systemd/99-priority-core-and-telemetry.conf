[Unit]
# Retain the single original timer and Broker; trigger noncritical probes after core.
OnSuccess=mad4b-dispatch-telemetry.service

[Service]
# Reset historical appended ExecStart commands, prioritize exact queue and signed receipts.
ExecStart=
ExecStart=/usr/bin/python3 /opt/mad4b-company-transport/onboarding-v1.py scan
ExecStart=/usr/bin/python3 /opt/mad4b-company-transport/dispatch-v1.py recheck --limit 30
ExecStart=/usr/bin/python3 /opt/mad4b-company-transport/dispatch-v1.py run --limit 20
ExecStart=/usr/bin/python3 /opt/mad4b-company-transport/broker-v1/vps-broker-poller.py sweep --limit=10
ExecStart=/usr/bin/python3 /opt/mad4b-company-transport/broker-v1/broker-native-ssh-reconcile.py reconcile
ExecStart=-/usr/bin/python3 /opt/mad4b-company-transport/unified-execution-router-v1/scheduled_dispatch.py
ExecStart=-/usr/bin/python3 /opt/mad4b-company-transport/unified-execution-router-v1/receipt_reconcile.py
TimeoutStartSec=240
