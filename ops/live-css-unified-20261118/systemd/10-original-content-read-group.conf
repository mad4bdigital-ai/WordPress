# The read-only source family registry must read original 421/422 MU runtime
# files inside each site's 0770 www-data WP_CONTENT_DIR. Its systemd
# CapabilityBoundingSet= intentionally excludes root's DAC_OVERRIDE.
# Supplement only the existing WP file read group; ProtectSystem=strict
# still makes every WordPress tree read-only to this service.
[Service]
SupplementaryGroups=www-data
