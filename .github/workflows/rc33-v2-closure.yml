name: RC33 V2 Closure Migration

on:
  push:
    branches:
      - feat/dynamic-wordpress-skills-20260909
    paths:
      - '.github/rc33-v2-closure.py'
      - '.github/workflows/rc33-v2-closure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact migration head
        uses: actions/checkout@v4
        with:
          ref: feat/dynamic-wordpress-skills-20260909
          fetch-depth: 0

      - name: Guard staging delta
        shell: bash
        run: |
          set -euo pipefail
          base='79ec52c3e1edc3fa1472c1de7fbea2151bb9654a'
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base"..HEAD)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/rc33-v2-closure\.py|\.github/workflows/rc33-v2-closure\.yml)$' || true)"
          test -z "$bad"

      - name: Apply closure migration
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/rc33-v2-closure.py

      - name: Validate runtime and contracts
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          php -l "$root/bootstrap/mad4b-mcp-adapter-mu-bootstrap.php"
          php -l "$root/tests/runtime-mcp-web-lifecycle.php"
          php -l "$root/tests/runtime-mcp-adapter-metadata-bridge.php"
          php -l "$root/tests/live-acceptance-reconciler-runtime.php"
          php -l "$root/tests/runtime-connection-readiness-smoke.php"
          python3 "$root/tests/skill-runtime-certification-contract.py"
          python3 "$root/tests/mcp-registration-bridge-contract.py"
          php "$root/tests/live-acceptance-reconciler-runtime.php"
          grep -Fq "get_option( 'mad4b_scp_site_profile_v2', array() )" "$root/bootstrap/mad4b-mcp-adapter-mu-bootstrap.php"
          grep -Fq "'mad4b.site-profile.v2' === (string) \$mad4b_mcp_mu_profile['contract']" "$root/bootstrap/mad4b-mcp-adapter-mu-bootstrap.php"
          if grep -Fq "mad4b_scp_site_profile_v1" "$root/bootstrap/mad4b-mcp-adapter-mu-bootstrap.php" || grep -Fq "mad4b.site-profile.v1" "$root/bootstrap/mad4b-mcp-adapter-mu-bootstrap.php"; then
            echo 'MU bootstrap must not treat legacy v1 enrollment as governed.' >&2
            exit 1
          fi
          grep -Fq "rank_math_meta_governed_nonproduction_only" "$root/tests/runtime-mcp-adapter-metadata-bridge.php"
          grep -Fq "profile_app_mapping_mismatch" "$root/tests/skill-runtime-certification-contract.py"
          grep -Fq "Site Profile URL" "$root/tests/live-acceptance-observer-runtime.php" || true
          grep -Fq "MAD4B_SCP_Site_Profile::origin_enrolled()" "$root/tests/mcp-registration-bridge-contract.py"
          grep -Fq "MAD4B_SCP_Site_Profile::save_current_site" .github/workflows/mad4b-live-acceptance-evidence.yml
          grep -Fq "plugin_asdk_app_6aa05fa2f97481919c24b99855fadba2" .github/workflows/mad4b-live-acceptance-evidence.yml
          git diff --check

      - name: Stage validated workflow bytes and push non-workflow patch
        shell: bash
        run: |
          set -euo pipefail
          stage='.github/rc33-workflow-staging'
          mkdir -p "$stage"
          cp .github/workflows/mad4b-live-acceptance-evidence.yml "$stage/mad4b-live-acceptance-evidence.yml"

          # The Actions token cannot modify workflow files. Keep the validated target
          # bytes above, restore the workflow path, and push only runtime/tests/staging.
          git restore --source=HEAD -- .github/workflows/mad4b-live-acceptance-evidence.yml

          git config user.name 'MAD4B Automation'
          git config user.email 'mad4b.digital@gmail.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'fix(rc33): close Site Profile v2 CI/runtime gaps'
          git push origin HEAD:feat/dynamic-wordpress-skills-20260909
