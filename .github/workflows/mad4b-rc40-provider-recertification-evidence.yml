name: MAD4B RC40 Provider Recertification Evidence

on:
  pull_request:
    paths:
      - 'wp-content/plugins/jet-engine.zip'
      - 'wp-content/plugins/jet-smart-filters.zip'
      - 'wp-content/plugins/bit-pi.zip'
      - 'wp-content/plugins/wp-all-import-pro.zip'
      - 'wp-content/plugins/wp-all-export-pro.zip'
      - 'wp-content/plugins/mad4b-site-control-plane/config/certified-providers.json'
      - 'wp-content/plugins/mad4b-site-control-plane/config/certified-provider-profiles.json'
      - 'wp-content/plugins/mad4b-site-control-plane/config/premium-provider-attestations.json'
      - 'tools/capture-provider-recertification-evidence.py'
      - 'tools/normalize-premium-provider-package.py'
      - 'tools/premium-provider-attestation.py'
      - '.github/workflows/mad4b-rc40-provider-recertification-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-rc40-provider-recertification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Exact RC40 provider recertification evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Capture exact repository provider evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mad4b-provider-recertification
          python3 tools/capture-provider-recertification-evidence.py \
            /tmp/mad4b-provider-recertification/provider-recertification-evidence.json

      - name: Normalize premium repository packages
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/mad4b-provider-recertification/normalized
          mkdir -p "$out"
          python3 tools/normalize-premium-provider-package.py \
            --provider jetengine \
            --input wp-content/plugins/jet-engine.zip \
            --output "$out/jet-engine.zip" \
            --expected-version 3.8.15 \
            --report "$out/jetengine-normalization.json"
          python3 tools/normalize-premium-provider-package.py \
            --provider jetsmartfilters \
            --input wp-content/plugins/jet-smart-filters.zip \
            --output "$out/jet-smart-filters.zip" \
            --expected-version 3.8.5 \
            --report "$out/jetsmartfilters-normalization.json"

      - name: Build non-authorizing premium attestation candidates
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/mad4b-provider-recertification
          locator_base="repository-normalized:${GITHUB_REPOSITORY}@${SOURCE_SHA}:wp-content/plugins"
          python3 tools/premium-provider-attestation.py \
            --provider jetengine \
            --package "$root/normalized/jet-engine.zip" \
            --expected-version 3.8.15 \
            --source-kind owner_supplied_exact_package \
            --source-locator "$locator_base/jet-engine.zip" \
            --attested-by "ci-candidate-only:$SOURCE_SHA" \
            --output "$root/jetengine-attestation-candidate.json"
          python3 tools/premium-provider-attestation.py \
            --provider jetsmartfilters \
            --package "$root/normalized/jet-smart-filters.zip" \
            --expected-version 3.8.5 \
            --source-kind owner_supplied_exact_package \
            --source-locator "$locator_base/jet-smart-filters.zip" \
            --attested-by "ci-candidate-only:$SOURCE_SHA" \
            --output "$root/jetsmartfilters-attestation-candidate.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/mad4b-provider-recertification')
          out = {
              'contract': 'mad4b.premium-provider-attestation-candidates.v1',
              'non_authorizing': True,
              'candidates': {
                  'jetengine': json.loads((root / 'jetengine-attestation-candidate.json').read_text()),
                  'jetsmartfilters': json.loads((root / 'jetsmartfilters-attestation-candidate.json').read_text()),
              },
          }
          (root / 'premium-attestation-candidates.json').write_text(
              json.dumps(out, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Validate fail-closed recertification boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path('/tmp/mad4b-provider-recertification')
          data = json.loads((root / 'provider-recertification-evidence.json').read_text())
          if data.get('contract') != 'mad4b.provider-recertification-evidence.v1':
              raise SystemExit('recertification evidence contract mismatch')
          if data.get('source_commit_sha') != os.environ['SOURCE_SHA']:
              raise SystemExit('recertification evidence exact-head mismatch')

          expected = {'jetengine', 'jetsmartfilters', 'bit_pi', 'wp-import-export'}
          if set(data.get('providers', {})) != expected:
              raise SystemExit('provider evidence set mismatch')

          for provider in ('jetengine', 'jetsmartfilters', 'bit_pi'):
              row = data['providers'][provider]
              if not row.get('critical_manifest_complete'):
                  raise SystemExit(f'{provider}: critical manifest incomplete')
              if not row.get('archive_sha256') or len(row['archive_sha256']) != 64:
                  raise SystemExit(f'{provider}: archive SHA missing')
              if provider in ('jetengine', 'jetsmartfilters'):
                  if row.get('authority_gate') != 'premium_semantic_attestation_required':
                      raise SystemExit(f'{provider}: premium attestation gate weakened')
              elif row.get('authority_gate') != 'behavioral_recertification_required':
                  raise SystemExit('bit_pi behavioral recertification gate weakened')

          composite = data['providers']['wp-import-export']
          if composite.get('authority_gate') != 'composite_behavioral_recertification_required':
              raise SystemExit('wp-import-export composite gate weakened')
          if set(composite.get('components', {})) != {'import', 'export'}:
              raise SystemExit('wp-import-export component set mismatch')
          for component, row in composite['components'].items():
              if not row.get('critical_manifest_complete'):
                  raise SystemExit(f'wp-import-export:{component}: critical manifest incomplete')

          candidates = json.loads((root / 'premium-attestation-candidates.json').read_text())
          profiles = json.loads(Path('wp-content/plugins/mad4b-site-control-plane/config/certified-provider-profiles.json').read_text())
          if candidates.get('contract') != 'mad4b.premium-provider-attestation-candidates.v1':
              raise SystemExit('premium candidate contract mismatch')
          if candidates.get('non_authorizing') is not True:
              raise SystemExit('premium candidates became authorizing')
          policy = profiles['premium_provider_policy']
          for provider, expected_version in (('jetengine', '3.8.15'), ('jetsmartfilters', '3.8.5')):
              row = candidates['candidates'][provider]
              if row['version'] != expected_version:
                  raise SystemExit(f'{provider}: candidate version mismatch')
              review = row.get('semantic_review', {})
              if review.get('status') != 'pending' or review.get('approved') is not False or review.get('review_id') != '':
                  raise SystemExit(f'{provider}: semantic review gate was not preserved')
              if row['archive_sha256'] != policy[provider]['normalized_archive_sha256']:
                  raise SystemExit(f'{provider}: normalized archive SHA mismatch')
              if int(row['archive_bytes']) != int(policy[provider]['normalized_archive_bytes']):
                  raise SystemExit(f'{provider}: normalized archive byte count mismatch')
              if profiles['providers'][provider]:
                  raise SystemExit(f'{provider}: certified profile appeared before semantic review')

          print('mad4b.provider-recertification-evidence.v1: PASS')
          print('premium attestation candidates: PASS (non-authorizing)')
          PY

      - name: Upload exact recertification evidence
        uses: actions/upload-artifact@v4
        with:
          name: mad4b-rc40-provider-recertification-evidence-${{ env.SOURCE_SHA }}
          path: |
            /tmp/mad4b-provider-recertification/provider-recertification-evidence.json
            /tmp/mad4b-provider-recertification/premium-attestation-candidates.json
            /tmp/mad4b-provider-recertification/jetengine-attestation-candidate.json
            /tmp/mad4b-provider-recertification/jetsmartfilters-attestation-candidate.json
            /tmp/mad4b-provider-recertification/normalized/*-normalization.json
          if-no-files-found: error
          retention-days: 30
