name: MAD4B MCP Client Compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/mad4b-mcp-client-compatibility.yml'
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - 'wp-content/plugins/mcp-adapter.zip'
      - 'wp-includes/**'
      - 'wp-content/mu-plugins/**'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-mcp-client-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: MCP client compatibility contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify dynamic client-agnostic discovery contract
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          php -l "$root/includes/class-mad4b-scp-mcp-client-profile-registry.php"
          php -l "$root/includes/class-mad4b-scp-mcp-client-compatibility.php"
          php -l "$root/includes/class-mad4b-scp-identifiers.php"
          php -l "$root/includes/class-mad4b-scp-identity-context.php"
          php -l "$root/includes/class-mad4b-scp-ability-contract-inspector.php"
          php -l "$root/includes/class-mad4b-scp-capability-descriptor-registry.php"
          php -l "$root/includes/class-mad4b-scp-preparation-receipt.php"
          php -l "$root/includes/class-mad4b-scp-chatgpt-tool-projection.php"
          php -l "$root/includes/class-mad4b-scp-ability-catalog-transport.php"
          php -l "$root/includes/class-mad4b-scp-database-transaction-guard.php"
          php -l "$root/includes/class-mad4b-scp-unified-capability-gateway.php"
          php -l "$root/includes/class-mad4b-scp-catalog-object-store.php"
          php -l "$root/tools/catalog-decommission.php"
          php "$root/tests/catalog-transport-runtime.php"
          php "$root/tests/database-transaction-guard-runtime.php"
          python3 "$root/tests/capability-fabric-bulk-hardening-contract.py"
          node "$root/tests/catalog-transport-client.mjs"
          node "$root/tests/network-catalog-client.mjs"
          node "$root/tests/catalog-transport-failures.mjs"
          php "$root/tests/projection-registration-lifecycle.php"
          php "$root/tests/gateway-regression-runtime.php"
          php "$root/tests/identity-context-runtime.php"
          php "$root/tests/ability-contract-inspector-runtime.php"
          php "$root/tests/preparation-receipt-runtime.php"
          php "$root/tests/execution-state-view-runtime.php"
          php "$root/tests/intent-registry-contract.php"
          php "$root/tests/catalog-lifecycle-runtime.php"
          php "$root/tests/catalog-decommission-bootstrap.php"
          python3 "$root/tests/plugin-lifecycle-data-retention-contract.py"
          php -l "$root/tests/runtime-unified-capability-gateway.php"
          php -l "$root/tests/runtime-mcp-client-compatibility-smoke.php"
          php -l "$root/tests/runtime-chatgpt-tool-inventory-smoke.php"
          php -l "$root/tests/runtime-chatgpt-dynamic-tool-projection.php"
          python3 -m json.tool "$root/config/mcp-client-profiles.json" >/dev/null
          python3 "$root/tests/mcp-client-compatibility-contract.py"
          python3 "$root/tests/chatgpt-dynamic-tool-projection-contract.py"
          python3 "$root/tests/unified-capability-gateway-contract.py"
          python3 "$root/tests/gateway-mutation-guards.py"

  catalog-compatibility:
    name: Catalog runtime (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint production PHP and exercise catalog lifecycle
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          find "$root/includes" -name '*.php' -print0 | xargs -0 -n1 php -l
          php "$root/tests/catalog-transport-runtime.php"
          php "$root/tests/database-transaction-guard-runtime.php"
          python3 "$root/tests/capability-fabric-bulk-hardening-contract.py"
          php "$root/tests/projection-registration-lifecycle.php"
          php "$root/tests/gateway-regression-runtime.php"
          php "$root/tests/identity-context-runtime.php"
          php "$root/tests/ability-contract-inspector-runtime.php"
          php "$root/tests/preparation-receipt-runtime.php"
          php "$root/tests/execution-state-view-runtime.php"
          php "$root/tests/intent-registry-contract.php"
          php "$root/tests/catalog-lifecycle-runtime.php"
          php "$root/tests/catalog-decommission-bootstrap.php"
          python3 "$root/tests/plugin-lifecycle-data-retention-contract.py"

  runtime:
    name: MCP client compatibility runtime (${{ matrix.wordpress }} / PHP ${{ matrix.php }} / ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.9'
            php: '7.4'
            database: mysql:8.0
            health_command: mysqladmin ping -h 127.0.0.1 -uroot -proot
          - wordpress: 'latest'
            php: '8.3'
            database: mysql:8.0
            health_command: mysqladmin ping -h 127.0.0.1 -uroot -proot
          - wordpress: 'latest'
            php: '8.3'
            database: mariadb:11.8
            health_command: mariadb-admin ping -h 127.0.0.1 -uroot -proot

    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health_command }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, openssl
          coverage: none

      - name: Install WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar

      - name: Provision disposable Staging WordPress
        shell: bash
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-wordpress
          rm -rf "$WP_PATH"
          mkdir -p "$WP_PATH"
          php /tmp/wp-cli.phar core download --path="$WP_PATH" --version="$WP_VERSION" --force
          php /tmp/wp-cli.phar config create --path="$WP_PATH" --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core install --path="$WP_PATH" --url='http://mad4b-client.test' --title='MAD4B Client Compatibility' --admin_user='mad4b-ci-admin' --admin_password='ci-only-not-a-secret' --admin_email='ci@example.invalid' --skip-email
          php /tmp/wp-cli.phar option update home 'https://mad4b-client.test' --path="$WP_PATH"
          php /tmp/wp-cli.phar option update siteurl 'https://mad4b-client.test' --path="$WP_PATH"
          php /tmp/wp-cli.phar option update permalink_structure '/%postname%/' --path="$WP_PATH"
          php /tmp/wp-cli.phar config set WP_ENVIRONMENT_TYPE staging --type=constant --path="$WP_PATH"
          php /tmp/wp-cli.phar config set MAD4B_MCP_OAUTH_ENABLED true --raw --type=constant --path="$WP_PATH"
          php /tmp/wp-cli.phar config set MAD4B_MCP_OAUTH_ISSUER 'https://auth.mad4b.test' --type=constant --path="$WP_PATH"
          php /tmp/wp-cli.phar config set MAD4B_MCP_OAUTH_WP_USER_ID 1 --raw --type=constant --path="$WP_PATH"
          php /tmp/wp-cli.phar config set MAD4B_MCP_OAUTH_ALLOWED_SUBJECTS 'user:compatibility-ci' --type=constant --path="$WP_PATH"

      - name: Install exact MCP Adapter and control plane
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-wordpress
          python3 "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/materialize-packaged-plugin.py" --archive wp-content/plugins/mcp-adapter.zip --plugins-dir "$WP_PATH/wp-content/plugins" --slug mcp-adapter
          rm -rf "$WP_PATH/wp-content/plugins/mad4b-site-control-plane"
          cp -R wp-content/plugins/mad4b-site-control-plane "$WP_PATH/wp-content/plugins/mad4b-site-control-plane"
          php /tmp/wp-cli.phar plugin activate mcp-adapter --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate mad4b-site-control-plane --path="$WP_PATH"
          mkdir -p "$WP_PATH/wp-content/mu-plugins"
          cp "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-chatgpt-projection-fixtures.php" "$WP_PATH/wp-content/mu-plugins/mad4b-projection-ci.php"

      - name: Prove dynamic vendor-neutral RFC 9728 discovery
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-mcp-client-compatibility-smoke.php" --path=/tmp/mad4b-wordpress --user=mad4b-ci-admin

      - name: Prove ChatGPT server contains the refresh-safe minimal governed tool inventory
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-chatgpt-tool-inventory-smoke.php" --path=/tmp/mad4b-wordpress --user=mad4b-ci-admin

      - name: Prove arbitrary registered Abilities can be dynamically projected
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-chatgpt-dynamic-tool-projection.php" --path=/tmp/mad4b-wordpress --user=mad4b-ci-admin

      - name: Prove adaptive unified capability gateway remains non-authorizing
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-unified-capability-gateway.php" --path=/tmp/mad4b-wordpress --user=mad4b-ci-admin

      - name: Prove transactional storage and transaction ownership
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-database-transaction-guard.php" --path=/tmp/mad4b-wordpress --user=mad4b-ci-admin

      - name: Prove independent database builds and non-destructive cron lifecycle
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-catalog-build-concurrency.php" --path=/tmp/mad4b-wordpress --user=mad4b-ci-admin

      - name: Prove explicit offline catalog retirement preserves authority
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-catalog-decommission.php" --path=/tmp/mad4b-wordpress --user=mad4b-ci-admin

      - name: Prove fresh-process inactive decommission plan and apply
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-wordpress
          PLUGIN=mad4b-site-control-plane
          PLUGIN_PATH="$WP_PATH/wp-content/plugins/$PLUGIN"
          HELPER="$PLUGIN_PATH/tests/catalog-decommission-fresh-process.php"
          TOOL="$PLUGIN_PATH/tools/catalog-decommission.php"
          PLAN=/tmp/mad4b-catalog-decommission-fresh-plan.json
          APPLY=/tmp/mad4b-catalog-decommission-fresh-apply.json
          FIXTURE=mad4b_ct2_2000000000_bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          cleanup() {
            rm -f "$WP_PATH/.maintenance" "$PLAN" "$APPLY"
            php /tmp/wp-cli.phar plugin activate "$PLUGIN" --path="$WP_PATH" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          php /tmp/wp-cli.phar plugin deactivate "$PLUGIN" --path="$WP_PATH"
          php /tmp/wp-cli.phar eval "delete_option('$FIXTURE'); add_option('$FIXTURE', array('fresh_process_fixture'=>true), '', false);" --path="$WP_PATH" --user=mad4b-ci-admin
          printf '<?php $upgrading = %s;' "$(date +%s)" > "$WP_PATH/.maintenance"
          php /tmp/wp-cli.phar eval-file "$HELPER" --path="$WP_PATH" --user=mad4b-ci-admin > "$PLAN"
          SHA="$(python3 - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('/tmp/mad4b-catalog-decommission-fresh-plan.json').read_text())
          plan=doc.get('plan',{})
          assert plan.get('contract') == 'mad4b.catalog-offline-purge.v1', plan
          assert plan.get('origin') == 'https://mad4b-client.test', plan
          assert 'mad4b_ct2_2000000000_bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' in plan.get('objects',{}), plan
          assert set(plan.get('preserves',[])) >= {'projection','grants','approvals','audit','site_profile'}, plan
          sha=doc.get('plan_sha256','')
          assert isinstance(sha,str) and len(sha)==64, doc
          print(sha)
          PY
          )"
          php /tmp/wp-cli.phar eval-file "$TOOL" apply "$PLAN" "$SHA" --path="$WP_PATH" --user=mad4b-ci-admin > "$APPLY"
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/mad4b-catalog-decommission-fresh-apply.json').read_text())
          assert result.get('readback_verified') is True, result
          assert result.get('authority_data_deleted') is False, result
          assert int(result.get('deleted',0)) > 0, result
          print('PASS fresh-process decommission: inactive plugin, exact reviewed plan, real deletion, empty readback and authority retention')
          PY
          cleanup
          trap - EXIT

      - name: Prove initialize and minimal tools/list over the pinned Adapter protocol
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-wordpress
          cat > /tmp/mad4b-chatgpt-protocol.jsonl <<'JSONRPC'
          {"jsonrpc":"2.0","id":40,"method":"initialize","params":{"protocolVersion":"2025-11-25","clientInfo":{"name":"mad4b-chatgpt-ci","version":"1.0.0"}}}
          {"jsonrpc":"2.0","id":41,"method":"tools/list","params":{}}
          JSONRPC

          php /tmp/wp-cli.phar --path="$WP_PATH" mcp-adapter serve --server=mad4b-chatgpt --user=mad4b-ci-admin \
            < /tmp/mad4b-chatgpt-protocol.jsonl \
            > /tmp/mad4b-chatgpt-protocol-response.jsonl

          cat /tmp/mad4b-chatgpt-protocol-response.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/mad4b-chatgpt-protocol-response.jsonl')
          responses = []
          for line in path.read_text(encoding='utf-8').splitlines():
              line = line.strip()
              if line:
                  responses.append(json.loads(line))

          by_id = {item.get('id'): item for item in responses if isinstance(item, dict)}
          init = by_id.get(40)
          tools_response = by_id.get(41)
          if not init or 'result' not in init or 'error' in init:
              raise SystemExit(f'initialize failed: {init!r}')
          if not tools_response or 'result' not in tools_response or 'error' in tools_response:
              raise SystemExit(f'tools/list failed: {tools_response!r}')

          tools = tools_response['result'].get('tools', [])
          if not isinstance(tools, list) or not tools:
              raise SystemExit('tools/list returned an empty tool inventory')
          names = sorted({tool.get('name') for tool in tools if isinstance(tool, dict) and isinstance(tool.get('name'), str)})

          required = {
              'mad4b-site-info',
              'mad4b-site-profile-status',
              'mad4b-session-safe-diagnostics',
              'mad4b-tool-discover',
              'mad4b-tool-info',
              'mad4b-read-execute',
              'mad4b-write-discover',
              'mad4b-write-info',
              'mad4b-write-execute',
              'mad4b-plugin-package-plan',
          }
          missing = sorted(required.difference(names))
          if missing:
              raise SystemExit(f'tools/list missing required minimal Staging transport tools: {missing}')

          hidden = {
              'mad4b-full-staging-authority-apply',
              'mad4b-build-provenance-status',
              'mad4b-diagnostics-health',
              'mad4b-runtime-authority-status',
              'mad4b-multi-authority-registry-status',
              'mad4b-connection-status',
              'mad4b-connector-preflight',
              'mad4b-read-snapshot-header',
              'mad4b-read-diagnostic-bundle',
              'mad4b-control-plane-update-status',
              'mad4b-remote-operation-parity-status',
              'mad4b-write-authority-status',
              'mad4b-write-authority-reconciliation-plan',
              'mad4b-write-runtime-certification',
              'mad4b-rest-compatibility-status',
              'mad4b-staging-certification-status',
              'mad4b-full-staging-authority-status',
              'mad4b-list-post-types',
              'mad4b-list-plugins',
              'mad4b-abilities-inventory',
              'mad4b-filesystem-list',
              'mad4b-filesystem-read',
              'mad4b-database-list-tables',
              'mad4b-database-describe-table',
              'mad4b-database-select',
              'mad4b-content-get-post',
              'mad4b-audit-tail',
              'mad4b-mutation-get',
              'mad4b-agent-list',
              'mad4b-agent-effective-access',
              'mad4b-filesystem-write',
              'mad4b-filesystem-patch',
              'mad4b-database-update',
              'mad4b-content-update-post',
              'mad4b-plugin-activate',
              'mad4b-plugin-deactivate',
              'mad4b-plugin-package-apply',
              'mad4b-site-profile-feature-reenroll',
              'mad4b-site-profile-write-enable',
              'mad4b-staging-write-grant-reconcile',
              'mad4b-staging-write-candidate-bind',
              'mad4b-mutation-undo',
              'mad4b-approval-plan',
          }
          leaked_hidden = sorted(hidden.intersection(names))
          if leaked_hidden:
              raise SystemExit(f'tools/list leaked capabilities that must stay behind governed discovery: {leaked_hidden}')

          payload_bytes = len(json.dumps(tools_response, separators=(',', ':'), ensure_ascii=False).encode('utf-8'))
          if len(names) > 36:
              raise SystemExit(f'tools/list exceeded session-safe tool-count budget: {len(names)} > 36')
          if payload_bytes > 131072:
              raise SystemExit(f'tools/list exceeded refresh payload budget: {payload_bytes} > 131072 bytes')

          forbidden = {'mad4b-database-raw-query'}
          leaked = sorted(forbidden.intersection(names))
          if leaked:
              raise SystemExit(f'tools/list leaked Breakglass/Raw SQL tools: {leaked}')

          print(json.dumps({'status': 'PASS', 'catalog_mode': 'session_safe_direct_plus_governed_read_write_dispatch', 'tool_count': len(names), 'tools_payload_bytes': payload_bytes, 'tools': names}, indent=2))
          PY

