name: MAD4B General Distribution Foundation

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-site-profile.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-policy.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/site-profile-general-distribution-runtime.php'
      - '.github/workflows/mad4b-general-distribution-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-general-distribution-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  profile-runtime:
    name: Tenant-neutral profile / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint generalized authority foundation
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-site-profile.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-policy.php
          php -l wp-content/plugins/mad4b-site-control-plane/tests/site-profile-general-distribution-runtime.php

      - name: Run tenant-neutral runtime contract
        shell: bash
        run: |
          set -euo pipefail
          php wp-content/plugins/mad4b-site-control-plane/tests/site-profile-general-distribution-runtime.php

      - name: Reject authority-by-install defaults in generalized profile
        shell: bash
        run: |
          set -euo pipefail
          profile='wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-site-profile.php'
          grep -Fq "site_not_enrolled" "$profile"
          grep -Fq "origin_drift" "$profile"
          grep -Fq "environment_drift" "$profile"
          grep -Fq "PRODUCTION_WRITE_CONFIRMATION" "$profile"
          grep -Fq "breakglass_enabled' => false" "$profile"
          if grep -Fq "staging.egypttourgates.com" "$profile"; then
            echo 'Tenant-neutral profile must not hardcode the ETG Staging origin.' >&2
            exit 1
          fi
          if grep -Fq "egypttourgates.com" "$profile"; then
            echo 'Tenant-neutral profile must not hardcode the ETG Production origin.' >&2
            exit 1
          fi
