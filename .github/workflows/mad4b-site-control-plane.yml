name: MAD4B Site Control Plane

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - '.github/workflows/mad4b-site-control-plane.yml'
  push:
    branches:
      - master
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - '.github/workflows/mad4b-site-control-plane.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint plugin PHP
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/plugins/mad4b-site-control-plane -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  contract-guard:
    name: Control-plane contract guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required modules and safety gates
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          for file in \
            mad4b-site-control-plane.php \
            includes/class-mad4b-scp-abilities.php \
            includes/class-mad4b-scp-policy.php \
            includes/class-mad4b-scp-servers.php \
            includes/class-mad4b-scp-audit.php \
            includes/class-mad4b-scp-adapter-registry.php \
            includes/adapters/class-mad4b-scp-adapter-base.php \
            includes/adapters/class-mad4b-scp-elementor-adapter.php \
            includes/adapters/class-mad4b-scp-jetengine-adapter.php \
            includes/adapters/class-mad4b-scp-jetsmartfilters-adapter.php \
            includes/adapters/class-mad4b-scp-bitflows-adapter.php \
            includes/adapters/class-mad4b-scp-media-adapter.php \
            includes/adapters/class-mad4b-scp-seo-adapter.php \
            includes/adapters/class-mad4b-scp-woocommerce-adapter.php \
            includes/adapters/class-mad4b-scp-polylang-adapter.php \
            includes/adapters/class-mad4b-scp-litespeed-adapter.php; do
            test -f "$root/$file"
          done

          grep -Fq "MAD4B_MCP_BREAKGLASS_ENABLED" "$root/includes/class-mad4b-scp-policy.php"
          grep -Fq "MAD4B_MCP_BREAKGLASS_WRITE_SQL_ENABLED" "$root/includes/class-mad4b-scp-abilities.php"
          grep -Fq "MAD4B_MCP_BREAKGLASS_DDL_ENABLED" "$root/includes/class-mad4b-scp-abilities.php"
          grep -Fq "expected_sha256" "$root/includes/class-mad4b-scp-abilities.php"
          grep -Fq "max_affected" "$root/includes/class-mad4b-scp-abilities.php"
          grep -Fq "realpath" "$root/includes/class-mad4b-scp-policy.php"

      - name: Verify adapter contracts
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          registry="$root/includes/class-mad4b-scp-adapter-registry.php"
          grep -Fq "mad4b/runtime-self-test" "$registry"
          grep -Fq "elementor/update-widget-settings" "$root/includes/adapters/class-mad4b-scp-elementor-adapter.php"
          grep -Fq "expected_sha256" "$root/includes/adapters/class-mad4b-scp-elementor-adapter.php"
          grep -Fq "mad4b_scp_allow_protected_meta_write" "$root/includes/adapters/class-mad4b-scp-jetengine-adapter.php"
          grep -Fq "does not create arbitrary filter internals" "$root/includes/adapters/class-mad4b-scp-jetsmartfilters-adapter.php"
          grep -Fq "BitApps\\Pi\\src\\Flow\\FlowExecutor" "$root/includes/adapters/class-mad4b-scp-bitflows-adapter.php"
          grep -Fq "Inactive flows cannot be run" "$root/includes/adapters/class-mad4b-scp-bitflows-adapter.php"
          grep -Fq "rank_math_title" "$root/includes/adapters/class-mad4b-scp-seo-adapter.php"
          grep -Fq "wc_get_product" "$root/includes/adapters/class-mad4b-scp-woocommerce-adapter.php"
          grep -Fq "pll_set_post_language" "$root/includes/adapters/class-mad4b-scp-polylang-adapter.php"
          grep -Fq "Only this WordPress site can be purged" "$root/includes/adapters/class-mad4b-scp-litespeed-adapter.php"

      - name: Deny arbitrary command and PHP execution primitives
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          if grep -RInE --include='*.php' '\b(eval|assert|exec|shell_exec|system|passthru|popen|proc_open)\s*\(' "$root"; then
            echo 'Forbidden arbitrary execution primitive detected.' >&2
            exit 1
          fi

      - name: Verify isolated MCP surfaces
        shell: bash
        run: |
          set -euo pipefail
          servers='wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-servers.php'
          for surface in mad4b-read mad4b-content mad4b-admin mad4b-breakglass; do
            grep -Fq "'$surface'" "$servers"
          done
          grep -Fq "ability_names( 'read' )" "$servers"
          grep -Fq "ability_names( 'content' )" "$servers"
          grep -Fq "ability_names( 'admin' )" "$servers"
