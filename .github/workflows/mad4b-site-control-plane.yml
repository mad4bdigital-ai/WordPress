name: MAD4B Site Control Plane

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - 'wp-content/plugins/mcp-adapter.zip'
      - 'wp-content/plugins/elementor.zip'
      - 'wp-content/plugins/jet-engine.zip'
      - 'wp-content/plugins/jet-smart-filters.zip'
      - 'wp-content/plugins/bit-pi.zip'
      - '.github/workflows/mad4b-site-control-plane.yml'
  push:
    branches:
      - master
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - 'wp-content/plugins/mcp-adapter.zip'
      - 'wp-content/plugins/elementor.zip'
      - 'wp-content/plugins/jet-engine.zip'
      - 'wp-content/plugins/jet-smart-filters.zip'
      - 'wp-content/plugins/bit-pi.zip'
      - '.github/workflows/mad4b-site-control-plane.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint plugin PHP
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/plugins/mad4b-site-control-plane -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  packaged-provider-contracts:
    name: Packaged provider contract scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify provider archives
        shell: bash
        run: |
          set -euo pipefail
          plugins='wp-content/plugins'
          for archive in mcp-adapter.zip elementor.zip jet-engine.zip jet-smart-filters.zip bit-pi.zip; do
            test -s "$plugins/$archive"
            unzip -tqq "$plugins/$archive"
          done

      - name: Inspect and certify exact packaged provider contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 wp-content/plugins/mad4b-site-control-plane/tests/scan-packaged-providers.py \
            --plugins-dir wp-content/plugins \
            --baseline wp-content/plugins/mad4b-site-control-plane/config/certified-providers.json \
            --output /tmp/mad4b-provider-contracts.json

      - name: Upload provider contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mad4b-provider-contracts-${{ github.sha }}
          path: /tmp/mad4b-provider-contracts.json
          if-no-files-found: error
          retention-days: 30

  contract-guard:
    name: Control-plane contract guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required modules and core safety gates
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          policy="$root/includes/class-mad4b-scp-policy.php"
          abilities="$root/includes/class-mad4b-scp-abilities.php"
          audit="$root/includes/class-mad4b-scp-audit.php"
          registry="$root/includes/class-mad4b-scp-adapter-registry.php"
          provider_contracts="$root/includes/class-mad4b-scp-provider-contracts.php"
          provider_baseline="$root/config/certified-providers.json"
          scanner="$root/tests/scan-packaged-providers.py"
          for file in \
            mad4b-site-control-plane.php \
            config/certified-providers.json \
            includes/class-mad4b-scp-abilities.php \
            includes/class-mad4b-scp-policy.php \
            includes/class-mad4b-scp-servers.php \
            includes/class-mad4b-scp-audit.php \
            includes/class-mad4b-scp-provider-contracts.php \
            includes/class-mad4b-scp-adapter-registry.php \
            includes/adapters/class-mad4b-scp-adapter-base.php \
            includes/adapters/class-mad4b-scp-elementor-adapter.php \
            includes/adapters/class-mad4b-scp-jetengine-adapter.php \
            includes/adapters/class-mad4b-scp-jetsmartfilters-adapter.php \
            includes/adapters/class-mad4b-scp-bitflows-adapter.php \
            includes/adapters/class-mad4b-scp-media-adapter.php \
            includes/adapters/class-mad4b-scp-seo-adapter.php \
            includes/adapters/class-mad4b-scp-woocommerce-adapter.php \
            includes/adapters/class-mad4b-scp-polylang-adapter.php \
            includes/adapters/class-mad4b-scp-litespeed-adapter.php \
            tests/scan-packaged-providers.py; do
            test -f "$root/$file"
          done

          grep -Fq "Version: 0.3.0" "$root/mad4b-site-control-plane.php"
          grep -Fq "mad4b.site-control-plane.packaged-provider-contracts.v1" "$scanner"
          grep -Fq "static_zip_inspection_only" "$scanner"
          grep -Fq "Unsafe ZIP entry" "$scanner"
          grep -Fq -- "--baseline" "$scanner"
          grep -Fq "baseline_status" "$scanner"
          grep -Fq "archive_sha256" "$scanner"
          grep -Fq "mad4b.site-control-plane.certified-providers.v1" "$provider_baseline"
          grep -Fq '"certification_mode": "exact_packaged_version"' "$provider_baseline"
          grep -Fq "version_drift" "$provider_contracts"
          grep -Fq "provider_version_drift" "$registry"
          grep -Fq "mcp_adapter_certification" "$registry"
          grep -Fq "provider_certification_ok" "$registry"

          grep -Fq "MAD4B_MCP_BREAKGLASS_ENABLED" "$policy"
          grep -Fq "MAD4B_MCP_BREAKGLASS_WRITE_SQL_ENABLED" "$abilities"
          grep -Fq "MAD4B_MCP_BREAKGLASS_DDL_ENABLED" "$abilities"
          grep -Fq "LOAD_FILE" "$abilities"
          grep -Fq "CREATE\\s+(?:USER|ROLE)" "$abilities"
          grep -Fq "expected_modified_gmt" "$abilities"
          grep -Fq "max_affected" "$abilities"
          grep -Fq "can_structured_database_read" "$abilities"
          grep -Fq "can_structured_database_write" "$abilities"
          grep -Fq "is_sensitive_database_column" "$abilities"
          grep -Fq "START TRANSACTION" "$abilities"
          grep -Fq "FOR UPDATE" "$abilities"
          grep -Fq "mad4b_control_plane_dependency_protected" "$abilities"

          grep -Fq "realpath" "$policy"
          grep -Fq "mad4b_scp_read_capability" "$policy"
          grep -Fq "'manage_options'" "$policy"
          grep -Fq "mad4b_sensitive_path_denied" "$policy"
          grep -Fq "wp-config" "$policy"
          grep -Fq "mad4b_scp_allow_sensitive_file_access" "$policy"
          grep -Fq "prepare_backup_root" "$policy"
          grep -Fq "mad4b_backup_root_web_exposed" "$policy"
          grep -Fq "mad4b_scp_allow_sensitive_database_read" "$policy"
          grep -Fq "mad4b_scp_allow_sensitive_database_write" "$policy"

          grep -Fq "prepare_backup_root" "$abilities"
          grep -Fq "chmod( \$backup_path, 0600" "$abilities"
          grep -Fq "fileperms( \$path ) & 0777" "$abilities"
          if grep -Fq ".mad4b-backup-" "$abilities"; then
            echo 'Adjacent webroot backup naming must not return.' >&2
            exit 1
          fi

          grep -Fq "request_id" "$audit"
          grep -Fq "previous_hash" "$audit"
          grep -Fq "entry_hash" "$audit"
          grep -Fq "verify_chain" "$audit"

      - name: Verify default-server isolation
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          registry="$root/includes/class-mad4b-scp-adapter-registry.php"
          base="$root/includes/adapters/class-mad4b-scp-adapter-base.php"
          grep -Fq "'mcp' => array( 'public' => false" "$base"
          grep -Fq "'mcp' => array( 'public' => false" "$registry"
          grep -Fq "default_server_exposure_leaks" "$registry"
          grep -Fq "custom_server_isolation" "$registry"
          if grep -RInF --include='*.php' "'mcp' => array( 'public' => true" "$root/includes" "$root/mad4b-site-control-plane.php"; then
            echo 'MAD4B production abilities must be custom-server-only; default MCP exposure detected.' >&2
            exit 1
          fi

      - name: Verify adapter mutation contracts
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          base="$root/includes/adapters/class-mad4b-scp-adapter-base.php"
          elementor="$root/includes/adapters/class-mad4b-scp-elementor-adapter.php"
          jetengine="$root/includes/adapters/class-mad4b-scp-jetengine-adapter.php"
          jetsmart="$root/includes/adapters/class-mad4b-scp-jetsmartfilters-adapter.php"
          bitflows="$root/includes/adapters/class-mad4b-scp-bitflows-adapter.php"
          media="$root/includes/adapters/class-mad4b-scp-media-adapter.php"
          seo="$root/includes/adapters/class-mad4b-scp-seo-adapter.php"
          woo="$root/includes/adapters/class-mad4b-scp-woocommerce-adapter.php"
          polylang="$root/includes/adapters/class-mad4b-scp-polylang-adapter.php"

          grep -Fq "anyOf" "$base"
          grep -Fq "provider_certification" "$base"

          grep -Fq "elementor/manage-elements" "$elementor"
          grep -Fq "expected_sha256" "$elementor"
          grep -Fq "mad4b_elementor_legacy_write_denied" "$elementor"
          grep -Fq "elementor_native_ability" "$elementor"

          grep -Fq "mad4b_scp_allow_protected_meta_write" "$jetengine"
          grep -Fq "mad4b_scp_allow_protected_meta_read" "$jetengine"
          grep -Fq "mad4b_scp_allow_jetengine_meta_create" "$jetengine"
          grep -Fq "mad4b_jetengine_create_policy_denied" "$jetengine"

          grep -Fq "current_user_can( 'manage_options' )" "$jetsmart"
          grep -Fq "does not create arbitrary filter internals" "$jetsmart"

          grep -Fq "certified_provider_key" "$bitflows"
          grep -Fq "return 'bit_pi'" "$bitflows"
          grep -Fq "FlowExecutor" "$bitflows"
          grep -Fq "FlowNode" "$bitflows"
          grep -Fq "MAD4B_MCP_BITFLOWS_EXECUTION_ENABLED" "$bitflows"
          grep -Fq "expected_flow_sha256" "$bitflows"
          grep -Fq "mad4b_bitflows_stale_flow" "$bitflows"
          grep -Fq "Inactive flows cannot be run" "$bitflows"

          grep -Fq "expected_sha256" "$media"
          grep -Fq "expected_thumbnail_id" "$media"
          grep -Fq "expected_sha256" "$seo"
          grep -Fq "mad4b_seo_stale_meta" "$seo"
          grep -Fq "wc_format_decimal" "$woo"
          grep -Fq "expected_sha256" "$woo"
          grep -Fq "mad4b_wc_stale_product" "$woo"
          grep -Fq "expected_language" "$polylang"

          grep -Fq "rank_math_title" "$seo"
          grep -Fq "wc_get_product" "$woo"
          grep -Fq "pll_set_post_language" "$polylang"
          grep -Fq "Only this WordPress site can be purged" "$root/includes/adapters/class-mad4b-scp-litespeed-adapter.php"

      - name: Deny arbitrary command and PHP execution primitives
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          if grep -RInE --include='*.php' '\b(eval|assert|exec|shell_exec|system|passthru|popen|proc_open)\s*\(' "$root"; then
            echo 'Forbidden arbitrary execution primitive detected.' >&2
            exit 1
          fi

      - name: Verify isolated MCP surfaces
        shell: bash
        run: |
          set -euo pipefail
          servers='wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-servers.php'
          for surface in mad4b-read mad4b-content mad4b-admin mad4b-breakglass; do
            grep -Fq "'$surface'" "$servers"
          done
          grep -Fq "ability_names( 'read' )" "$servers"
          grep -Fq "ability_names( 'content' )" "$servers"
          grep -Fq "ability_names( 'admin' )" "$servers"
