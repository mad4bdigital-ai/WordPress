name: MAD4B unified operation policy source contract

on:
  pull_request:
    paths:
      - 'ops/company-readiness-workflow/unified-operation-policy/**'
      - '.github/workflows/unified-operation-policy-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-operation-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source without network or tenant access
        run: |
          python -m compileall -q ops/company-readiness-workflow/unified-operation-policy
      - name: Contract-only isolated tests
        run: |
          python ops/company-readiness-workflow/unified-operation-policy/source_contract_test.py

# Source-only contract. No grants, credentials, remote execution or deployment.
