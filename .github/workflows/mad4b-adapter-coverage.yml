name: MAD4B Adapter Coverage

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - 'wp-content/plugins/*.zip'
      - 'wp-content/plugins/*.php'
      - 'wp-content/mu-plugins.zip'
      - 'wp-content/mu-plugins/**'
      - 'wp-content/themes/**'
      - 'wp-content/*.php'
      - 'wp-includes/version.php'
      - 'wp-settings.php'
      - 'wp-admin/admin.php'
      - 'tools/normalize-premium-provider-package.py'
      - '.github/workflows/mad4b-adapter-coverage.yml'
  push:
    branches:
      - master
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - 'wp-content/plugins/*.zip'
      - 'wp-content/plugins/*.php'
      - 'wp-content/mu-plugins.zip'
      - 'wp-content/mu-plugins/**'
      - 'wp-content/themes/**'
      - 'wp-content/*.php'
      - 'wp-includes/version.php'
      - 'wp-settings.php'
      - 'wp-admin/admin.php'
      - 'tools/normalize-premium-provider-package.py'
      - '.github/workflows/mad4b-adapter-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-adapter-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-coverage-contract:
    name: Repository plugin adapter coverage contract + runtime components
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify discovery and reversible adapter contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 wp-content/plugins/mad4b-site-control-plane/tests/jetengine-features-registration-diagnostics-contract.py
          python3 wp-content/plugins/mad4b-site-control-plane/tests/wp-import-export-governed-adapter-contract.py
          python3 wp-content/plugins/mad4b-site-control-plane/tests/functional-provider-coverage-contract.py
          python3 wp-content/plugins/mad4b-site-control-plane/tests/provider-family-decomposition-contract.py
          python3 wp-content/plugins/mad4b-site-control-plane/tests/form-provider-read-adapters-contract.py
          python3 wp-content/plugins/mad4b-site-control-plane/tests/provider-candidate-attestation-contract.py
          python3 wp-content/plugins/mad4b-site-control-plane/tests/adapter-discovery-reversibility-contract.py \
            --output /tmp/mad4b-repository-plugin-adapter-coverage.json
          python3 wp-content/plugins/mad4b-site-control-plane/tests/repository-plugin-artifact-coverage.py \
            --output /tmp/mad4b-repository-plugin-artifact-coverage.json
          python3 wp-content/plugins/mad4b-site-control-plane/tests/repository-runtime-component-coverage.py \
            --output /tmp/mad4b-repository-runtime-component-coverage.json
          cat /tmp/mad4b-repository-plugin-adapter-coverage.json
          cat /tmp/mad4b-repository-plugin-artifact-coverage.json
          cat /tmp/mad4b-repository-runtime-component-coverage.json

      - name: Upload repository adapter coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: mad4b-repository-runtime-adapter-coverage-${{ github.sha }}
          path: |
            /tmp/mad4b-repository-plugin-adapter-coverage.json
            /tmp/mad4b-repository-plugin-artifact-coverage.json
            /tmp/mad4b-repository-runtime-component-coverage.json
          if-no-files-found: error
          retention-days: 30

  core-adapter-runtime:
    name: Core adapter runtime (${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.9', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring
          coverage: none

      - name: Install WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar --info

      - name: Provision disposable WordPress
        shell: bash
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-wordpress
          rm -rf "$WP_PATH"
          mkdir -p "$WP_PATH"
          php /tmp/wp-cli.phar core download --path="$WP_PATH" --version="$WP_VERSION" --force
          php /tmp/wp-cli.phar config create --path="$WP_PATH" --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core install --path="$WP_PATH" --url='http://mad4b-adapter-runtime.test' --title='MAD4B Adapter Runtime' --admin_user='mad4b-ci-admin' --admin_password='ci-only-not-a-secret' --admin_email='ci@example.invalid' --skip-email

      - name: Install exact MCP Adapter and control plane
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-wordpress
          python3 "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/materialize-packaged-plugin.py" --archive wp-content/plugins/mcp-adapter.zip --plugins-dir "$WP_PATH/wp-content/plugins" --slug mcp-adapter
          cp -R wp-content/plugins/mad4b-site-control-plane "$WP_PATH/wp-content/plugins/mad4b-site-control-plane"
          php /tmp/wp-cli.phar plugin activate mcp-adapter --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate mad4b-site-control-plane --path="$WP_PATH"

      - name: Prove automatic plugin adapter discovery
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file \
            "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-plugin-adapter-discovery-smoke.php" \
            --path=/tmp/mad4b-wordpress --user=mad4b-ci-admin

      - name: Prove Core MU drop-in theme and Astra adapters
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file \
            "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-component-adapter-smoke.php" \
            --path=/tmp/mad4b-wordpress --user=mad4b-ci-admin

      - name: Prove reversible Media adapter envelope and drift-safe undo
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file \
            "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-reversible-adapter-smoke.php" \
            --path=/tmp/mad4b-wordpress --user=mad4b-ci-admin

  jetengine-adapter-boundary:
    name: JetEngine adapter boundary (${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.9', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring
          coverage: none

      - name: Install WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar --info

      - name: Provision disposable WordPress
        shell: bash
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-wordpress
          rm -rf "$WP_PATH"
          mkdir -p "$WP_PATH"
          php /tmp/wp-cli.phar core download --path="$WP_PATH" --version="$WP_VERSION" --force
          php /tmp/wp-cli.phar config create --path="$WP_PATH" --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core install --path="$WP_PATH" --url='http://mad4b-jetengine-runtime.test' --title='MAD4B JetEngine Runtime' --admin_user='mad4b-ci-admin' --admin_password='ci-only-not-a-secret' --admin_email='ci@example.invalid' --skip-email

      - name: Normalize exact JetEngine package
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/mad4b-jetengine-provider
          rm -rf "$out"
          mkdir -p "$out"
          python3 tools/normalize-premium-provider-package.py \
            --provider jetengine \
            --input wp-content/plugins/jet-engine.zip \
            --output "$out/jet-engine.zip" \
            --expected-version 3.8.15 \
            --report "$out/jetengine-normalization.json"
          unzip -tqq "$out/jet-engine.zip"

      - name: Install exact MCP Adapter, packaged JetEngine and control plane
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-wordpress
          python3 "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/materialize-packaged-plugin.py" --archive wp-content/plugins/mcp-adapter.zip --plugins-dir "$WP_PATH/wp-content/plugins" --slug mcp-adapter
          python3 "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/materialize-packaged-plugin.py" --archive "/tmp/mad4b-jetengine-provider/jet-engine.zip" --plugins-dir "$WP_PATH/wp-content/plugins" --slug jet-engine
          cp -R wp-content/plugins/mad4b-site-control-plane "$WP_PATH/wp-content/plugins/mad4b-site-control-plane"
          php /tmp/wp-cli.phar plugin activate mcp-adapter --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate jet-engine --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate mad4b-site-control-plane --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin status jet-engine --path="$WP_PATH"

      - name: Prove packaged JetEngine native MCP fail-closed boundary
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file \
            "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-jetengine-reversible-adapter-smoke.php" \
            --path=/tmp/mad4b-wordpress --user=mad4b-ci-admin

      - name: Upload JetEngine normalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mad4b-jetengine-adapter-normalization-${{ matrix.wordpress }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/mad4b-jetengine-provider/jetengine-normalization.json
          if-no-files-found: error
          retention-days: 14

  wp-import-export-exact-runtime:
    name: WP Import Export exact runtime (${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.9', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring
          coverage: none

      - name: Install WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar --info

      - name: Provision disposable WordPress
        shell: bash
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-wp-import-export-runtime
          rm -rf "$WP_PATH"
          mkdir -p "$WP_PATH"
          php /tmp/wp-cli.phar core download --path="$WP_PATH" --version="$WP_VERSION" --force
          php /tmp/wp-cli.phar config create --path="$WP_PATH" --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core install --path="$WP_PATH" --url='http://mad4b-wp-import-export-runtime.test' --title='MAD4B WP Import Export Runtime' --admin_user='mad4b-ci-admin' --admin_password='ci-only-not-a-secret' --admin_email='ci@example.invalid' --skip-email

      - name: Install exact WP Import Export packages and control plane
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-wp-import-export-runtime
          python3 "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/materialize-packaged-plugin.py" --archive wp-content/plugins/mcp-adapter.zip --plugins-dir "$WP_PATH/wp-content/plugins" --slug mcp-adapter
          python3 "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/materialize-packaged-plugin.py" --archive wp-content/plugins/wp-all-import-pro.zip --plugins-dir "$WP_PATH/wp-content/plugins" --slug wp-all-import-pro
          python3 "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/materialize-packaged-plugin.py" --archive wp-content/plugins/wp-all-export-pro.zip --plugins-dir "$WP_PATH/wp-content/plugins" --slug wp-all-export-pro
          cp -R wp-content/plugins/mad4b-site-control-plane "$WP_PATH/wp-content/plugins/mad4b-site-control-plane"
          php /tmp/wp-cli.phar plugin activate mcp-adapter --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate wp-all-import-pro --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate wp-all-export-pro --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate mad4b-site-control-plane --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin status wp-all-import-pro --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin status wp-all-export-pro --path="$WP_PATH"

      - name: Prove exact provider WP-CLI execution surface split
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-wp-import-export-runtime
          php /tmp/wp-cli.phar help all-import --path="$WP_PATH" > /tmp/mad4b-all-import-help.txt
          grep -Eq '(^|[[:space:]])run([[:space:]]|$)' /tmp/mad4b-all-import-help.txt
          if php /tmp/wp-cli.phar help all-export --path="$WP_PATH" > /tmp/mad4b-all-export-help.txt 2>&1; then
            echo "Unexpected all-export WP-CLI command on exact WP All Export 1.9.15 package" >&2
            exit 1
          fi

      - name: Prove exact composite provider certification and drift fail-closed
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file             "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-wp-import-export-exact-packages.php"             --path=/tmp/mad4b-wp-import-export-runtime --user=mad4b-ci-admin

