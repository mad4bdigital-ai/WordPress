name: MAD4B Adapter Coverage

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - 'wp-content/plugins/*.zip'
      - '.github/workflows/mad4b-adapter-coverage.yml'
  push:
    branches:
      - master
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - 'wp-content/plugins/*.zip'
      - '.github/workflows/mad4b-adapter-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-adapter-coverage-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  repository-coverage-contract:
    name: Repository plugin adapter coverage contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify discovery and reversible adapter contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 wp-content/plugins/mad4b-site-control-plane/tests/adapter-discovery-reversibility-contract.py \
            --output /tmp/mad4b-repository-plugin-adapter-coverage.json
          cat /tmp/mad4b-repository-plugin-adapter-coverage.json

      - name: Upload repository adapter coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: mad4b-repository-plugin-adapter-coverage-${{ github.sha }}
          path: /tmp/mad4b-repository-plugin-adapter-coverage.json
          if-no-files-found: error
          retention-days: 30

  core-adapter-runtime:
    name: Core adapter runtime (${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.9', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring
          coverage: none

      - name: Install WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar --info

      - name: Provision disposable WordPress
        shell: bash
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-wordpress
          rm -rf "$WP_PATH"
          mkdir -p "$WP_PATH"
          php /tmp/wp-cli.phar core download --path="$WP_PATH" --version="$WP_VERSION" --force
          php /tmp/wp-cli.phar config create --path="$WP_PATH" --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core install --path="$WP_PATH" --url='http://mad4b-adapter-runtime.test' --title='MAD4B Adapter Runtime' --admin_user='mad4b-ci-admin' --admin_password='ci-only-not-a-secret' --admin_email='ci@example.invalid' --skip-email

      - name: Install exact MCP Adapter and control plane
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-wordpress
          unzip -q wp-content/plugins/mcp-adapter.zip -d "$WP_PATH/wp-content/plugins"
          cp -R wp-content/plugins/mad4b-site-control-plane "$WP_PATH/wp-content/plugins/mad4b-site-control-plane"
          php /tmp/wp-cli.phar plugin activate mcp-adapter --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate mad4b-site-control-plane --path="$WP_PATH"

      - name: Prove automatic plugin adapter discovery
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file \
            "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-plugin-adapter-discovery-smoke.php" \
            --path=/tmp/mad4b-wordpress --user=mad4b-ci-admin

      - name: Prove reversible Media adapter envelope and drift-safe undo
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file \
            "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-reversible-adapter-smoke.php" \
            --path=/tmp/mad4b-wordpress --user=mad4b-ci-admin

  jetengine-adapter-boundary:
    name: JetEngine adapter boundary (${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.9', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring
          coverage: none

      - name: Install WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar --info

      - name: Provision disposable WordPress
        shell: bash
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-wordpress
          rm -rf "$WP_PATH"
          mkdir -p "$WP_PATH"
          php /tmp/wp-cli.phar core download --path="$WP_PATH" --version="$WP_VERSION" --force
          php /tmp/wp-cli.phar config create --path="$WP_PATH" --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core install --path="$WP_PATH" --url='http://mad4b-jetengine-runtime.test' --title='MAD4B JetEngine Runtime' --admin_user='mad4b-ci-admin' --admin_password='ci-only-not-a-secret' --admin_email='ci@example.invalid' --skip-email

      - name: Install exact MCP Adapter, packaged JetEngine and control plane
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-wordpress
          unzip -q wp-content/plugins/mcp-adapter.zip -d "$WP_PATH/wp-content/plugins"
          unzip -q wp-content/plugins/jet-engine.zip -d "$WP_PATH/wp-content/plugins"
          cp -R wp-content/plugins/mad4b-site-control-plane "$WP_PATH/wp-content/plugins/mad4b-site-control-plane"
          php /tmp/wp-cli.phar plugin activate mcp-adapter --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate jet-engine --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate mad4b-site-control-plane --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin status jet-engine --path="$WP_PATH"

      - name: Prove packaged JetEngine native MCP fail-closed boundary
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file \
            "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-jetengine-reversible-adapter-smoke.php" \
            --path=/tmp/mad4b-wordpress --user=mad4b-ci-admin
