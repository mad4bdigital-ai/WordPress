name: MAD4B Distribution Local Credentials

on:
  push:
    paths:
      - 'wp-content/plugins/mad4b-distribution-connectors/**'
      - 'wp-content/plugins/meta-catalog-feed-mapper-pro/meta-catalog-feed-mapper-pro.php'
      - 'wp-content/plugins/mad4b-company-portfolio-manager/includes/class-mad4b-company-distribution-provision.php'
      - 'tests/test_mad4b_distribution_channel_unit.php'
      - 'tests/test_mad4b_distribution_activation_unit.php'
      - 'tests/test_mad4b_company_distribution_local_policy_unit.php'
      - 'tests/test_mad4b_distribution_console_ui.js'
      - 'tests/test_mad4b_catalog_studio_lifecycle.php'
      - 'tests/test_mad4b_catalog_studio_ui.js'
      - 'tests/test_mad4b_catalog_admin_menu.php'
      - 'tests/test_mad4b_catalog_hardening.php'
      - 'tests/test_mad4b_catalog_shared_revision.js'
      - 'tests/test_mcfm_wpml_memo_unit.php'
      - '.github/workflows/mad4b-distribution-local-credentials.yml'
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-distribution-connectors/**'
      - 'wp-content/plugins/meta-catalog-feed-mapper-pro/meta-catalog-feed-mapper-pro.php'
      - 'wp-content/plugins/mad4b-company-portfolio-manager/includes/class-mad4b-company-distribution-provision.php'
      - 'tests/test_mad4b_distribution_channel_unit.php'
      - 'tests/test_mad4b_distribution_activation_unit.php'
      - 'tests/test_mad4b_company_distribution_local_policy_unit.php'
      - 'tests/test_mad4b_distribution_console_ui.js'
      - 'tests/test_mad4b_catalog_studio_lifecycle.php'
      - 'tests/test_mad4b_catalog_studio_ui.js'
      - 'tests/test_mad4b_catalog_admin_menu.php'
      - 'tests/test_mad4b_catalog_hardening.php'
      - 'tests/test_mad4b_catalog_shared_revision.js'
      - 'tests/test_mcfm_wpml_memo_unit.php'
      - '.github/workflows/mad4b-distribution-local-credentials.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-local-connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium
          coverage: none
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/plugins/mad4b-distribution-connectors/mad4b-distribution-connectors.php
          php -l wp-content/plugins/mad4b-distribution-connectors/includes/class-mad4b-distribution-channel-registry.php
          php -l wp-content/plugins/mad4b-distribution-connectors/includes/class-mad4b-distribution-activation.php
          php -l wp-content/plugins/mad4b-distribution-connectors/includes/class-mad4b-distribution-admin.php
          php -l wp-content/plugins/mad4b-distribution-connectors/includes/class-mad4b-catalog-data-epoch.php
          php -l wp-content/plugins/meta-catalog-feed-mapper-pro/meta-catalog-feed-mapper-pro.php
          php -l wp-content/plugins/mad4b-distribution-connectors/includes/class-mad4b-catalog-studio.php
          php -l wp-content/plugins/mad4b-distribution-connectors/includes/class-mad4b-catalog-studio-admin.php
          php -l wp-content/plugins/mad4b-distribution-connectors/includes/class-mad4b-distribution-local-credentials.php
          php -l wp-content/plugins/mad4b-company-portfolio-manager/includes/class-mad4b-company-distribution-provision.php
      - name: Local encryption, tenant isolation and authorization (no WordPress DB)
        shell: bash
        run: |
          set -euo pipefail
          php tests/test_mad4b_distribution_channel_unit.php
      - name: Channel activation must never bypass verified provider and delivery adapter
        shell: bash
        run: |
          set -euo pipefail
          php tests/test_mad4b_distribution_activation_unit.php
      - name: Company provisioning and policy migration (no WordPress DB)
        shell: bash
        run: |
          set -euo pipefail
          php tests/test_mad4b_company_distribution_local_policy_unit.php
      - name: Distribution console responsive controls (isolated JS)
        shell: bash
        run: |
          set -euo pipefail
          node --check wp-content/plugins/mad4b-distribution-connectors/assets/distribution-console.js
          node tests/test_mad4b_distribution_console_ui.js
      - name: Catalog Studio complete lifecycle (no WordPress DB)
        shell: bash
        run: |
          set -euo pipefail
          php tests/test_mad4b_catalog_studio_lifecycle.php
          php tests/test_mad4b_catalog_admin_menu.php
          php tests/test_mad4b_catalog_hardening.php
      - name: Catalog Studio admin action and responsive controls
        shell: bash
        run: |
          set -euo pipefail
          node --check wp-content/plugins/mad4b-distribution-connectors/assets/catalog-workbench.js
          node tests/test_mad4b_catalog_studio_ui.js
          node tests/test_mad4b_catalog_shared_revision.js
          php tests/test_mcfm_wpml_memo_unit.php
      - name: Portable manifest contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.contract=="mad4b.plugin-portability-profile.v1" and .external_vault_required==false and .credential_option_portable==false and .external_sending_default==false' \
            wp-content/plugins/mad4b-distribution-connectors/mad4b-portability.json
