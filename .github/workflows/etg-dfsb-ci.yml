name: ETG DFSB Operational CI

on:
  pull_request:
    paths:
      - 'wp-content/plugins/etg-dynamic-filter-seo-bridge/**'
      - 'specs/001-etg-dynamic-filter-seo-operational/**'
      - '.specify/**'
      - '.github/workflows/etg-dfsb-ci.yml'
      - '.github/workflows/etg-dfsb-jetengine-ci.yml'
      - '.github/workflows/indexflow-foundation-ci.yml'
      - 'wp-content/plugins/jet-engine.zip'
      - 'wp-content/plugins/jet-smart-filters.zip'
      - 'wp-content/plugins/seo-by-rank-math.zip'
      - 'wp-content/plugins/seo-by-rank-math-pro.zip'
      - 'wp-content/plugins/sitepress-multilingual-cms.zip'
      - 'wp-content/plugins/wpml-string-translation.zip'
      - 'wp-content/plugins/wp-seo-multilingual.zip'
  push:
    branches:
      - feat/etg-dynamic-filter-seo-bridge
      - 'fix/etg-*'

concurrency:
  group: etg-dfsb-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  php-contract:
    name: PHP ${{ matrix.php }} contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint and governed policy simulations
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN='wp-content/plugins/etg-dynamic-filter-seo-bridge'
          find "$PLUGIN" -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
          for test_file in \
            parser-smoke.php \
            operational-smoke.php \
            result-count-adapter-smoke.php \
            profile-runtime-smoke.php \
            post-type-observer-smoke.php \
            term-meta-profile-smoke.php \
            profile-blueprint-smoke.php \
            presentation-guard-smoke.php \
            runtime-inventory-smoke.php \
            runtime-inventory-availability-smoke.php \
            inventory-reconciliation-smoke.php \
            pre-staging-authority-hardening-smoke.php \
            publication-layer-smoke.php \
            build-identity-smoke.php \
            alpha9-governance-smoke.php \
            alpha10-query-identity-smoke.php \
            alpha11-runtime-topology-dynamic-content-smoke.php \
            alpha12-inventory-control-smoke.php \
            alpha13-ajax-state-smoke.php \
            alpha13-usage-guide-smoke.php \
            alpha13-frontend-runtime-smoke.php \
            alpha13-deep-audit-smoke.php; do
              php "$PLUGIN/tests/$test_file"
          done

  browser-contract:
    name: Browser transport contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Browser transport regression smoke
        shell: bash
        run: node wp-content/plugins/etg-dynamic-filter-seo-bridge/tests/alpha13-browser-transport-smoke.js

  governance:
    name: Vendor capability and governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Verify exact bundled compatibility surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/etg-vendor && mkdir -p /tmp/etg-vendor/{je,jsf,rm,wpml}
          unzip -q wp-content/plugins/jet-engine.zip -d /tmp/etg-vendor/je
          unzip -q wp-content/plugins/jet-smart-filters.zip -d /tmp/etg-vendor/jsf
          unzip -q wp-content/plugins/seo-by-rank-math.zip -d /tmp/etg-vendor/rm
          unzip -q wp-content/plugins/sitepress-multilingual-cms.zip -d /tmp/etg-vendor/wpml
          require_token(){ local label="$1" token="$2" root="$3"; if ! grep -RFqs -- "$token" "$root"; then echo "::error::Missing bundled vendor capability: $label"; exit 1; fi; echo "verified: $label"; }
          require_token 'JetEngine custom query identity mapping' 'custom_query_ids_mapping' /tmp/etg-vendor/je
          require_token 'JetEngine filtered property setter' 'function set_filtered_prop' /tmp/etg-vendor/je
          require_token 'JetEngine total count' 'function get_items_total_count' /tmp/etg-vendor/je
          require_token 'JetEngine query type' 'function get_query_type' /tmp/etg-vendor/je
          require_token 'JetEngine public query args' 'public function get_query_args()' /tmp/etg-vendor/je
          require_token 'JetEngine query inventory' 'public function get_queries()' /tmp/etg-vendor/je
          require_token 'JetEngine current provider query identity' "get_current_provider( 'query_id' )" /tmp/etg-vendor/je
          require_token 'JetSmartFilters current provider' 'function get_current_provider' /tmp/etg-vendor/jsf
          require_token 'JetSmartFilters request query' 'function get_query_from_request' /tmp/etg-vendor/jsf
          require_token 'Rank Math title filter' 'rank_math/frontend/title' /tmp/etg-vendor/rm
          require_token 'Rank Math description filter' 'rank_math/frontend/description' /tmp/etg-vendor/rm
          require_token 'Rank Math canonical filter' 'rank_math/frontend/canonical' /tmp/etg-vendor/rm
          require_token 'Rank Math robots filter' 'rank_math/frontend/robots' /tmp/etg-vendor/rm
          require_token 'Rank Math JSON-LD filter' 'rank_math/json_ld' /tmp/etg-vendor/rm
          require_token 'WPML current language' 'wpml_current_language' /tmp/etg-vendor/wpml
          require_token 'WPML translated object identity' 'wpml_object_id' /tmp/etg-vendor/wpml
          require_token 'WPML active languages' 'wpml_active_languages' /tmp/etg-vendor/wpml
          require_token 'WPML translated permalink' 'wpml_permalink' /tmp/etg-vendor/wpml
          require_token 'WPML runtime language switch' 'switch_lang' /tmp/etg-vendor/wpml

      - name: Verify Alpha13 AJAX runtime-state governance
        shell: bash
        run: |
          set -euo pipefail
          test -s .specify/memory/constitution.md
          test -s .specify/feature.json
          test -s specs/001-etg-dynamic-filter-seo-operational/contracts/alpha9-governance-hardening-contract.md
          test -s specs/001-etg-dynamic-filter-seo-operational/contracts/alpha10-query-identity-contract.md
          test -s specs/001-etg-dynamic-filter-seo-operational/contracts/alpha11-runtime-topology-dynamic-content-contract.md
          test -s specs/001-etg-dynamic-filter-seo-operational/contracts/alpha12-inventory-control-contract.md
          test -s specs/001-etg-dynamic-filter-seo-operational/contracts/alpha13-ajax-runtime-state-contract.md
          python - <<'PY'
          import json,re
          d=json.load(open('.specify/feature.json'))
          assert d['target_version']=='0.4.0-alpha.13'
          assert d['status']=='ajax_runtime_state_alpha'
          assert d['merge_authorized'] is False and d['production_activation_authorized'] is False
          for gate in [
            'runtime_topology_auto_discovery','inventory_dynamic_content_catalog','elementor_dynamic_tags',
            'inventory_profile_planner','inventory_control_fail_closed','ajax_filter_state_transport',
            'ajax_state_url_authority_separation','ajax_live_dynamic_content','ajax_multivalue_taxonomy_presentation',
            'ajax_filtered_result_count','ajax_rest_non_authorizing','runtime_acceptance','release_provenance'
          ]:
              assert gate in d['required_gates'],gate
          p='wp-content/plugins/etg-dynamic-filter-seo-bridge'
          source=open(f'{p}/etg-dynamic-filter-seo-bridge.php').read()
          assert re.search(r'Version:\s*0\.4\.0-alpha\.13',source)
          assert "define( 'ETG_DFSB_VERSION', '0.4.0-alpha.13' );" in source
          parser=open(f'{p}/includes/JetSmartFilters/AjaxFilterStateParser.php').read()
          endpoint=open(f'{p}/includes/Presentation/AjaxPresentationEndpoint.php').read()
          bridge=open(f'{p}/assets/js/ajax-filter-state.js').read()
          builder=open(f'{p}/includes/Context/FilterContextBuilder.php').read()
          presentation=open(f'{p}/includes/Presentation/PresentationResolver.php').read()
          adapter=open(f'{p}/includes/SEO/JetEngineResultCountAdapter.php').read()
          resolver=open(f'{p}/includes/SEO/ResultCountResolver.php').read()
          tags=open(f'{p}/includes/Elementor/DynamicTagRegistrar.php').read()
          live=open(f'{p}/includes/Elementor/DynamicTags/LiveBindingTrait.php').read()
          runtime=open(f'{p}/includes/Elementor/DynamicTags/DynamicTagRuntime.php').read()
          image_tag=open(f'{p}/includes/Elementor/DynamicTags/FilterImageTag.php').read()
          slot_tag=open(f'{p}/includes/Elementor/DynamicTags/ContentSlotTag.php').read()
          query_id=open(f'{p}/includes/Identifiers/QueryId.php').read()
          catalog=open(f'{p}/includes/Presentation/InventoryContentCatalog.php').read()
          build_identity=open(f'{p}/includes/Diagnostics/BuildIdentity.php').read()
          bootstrap=open(f'{p}/includes/Bootstrap.php').read()
          assert 'etg.dfsb.ajax-filter-state.v1' in parser and "'url_authority' => false" in parser and "'authorizing' => false" in parser
          assert 'MAX_QUERY_NODES = 500' in parser and 'MAX_TERMS_PER_TAXONOMY = 20' in parser
          assert 'baseArchivePath' in parser and "'request_path' => $requestPath" in parser and "'archive_path' => $archivePath" in parser
          assert 'extractNativeJetSmartFiltersTaxQuery' in parser and 'query_depth_limit_exceeded' in parser and 'terms_limit_exceeded:' in parser
          assert 'QueryId::normalize( $queryIdRaw )' in parser and 'query_id_malformed' in parser
          assert "'/ajax-presentation'" in endpoint and "'seo_mutation' => false" in endpoint and "'url_authority' => false" in endpoint
          assert 'MAX_PAYLOAD_BYTES = 65536' in endpoint and 'elementor_render_when_global_off' in endpoint and 'catalogTokenMeta' in endpoint
          assert 'CLIENT_TIMEOUT_MS = 8000' in endpoint and "'provider_client_observed'" in endpoint and "'provider_server_observed'" in endpoint
          assert 'ajaxFilters/updated' in bridge and 'group.currentQuery' in bridge and 'history.pushState' not in bridge and 'history.replaceState' not in bridge
          assert 'filters_cleared' in bridge and 'restoreInitial' in bridge and 'sequences[key]' in bridge and 'timers[key]' in bridge
          assert 'autoGroupKey' in bridge and 'baseArchivePath' in bridge and 'ambiguous_auto_group' in bridge and 'data-etg-dfsb-fallback' in bridge
          assert 'boundGroups' in bridge and 'restoreAttribute' in bridge and 'syncAutoBindings' in bridge and 'queryHasSemanticFilters' in bridge
          assert 'scheduleUrlGroupRetry' in bridge and 'Promise.race' in bridge and "reason: 'http_error'" in bridge and 'http_status: result.status' in bridge
          assert 'boundedPositiveInt(cfg.timeoutMs, 8000, 8000)' in bridge and "reason: 'timeout'" in bridge
          assert 'etg-dfsb/ajax-presentation-updated' in bridge and 'etg-dfsb/ajax-presentation-reset' in bridge
          assert 'AJAX Live Update' in live and 'AJAX Group' in live and 'data-etg-dfsb-group' in live
          assert 'catalogCache' in runtime and 'QueryId::normalize($parts[1])' in runtime
          assert 'MAX_LENGTH = 80' in query_id
          assert "'fallback_image'" in image_tag and 'Controls_Manager::MEDIA' in image_tag and 'enterImageFallback' in image_tag
          assert "'default'=>''" in slot_tag and 'Select Content Slot' in slot_tag and "if ('' === $id)" in slot_tag
          assert 'buildAjaxEvidence' in builder and "'provider_client_observed'" in builder and "'provider_server_observed'" in builder and "'url_authority'=>$ajax?false:true" in builder.replace(' ','')
          assert 'terms:' in presentation and 'termSetValue' in presentation and 'provider_observation_matches_state' in presentation
          assert 'resolveFilteredQuery' in adapter and 'provider_observation_matches_state' in adapter and 'resolveFilteredQuery' in resolver
          assert 'data-etg-dfsb-token' in tags and 'data-etg-dfsb-slot' in tags
          assert 'supports_ajax_runtime_state' in catalog and "'terms:'" in catalog and "'groups'=>$groups" in catalog
          assert 'etg.dfsb.embedded-build-identity.v1' in build_identity and 'MAX_BYTES = 4096' in build_identity
          assert 'etg-dfsb-source-sha' in source and 'etg-dfsb-source-tree' in source
          assert 'new AjaxFilterStateParser' in bootstrap and 'new AjaxPresentationEndpoint' in bootstrap and '$topology->discover(false)' in bootstrap
          PY

      - name: Enforce PR change boundary
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          test -n "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}" || git fetch --no-tags origin "$BASE_SHA"
          MERGE_BASE=$(git merge-base "$BASE_SHA" HEAD)
          test -n "$MERGE_BASE"
          git diff --name-only "$MERGE_BASE...HEAD" | while IFS= read -r path; do
            case "$path" in
              wp-content/plugins/etg-dynamic-filter-seo-bridge/*|specs/001-etg-dynamic-filter-seo-operational/*|.specify/*|.github/workflows/etg-dfsb-ci.yml|.github/workflows/etg-dfsb-jetengine-ci.yml|.github/workflows/indexflow-foundation-ci.yml|.github/workflows/mad4b-browser-acceptance-core.yml|.github/workflows/mad4b-control-plane-package.yml|.github/workflows/mad4b-general-distribution-foundation.yml|.github/workflows/mad4b-wpml-external-diagnostic.yml|plugins/mad4b-wordpress/skills/elementor-dynamic-content/SKILL.md|wp-content/plugins/mad4b-site-control-plane/includes/adapters/class-mad4b-scp-elementor-adapter.php|wp-content/plugins/mad4b-site-control-plane/includes/adapters/class-mad4b-scp-bitflows-adapter.php|wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-authorization.php|wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-browser-acceptance-core.php|wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-live-acceptance-observer.php|wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-live-truth.php|wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-query-monitor-evidence-bridge.php|wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-staging-write-authority.php|wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-staging-write-grant-reconciliation.php|wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-transport-context.php|wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-write-runtime-certification.php|wp-content/plugins/mad4b-site-control-plane/skill-seeds/elementor-dynamic-content/SKILL.md|wp-content/plugins/mad4b-site-control-plane/tests/browser-acceptance-core-contract.php|wp-content/plugins/mad4b-site-control-plane/tests/live-acceptance-evidence-contract.py|wp-content/plugins/mad4b-site-control-plane/tests/live-acceptance-observer-runtime.php|wp-content/plugins/mad4b-site-control-plane/tests/provider-bounded-reversible-contract.py|wp-content/plugins/mad4b-site-control-plane/tests/query-monitor-evidence-bridge-runtime.php|wp-content/plugins/mad4b-site-control-plane/tests/runtime-browser-acceptance-core-etg-smoke.php|wp-content/plugins/mad4b-site-control-plane/tests/runtime-dynamic-skills-smoke.php|wp-content/plugins/mad4b-site-control-plane/tests/runtime-elementor-etg-structural-primitives.php|wp-content/plugins/mad4b-site-control-plane/tests/staging-write-authority-contract.py|.github/workflows/mad4b-dynamic-skills.yml|docs/MAD4B-UNIFIED-WORDPRESS-WORKFLOW-OPERATING-MODEL.md|docs/MAD4B-OPERATING-MODEL-COVERAGE-MATRIX.md|plugins/mad4b-wordpress/.codex-plugin/plugin.json|plugins/mad4b-wordpress/plugin.json|plugins/mad4b-wordpress/skills/wordpress-release-orchestration/SKILL.md|wp-content/plugins/mad4b-site-control-plane/MAD4B-RUNTIME-BUILD.txt|wp-content/plugins/mad4b-site-control-plane/README.md|wp-content/plugins/mad4b-site-control-plane/config/adapter-support-catalog.json|wp-content/plugins/mad4b-site-control-plane/config/workflow-provider-contracts.json|wp-content/plugins/mad4b-site-control-plane/config/operating-model-contracts.json|wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-abilities.php|wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-adapter-registry.php|wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-plugin-lifecycle.php|wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-servers.php|wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-skill-seeder.php|wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-workflow-providers.php|wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-operating-model.php|wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php|wp-content/plugins/mad4b-site-control-plane/skill-seeds/wordpress-release-orchestration/SKILL.md|wp-content/plugins/mad4b-site-control-plane/tests/dynamic-skills-contract.py|wp-content/plugins/mad4b-site-control-plane/tests/plugin-lifecycle-governance-contract.py|wp-content/plugins/mad4b-site-control-plane/tests/runtime-workflow-lifecycle-governance.php|wp-content/plugins/mad4b-site-control-plane/tests/workflow-provider-contract.py|wp-content/plugins/mad4b-site-control-plane/tests/operating-model-contract.py) ;;
              *) echo "Unexpected path in ETG PR: $path"; exit 1 ;;
            esac
          done

      - name: Check whitespace and forbidden temporary transport files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            git cat-file -e "$BASE_SHA^{commit}" || git fetch --no-tags origin "$BASE_SHA"
            MERGE_BASE=$(git merge-base "$BASE_SHA" HEAD)
          else
            git fetch --no-tags origin master
            MERGE_BASE=$(git merge-base origin/master HEAD)
          fi
          test -n "$MERGE_BASE"
          git diff --check "$MERGE_BASE...HEAD"
          ! find .github -maxdepth 1 -type f \( -name 'etg-op-payload*' -o -name '*payload.part-*' -o -name '*materializer*' -o -name '*probe*' \) -print -quit | grep -q .

      - name: Detect installable ETG source changes
        id: etg-installable
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "$BASE_SHA^{commit}" || git fetch --no-tags origin "$BASE_SHA"
          MERGE_BASE=$(git merge-base "$BASE_SHA" HEAD)
          test -n "$MERGE_BASE"
          if git diff --name-only "$MERGE_BASE...HEAD" -- 'wp-content/plugins/etg-dynamic-filter-seo-bridge/**' \
            ':(exclude)wp-content/plugins/etg-dynamic-filter-seo-bridge/tests/**' \
            ':(exclude)wp-content/plugins/etg-dynamic-filter-seo-bridge/installed-content-manifest.json' \
            | grep -q .; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build deterministic installable package and provenance v6
        if: github.event_name != 'pull_request' || steps.etg-installable.outputs.changed == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACTUAL_SHA=$(git rev-parse HEAD); test "$ACTUAL_SHA" = "$SOURCE_SHA"
          TREE_SHA=$(git rev-parse HEAD^{tree})
          PLUGIN='wp-content/plugins/etg-dynamic-filter-seo-bridge'
          VERSION=$(php -r '$s=file_get_contents($argv[1]); preg_match("/Version:\s*([^\r\n]+)/",$s,$m); echo trim($m[1]);' "$PLUGIN/etg-dynamic-filter-seo-bridge.php")
          test "$VERSION" = '0.4.0-alpha.13'

          PHP_MATRIX='7.4,8.3'
          TEST_MANIFEST_SHA256=$(
            cd "$PLUGIN"
            find tests -type f \( -name '*.php' -o -name '*.js' \) -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum \
              | sha256sum \
              | awk '{print $1}'
          )

          JET_ENGINE_BLOB=$(git rev-parse HEAD:wp-content/plugins/jet-engine.zip)
          JET_SMART_FILTERS_BLOB=$(git rev-parse HEAD:wp-content/plugins/jet-smart-filters.zip)
          RANK_MATH_BLOB=$(git rev-parse HEAD:wp-content/plugins/seo-by-rank-math.zip)
          RANK_MATH_PRO_BLOB=$(git rev-parse HEAD:wp-content/plugins/seo-by-rank-math-pro.zip)
          WPML_CMS_BLOB=$(git rev-parse HEAD:wp-content/plugins/sitepress-multilingual-cms.zip)
          WPML_STRING_TRANSLATION_BLOB=$(git rev-parse HEAD:wp-content/plugins/wpml-string-translation.zip)
          WPML_SEO_BLOB=$(git rev-parse HEAD:wp-content/plugins/wp-seo-multilingual.zip)
          VENDOR_CONTRACT_SHA256=$(
            printf '%s\n' \
              "jet_engine_blob=$JET_ENGINE_BLOB" \
              "jet_smart_filters_blob=$JET_SMART_FILTERS_BLOB" \
              "rank_math_blob=$RANK_MATH_BLOB" \
              "rank_math_pro_blob=$RANK_MATH_PRO_BLOB" \
              "wpml_cms_blob=$WPML_CMS_BLOB" \
              "wpml_string_translation_blob=$WPML_STRING_TRANSLATION_BLOB" \
              "wpml_seo_blob=$WPML_SEO_BLOB" \
              | sha256sum | awk '{print $1}'
          )

          PUSH_RUNS_JSON="$RUNNER_TEMP/etg-dfsb-push-runs.json"
          PR_RUNS_JSON="$RUNNER_TEMP/etg-dfsb-pr-runs.json"
          PUSH_RUN_ID=''
          PR_RUN_ID=''
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/etg-dfsb-ci.yml/runs?head_sha=${SOURCE_SHA}&event=push&per_page=10" > "$PUSH_RUNS_JSON"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/etg-dfsb-ci.yml/runs?head_sha=${SOURCE_SHA}&event=pull_request&per_page=10" > "$PR_RUNS_JSON"
            PUSH_RUN_ID=$(jq -r --arg sha "$SOURCE_SHA" '.workflow_runs[] | select(.head_sha==$sha and .event=="push") | .id' "$PUSH_RUNS_JSON" | head -n1)
            PR_RUN_ID=$(jq -r --arg sha "$SOURCE_SHA" '.workflow_runs[] | select(.head_sha==$sha and .event=="pull_request") | .id' "$PR_RUNS_JSON" | head -n1)
            if [[ -n "$PUSH_RUN_ID" && "$PUSH_RUN_ID" != 'null' && -n "$PR_RUN_ID" && "$PR_RUN_ID" != 'null' ]]; then
              break
            fi
            sleep 5
          done
          test -n "$PUSH_RUN_ID" && test "$PUSH_RUN_ID" != 'null'
          test -n "$PR_RUN_ID" && test "$PR_RUN_ID" != 'null'

          OUT="$RUNNER_TEMP/etg-package"; mkdir -p "$OUT/etg-dynamic-filter-seo-bridge"
          rsync -a --exclude tests "$PLUGIN/" "$OUT/etg-dynamic-filter-seo-bridge/"
          IDENTITY="$OUT/etg-dynamic-filter-seo-bridge/build-identity.json"
          python - "$IDENTITY" "$SOURCE_SHA" "$TREE_SHA" "$VERSION" <<'PY'
          import json,re,sys
          path,git_sha,tree_sha,version=sys.argv[1:]
          assert re.fullmatch(r'[0-9a-f]{40}',git_sha)
          assert re.fullmatch(r'[0-9a-f]{40}',tree_sha)
          payload={
              'contract':'etg.dfsb.embedded-build-identity.v1',
              'git_sha':git_sha,
              'tree_sha':tree_sha,
              'plugin_version':version,
          }
          with open(path,'w',encoding='utf-8',newline='\n') as handle:
              json.dump(payload,handle,indent=2,ensure_ascii=False)
              handle.write('\n')
          PY
          IDENTITY_SHA256=$(sha256sum "$IDENTITY" | awk '{print $1}')
          python - "$IDENTITY" "$SOURCE_SHA" "$TREE_SHA" "$VERSION" <<'PY'
          import json,re,sys
          path,git_sha,tree_sha,version=sys.argv[1:]
          data=json.load(open(path,encoding='utf-8'))
          assert set(data)=={'contract','git_sha','tree_sha','plugin_version'}
          assert data['contract']=='etg.dfsb.embedded-build-identity.v1'
          assert data['git_sha']==git_sha and data['tree_sha']==tree_sha and data['plugin_version']==version
          assert not any(key in data for key in ('current_run_id','current_event','build_timestamp','token','credential'))
          PY
          find "$OUT/etg-dynamic-filter-seo-bridge" -exec touch -t 198001010000 {} +
          ZIP="$OUT/etg-dynamic-filter-seo-bridge-${VERSION}.zip"
          (cd "$OUT"; find etg-dynamic-filter-seo-bridge -type f -print | LC_ALL=C sort | zip -X -q "$ZIP" -@)
          unzip -t "$ZIP"
          python - "$ZIP" "$SOURCE_SHA" "$TREE_SHA" "$VERSION" <<'PY'
          import json,sys,zipfile
          zip_path,git_sha,tree_sha,version=sys.argv[1:]
          with zipfile.ZipFile(zip_path) as archive:
              data=json.loads(archive.read('etg-dynamic-filter-seo-bridge/build-identity.json'))
          assert set(data)=={'contract','git_sha','tree_sha','plugin_version'}
          assert data=={
              'contract':'etg.dfsb.embedded-build-identity.v1',
              'git_sha':git_sha,
              'tree_sha':tree_sha,
              'plugin_version':version,
          }
          PY
          DIGEST=$(sha256sum "$ZIP" | awk '{print $1}')
          BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          {
            echo "contract=etg.dfsb.release-provenance.v6"
            echo "git_sha=$SOURCE_SHA"
            echo "tree_sha=$TREE_SHA"
            echo "plugin_version=$VERSION"
            echo "package_sha256=$DIGEST"
            echo "embedded_identity_contract=etg.dfsb.embedded-build-identity.v1"
            echo "embedded_identity_sha256=$IDENTITY_SHA256"
            echo "push_run_id=$PUSH_RUN_ID"
            echo "pr_run_id=$PR_RUN_ID"
            echo "current_run_id=$GITHUB_RUN_ID"
            echo "current_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "current_event=$GITHUB_EVENT_NAME"
            echo "php_matrix=$PHP_MATRIX"
            echo "node_version=20"
            echo "test_manifest_sha256=$TEST_MANIFEST_SHA256"
            echo "vendor_contract_sha256=$VENDOR_CONTRACT_SHA256"
            echo "build_contract=deterministic_zip_epoch1980_zipX_embedded_identity_v2"
            echo "build_environment=github_actions_ubuntu_latest"
            echo "build_timestamp=$BUILD_TIMESTAMP"
            echo "profile_engine=generic_surface_profile_v1"
            echo "publication_engine=rank_math_dynamic_publication_v1"
            echo "query_identity=jet_engine_custom_query_id_v3_case_preserving"
            echo "runtime_topology=elementor_jet_engine_correlation_v1"
            echo "dynamic_content=inventory_slots_dynamic_tags_v2"
            echo "inventory_control=profile_plan_fail_closed_v1"
            echo "ajax_state=jetsmartfilters_current_query_v2_case_preserving"
            echo "ajax_presentation=rest_non_authorizing_live_bindings_v2_bounded_transport"
            echo "frontend_runtime=elementor_fallback_group_native_jsf_failclosed_v3"
            echo "jet_engine_blob=$JET_ENGINE_BLOB"
            echo "jet_smart_filters_blob=$JET_SMART_FILTERS_BLOB"
            echo "rank_math_blob=$RANK_MATH_BLOB"
            echo "rank_math_pro_blob=$RANK_MATH_PRO_BLOB"
            echo "wpml_cms_blob=$WPML_CMS_BLOB"
            echo "wpml_string_translation_blob=$WPML_STRING_TRANSLATION_BLOB"
            echo "wpml_seo_blob=$WPML_SEO_BLOB"
          } > "$OUT/etg-dfsb-provenance.txt"
          cat "$OUT/etg-dfsb-provenance.txt"
          python - "$OUT/etg-dfsb-provenance.txt" "$SOURCE_SHA" "$TREE_SHA" "$DIGEST" "$IDENTITY_SHA256" <<'PY'
          import re,sys
          path,source_sha,tree_sha,package_sha,identity_sha=sys.argv[1:]
          values={}
          for lineno,raw in enumerate(open(path,encoding='utf-8'),1):
              line=raw.rstrip('\n')
              if '=' not in line:
                  raise SystemExit(f'provenance line {lineno} is not key=value: {line!r}')
              key,value=line.split('=',1)
              if key in values:
                  raise SystemExit(f'duplicate provenance key: {key}')
              values[key]=value
          expected={
              'contract':'etg.dfsb.release-provenance.v6',
              'git_sha':source_sha,
              'tree_sha':tree_sha,
              'package_sha256':package_sha,
              'embedded_identity_contract':'etg.dfsb.embedded-build-identity.v1',
              'embedded_identity_sha256':identity_sha,
          }
          for key,want in expected.items():
              got=values.get(key)
              if got!=want:
                  raise SystemExit(f'provenance mismatch {key}: expected={want!r} actual={got!r}')
          for key in ('push_run_id','pr_run_id'):
              got=values.get(key,'')
              if not re.fullmatch(r'[0-9]+',got):
                  raise SystemExit(f'provenance invalid {key}: {got!r}')
          for key in ('test_manifest_sha256','vendor_contract_sha256'):
              got=values.get(key,'')
              if not re.fullmatch(r'[0-9a-f]{64}',got):
                  raise SystemExit(f'provenance invalid {key}: {got!r}')
          print('provenance-validation=PASS')
          PY

      - uses: actions/upload-artifact@v4
