name: RC34 Governance Binding Diagnostics Fix

on:
  push:
    branches:
      - feat/dynamic-wordpress-skills-20260909
    paths:
      - .github/workflows/rc34-governance-binding-diagnostics-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynamic-wordpress-skills-20260909
          fetch-depth: 3

      - name: Guard exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '96eb43a7b1dddb52b10f3d78a122fa6fb91926f9'

      - name: Separate enrollment, acceptance and write eligibility truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('wp-content/plugins/mad4b-site-control-plane')
          observer = root / 'includes/class-mad4b-scp-live-acceptance-observer.php'
          live_truth = root / 'includes/class-mad4b-scp-live-truth.php'
          write_cert = root / 'includes/class-mad4b-scp-write-runtime-certification.php'
          test = root / 'tests/live-acceptance-evidence-contract.py'

          def replace_exact(path, old, new, count=1):
              text = path.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old[:120]!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          # Environment enrollment and acceptance capture are separate facts.
          old = "$input = is_array( $input ) ? $input : array(); $provenance = self::build_provenance_status(); $qm = self::query_monitor_status(); $wpml = self::external_wpml_receipt_status(); $external = self::external_handshake_attestation_status(); $rest = class_exists( 'MAD4B_SCP_REST_Compatibility' ) ? MAD4B_SCP_REST_Compatibility::status() : array(); $skills = class_exists( 'MAD4B_SCP_Skill_Runtime_Certification' ) ? MAD4B_SCP_Skill_Runtime_Certification::status() : array(); $write_authority = class_exists( 'MAD4B_SCP_Staging_Write_Authority' ) ? MAD4B_SCP_Staging_Write_Authority::status() : array(); $write_runtime = self::write_runtime_certification_status(); $snapshot_local = class_exists( 'MAD4B_SCP_Skill_Snapshot_Identity' ) ? MAD4B_SCP_Skill_Snapshot_Identity::build() : array(); $snapshot_external = ! empty( $input['client_snapshot_token'] ) ? self::snapshot_verify( $input ) : array( 'contract' => self::SNAPSHOT_VERIFY_CONTRACT, 'exact_match' => false, 'state' => 'pending_external_evidence' ); $provider_execution_leaks = isset( $external['provider_execution_mount_leaks'] ) ? $external['provider_execution_mount_leaks'] : array();"
          new = old + " $environment_enrolled = self::nonproduction_profile_enrolled(); $acceptance_enabled = $environment_enrolled && class_exists( 'MAD4B_SCP_Site_Profile' ) && MAD4B_SCP_Site_Profile::acceptance_enabled();"
          replace_exact(observer, old, new)

          old_gate = "\t\t\t'environment_guard' => self::gate( self::staging_capture_allowed(), self::staging_capture_allowed() ? 'ready' : 'blocked', true, 'mad4b.environment-guard', self::staging_capture_allowed() ? array() : array( 'not_enrolled_governed_nonproduction_origin' ) ),"
          new_gate = "\t\t\t'environment_guard' => self::gate( $environment_enrolled, $environment_enrolled ? 'ready' : 'blocked', true, 'mad4b.environment-guard', $environment_enrolled ? array() : array( 'not_enrolled_governed_nonproduction_origin' ) ),\n\t\t\t'acceptance_capture' => self::gate( $acceptance_enabled, $acceptance_enabled ? 'ready' : 'blocked', true, 'mad4b.acceptance-capture', $acceptance_enabled ? array() : array( 'site_profile_acceptance_disabled' ) ),"
          replace_exact(observer, old_gate, new_gate)

          old_capture = "\tpublic static function staging_capture_allowed() { if ( defined( 'WP_CLI' ) && WP_CLI ) return false; if ( defined( 'DOING_CRON' ) && DOING_CRON ) return false; return class_exists( 'MAD4B_SCP_Site_Profile' ) && MAD4B_SCP_Site_Profile::nonproduction_governed( 'acceptance' ) && MAD4B_SCP_Site_Profile::site_urls_match_enrollment(); }"
          new_capture = "\tprivate static function nonproduction_profile_enrolled() { return class_exists( 'MAD4B_SCP_Site_Profile' ) && MAD4B_SCP_Site_Profile::nonproduction_governed() && MAD4B_SCP_Site_Profile::site_urls_match_enrollment(); }\n\tpublic static function staging_capture_allowed() { if ( defined( 'WP_CLI' ) && WP_CLI ) return false; if ( defined( 'DOING_CRON' ) && DOING_CRON ) return false; return self::nonproduction_profile_enrolled() && MAD4B_SCP_Site_Profile::acceptance_enabled(); }"
          replace_exact(observer, old_capture, new_capture)

          # Live write truth: binding is not the same thing as write eligibility.
          replace_exact(
              live_truth,
              "\t\t$checks['site_profile_bound'] = ! empty( $authority['eligible'] );\n\t\t// Compatibility alias retained while older evidence consumers migrate.\n\t\t$checks['exact_staging_origin'] = $checks['site_profile_bound'];\n\t\t$checks['authority_ready'] = ! empty( $authority['ready'] );",
              "\t\t$checks['site_profile_bound'] = ! empty( $authority['profile_origin_enrolled'] );\n\t\t// Compatibility alias retained while older evidence consumers migrate.\n\t\t$checks['exact_staging_origin'] = $checks['site_profile_bound'];\n\t\t$checks['write_feature_enabled'] = ! empty( $authority['profile_write_enabled'] );\n\t\t$checks['write_authority_eligible'] = ! empty( $authority['eligible'] );\n\t\t$checks['authority_ready'] = ! empty( $authority['ready'] );"
          )
          replace_exact(
              live_truth,
              "foreach ( array( 'site_profile_bound', 'authority_ready', 'mutation_gate_enabled', 'production_auto_enable_absent', 'breakglass_auto_enable_absent', 'breakglass_not_included', 'remote_approval_required' ) as $key )",
              "foreach ( array( 'site_profile_bound', 'write_feature_enabled', 'write_authority_eligible', 'authority_ready', 'mutation_gate_enabled', 'production_auto_enable_absent', 'breakglass_auto_enable_absent', 'breakglass_not_included', 'remote_approval_required' ) as $key )"
          )

          # Canonical persisted write certification uses the same separated semantics.
          replace_exact(
              write_cert,
              "\t\t$checks['exact_enrolled_origin'] = ! empty( $authority['eligible'] );\n\t\t$checks['authority_ready'] = ! empty( $authority['ready'] );",
              "\t\t$checks['exact_enrolled_origin'] = class_exists( 'MAD4B_SCP_Site_Profile' ) && MAD4B_SCP_Site_Profile::origin_enrolled() && MAD4B_SCP_Site_Profile::site_urls_match_enrollment();\n\t\t$checks['write_feature_enabled'] = class_exists( 'MAD4B_SCP_Site_Profile' ) && MAD4B_SCP_Site_Profile::write_enabled();\n\t\t$checks['write_authority_eligible'] = ! empty( $authority['eligible'] );\n\t\t$checks['authority_ready'] = ! empty( $authority['ready'] );"
          )
          replace_exact(
              write_cert,
              "\t\t$profile = class_exists( 'MAD4B_SCP_Site_Profile' ) ? MAD4B_SCP_Site_Profile::status() : array();\n\t\t$blocker = empty( $profile['configured'] ) ? 'site_profile_unconfigured' : ( empty( $profile['origin_match'] ) || empty( $profile['environment_match'] ) ? 'site_profile_not_enrolled' : 'site_profile_write_disabled' );",
              "\t\t$profile = class_exists( 'MAD4B_SCP_Site_Profile' ) ? MAD4B_SCP_Site_Profile::status() : array();\n\t\t$profile_origin_enrolled = class_exists( 'MAD4B_SCP_Site_Profile' ) && MAD4B_SCP_Site_Profile::origin_enrolled() && MAD4B_SCP_Site_Profile::site_urls_match_enrollment();\n\t\t$profile_write_enabled = class_exists( 'MAD4B_SCP_Site_Profile' ) && MAD4B_SCP_Site_Profile::write_enabled();\n\t\t$blocker = empty( $profile['configured'] ) ? 'site_profile_unconfigured' : ( ! $profile_origin_enrolled ? 'site_profile_not_enrolled' : 'site_profile_write_disabled' );"
          )
          replace_exact(
              write_cert,
              "\t\t\t'state' => 'ineligible',\n\t\t\t'blockers' => array( $blocker ),",
              "\t\t\t'state' => 'ineligible',\n\t\t\t'profile_origin_enrolled' => $profile_origin_enrolled,\n\t\t\t'profile_write_enabled' => $profile_write_enabled,\n\t\t\t'write_authority_eligible' => false,\n\t\t\t'blockers' => array( $blocker ),"
          )

          # Permanent static regression coverage in the already-governed Live Acceptance contract.
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              "authorization = (root / 'includes/class-mad4b-scp-authorization.php').read_text(encoding='utf-8')\n",
              "authorization = (root / 'includes/class-mad4b-scp-authorization.php').read_text(encoding='utf-8')\nlive_truth = (root / 'includes/class-mad4b-scp-live-truth.php').read_text(encoding='utf-8')\nwrite_cert = (root / 'includes/class-mad4b-scp-write-runtime-certification.php').read_text(encoding='utf-8')\n"
          )
          old_marker = "    \"MAD4B_SCP_Site_Profile::nonproduction_governed( 'acceptance' )\",\n    \"MAD4B_SCP_Site_Profile::site_urls_match_enrollment()\","
          new_marker = "    \"MAD4B_SCP_Site_Profile::nonproduction_governed()\",\n    \"MAD4B_SCP_Site_Profile::acceptance_enabled()\",\n    \"MAD4B_SCP_Site_Profile::site_urls_match_enrollment()\",\n    \"'acceptance_capture' => self::gate(\",\n    \"'site_profile_acceptance_disabled'\","
          if text.count(old_marker) != 1:
              raise SystemExit('live acceptance required_observer marker drifted')
          text = text.replace(old_marker, new_marker, 1)
          anchor = "# Positive reachability is a mandatory regression, not only false-pass checks.\n"
          regression = '''# Environment/profile enrollment, acceptance capture and write eligibility are\n# separate governance facts. Disabled features must stay fail-closed without\n# being misreported as an origin-enrollment failure.\nif "'environment_guard' => self::gate( self::staging_capture_allowed()" in observer:\n    raise SystemExit('Environment Guard must not conflate acceptance capture with origin enrollment.')\nfor marker in [\n    "'environment_guard' => self::gate( $environment_enrolled",\n    "'acceptance_capture' => self::gate( $acceptance_enabled",\n    "private static function nonproduction_profile_enrolled()",\n    "MAD4B_SCP_Site_Profile::acceptance_enabled()",\n]:\n    if marker not in observer:\n        raise SystemExit('Separated enrollment/acceptance diagnostic missing: ' + marker)\nif "$checks['site_profile_bound'] = ! empty( $authority['eligible'] );" in live_truth:\n    raise SystemExit('Live write truth must not conflate profile binding with write eligibility.')\nfor marker in [\n    "$checks['site_profile_bound'] = ! empty( $authority['profile_origin_enrolled'] );",\n    "$checks['write_feature_enabled'] = ! empty( $authority['profile_write_enabled'] );",\n    "$checks['write_authority_eligible'] = ! empty( $authority['eligible'] );",\n]:\n    if marker not in live_truth:\n        raise SystemExit('Live write truth separation missing: ' + marker)\nif "$checks['exact_enrolled_origin'] = ! empty( $authority['eligible'] );" in write_cert:\n    raise SystemExit('Canonical write certification must not conflate enrollment with authority eligibility.')\nfor marker in [\n    "MAD4B_SCP_Site_Profile::origin_enrolled()",\n    "$checks['write_feature_enabled'] = class_exists( 'MAD4B_SCP_Site_Profile' ) && MAD4B_SCP_Site_Profile::write_enabled();",\n    "$checks['write_authority_eligible'] = ! empty( $authority['eligible'] );",\n    "'profile_origin_enrolled' => $profile_origin_enrolled",\n    "'profile_write_enabled' => $profile_write_enabled",\n]:\n    if marker not in write_cert:\n        raise SystemExit('Canonical write certification diagnostic separation missing: ' + marker)\n\n'''
          if regression not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('regression insertion anchor missing or ambiguous')
              text = text.replace(anchor, regression + anchor, 1)
          test.write_text(text, encoding='utf-8')
          PY

      - name: Verify focused contracts
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          php -l "$root/includes/class-mad4b-scp-live-acceptance-observer.php"
          php -l "$root/includes/class-mad4b-scp-live-truth.php"
          php -l "$root/includes/class-mad4b-scp-write-runtime-certification.php"
          python3 "$root/tests/live-acceptance-evidence-contract.py"
          git diff --check
          if grep -RInF --include='*.php' 'staging.egypttourgates.com' "$root/includes/class-mad4b-scp-live-acceptance-observer.php" "$root/includes/class-mad4b-scp-live-truth.php" "$root/includes/class-mad4b-scp-write-runtime-certification.php"; then
            echo 'Tenant-specific origin must not enter governance diagnostics.' >&2
            exit 1
          fi

      - name: Commit governance diagnostic repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MAD4B'
          git config user.email 'mad4b.digital@gmail.com'
          git add \
            wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-live-acceptance-observer.php \
            wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-live-truth.php \
            wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-write-runtime-certification.php \
            wp-content/plugins/mad4b-site-control-plane/tests/live-acceptance-evidence-contract.py
          test -n "$(git status --porcelain)"
          git commit -m 'fix(governance): separate enrollment from feature eligibility'
          git push origin HEAD:feat/dynamic-wordpress-skills-20260909
