name: RC32 CI Contract Migration

on:
  push:
    branches:
      - feat/dynamic-wordpress-skills-20260909
    paths:
      - '.github/workflows/rc32-ci-contract-migration.yml'
      - '.github/rc32-ci-contract-migration.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration staging head
        uses: actions/checkout@v4
        with:
          ref: feat/dynamic-wordpress-skills-20260909
          fetch-depth: 0

      - name: Guard migration staging delta
        shell: bash
        run: |
          set -euo pipefail
          base='11a4c153ecdde7cd2c59f3bdfa22464b36bbc817'
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base"..HEAD)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/rc32-ci-contract-migration\.yml|\.github/rc32-ci-contract-migration\.py)$' || true)"
          test -z "$bad"

      - name: Apply tenant-neutral CI migration
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's/if found != expected:/if found < expected:/' .github/rc32-ci-contract-migration.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/rc32-ci-contract-migration.py')
          s = p.read_text(encoding='utf-8')
          a = s.index('old_block = """')
          marker = 'replace(conn, old_block, new_block)\n'
          b = s.index(marker, a) + len(marker)
          replacement = '''connection_replacement = """          # Explicitly enroll the generic HTTPS fixture after the foreign preloader exists.\n          # The next request remains the first governed repair opportunity.\n          php /tmp/wp-cli.phar eval '\n          $result = MAD4B_SCP_Site_Profile::save_current_site( array(\n              \\"expected_revision\\" => 0, \\"display_name\\" => \\"MAD4B Connection Governance\\",\n              \\"oauth_user_ids\\" => array( get_current_user_id() ),\n              \\"oauth_enabled\\" => false, \\"skills_enabled\\" => false, \\"write_enabled\\" => false,\n              \\"production_write_confirmed\\" => false, \\"provider_isolation_enabled\\" => false,\n              \\"managed_runtime_enabled\\" => true, \\"acceptance_enabled\\" => false,\n          ) );\n          if ( is_wp_error( $result ) ) throw new RuntimeException( $result->get_error_code() . \\":\\" . $result->get_error_message() );\n          ' --path=\\"$WP_PATH\\" --user=mad4b-ci-admin\n"""\nbetween(\n    conn,\n    "          # Move the disposable site onto the exact Staging origin without a\\n",\n    "\\n          # Request 1 must detect provenance mismatch and install the managed\\n",\n    connection_replacement,\n)\n'''
          p.write_text(s[:a] + replacement + s[b:], encoding='utf-8')
          PY
          python3 .github/rc32-ci-contract-migration.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('wp-content/plugins/mad4b-site-control-plane/tests/provider-canary-execution-contract.php')
          s = p.read_text(encoding='utf-8')
          old = "final class MAD4B_SCP_Site_Profile {\n\tpublic static function nonproduction_governed( $feature = '' ) { return 'write' === (string) $feature; }\n}"
          new = "final class MAD4B_SCP_Site_Profile {\n\tpublic static function current_environment() { return 'staging'; }\n\tpublic static function current_host() { return 'provider-canary.test'; }\n\tpublic static function nonproduction_governed( $feature = '' ) { return 'write' === (string) $feature; }\n}"
          if s.count(old) != 1:
              raise SystemExit('provider canary Site Profile fixture shape changed')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Validate migrated contracts
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          python3 "$root/tests/spec-consistency-contract.py"
          python3 "$root/tests/dynamic-skills-contract.py"
          python3 "$root/tests/live-acceptance-evidence-contract.py"
          python3 "$root/tests/live-acceptance-reconciler-contract.py"
          python3 "$root/tests/mcp-provider-isolation-contract.py"
          python3 "$root/tests/local-oauth-browser-canary-contract.py"
          php "$root/tests/provider-behavioral-recertification-runtime.php"
          php "$root/tests/provider-canary-execution-contract.php"
          php "$root/tests/live-acceptance-observer-runtime.php"
          php -l "$root/tests/runtime-mcp-governed-execution-fence-reconciler.php"
          php -l "$root/tests/runtime-local-oauth-browser-canary-smoke.php"
          php -l "$root/tests/runtime-local-oauth-browser-canary-production-smoke.php"
          git diff --check

      - name: Commit migrated contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MAD4B Automation'
          git config user.email 'mad4b.digital@gmail.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'test(rc32): align CI with tenant-neutral contracts'
          git push origin HEAD:feat/dynamic-wordpress-skills-20260909
