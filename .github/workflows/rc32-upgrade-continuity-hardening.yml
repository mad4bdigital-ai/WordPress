name: RC32 Upgrade Continuity Hardening

on:
  push:
    branches:
      - feat/dynamic-wordpress-skills-20260909
    paths:
      - .github/workflows/rc32-upgrade-continuity-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynamic-wordpress-skills-20260909
          fetch-depth: 7

      - name: Guard exact staging ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'f9383d3de73abc358f53428ab1ec01f430134219'
          test "$(git merge-base HEAD 62544e80a72e02bfa1711919dec588a26bea5df1)" = '62544e80a72e02bfa1711919dec588a26bea5df1'
          mapfile -t changed < <(git diff --name-only 62544e80a72e02bfa1711919dec588a26bea5df1..HEAD | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/rc32-upgrade-continuity-hardening.py'
          test "${changed[1]}" = '.github/workflows/rc32-upgrade-continuity-hardening.yml'

      - name: Apply reviewed continuity patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/rc32-upgrade-continuity-hardening.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-upgrade-continuity.php')
          lines = []
          for line in p.read_text().splitlines(keepends=True):
              line = re.sub(r'^(?:\\t)+', lambda m: '\t' * (len(m.group(0)) // 2), line)
              lines.append(line)
          s = ''.join(lines)
          early = "\t\tif ( '' === $snapshot_issuer || ! hash_equals( $expected_issuer, $snapshot_issuer ) ) return self::recovery_result( 'blocked', false, 'prior_oauth_issuer_mismatch' );\n\n\t\t$owner_user_id"
          if s.count(early) != 1:
              raise SystemExit('early issuer guard drifted')
          s = s.replace(early, "\t\t$owner_user_id", 1)
          identity = "\t\t\tif ( ! hash_equals( $environment, $snapshot_environment ) || ! hash_equals( $origin, $snapshot_origin ) ) return self::recovery_result( 'blocked', false, 'prior_oauth_identity_mismatch' );\n"
          if s.count(identity) != 1:
              raise SystemExit('profile identity guard drifted')
          s = s.replace(identity, identity + "\t\t\tif ( '' === $snapshot_issuer || ! hash_equals( $expected_issuer, $snapshot_issuer ) ) return self::recovery_result( 'blocked', false, 'prior_oauth_issuer_mismatch' );\n", 1)
          legacy = "\t\t} else {\n\t\t\t$snapshot_uuid = self::legacy_snapshot_site_uuid( $origin, $owner_user_id, $snapshot_issuer );\n"
          if s.count(legacy) != 1:
              raise SystemExit('legacy snapshot branch drifted')
          s = s.replace(legacy, "\t\t} else {\n\t\t\tif ( '' === $snapshot_issuer || ! hash_equals( $expected_issuer, $snapshot_issuer ) ) return self::recovery_result( 'blocked', false, 'prior_oauth_issuer_mismatch' );\n\t\t\t$snapshot_uuid = self::legacy_snapshot_site_uuid( $origin, $owner_user_id, $snapshot_issuer );\n", 1)
          p.write_text(s)
          PY

      - name: Verify focused runtime contract
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-upgrade-continuity.php
          php -l wp-content/plugins/mad4b-site-control-plane/tests/upgrade-continuity-runtime.php
          php wp-content/plugins/mad4b-site-control-plane/tests/upgrade-continuity-runtime.php

      - name: Commit source hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MAD4B Automation'
          git config user.email 'mad4b.digital@gmail.com'
          git add wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-upgrade-continuity.php wp-content/plugins/mad4b-site-control-plane/tests/upgrade-continuity-runtime.php
          git diff --cached --check
          git commit -m 'fix(oauth): harden legacy read continuity recovery'
          git push origin HEAD:feat/dynamic-wordpress-skills-20260909
