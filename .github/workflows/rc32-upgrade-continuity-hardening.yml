name: RC32 Upgrade Continuity Hardening

on:
  push:
    branches:
      - feat/dynamic-wordpress-skills-20260909
    paths:
      - .github/workflows/rc32-upgrade-continuity-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynamic-wordpress-skills-20260909
          fetch-depth: 4

      - name: Guard exact staging ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '4d30815ab3a96aee674b25814b88a7bec6697afd'
          test "$(git rev-parse HEAD^^^)" = '62544e80a72e02bfa1711919dec588a26bea5df1'
          mapfile -t changed < <(git diff --name-only 62544e80a72e02bfa1711919dec588a26bea5df1..HEAD | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/rc32-upgrade-continuity-hardening.py'
          test "${changed[1]}" = '.github/workflows/rc32-upgrade-continuity-hardening.yml'

      - name: Apply reviewed continuity patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/rc32-upgrade-continuity-hardening.py

      - name: Verify focused runtime contract
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-upgrade-continuity.php
          php -l wp-content/plugins/mad4b-site-control-plane/tests/upgrade-continuity-runtime.php
          php wp-content/plugins/mad4b-site-control-plane/tests/upgrade-continuity-runtime.php

      - name: Commit source hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MAD4B Automation'
          git config user.email 'mad4b.digital@gmail.com'
          git add wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-upgrade-continuity.php wp-content/plugins/mad4b-site-control-plane/tests/upgrade-continuity-runtime.php
          git diff --cached --check
          git commit -m 'fix(oauth): harden legacy read continuity recovery'
          git push origin HEAD:feat/dynamic-wordpress-skills-20260909
