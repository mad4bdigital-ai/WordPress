name: DFSB Neutral Source Integrity (unsigned candidate)

on:
  pull_request:
    paths:
      - 'wp-content/plugins/dynamic-filter-seo-bridge/**'
      - 'tools/dfsb-neutral/**'
      - '.github/workflows/dfsb-neutral-source-ci.yml'
      - '.github/workflows/dfsb-release-review-attestation.yml'
      - '.github/workflows/dfsb-owner-command-review-dispatch.yml'
      - 'tests/dfsb-owner-command-dispatch-contract.py'
      - 'tests/dfsb-release-review-workflow-contract.py'
      - 'tests/dfsb-release-boot-authority.php'
      - 'tests/dfsb-neutral-read-service-contract.php'
      - 'tests/dfsb-neutral-brand-surface-contract.py'
      - 'tests/dfsb-read-adapter-original-hermetic.php'
      - 'ops/provider-source-transition/**'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/adapters/class-mad4b-scp-dfsb-adapter.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dfsb-neutral-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    env:
      EXACT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout the exact GitHub source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source commit
        run: test "$(git rev-parse HEAD)" = "$EXACT_SOURCE_SHA"
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify versioned attestation workflow stays non-authorizing
        run: python3 tests/dfsb-release-review-workflow-contract.py
      - name: Verify governed owner-comment signing dispatch remains fail-closed
        run: python3 tests/dfsb-owner-command-dispatch-contract.py
      - name: Lint all neutral PHP sources
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/plugins/dynamic-filter-seo-bridge -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
          php -l tools/dfsb-neutral/verify_candidate.php
      - name: Verify standalone neutral semantic acceptance
        run: php wp-content/plugins/dynamic-filter-seo-bridge/tests/live-acceptance-provider-smoke.php
      - name: Verify standalone neutral read service contracts
        shell: bash
        run: |
          set -euo pipefail
          php tests/dfsb-neutral-read-service-contract.php
          python3 tests/dfsb-neutral-brand-surface-contract.py
          python3 wp-content/plugins/dynamic-filter-seo-bridge/tests/neutral-admin-action-contract.py
          python3 wp-content/plugins/dynamic-filter-seo-bridge/tests/neutral-settings-sitemap-contract.py
          php wp-content/plugins/dynamic-filter-seo-bridge/tests/neutral-sitemap-continuity-smoke.php
          php wp-content/plugins/dynamic-filter-seo-bridge/tests/neutral-rest-route-smoke.php
          php wp-content/plugins/dynamic-filter-seo-bridge/tests/neutral-browser-route-smoke.php
          php wp-content/plugins/dynamic-filter-seo-bridge/tests/neutral-browser-freshness-smoke.php
          node tools/browser-acceptance/test-mcp-bridge.mjs
          node wp-content/plugins/dynamic-filter-seo-bridge/tests/neutral-browser-observer-route.test.js
          node tools/browser-acceptance/test-plan-boundary.mjs
          php wp-content/plugins/dynamic-filter-seo-bridge/tests/neutral-jetengine-macro-alias-smoke.php
          php wp-content/plugins/dynamic-filter-seo-bridge/tests/neutral-option-mirror-smoke.php
          php wp-content/plugins/dynamic-filter-seo-bridge/tests/neutral-media-persistence-smoke.php
          php wp-content/plugins/dynamic-filter-seo-bridge/tests/native-evidence-provider-smoke.php
          php wp-content/plugins/dynamic-filter-seo-bridge/tests/editorial-title-smoke.php
          php wp-content/plugins/dynamic-filter-seo-bridge/tests/bootstrap-presentation-assets-smoke.php
          php wp-content/plugins/dynamic-filter-seo-bridge/tests/public-catalog-cache-smoke.php
          php wp-content/plugins/dynamic-filter-seo-bridge/tests/asset-version-smoke.php
          php wp-content/plugins/dynamic-filter-seo-bridge/tests/configured-term-gallery-smoke.php
          php wp-content/plugins/dynamic-filter-seo-bridge/tests/registered-gallery-slot-smoke.php
          php wp-content/plugins/dynamic-filter-seo-bridge/tests/editorial-term-cards-smoke.php
          php wp-content/plugins/dynamic-filter-seo-bridge/tests/native-evidence-abilities-smoke.php
          php wp-content/plugins/dynamic-filter-seo-bridge/tests/result-count-observability-smoke.php
          php wp-content/plugins/dynamic-filter-seo-bridge/tests/build-identity-smoke.php
          for test in profile-blueprint-smoke.php runtime-inventory-smoke.php runtime-inventory-availability-smoke.php alpha12-inventory-control-smoke.php inventory-reconciliation-smoke.php indexflow-configuration-smoke.php content-slot-persistence-smoke.php; do
            php "wp-content/plugins/dynamic-filter-seo-bridge/tests/$test"
          done
      - name: Verify neutral background and event compatibility
        run: node wp-content/plugins/dynamic-filter-seo-bridge/tests/neutral-background-events.test.js
      - name: Verify native hydration and editorial lifecycle
        shell: bash
        run: |
          set -euo pipefail
          node wp-content/plugins/dynamic-filter-seo-bridge/tests/native-hydration-coalescing.test.js
          node wp-content/plugins/dynamic-filter-seo-bridge/tests/native-direct-link-operators.test.js
          node wp-content/plugins/dynamic-filter-seo-bridge/tests/native-rebind.test.js
          node wp-content/plugins/dynamic-filter-seo-bridge/tests/native-composite-rebind-observation.test.js
          node wp-content/plugins/dynamic-filter-seo-bridge/tests/neutral-gallery-state.test.js
          node wp-content/plugins/dynamic-filter-seo-bridge/tests/editorial-lifecycle.test.js
          node wp-content/plugins/dynamic-filter-seo-bridge/tests/editorial-card-dedup.test.js
          node wp-content/plugins/dynamic-filter-seo-bridge/tests/ajax-request-lifecycle.test.js
          node wp-content/plugins/dynamic-filter-seo-bridge/tests/wpml-language-switch-early.test.js
      - name: Build two byte-identical unsigned review packages from exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dfsb-candidate"
          version="$(sed -n 's/^ \* Version: //p' wp-content/plugins/dynamic-filter-seo-bridge/dynamic-filter-seo-bridge.php | head -1)"
          build() {
            if [[ "$version" == *-local.* ]]; then
              python3 tools/dfsb-neutral/build_candidate.py --output "$RUNNER_TEMP/dfsb-candidate/candidate.zip"
            else
              python3 tools/dfsb-neutral/build_release_candidate.py \
                --expected-source-sha "$EXACT_SOURCE_SHA" --expected-version "$version" \
                --output "$RUNNER_TEMP/dfsb-candidate/candidate.zip"
            fi
          }
          build | tee "$RUNNER_TEMP/dfsb-candidate/build.json"
          sha256sum "$RUNNER_TEMP/dfsb-candidate/candidate.zip" > "$RUNNER_TEMP/dfsb-candidate/first.sha256"
          build > /dev/null
          sha256sum "$RUNNER_TEMP/dfsb-candidate/candidate.zip" > "$RUNNER_TEMP/dfsb-candidate/second.sha256"
          cmp "$RUNNER_TEMP/dfsb-candidate/first.sha256" "$RUNNER_TEMP/dfsb-candidate/second.sha256"
      - name: Verify review candidate authority is never implied
        shell: bash
        run: |
          set -euo pipefail
          php tests/dfsb-release-boot-authority.php
      - name: Verify package integrity and fail-closed governance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dfsb-extracted"
          unzip -q "$RUNNER_TEMP/dfsb-candidate/candidate.zip" -d "$RUNNER_TEMP/dfsb-extracted"
          php tools/dfsb-neutral/verify_candidate.php "$RUNNER_TEMP/dfsb-extracted/dynamic-filter-seo-bridge"
          cp -a "$RUNNER_TEMP/dfsb-extracted/dynamic-filter-seo-bridge" "$RUNNER_TEMP/dfsb-tampered"
          printf '\n// intentional QA tamper\n' >> "$RUNNER_TEMP/dfsb-tampered/includes/SEO/ContextSeoSources.php"
          if php tools/dfsb-neutral/verify_candidate.php "$RUNNER_TEMP/dfsb-tampered"; then
            echo '::error::Tampered package was incorrectly accepted'
            exit 1
          fi
      - name: Bind capability review to the exact unsigned package
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dfsb-candidate"
          php tests/dfsb-read-adapter-original-hermetic.php > "$out/qualification-fixture.log"
          python3 ops/provider-source-transition/audit_consumer_readiness.py > "$out/consumer-readiness.json"
          python3 ops/provider-source-transition/bind_qualification_review.py --build "$out/build.json" --package "$out/candidate.zip" --fixture "$out/qualification-fixture.log" --audit "$out/consumer-readiness.json" > "$out/qualification-review.json"
      - name: Upload unsigned review package (not deployable)
        uses: actions/upload-artifact@v4
        with:
          name: dfsb-unsigned-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/dfsb-candidate/candidate.zip
            ${{ runner.temp }}/dfsb-candidate/build.json
            ${{ runner.temp }}/dfsb-candidate/qualification-review.json
            ${{ runner.temp }}/dfsb-candidate/qualification-fixture.log
            ${{ runner.temp }}/dfsb-candidate/consumer-readiness.json
          retention-days: 14
