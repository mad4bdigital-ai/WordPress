name: MAD4B Commerce Runtime — source owner and load contract
on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-commerce/**'
      - '.github/workflows/mad4b-commerce-runtime-source.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
concurrency:
  group: commerce-runtime-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  php-source:
    name: PHP ${{ matrix.php }} source and owner parity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate source owner contract
        run: php wp-content/plugins/mad4b-commerce/tests/source-owner-parity.php
      - name: Lint all owned PHP
        run: |
          find wp-content/plugins/mad4b-commerce -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l
      - name: Prevent duplicate legacy Core enrollment
        run: |
          test ! -d wp-content/plugins/mad4b-commerce/legacy-mu-tree
          test -f packages/mad4b-shared-product-core/mu-plugins/shared-product-core/admin/rate-generation.php
  js-source:
    name: JavaScript syntax and plugin assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint owned JavaScript
        run: |
          find wp-content/plugins/mad4b-commerce -type f -name '*.js' -print0 |
            xargs -0 -n1 node --check
      - name: Ensure owned centered-popover entry
        run: test -s wp-content/plugins/mad4b-commerce/assets/tour-rate-centered-popover.js
