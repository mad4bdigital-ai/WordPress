name: RC32 Final Workflow Blob Stage v10

on:
  push:
    branches:
      - feat/dynamic-wordpress-skills-20260909
    paths:
      - '.github/workflows/rc32-final-generalization-stage-v10.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Guard exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'f2261e1c9b4d0d363bd78bae190a47e4c41a7ebb'
          mapfile -t changed < <(git diff --name-only HEAD^..HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/rc32-final-generalization-stage-v10.yml'

      - name: Generate exact validated canonical bytes into non-workflow staging paths
        shell: python
        run: |
          from pathlib import Path

          def replace(text, old, new, expected=1):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'expected {expected} occurrence(s) of {old!r}, found {count}')
              return text.replace(old, new)

          package = Path('.github/workflows/mad4b-control-plane-package.yml')
          package_text = package.read_text(encoding='utf-8')
          package_text = replace(package_text, 'name: Build reviewed staging installation kit', 'name: Build reviewed General Distribution installation kit')
          package_text = replace(package_text, '- name: Verify tenant-bound governed Staging kit invariants', '- name: Verify tenant-neutral General Distribution kit invariants')
          anchor = "          grep -Fq '\"production_mutation_auto_enabled\": false' \"$stage/install-manifest.json\"\n"
          extra = anchor + "          grep -Fq 'mad4b-site-control-plane-general-distribution-kit-{exact_head_sha}' \"$stage/package/mad4b-site-control-plane/config/staging-deployment-handoff.json\"\n          grep -Fq \"Current plugin version: **${expected_version}**.\" \"$stage/package/mad4b-site-control-plane/README.md\"\n          grep -Fq 'six MAD4B custom servers' \"$stage/package/mad4b-site-control-plane/README.md\"\n          if grep -Fq 'Egypt Tour Gates' \"$stage/package/mad4b-site-control-plane/README.md\" || grep -Fq 'staging.egypttourgates.com' \"$stage/package/mad4b-site-control-plane/README.md\"; then\n            echo 'General Distribution README retained tenant-specific identity.' >&2\n            exit 1\n          fi\n"
          package_text = replace(package_text, anchor, extra)

          foundation = Path('.github/workflows/mad4b-general-distribution-foundation.yml')
          foundation_text = foundation.read_text(encoding='utf-8')
          path_anchor = "      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-skill-autoconfig.php'\n"
          path_extra = path_anchor + "      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-local-oauth-server.php'\n      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-oauth-resource-bridge.php'\n      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-mcp-client-compatibility.php'\n      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-external-handshake-evidence.php'\n      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-chatgpt-connection-admin-ui.php'\n      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-live-acceptance-observer.php'\n      - 'wp-content/plugins/mad4b-site-control-plane/tests/general-distribution-environment-contract.py'\n"
          foundation_text = replace(foundation_text, path_anchor, path_extra)
          run_anchor = "      - name: Run tenant-bound multi-user OAuth runtime contract\n        shell: bash\n        run: |\n          set -euo pipefail\n          php wp-content/plugins/mad4b-site-control-plane/tests/oauth-multi-user-tenant-runtime.php\n"
          run_extra = run_anchor + "\n      - name: Run General Distribution environment contract\n        shell: bash\n        run: |\n          set -euo pipefail\n          python3 wp-content/plugins/mad4b-site-control-plane/tests/general-distribution-environment-contract.py\n"
          foundation_text = replace(foundation_text, run_anchor, run_extra)

          out = Path('.github/rc32-final-workflow-stage')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'mad4b-control-plane-package.yml').write_text(package_text, encoding='utf-8')
          (out / 'mad4b-general-distribution-foundation.yml').write_text(foundation_text, encoding='utf-8')

      - name: Verify exact expected blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/rc32-final-workflow-stage/mad4b-control-plane-package.yml)" = '2657e7dceb584bc0c02b666b434d2960d777d6da'
          test "$(git hash-object .github/rc32-final-workflow-stage/mad4b-general-distribution-foundation.yml)" = '0710479c1e8a68214c9fb6bbd2c09eb3dd34464d'

      - name: Commit staging blobs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/rc32-final-workflow-stage/mad4b-control-plane-package.yml \
                  .github/rc32-final-workflow-stage/mad4b-general-distribution-foundation.yml
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 2
          git commit -m 'chore(rc32): stage validated canonical workflow blobs'
          git push origin HEAD:feat/dynamic-wordpress-skills-20260909
