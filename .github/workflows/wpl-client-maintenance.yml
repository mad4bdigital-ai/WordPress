name: WPL Client maintenance helper

on:
  push:
    branches:
      - fix/wpl-client-db-lifecycle-cleanup-20260906
    paths:
      - .github/workflows/wpl-client-maintenance.yml

permissions:
  contents: write

jobs:
  patch-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden Crocoblock state classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('wp-content/plugins/wpl-client/includes/class-wpl-license-health-monitor.php')
          text = p.read_text(encoding='utf-8')

          old = "$error_code = sanitize_key( (string) ( $activate['error'] ?? $check['error'] ?? '' ) );"
          new = "$error_code = self::crocoblock_status_code( $activate );\n        if ( $error_code === '' ) $error_code = self::crocoblock_status_code( $check );"
          if text.count(old) != 1:
              raise SystemExit('initial Crocoblock status expression not found exactly once')
          text = text.replace(old, new, 1)

          old = "$error_code = sanitize_key( (string) ( $activate['error'] ?? $error_code ) );"
          new = "$reactivate_code = self::crocoblock_status_code( $activate );\n            if ( $reactivate_code !== '' ) $error_code = $reactivate_code;"
          if text.count(old) != 1:
              raise SystemExit('reactivation status expression not found exactly once')
          text = text.replace(old, new, 1)

          needle = "    private static function crocoblock_response_is_valid( $response ) {\n"
          helper = "    private static function crocoblock_status_code( $response ) {\n        if ( ! is_array( $response ) ) return '';\n        if ( ! empty( $response['error'] ) ) return sanitize_key( (string) $response['error'] );\n        $license = sanitize_key( (string) ( $response['license'] ?? '' ) );\n        return ( $license && $license !== 'valid' ) ? $license : '';\n    }\n\n"
          if text.count(needle) != 1:
              raise SystemExit('Crocoblock helper insertion point not found exactly once')
          text = text.replace(needle, helper + needle, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: PHP lint and package consistency
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/plugins/wpl-client -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -q "crocoblock_status_code" wp-content/plugins/wpl-client/includes/class-wpl-license-health-monitor.php
          cd wp-content/plugins
          rm -f wpl-client.zip
          zip -qr wpl-client.zip wpl-client -x '*/.DS_Store'
          rm -rf /tmp/wpl-client-package-check
          mkdir -p /tmp/wpl-client-package-check
          unzip -q wpl-client.zip -d /tmp/wpl-client-package-check
          diff -qr wpl-client /tmp/wpl-client-package-check/wpl-client
          cd ../..

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wp-content/plugins/wpl-client/includes/class-wpl-license-health-monitor.php wp-content/plugins/wpl-client.zip
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(wpl-client): repair Crocoblock inactive registration states"
          git push
