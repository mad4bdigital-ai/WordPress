name: WPL Client maintenance helper

on:
  push:
    branches:
      - fix/wpl-client-db-lifecycle-cleanup-20260906
    paths:
      - .github/workflows/wpl-client-maintenance.yml
      - wp-content/plugins/wpl-client.zip

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack plugin source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wp-content/plugins/wpl-client
          unzip -q wp-content/plugins/wpl-client.zip -d wp-content/plugins/
          test -f wp-content/plugins/wpl-client/wpl-client.php
      - name: Commit unpacked source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wp-content/plugins/wpl-client
          if git diff --cached --quiet; then
            echo "No unpacked source changes to commit."
            exit 0
          fi
          git commit -m "chore(wpl-client): unpack plugin source for maintenance"
          git push
