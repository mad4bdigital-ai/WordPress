name: WPL Client maintenance helper

on:
  push:
    branches:
      - fix/wpl-client-db-lifecycle-cleanup-20260906
    paths:
      - .github/workflows/wpl-client-maintenance.yml

permissions:
  contents: write

jobs:
  inspect-vendor-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect exact vendor reactivation contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wpl-license-discovery
          rm -rf "$ROOT"
          mkdir -p "$ROOT/otgs" "$ROOT/crocoblock"
          unzip -q wp-content/plugins/otgs-installer-plugin.zip -d "$ROOT/otgs"
          unzip -q wp-content/plugins/crocoblock-wizard.zip -d "$ROOT/crocoblock"

          OTGS="$ROOT/otgs/otgs-installer-plugin/vendor/otgs/installer/includes/class-wp-installer.php"
          CROCO="$ROOT/crocoblock/crocoblock-wizard/includes/modules/license/api.php"

          echo '=== WPML save/remove/revalidate implementation ==='
          sed -n '1460,1635p' "$OTGS"
          echo '=== WPML refresh implementation ==='
          sed -n '800,875p' "$OTGS"
          echo '=== Crocoblock license API implementation ==='
          sed -n '40,230p' "$CROCO"
