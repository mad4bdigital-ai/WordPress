name: WPL Client maintenance helper

on:
  push:
    branches:
      - fix/wpl-client-db-lifecycle-cleanup-20260906
    paths:
      - .github/workflows/wpl-client-maintenance.yml

permissions:
  contents: write

jobs:
  inspect-vendor-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect WPML/OTGS and Crocoblock registration APIs
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wpl-license-discovery
          rm -rf "$ROOT"
          mkdir -p "$ROOT/otgs" "$ROOT/wpml" "$ROOT/crocoblock"

          unzip -q wp-content/plugins/otgs-installer-plugin.zip -d "$ROOT/otgs" || true
          unzip -q wp-content/plugins/sitepress-multilingual-cms.zip -d "$ROOT/wpml" || true
          unzip -q wp-content/plugins/crocoblock-wizard.zip -d "$ROOT/crocoblock" || true

          echo '=== OTGS/WPML likely registration files ==='
          find "$ROOT/otgs" "$ROOT/wpml" -type f -name '*.php' -print0 \
            | xargs -0 grep -liE 'site.?key|registration|register.*site|repository.*subscription|subscription.*repository|installer.*settings' \
            | head -n 120 || true

          echo '=== OTGS/WPML candidate symbols ==='
          grep -RniE '(class|function|public function|static function).*(site.?key|register|registration|subscription|repository)' "$ROOT/otgs" "$ROOT/wpml" \
            --include='*.php' | head -n 400 || true

          echo '=== OTGS/WPML calls/options around site keys ==='
          grep -RniE 'site.?key|repository.*subscription|subscription.*repository|registered|registration' "$ROOT/otgs" "$ROOT/wpml" \
            --include='*.php' | head -n 700 || true

          echo '=== Crocoblock likely registration files ==='
          find "$ROOT/crocoblock" -type f -name '*.php' -print0 \
            | xargs -0 grep -liE 'license|licen[sc]e|activation|activate.*license|account|token|api.?key|register' \
            | head -n 120 || true

          echo '=== Crocoblock candidate symbols ==='
          grep -RniE '(class|function|public function|static function).*(license|licen[sc]e|activat|register|account|token)' "$ROOT/crocoblock" \
            --include='*.php' | head -n 400 || true

          echo '=== Crocoblock calls/options around licensing ==='
          grep -RniE 'license|licen[sc]e|activation|activate|account|token|api.?key|registered|registration' "$ROOT/crocoblock" \
            --include='*.php' | head -n 700 || true
