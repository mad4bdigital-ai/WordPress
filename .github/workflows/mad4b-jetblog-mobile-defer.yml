name: MAD4B JetBlog Mobile Defer Contract
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'wp-content/mu-plugins/mad4b-jetblog-mobile-lazy-canary.php'
      - 'wp-content/mu-plugins/assets/mad4b-jetblog-lazy-mobile.js'
      - 'tests/test_mad4b_jetblog_mobile_lazy.js'
      - 'docs/MAD4B-JETBLOG-MOBILE-PERFORMANCE-20261107.md'
      - '.github/workflows/mad4b-jetblog-mobile-defer.yml'
  push:
    branches: [master]
    paths:
      - 'wp-content/mu-plugins/mad4b-jetblog-mobile-lazy-canary.php'
      - 'wp-content/mu-plugins/assets/mad4b-jetblog-lazy-mobile.js'
      - 'tests/test_mad4b_jetblog_mobile_lazy.js'
permissions:
  contents: read
jobs:
  jetblog-mobile-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Source syntax and mobile deferral contract
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/mu-plugins/mad4b-jetblog-mobile-lazy-canary.php
          node --check wp-content/mu-plugins/assets/mad4b-jetblog-lazy-mobile.js
          node tests/test_mad4b_jetblog_mobile_lazy.js
