name: MAD4B Content Hub — WPML intake source quality
on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-content-hub/**'
      - '.github/workflows/mad4b-content-hub-source.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  content-hub-source:
    name: PHP ${{ matrix.php }} trigger and source integrity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify source snapshot matches live Staging ownership inventory
        run: |
          cd wp-content/plugins/mad4b-content-hub
          sha256sum -c source-files.sha256
      - name: Validate PHP syntax
        run: |
          find wp-content/plugins/mad4b-content-hub -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l
      - name: Test WPML creation deferral without triggering live queues
        run: php wp-content/plugins/mad4b-content-hub/tests/wpml-tour-intake-trigger-contract.php
      - name: Check JavaScript
        run: node --check wp-content/plugins/mad4b-content-hub/assets/reviews.js
