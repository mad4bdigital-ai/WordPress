name: MAD4B Site Owner Sources — provenance only

on:
  pull_request:
    paths:
      - 'ops/company-code-release-v1/site-owner-sources/**'
      - '.github/workflows/mad4b-site-owner-source-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: mad4b-site-owner-source-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  provenance:
    name: Source owner contract (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify all registered source fingerprints and release fence
        run: python3 ops/company-code-release-v1/site-owner-sources/verify.py
      - name: Verify collision and drift guards
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s ops/company-code-release-v1/site-owner-sources \
            -p 'test_verify.py' -v
      - name: Lint each site-owned PHP source without executing it
        run: |
          find ops/company-code-release-v1/site-owner-sources/files \
            -type f -name '*.php' -print0 | xargs -0 -n1 php -l
