name: MAD4B Operator Bridge Admission
on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-operator-bridge.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-host-bridge.php'
      - 'tests/remote-execution/operator-bridge-admission.php'
      - '.github/workflows/mad4b-operator-bridge-admission.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: PHP syntax
        run: |
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-operator-bridge.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-host-bridge.php
          php -l tests/remote-execution/operator-bridge-admission.php
      - name: OAuth request boundary smoke
        run: php tests/remote-execution/operator-bridge-admission.php
