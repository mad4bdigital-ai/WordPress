name: ETG DFSB Live Evidence Remediation

on:
  push:
    branches: [feat/etg-dynamic-filter-seo-bridge]
    paths:
      - '.github/workflows/etg-dfsb-live-evidence-remediation.yml'
      - '.github/etg-live-evidence-remediation.py'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard bounded orchestration ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE='3506360dee983b13ed8fc6f7e314b400b17c5c14'
          git cat-file -e "$BASE^{commit}"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          ACTUAL=$(git diff --name-only "$BASE...HEAD" | LC_ALL=C sort)
          EXPECTED=$(printf '%s\n' '.github/etg-live-evidence-remediation.py' '.github/workflows/etg-dfsb-live-evidence-remediation.yml' | LC_ALL=C sort)
          test "$ACTUAL" = "$EXPECTED"
      - name: Apply bounded live-evidence patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/etg-live-evidence-remediation.py
      - name: Validate focused regressions
        shell: bash
        run: |
          set -euo pipefail
          P='wp-content/plugins/etg-dynamic-filter-seo-bridge'
          php -l "$P/includes/JetSmartFilters/FilterDefinitionInspector.php"
          php -l "$P/includes/Diagnostics/RuntimeInventory.php"
          php -l "$P/includes/Runtime/RuntimeTopologyDiscoverer.php"
          php -l "$P/includes/Runtime/BootGuard.php"
          php -l "$P/includes/Bootstrap.php"
          php -l "$P/tests/alpha13-live-evidence-hardening-smoke.php"
          php "$P/tests/alpha13-live-evidence-hardening-smoke.php"
          php "$P/tests/alpha13-filter-definition-drift-smoke.php"
          php "$P/tests/alpha12-inventory-control-smoke.php"
          php "$P/tests/build-identity-smoke.php"
          php "$P/tests/alpha13-nested-template-topology-smoke.php"
      - name: Commit source patch only
        shell: bash
        run: |
          set -euo pipefail
          git restore .github/workflows/etg-dfsb-ci.yml .github/workflows/etg-dfsb-jetengine-ci.yml
          git config user.name 'MAD4B'
          git config user.email 'mad4b.digital@gmail.com'
          git add \
            wp-content/plugins/etg-dynamic-filter-seo-bridge/includes/JetSmartFilters/FilterDefinitionInspector.php \
            wp-content/plugins/etg-dynamic-filter-seo-bridge/includes/Diagnostics/RuntimeInventory.php \
            wp-content/plugins/etg-dynamic-filter-seo-bridge/includes/Runtime/RuntimeTopologyDiscoverer.php \
            wp-content/plugins/etg-dynamic-filter-seo-bridge/includes/Runtime/BootGuard.php \
            wp-content/plugins/etg-dynamic-filter-seo-bridge/includes/Bootstrap.php \
            wp-content/plugins/etg-dynamic-filter-seo-bridge/tests/alpha13-live-evidence-hardening-smoke.php \
            specs/001-etg-dynamic-filter-seo-operational/contracts/alpha13-ajax-runtime-state-contract.md
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git commit -m 'fix(inventory): resolve live JSF identities and expose safe boot evidence'
          git push origin HEAD:feat/etg-dynamic-filter-seo-bridge
