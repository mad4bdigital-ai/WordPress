name: RC32 Apply Tenant-Neutral Generalization

on:
  push:
    branches:
      - feat/dynamic-wordpress-skills-20260909
    paths:
      - '.github/workflows/rc32-apply-generalization.yml'

permissions:
  contents: write

concurrency:
  group: rc32-apply-generalization
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/dynamic-wordpress-skills-20260909
          fetch-depth: 2
          persist-credentials: true

      - name: Guard staged parent and payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '5f0ec8104bab53c7d07d8c388c92089159d3dd36'
          for n in 01 02 03 04 05; do test -f ".github/rc32-generalization.patch.gz.b64.part${n}"; done

      - name: Reassemble verify and apply reviewed rc32 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/rc32-generalization.patch.gz.b64.part{01,02,03,04,05} > /tmp/rc32.b64
          printf '%s  %s\n' 'ff62089a02086907a62211fa2979198c7c21e7046b459d81c89d78cbdb9a9fbd' /tmp/rc32.b64 | sha256sum -c -
          base64 --decode /tmp/rc32.b64 | gzip --decompress > /tmp/rc32.patch
          printf '%s  %s\n' '96231817165faf1f7e39047b16df295e1563563cd23eaad97afdcff1092c5622' /tmp/rc32.patch | sha256sum -c -
          awk '$1=="---"{old=$2} $1=="+++"{new=$2;if(old=="/dev/null"){sub(/^b\//,"",new);sub(/^patch-new\//,"",new);print new}}' /tmp/rc32.patch |
          while IFS= read -r target; do
            case "$target" in
              wp-content/plugins/mad4b-site-control-plane/*) [ ! -e "$target" ] || rm -f -- "$target" ;;
              *) echo "Unexpected additive target: $target" >&2; exit 1 ;;
            esac
          done
          git apply -p2 --check /tmp/rc32.patch
          git apply -p2 /tmp/rc32.patch

      - name: Harden Site Profile v2 migration boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          p = Path('wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-site-profile.php')
          s = p.read_text()

          def replace_method(source, signature, replacement):
              start = source.find(signature)
              if start < 0: raise SystemExit(f'method signature not found: {signature}')
              brace = source.find('{', start)
              depth = 0
              for i in range(brace, len(source)):
                  if source[i] == '{': depth += 1
                  elif source[i] == '}':
                      depth -= 1
                      if depth == 0: return source[:start] + replacement + source[i + 1:]
              raise SystemExit(f'unbalanced method: {signature}')

          old = "\tconst CONTRACT = 'mad4b.site-profile.v1';\n\tconst PRESET_CONTRACT = 'mad4b.site-profile-presets.v1';\n\tconst OPTION = 'mad4b_scp_site_profile_v1';\n\tconst VERSION = 1;\n"
          new = "\tconst CONTRACT = 'mad4b.site-profile.v2';\n\tconst LEGACY_CONTRACT = 'mad4b.site-profile.v1';\n\tconst PRESET_CONTRACT = 'mad4b.site-profile-presets.v2';\n\tconst OPTION = 'mad4b_scp_site_profile_v2';\n\tconst LEGACY_OPTION = 'mad4b_scp_site_profile_v1';\n\tconst VERSION = 2;\n\tconst LEGACY_VERSION = 1;\n"
          if s.count(old) != 1: raise SystemExit('Site Profile constants block drifted')
          s = s.replace(old, new, 1)

          bootstrap = r'''	public static function bootstrap() {
          		if ( null !== self::$status || self::$bootstrapping ) return self::status_without_bootstrap();
          		self::$bootstrapping = true;
          		$record = get_option( self::OPTION, null );
          		$source = 'stored';
          		$has_current_record = null !== $record && false !== $record;
          		if ( ! self::valid_record( $record ) ) {
          			if ( $has_current_record ) {
          				$record = array();
          				$source = 'stored_invalid';
          			} else {
          				$legacy = get_option( self::LEGACY_OPTION, array() );
          				$migrated = self::migrate_legacy_record( $legacy );
          				if ( ! empty( $migrated ) && self::valid_record( $migrated ) && false !== update_option( self::OPTION, $migrated, false ) ) {
          					$record = $migrated;
          					$source = 'legacy_v1_migrated';
          				} else {
          					$record = self::matching_preset();
          					$source = ! empty( $record ) ? 'preset' : 'none';
          					if ( ! empty( $record ) && self::valid_record( $record ) && false !== update_option( self::OPTION, $record, false ) ) $source = 'preset_migrated';
          				}
          			}
          		}
          		self::$profile = self::valid_record( $record ) ? self::normalize_record( $record ) : array();
          		self::$status = self::build_status( self::$profile, $source );
          		self::$bootstrapping = false;
          		return self::$status;
          	}'''
          s = replace_method(s, '\tpublic static function bootstrap()', bootstrap)

          save_marker = "\tpublic static function save_current_site( array $input ) {\n\t\tif ( ! current_user_can( 'manage_options' ) ) return new WP_Error( 'mad4b_site_profile_admin_required', 'Administrator capability is required to enroll this site.' );\n"
          if s.count(save_marker) != 1: raise SystemExit('save_current_site marker drifted')
          s = s.replace(save_marker, save_marker + "\t\tself::bootstrap();\n", 1)

          methods = r'''
          	private static function valid_legacy_record( $record ) {
          		if ( ! is_array( $record ) ) return false;
          		if ( self::LEGACY_CONTRACT !== ( isset( $record['contract'] ) ? (string) $record['contract'] : '' ) ) return false;
          		if ( self::LEGACY_VERSION !== absint( isset( $record['version'] ) ? $record['version'] : 0 ) ) return false;
          		if ( ! self::valid_uuid( isset( $record['site_uuid'] ) ? $record['site_uuid'] : '' ) ) return false;
          		if ( absint( isset( $record['revision'] ) ? $record['revision'] : 0 ) < 1 ) return false;
          		$environment = sanitize_key( isset( $record['environment'] ) ? (string) $record['environment'] : '' );
          		if ( ! in_array( $environment, array( 'local', 'development', 'staging', 'production' ), true ) ) return false;
          		return '' !== self::normalize_origin( isset( $record['canonical_origin'] ) ? $record['canonical_origin'] : '' );
          	}

          	private static function migrate_legacy_record( $record ) {
          		if ( ! self::valid_legacy_record( $record ) ) return array();
          		$legacy = self::normalize_record( $record );
          		$environment = self::current_environment();
          		$origin = self::current_origin();
          		if ( ! hash_equals( (string) $legacy['environment'], $environment ) ) return array();
          		if ( '' === $origin || ! hash_equals( (string) $legacy['canonical_origin'], $origin ) ) return array();
          		return array(
          			'contract' => self::CONTRACT,
          			'version' => self::VERSION,
          			'site_uuid' => (string) $legacy['site_uuid'],
          			'revision' => max( 1, absint( $legacy['revision'] ) + 1 ),
          			'environment' => (string) $legacy['environment'],
          			'canonical_origin' => (string) $legacy['canonical_origin'],
          			'display_name' => isset( $legacy['display_name'] ) ? (string) $legacy['display_name'] : '',
          			'chatgpt_app_id' => '',
          			'oauth_user_ids' => array(),
          			'related_origins' => isset( $legacy['related_origins'] ) && is_array( $legacy['related_origins'] ) ? $legacy['related_origins'] : array(),
          			'features' => array( 'oauth' => false, 'skills' => false, 'write' => false, 'production_write_confirmed' => false, 'provider_isolation' => false, 'managed_runtime' => false, 'acceptance' => false ),
          			'legacy_agent_slug' => '',
          			'legacy_zero_touch' => false,
          			'migrated_from_contract' => self::LEGACY_CONTRACT,
          			'migration_requires_reenrollment' => true,
          			'created_at' => ! empty( $legacy['created_at'] ) ? (string) $legacy['created_at'] : gmdate( 'c' ),
          			'updated_at' => gmdate( 'c' ),
          		);
          	}

          '''
          anchor = "\tprivate static function build_status( array $profile, $source ) {\n"
          if s.count(anchor) != 1: raise SystemExit('build_status marker drifted')
          s = s.replace(anchor, methods + anchor, 1)
          blocker = "\t\t$blockers = array();\n"
          if s.count(blocker) != 1: raise SystemExit('blockers marker drifted')
          s = s.replace(blocker, blocker + "\t\t$reenrollment_required = $configured && ! empty( $profile['migration_requires_reenrollment'] );\n", 1)
          drift = "\t\tif ( $configured && ! $origin_match ) $blockers[] = 'site_profile_origin_drift';\n"
          if s.count(drift) != 1: raise SystemExit('origin drift marker drifted')
          s = s.replace(drift, drift + "\t\tif ( $reenrollment_required ) $blockers[] = 'site_profile_reenrollment_required';\n", 1)
          field = "\t\t\t'origin_match' => $origin_match,\n"
          if s.count(field) != 1: raise SystemExit('origin_match field marker drifted')
          s = s.replace(field, field + "\t\t\t'reenrollment_required' => $reenrollment_required,\n", 1)
          p.write_text(s)

          preset = Path('wp-content/plugins/mad4b-site-control-plane/config/site-profile-presets.json')
          data = json.loads(preset.read_text())
          data['contract'] = 'mad4b.site-profile-presets.v2'
          data['profiles'] = []
          preset.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Replace focused Site Profile test with v2-native runtime contract
        shell: bash
        run: |
          cat > wp-content/plugins/mad4b-site-control-plane/tests/site-profile-general-distribution-runtime.php <<'PHP'
          <?php
          if ( ! defined( 'ABSPATH' ) ) define( 'ABSPATH', __DIR__ . '/' );
          if ( ! defined( 'MAD4B_SCP_DIR' ) ) define( 'MAD4B_SCP_DIR', rtrim( dirname( __DIR__ ), '/\\' ) . '/' );
          $GLOBALS['mad4b_test_options'] = array();
          $GLOBALS['mad4b_test_environment'] = 'staging';
          $GLOBALS['mad4b_test_home'] = 'https://client.test/site/';
          $GLOBALS['mad4b_test_user_id'] = 7;
          $GLOBALS['mad4b_test_is_admin'] = true;
          $GLOBALS['mad4b_test_audit_ready'] = true;
          $GLOBALS['mad4b_test_audit_fail'] = false;
          $GLOBALS['mad4b_test_audit_events'] = array();

          class WP_Error { private $code; private $message; private $data; public function __construct($c,$m='',$d=null){$this->code=$c;$this->message=$m;$this->data=$d;} public function get_error_code(){return $this->code;} public function get_error_message(){return $this->message;} public function get_error_data(){return $this->data;} }
          function is_wp_error($v){return $v instanceof WP_Error;}
          function sanitize_key($v){return strtolower(preg_replace('/[^a-z0-9_\-]/','',(string)$v));}
          function sanitize_text_field($v){return trim(strip_tags((string)$v));}
          function absint($v){return abs((int)$v);}
          function wp_parse_url($u,$c=-1){return parse_url($u,$c);}
          function wp_json_encode($v,$f=0){return json_encode($v,$f);}
          function trailingslashit($v){return rtrim((string)$v,'/\\').'/';}
          function home_url($p=''){return rtrim($GLOBALS['mad4b_test_home'],'/').(''===$p?'':'/'.ltrim($p,'/'));}
          function wp_get_environment_type(){return $GLOBALS['mad4b_test_environment'];}
          function current_user_can($c){return 'manage_options'===$c ? !empty($GLOBALS['mad4b_test_is_admin']) : false;}
          function get_current_user_id(){return (int)$GLOBALS['mad4b_test_user_id'];}
          function get_option($k,$d=false){return array_key_exists($k,$GLOBALS['mad4b_test_options'])?$GLOBALS['mad4b_test_options'][$k]:$d;}
          function update_option($k,$v,$a=null){$GLOBALS['mad4b_test_options'][$k]=$v;return true;}
          function delete_option($k){unset($GLOBALS['mad4b_test_options'][$k]);return true;}
          function wp_generate_uuid4(){static $n=0;++$n;return sprintf('11111111-1111-4111-8111-%012d',$n);}
          function get_userdata($id){return absint($id)>0?(object)array('ID'=>absint($id)):false;}
          function user_can($u,$c){return is_object($u)&&'manage_options'===$c;}
          function get_bloginfo($k){return 'Client Test';}
          function wp_register_ability(){}
          final class MAD4B_SCP_Audit { public static function storage_status(){return array('ready'=>!empty($GLOBALS['mad4b_test_audit_ready']));} public static function record($a,$s,$st){if(!empty($GLOBALS['mad4b_test_audit_fail']))return new WP_Error('audit_failed','forced');$GLOBALS['mad4b_test_audit_events'][]=array($a,$s,$st);return true;} }
          require_once dirname(__DIR__).'/includes/class-mad4b-scp-site-profile.php';
          function ok($c,$m){if(!$c){fwrite(STDERR,"FAIL: {$m}\n");exit(1);}}
          function reset_state(){ $GLOBALS['mad4b_test_options']=array();$GLOBALS['mad4b_test_audit_events']=array();$GLOBALS['mad4b_test_audit_ready']=true;$GLOBALS['mad4b_test_audit_fail']=false;$GLOBALS['mad4b_test_is_admin']=true;MAD4B_SCP_Site_Profile::reset_cache(); }
          function legacy_record($env,$origin,$revision=4){return array('contract'=>MAD4B_SCP_Site_Profile::LEGACY_CONTRACT,'version'=>MAD4B_SCP_Site_Profile::LEGACY_VERSION,'site_uuid'=>'123e4567-e89b-42d3-a456-426614174000','revision'=>$revision,'environment'=>$env,'canonical_origin'=>$origin,'display_name'=>'Legacy Client','chatgpt_app_id'=>'plugin_asdk_app_legacy123','oauth_user_ids'=>array(7,8),'related_origins'=>array($env=>$origin),'features'=>array('oauth'=>true,'skills'=>true,'write'=>true,'production_write_confirmed'=>true,'provider_isolation'=>true,'managed_runtime'=>true,'acceptance'=>true),'legacy_agent_slug'=>'legacy-agent','legacy_zero_touch'=>true,'created_at'=>'2026-01-01T00:00:00Z','updated_at'=>'2026-01-01T00:00:00Z');}

          // Fresh arbitrary install is unconfigured and zero-authority.
          reset_state();
          $GLOBALS['mad4b_test_environment']='staging';$GLOBALS['mad4b_test_home']='https://client.test/site/';
          $s=MAD4B_SCP_Site_Profile::status();
          ok(empty($s['configured']),'fresh arbitrary site is not auto-enrolled');
          ok(!MAD4B_SCP_Site_Profile::write_enabled(),'fresh arbitrary site has zero write authority');
          ok(!MAD4B_SCP_Site_Profile::oauth_enabled(),'fresh arbitrary site has zero OAuth authority');

          // Exact v1 record migrates only as identity; every authority-bearing field fails closed.
          reset_state();
          $origin='https://legacy.client.test/subdir';$GLOBALS['mad4b_test_home']=$origin.'/';$GLOBALS['mad4b_test_environment']='staging';
          $legacy=legacy_record('staging',$origin,4);$GLOBALS['mad4b_test_options'][MAD4B_SCP_Site_Profile::LEGACY_OPTION]=$legacy;
          $s=MAD4B_SCP_Site_Profile::status();
          ok(!empty($s['configured']),'exact legacy identity migrates');
          ok('legacy_v1_migrated'===$s['source'],'legacy migration has explicit source');
          ok($s['site_uuid']===$legacy['site_uuid'],'migration preserves site UUID');
          ok(5===(int)$s['revision'],'migration increments revision');
          ok(!empty($s['reenrollment_required']),'migration requires explicit reenrollment');
          ok(in_array('site_profile_reenrollment_required',$s['blockers'],true),'migration blocker is explicit');
          ok(empty($s['write_enabled'])&&empty($s['oauth_enabled'])&&empty($s['skills_enabled']),'migration carries no feature authority');
          ok(''===MAD4B_SCP_Site_Profile::chatgpt_app_id(),'migration does not carry App ID');
          ok(array()===MAD4B_SCP_Site_Profile::oauth_user_ids(),'migration does not carry OAuth users');
          $v2=get_option(MAD4B_SCP_Site_Profile::OPTION,array());
          ok(MAD4B_SCP_Site_Profile::CONTRACT===($v2['contract']??''),'migration persists v2 contract');
          ok(isset($GLOBALS['mad4b_test_options'][MAD4B_SCP_Site_Profile::LEGACY_OPTION]),'legacy option remains available for rollback/audit reference');

          // Explicit reenrollment preserves identity, clears migration blocker and enables only requested features.
          $r=MAD4B_SCP_Site_Profile::save_current_site(array('expected_revision'=>5,'display_name'=>'Migrated Client','chatgpt_app_id'=>'plugin_asdk_app_new123','oauth_user_ids'=>array(7),'oauth_enabled'=>true,'skills_enabled'=>true,'write_enabled'=>true,'provider_isolation_enabled'=>true,'managed_runtime_enabled'=>true,'acceptance_enabled'=>true));
          ok(!is_wp_error($r),'explicit reenrollment after migration succeeds');
          ok(6===(int)$r['revision'],'reenrollment creates next revision');
          ok($legacy['site_uuid']===$r['site_uuid'],'reenrollment preserves migrated UUID');
          ok(empty($r['reenrollment_required']),'reenrollment clears migration marker');
          ok(!in_array('site_profile_reenrollment_required',$r['blockers'],true),'reenrollment clears blocker');
          ok(!empty($r['write_enabled'])&&!empty($r['oauth_enabled'])&&!empty($r['skills_enabled']),'only explicit reenrollment restores requested authority');

          // Near-match clone cannot migrate v1 identity or authority.
          reset_state();
          $GLOBALS['mad4b_test_environment']='staging';$GLOBALS['mad4b_test_home']='https://clone.client.test/subdir/';
          $GLOBALS['mad4b_test_options'][MAD4B_SCP_Site_Profile::LEGACY_OPTION]=legacy_record('staging','https://legacy.client.test/subdir',4);
          $s=MAD4B_SCP_Site_Profile::status();
          ok(empty($s['configured']),'different origin cannot inherit legacy identity');
          ok(!isset($GLOBALS['mad4b_test_options'][MAD4B_SCP_Site_Profile::OPTION]),'failed legacy match does not create v2 option');
          ok(!MAD4B_SCP_Site_Profile::write_enabled(),'different origin remains zero-authority');

          // Invalid v2 record takes precedence and fails closed; it must not fall back to valid legacy authority.
          reset_state();
          $GLOBALS['mad4b_test_environment']='staging';$GLOBALS['mad4b_test_home']='https://legacy.client.test/subdir/';
          $GLOBALS['mad4b_test_options'][MAD4B_SCP_Site_Profile::OPTION]=array('contract'=>'broken');
          $GLOBALS['mad4b_test_options'][MAD4B_SCP_Site_Profile::LEGACY_OPTION]=legacy_record('staging','https://legacy.client.test/subdir',4);
          $s=MAD4B_SCP_Site_Profile::status();
          ok(empty($s['configured'])&&'stored_invalid'===$s['source'],'invalid v2 record blocks legacy fallback');
          ok(!MAD4B_SCP_Site_Profile::write_enabled(),'invalid v2 state remains zero-authority');

          // Legacy Production write confirmation never migrates; explicit v2 confirmation is required again.
          reset_state();
          $GLOBALS['mad4b_test_environment']='production';$GLOBALS['mad4b_test_home']='https://client.example/';
          $GLOBALS['mad4b_test_options'][MAD4B_SCP_Site_Profile::LEGACY_OPTION]=legacy_record('production','https://client.example',2);
          $s=MAD4B_SCP_Site_Profile::status();
          ok(!empty($s['configured'])&&3===(int)$s['revision'],'production identity migrates');
          ok(empty($s['write_enabled']),'legacy production write is disabled during migration');
          $prod=array('expected_revision'=>3,'display_name'=>'Client Production','oauth_user_ids'=>array(7),'oauth_enabled'=>true,'write_enabled'=>true,'production_write_confirmed'=>true);
          $denied=MAD4B_SCP_Site_Profile::save_current_site($prod);
          ok(is_wp_error($denied)&&'mad4b_site_profile_production_write_confirmation_required'===$denied->get_error_code(),'production write requires typed v2 confirmation');
          $prod['production_write_confirmation']=MAD4B_SCP_Site_Profile::PRODUCTION_WRITE_CONFIRMATION;
          $allowed=MAD4B_SCP_Site_Profile::save_current_site($prod);
          ok(!is_wp_error($allowed)&&!empty($allowed['write_enabled']),'exact explicit v2 production confirmation succeeds');

          fwrite(STDOUT,"MAD4B Site Profile v2 general distribution runtime: PASS\n");
          PHP

      - name: Lint and verify tenant-neutral invariants
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          find "$root" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          profile="$root/includes/class-mad4b-scp-site-profile.php"
          main="$root/mad4b-site-control-plane.php"
          grep -Fq 'Version: 0.4.0-rc.32' "$main"
          grep -Fq "const CONTRACT = 'mad4b.site-profile.v2';" "$profile"
          grep -Fq "const LEGACY_CONTRACT = 'mad4b.site-profile.v1';" "$profile"
          grep -Fq "const OPTION = 'mad4b_scp_site_profile_v2';" "$profile"
          grep -Fq "const LEGACY_OPTION = 'mad4b_scp_site_profile_v1';" "$profile"
          grep -Fq 'site_profile_reenrollment_required' "$profile"
          grep -Fq 'migration_requires_reenrollment' "$profile"
          grep -Fq "'chatgpt_app_id' => ''," "$profile"
          grep -Fq "'oauth_user_ids' => array()," "$profile"
          for forbidden in 'plugin_asdk_app_6aa05fa2f97481919c24b99855fadba2' 'staging.egypttourgates.com' 'https://egypttourgates.com'; do ! grep -R -F -n "$forbidden" "$root/includes" "$main"; done
          php -r '$p=json_decode(file_get_contents($argv[1]),true);if(($p["contract"]??"")!=="mad4b.site-profile-presets.v2"||count($p["profiles"]??[])!==0)exit(1);' "$root/config/site-profile-presets.json"
          unexpected="$(grep -R -l -E 'mad4b\.site-profile\.v1|mad4b_scp_site_profile_v1' "$root/includes" "$main" || true)"
          test "$unexpected" = "$profile"

      - name: Run focused runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane/tests'
          php "$root/site-profile-general-distribution-runtime.php"
          if [ -f "$root/oauth-multi-user-tenant-runtime.php" ]; then php "$root/oauth-multi-user-tenant-runtime.php"; fi

      - name: Remove staging payload and commit generalized source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/rc32-generalization.patch.gz.b64 .github/rc32-generalization.patch.gz.b64.part{01,02,03,04,05}
          rm -f .github/rc32.part{01,02,03,04,05}
          rm -f .github/workflows/rc32-apply-generalization.yml
          git config user.name 'MAD4B Automation'
          git config user.email 'mad4b.digital@gmail.com'
          git add -A
          git commit -m 'refactor(core): make control plane tenant-neutral'
          git push origin HEAD:feat/dynamic-wordpress-skills-20260909
