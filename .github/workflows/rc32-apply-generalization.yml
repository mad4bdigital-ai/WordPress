name: RC32 Apply Tenant-Neutral Generalization

on:
  push:
    branches:
      - feat/dynamic-wordpress-skills-20260909
    paths:
      - '.github/workflows/rc32-apply-generalization.yml'

permissions:
  contents: write

concurrency:
  group: rc32-apply-generalization
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/dynamic-wordpress-skills-20260909
          fetch-depth: 2
          persist-credentials: true

      - name: Guard exact staged parent
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='a9a75c1d168706e96917bb179bf98748e78286ab'
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent"
          for n in 01 02 03 04 05; do
            test -f ".github/rc32-generalization.patch.gz.b64.part${n}"
          done

      - name: Reassemble verify and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/rc32-generalization.patch.gz.b64.part01 \
            .github/rc32-generalization.patch.gz.b64.part02 \
            .github/rc32-generalization.patch.gz.b64.part03 \
            .github/rc32-generalization.patch.gz.b64.part04 \
            .github/rc32-generalization.patch.gz.b64.part05 \
            > /tmp/rc32-generalization.patch.gz.b64
          printf '%s  %s\n' \
            'ff62089a02086907a62211fa2979198c7c21e7046b459d81c89d78cbdb9a9fbd' \
            '/tmp/rc32-generalization.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/rc32-generalization.patch.gz.b64 | gzip --decompress > /tmp/rc32-generalization.patch
          test -s /tmp/rc32-generalization.patch
          printf '%s  %s\n' \
            '96231817165faf1f7e39047b16df295e1563563cd23eaad97afdcff1092c5622' \
            '/tmp/rc32-generalization.patch' | sha256sum -c -
          grep -Fq '0.4.0-rc.32' /tmp/rc32-generalization.patch
          grep -Fq 'class-mad4b-scp-site-profile.php' /tmp/rc32-generalization.patch

          awk '
            $1 == "---" { old = $2 }
            $1 == "+++" {
              new = $2
              if (old == "/dev/null") {
                sub(/^b\//, "", new)
                sub(/^patch-new\//, "", new)
                print new
              }
            }
          ' /tmp/rc32-generalization.patch | while IFS= read -r target; do
            case "$target" in
              wp-content/plugins/mad4b-site-control-plane/*)
                if [ -e "$target" ]; then
                  echo "Replacing patch-owned additive target: $target"
                  rm -f -- "$target"
                fi
                ;;
              *)
                echo "Refusing unexpected additive target from staged patch: $target" >&2
                exit 1
                ;;
            esac
          done

          git apply -p2 --check /tmp/rc32-generalization.patch
          git apply -p2 /tmp/rc32-generalization.patch

      - name: Upgrade Site Profile contract to v2 fail closed
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-site-profile.php')
          text = path.read_text()

          old_constants = """\tconst CONTRACT = 'mad4b.site-profile.v1';
          \tconst PRESET_CONTRACT = 'mad4b.site-profile-presets.v1';
          \tconst OPTION = 'mad4b_scp_site_profile_v1';
          \tconst VERSION = 1;
          \tconst PRESET_FILE = 'config/site-profile-presets.json';
          """
          new_constants = """\tconst CONTRACT = 'mad4b.site-profile.v2';
          \tconst LEGACY_CONTRACT = 'mad4b.site-profile.v1';
          \tconst PRESET_CONTRACT = 'mad4b.site-profile-presets.v2';
          \tconst OPTION = 'mad4b_scp_site_profile_v2';
          \tconst LEGACY_OPTION = 'mad4b_scp_site_profile_v1';
          \tconst VERSION = 2;
          \tconst LEGACY_VERSION = 1;
          \tconst PRESET_FILE = 'config/site-profile-presets.json';
          """
          if text.count(old_constants) != 1:
              raise SystemExit('expected exactly one Site Profile v1 constants block')
          text = text.replace(old_constants, new_constants, 1)

          old_bootstrap = """\t\t$record = get_option( self::OPTION, array() );
          \t\t$source = 'stored';
          \t\tif ( ! self::valid_record( $record ) ) {
          \t\t\t$record = self::matching_preset();
          \t\t\t$source = ! empty( $record ) ? 'legacy_preset' : 'none';
          \t\t\tif ( ! empty( $record ) && self::valid_record( $record ) ) {
          \t\t\t\tupdate_option( self::OPTION, $record, false );
          \t\t\t\t$source = 'legacy_preset_migrated';
          \t\t\t}
          \t\t}
          """
          new_bootstrap = """\t\t$record = get_option( self::OPTION, null );
          \t\t$source = 'stored';
          \t\t$has_current_record = null !== $record && false !== $record;
          \t\tif ( ! self::valid_record( $record ) ) {
          \t\t\tif ( $has_current_record ) {
          \t\t\t\t$record = array();
          \t\t\t\t$source = 'stored_invalid';
          \t\t\t} else {
          \t\t\t\t$legacy = get_option( self::LEGACY_OPTION, array() );
          \t\t\t\t$migrated = self::migrate_legacy_record( $legacy );
          \t\t\t\tif ( ! empty( $migrated ) && self::valid_record( $migrated ) ) {
          \t\t\t\t\tif ( false !== update_option( self::OPTION, $migrated, false ) ) {
          \t\t\t\t\t\t$record = $migrated;
          \t\t\t\t\t\t$source = 'legacy_v1_migrated';
          \t\t\t\t\t} else {
          \t\t\t\t\t\t$record = array();
          \t\t\t\t\t\t$source = 'legacy_v1_migration_failed';
          \t\t\t\t\t}
          \t\t\t\t} else {
          \t\t\t\t\t$record = self::matching_preset();
          \t\t\t\t\t$source = ! empty( $record ) ? 'preset' : 'none';
          \t\t\t\t\tif ( ! empty( $record ) && self::valid_record( $record ) ) {
          \t\t\t\t\t\tupdate_option( self::OPTION, $record, false );
          \t\t\t\t\t\t$source = 'preset_migrated';
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t\t}
          \t\t}
          """
          if text.count(old_bootstrap) != 1:
              raise SystemExit('expected exactly one Site Profile bootstrap v1 block')
          text = text.replace(old_bootstrap, new_bootstrap, 1)

          save_anchor = """\tpublic static function save_current_site( array $input ) {
          \t\tif ( ! current_user_can( 'manage_options' ) ) return new WP_Error( 'mad4b_site_profile_admin_required', 'Administrator capability is required to enroll this site.' );
          \t\t$environment = self::current_environment();
          """
          save_replacement = """\tpublic static function save_current_site( array $input ) {
          \t\tif ( ! current_user_can( 'manage_options' ) ) return new WP_Error( 'mad4b_site_profile_admin_required', 'Administrator capability is required to enroll this site.' );
          \t\tself::bootstrap();
          \t\t$environment = self::current_environment();
          """
          if text.count(save_anchor) != 1:
              raise SystemExit('expected exactly one save_current_site anchor')
          text = text.replace(save_anchor, save_replacement, 1)

          status_anchor = """\t\tif ( ! $configured ) $blockers[] = 'site_profile_unconfigured';
          \t\tif ( $configured && ! $environment_match ) $blockers[] = 'site_profile_environment_drift';
          \t\tif ( $configured && ! $origin_match ) $blockers[] = 'site_profile_origin_drift';
          \t\treturn array(
          """
          status_replacement = """\t\t$reenrollment_required = $configured && ! empty( $profile['migration_requires_reenrollment'] );
          \t\tif ( ! $configured ) $blockers[] = 'site_profile_unconfigured';
          \t\tif ( $configured && ! $environment_match ) $blockers[] = 'site_profile_environment_drift';
          \t\tif ( $configured && ! $origin_match ) $blockers[] = 'site_profile_origin_drift';
          \t\tif ( $reenrollment_required ) $blockers[] = 'site_profile_reenrollment_required';
          \t\treturn array(
          """
          if text.count(status_anchor) != 1:
              raise SystemExit('expected exactly one Site Profile status blocker anchor')
          text = text.replace(status_anchor, status_replacement, 1)

          field_anchor = """\t\t\t'origin_match' => $origin_match,
          \t\t\t'write_enabled' => $configured && $environment_match && $origin_match && self::record_feature_enabled( $profile, 'write', $environment ),
          """
          field_replacement = """\t\t\t'origin_match' => $origin_match,
          \t\t\t'reenrollment_required' => $reenrollment_required,
          \t\t\t'write_enabled' => $configured && $environment_match && $origin_match && self::record_feature_enabled( $profile, 'write', $environment ),
          """
          if text.count(field_anchor) != 1:
              raise SystemExit('expected exactly one Site Profile status field anchor')
          text = text.replace(field_anchor, field_replacement, 1)

          migration_methods = r'''
          	private static function valid_legacy_record( $record ) {
          		if ( ! is_array( $record ) ) return false;
          		if ( self::LEGACY_CONTRACT !== ( isset( $record['contract'] ) ? (string) $record['contract'] : '' ) ) return false;
          		if ( self::LEGACY_VERSION !== absint( isset( $record['version'] ) ? $record['version'] : 0 ) ) return false;
          		if ( ! self::valid_uuid( isset( $record['site_uuid'] ) ? $record['site_uuid'] : '' ) ) return false;
          		if ( absint( isset( $record['revision'] ) ? $record['revision'] : 0 ) < 1 ) return false;
          		$environment = sanitize_key( isset( $record['environment'] ) ? (string) $record['environment'] : '' );
          		if ( ! in_array( $environment, array( 'local', 'development', 'staging', 'production' ), true ) ) return false;
          		return '' !== self::normalize_origin( isset( $record['canonical_origin'] ) ? $record['canonical_origin'] : '' );
          	}

          	private static function migrate_legacy_record( $record ) {
          		if ( ! self::valid_legacy_record( $record ) ) return array();
          		$legacy = self::normalize_record( $record );
          		$environment = self::current_environment();
          		$origin = self::current_origin();
          		if ( ! hash_equals( (string) $legacy['environment'], $environment ) ) return array();
          		if ( '' === $origin || ! hash_equals( (string) $legacy['canonical_origin'], $origin ) ) return array();
          		return array(
          			'contract' => self::CONTRACT,
          			'version' => self::VERSION,
          			'site_uuid' => (string) $legacy['site_uuid'],
          			'revision' => max( 1, absint( $legacy['revision'] ) + 1 ),
          			'environment' => (string) $legacy['environment'],
          			'canonical_origin' => (string) $legacy['canonical_origin'],
          			'display_name' => isset( $legacy['display_name'] ) ? (string) $legacy['display_name'] : '',
          			'chatgpt_app_id' => isset( $legacy['chatgpt_app_id'] ) ? (string) $legacy['chatgpt_app_id'] : '',
          			'oauth_user_ids' => isset( $legacy['oauth_user_ids'] ) && is_array( $legacy['oauth_user_ids'] ) ? $legacy['oauth_user_ids'] : array(),
          			'related_origins' => isset( $legacy['related_origins'] ) && is_array( $legacy['related_origins'] ) ? $legacy['related_origins'] : array(),
          			'features' => array(
          				'oauth' => false,
          				'skills' => false,
          				'write' => false,
          				'production_write_confirmed' => false,
          				'provider_isolation' => false,
          				'managed_runtime' => false,
          				'acceptance' => false,
          			),
          			'legacy_agent_slug' => '',
          			'legacy_zero_touch' => false,
          			'migrated_from_contract' => self::LEGACY_CONTRACT,
          			'migration_requires_reenrollment' => true,
          			'created_at' => ! empty( $legacy['created_at'] ) ? (string) $legacy['created_at'] : gmdate( 'c' ),
          			'updated_at' => gmdate( 'c' ),
          		);
          	}

          '''
          build_anchor = "\tprivate static function build_status( array $profile, $source ) {\n"
          if text.count(build_anchor) != 1:
              raise SystemExit('expected exactly one build_status anchor')
          text = text.replace(build_anchor, migration_methods + build_anchor, 1)

          path.write_text(text)

          preset = Path('wp-content/plugins/mad4b-site-control-plane/config/site-profile-presets.json')
          if preset.exists():
              import json
              data = json.loads(preset.read_text())
              data['contract'] = 'mad4b.site-profile-presets.v2'
              data['profiles'] = []
              preset.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Lint changed PHP and validate changed JSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            case "$file" in
              *.php) if [ -f "$file" ]; then php -l "$file"; fi ;;
              *.json) if [ -f "$file" ]; then php -r '$p=$argv[1]; $v=json_decode(file_get_contents($p), true); if (json_last_error() !== JSON_ERROR_NONE) { fwrite(STDERR, $p.": ".json_last_error_msg()."\n"); exit(1); }' "$file"; fi ;;
            esac
          done < <(git status --short | sed -E 's/^.. //' | sed -E 's/^.* -> //')

      - name: Verify tenant-neutral release invariants
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          main="$root/mad4b-site-control-plane.php"
          profile="$root/includes/class-mad4b-scp-site-profile.php"
          grep -Fq 'Version: 0.4.0-rc.32' "$main"
          grep -Fq "define( 'MAD4B_SCP_VERSION', '0.4.0-rc.32' );" "$main"
          grep -Fq "const CONTRACT = 'mad4b.site-profile.v2';" "$profile"
          grep -Fq "const LEGACY_CONTRACT = 'mad4b.site-profile.v1';" "$profile"
          grep -Fq "const OPTION = 'mad4b_scp_site_profile_v2';" "$profile"
          grep -Fq "const LEGACY_OPTION = 'mad4b_scp_site_profile_v1';" "$profile"
          grep -Fq 'site_profile_reenrollment_required' "$profile"
          grep -Fq 'migration_requires_reenrollment' "$profile"
          grep -Fq 'PRODUCTION_WRITE_CONFIRMATION' "$profile"
          for forbidden in \
            'plugin_asdk_app_6aa05fa2f97481919c24b99855fadba2' \
            'staging.egypttourgates.com' \
            'https://egypttourgates.com'; do
            ! grep -R -F -n "$forbidden" "$root/includes" "$main"
          done
          presets="$root/config/site-profile-presets.json"
          php -r '$p=json_decode(file_get_contents($argv[1]), true); if (!is_array($p) || ($p["contract"] ?? "") !== "mad4b.site-profile-presets.v2" || !isset($p["profiles"]) || count($p["profiles"]) !== 0) exit(1);' "$presets"
          unexpected="$(grep -R -l -E 'mad4b\.site-profile\.v1|mad4b_scp_site_profile_v1' "$root/includes" "$main" || true)"
          test "$unexpected" = "$profile"

      - name: Run focused tenant-neutral runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane/tests'
          for test in \
            site-profile-general-distribution-runtime.php \
            oauth-multi-user-tenant-runtime.php; do
            if [ -f "$root/$test" ]; then php "$root/$test"; fi
          done

      - name: Remove staging payload and commit generalized source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/rc32-generalization.patch.gz.b64
          rm -f .github/rc32-generalization.patch.gz.b64.part01
          rm -f .github/rc32-generalization.patch.gz.b64.part02
          rm -f .github/rc32-generalization.patch.gz.b64.part03
          rm -f .github/rc32-generalization.patch.gz.b64.part04
          rm -f .github/rc32-generalization.patch.gz.b64.part05
          rm -f .github/rc32.part01 .github/rc32.part02 .github/rc32.part03 .github/rc32.part04 .github/rc32.part05
          rm -f .github/workflows/rc32-apply-generalization.yml
          git status --short
          test -n "$(git status --porcelain)"
          git config user.name 'MAD4B Automation'
          git config user.email 'mad4b.digital@gmail.com'
          git add -A
          git commit -m 'refactor(core): make control plane tenant-neutral'
          git push origin HEAD:feat/dynamic-wordpress-skills-20260909
