name: RC32 Apply Tenant-Neutral Generalization

on:
  push:
    branches:
      - feat/dynamic-wordpress-skills-20260909
    paths:
      - '.github/workflows/rc32-apply-generalization.yml'

permissions:
  contents: write

concurrency:
  group: rc32-apply-generalization
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/dynamic-wordpress-skills-20260909
          fetch-depth: 2
          persist-credentials: true

      - name: Guard staged parent and payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '3d07ae2ff068a22076f5f85939931a0d88961e33'
          for n in 01 02 03 04 05; do test -f ".github/rc32-generalization.patch.gz.b64.part${n}"; done

      - name: Reassemble verify and apply reviewed rc32 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/rc32-generalization.patch.gz.b64.part{01,02,03,04,05} > /tmp/rc32.b64
          printf '%s  %s\n' 'ff62089a02086907a62211fa2979198c7c21e7046b459d81c89d78cbdb9a9fbd' /tmp/rc32.b64 | sha256sum -c -
          base64 --decode /tmp/rc32.b64 | gzip --decompress > /tmp/rc32.patch
          printf '%s  %s\n' '96231817165faf1f7e39047b16df295e1563563cd23eaad97afdcff1092c5622' /tmp/rc32.patch | sha256sum -c -
          awk '$1=="---"{old=$2} $1=="+++"{new=$2; if(old=="/dev/null"){sub(/^b\//,"",new);sub(/^patch-new\//,"",new);print new}}' /tmp/rc32.patch |
          while IFS= read -r target; do
            case "$target" in
              wp-content/plugins/mad4b-site-control-plane/*) [ ! -e "$target" ] || rm -f -- "$target" ;;
              *) echo "Unexpected additive target: $target" >&2; exit 1 ;;
            esac
          done
          git apply -p2 --check /tmp/rc32.patch
          git apply -p2 /tmp/rc32.patch

      - name: Harden Site Profile v2 migration boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json, re

          p = Path('wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-site-profile.php')
          s = p.read_text()

          old = "\tconst CONTRACT = 'mad4b.site-profile.v1';\n\tconst PRESET_CONTRACT = 'mad4b.site-profile-presets.v1';\n\tconst OPTION = 'mad4b_scp_site_profile_v1';\n\tconst VERSION = 1;\n"
          new = "\tconst CONTRACT = 'mad4b.site-profile.v2';\n\tconst LEGACY_CONTRACT = 'mad4b.site-profile.v1';\n\tconst PRESET_CONTRACT = 'mad4b.site-profile-presets.v2';\n\tconst OPTION = 'mad4b_scp_site_profile_v2';\n\tconst LEGACY_OPTION = 'mad4b_scp_site_profile_v1';\n\tconst VERSION = 2;\n\tconst LEGACY_VERSION = 1;\n"
          if s.count(old) != 1:
              raise SystemExit('Site Profile constants block drifted')
          s = s.replace(old, new, 1)

          bootstrap_re = re.compile(
              r"\t\t\$record = get_option\( self::OPTION, .*?\);\n"
              r"\t\t\$source = 'stored';\n"
              r"\t\tif \( ! self::valid_record\( \$record \) \) \{.*?\n\t\t\}\n\n"
              r"(?=\t\tself::\$profile =)", re.S
          )
          replacement = """\t\t$record = get_option( self::OPTION, null );
          \t\t$source = 'stored';
          \t\t$has_current_record = null !== $record && false !== $record;
          \t\tif ( ! self::valid_record( $record ) ) {
          \t\t\tif ( $has_current_record ) {
          \t\t\t\t$record = array();
          \t\t\t\t$source = 'stored_invalid';
          \t\t\t} else {
          \t\t\t\t$legacy = get_option( self::LEGACY_OPTION, array() );
          \t\t\t\t$migrated = self::migrate_legacy_record( $legacy );
          \t\t\t\tif ( ! empty( $migrated ) && self::valid_record( $migrated ) && false !== update_option( self::OPTION, $migrated, false ) ) {
          \t\t\t\t\t$record = $migrated;
          \t\t\t\t\t$source = 'legacy_v1_migrated';
          \t\t\t\t} else {
          \t\t\t\t\t$record = self::matching_preset();
          \t\t\t\t\t$source = ! empty( $record ) ? 'preset' : 'none';
          \t\t\t\t\tif ( ! empty( $record ) && self::valid_record( $record ) && false !== update_option( self::OPTION, $record, false ) ) $source = 'preset_migrated';
          \t\t\t\t}
          \t\t\t}
          \t\t}

          """
          s, count = bootstrap_re.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('Site Profile bootstrap block drifted')

          save_marker = "\tpublic static function save_current_site( array $input ) {\n\t\tif ( ! current_user_can( 'manage_options' ) ) return new WP_Error( 'mad4b_site_profile_admin_required', 'Administrator capability is required to enroll this site.' );\n"
          if s.count(save_marker) != 1:
              raise SystemExit('save_current_site marker drifted')
          s = s.replace(save_marker, save_marker + "\t\tself::bootstrap();\n", 1)

          methods = r'''
          	private static function valid_legacy_record( $record ) {
          		if ( ! is_array( $record ) ) return false;
          		if ( self::LEGACY_CONTRACT !== ( isset( $record['contract'] ) ? (string) $record['contract'] : '' ) ) return false;
          		if ( self::LEGACY_VERSION !== absint( isset( $record['version'] ) ? $record['version'] : 0 ) ) return false;
          		if ( ! self::valid_uuid( isset( $record['site_uuid'] ) ? $record['site_uuid'] : '' ) ) return false;
          		if ( absint( isset( $record['revision'] ) ? $record['revision'] : 0 ) < 1 ) return false;
          		$environment = sanitize_key( isset( $record['environment'] ) ? (string) $record['environment'] : '' );
          		if ( ! in_array( $environment, array( 'local', 'development', 'staging', 'production' ), true ) ) return false;
          		return '' !== self::normalize_origin( isset( $record['canonical_origin'] ) ? $record['canonical_origin'] : '' );
          	}

          	private static function migrate_legacy_record( $record ) {
          		if ( ! self::valid_legacy_record( $record ) ) return array();
          		$legacy = self::normalize_record( $record );
          		$environment = self::current_environment();
          		$origin = self::current_origin();
          		if ( ! hash_equals( (string) $legacy['environment'], $environment ) ) return array();
          		if ( '' === $origin || ! hash_equals( (string) $legacy['canonical_origin'], $origin ) ) return array();
          		return array(
          			'contract' => self::CONTRACT,
          			'version' => self::VERSION,
          			'site_uuid' => (string) $legacy['site_uuid'],
          			'revision' => max( 1, absint( $legacy['revision'] ) + 1 ),
          			'environment' => (string) $legacy['environment'],
          			'canonical_origin' => (string) $legacy['canonical_origin'],
          			'display_name' => isset( $legacy['display_name'] ) ? (string) $legacy['display_name'] : '',
          			'chatgpt_app_id' => isset( $legacy['chatgpt_app_id'] ) ? (string) $legacy['chatgpt_app_id'] : '',
          			'oauth_user_ids' => isset( $legacy['oauth_user_ids'] ) && is_array( $legacy['oauth_user_ids'] ) ? $legacy['oauth_user_ids'] : array(),
          			'related_origins' => isset( $legacy['related_origins'] ) && is_array( $legacy['related_origins'] ) ? $legacy['related_origins'] : array(),
          			'features' => array(
          				'oauth' => false,
          				'skills' => false,
          				'write' => false,
          				'production_write_confirmed' => false,
          				'provider_isolation' => false,
          				'managed_runtime' => false,
          				'acceptance' => false,
          			),
          			'legacy_agent_slug' => '',
          			'legacy_zero_touch' => false,
          			'migrated_from_contract' => self::LEGACY_CONTRACT,
          			'migration_requires_reenrollment' => true,
          			'created_at' => ! empty( $legacy['created_at'] ) ? (string) $legacy['created_at'] : gmdate( 'c' ),
          			'updated_at' => gmdate( 'c' ),
          		);
          	}

          '''
          anchor = "\tprivate static function build_status( array $profile, $source ) {\n"
          if s.count(anchor) != 1:
              raise SystemExit('build_status marker drifted')
          s = s.replace(anchor, methods + anchor, 1)

          blocker_marker = "\t\t$blockers = array();\n"
          if s.count(blocker_marker) != 1:
              raise SystemExit('build_status blockers marker drifted')
          s = s.replace(blocker_marker, blocker_marker + "\t\t$reenrollment_required = $configured && ! empty( $profile['migration_requires_reenrollment'] );\n", 1)
          drift_marker = "\t\tif ( $configured && ! $origin_match ) $blockers[] = 'site_profile_origin_drift';\n"
          if s.count(drift_marker) != 1:
              raise SystemExit('origin drift marker drifted')
          s = s.replace(drift_marker, drift_marker + "\t\tif ( $reenrollment_required ) $blockers[] = 'site_profile_reenrollment_required';\n", 1)
          origin_field = "\t\t\t'origin_match' => $origin_match,\n"
          if s.count(origin_field) != 1:
              raise SystemExit('origin_match field marker drifted')
          s = s.replace(origin_field, origin_field + "\t\t\t'reenrollment_required' => $reenrollment_required,\n", 1)

          p.write_text(s)

          preset = Path('wp-content/plugins/mad4b-site-control-plane/config/site-profile-presets.json')
          data = json.loads(preset.read_text())
          data['contract'] = 'mad4b.site-profile-presets.v2'
          data['profiles'] = []
          preset.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Lint and verify tenant-neutral invariants
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          find "$root" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          profile="$root/includes/class-mad4b-scp-site-profile.php"
          main="$root/mad4b-site-control-plane.php"
          grep -Fq 'Version: 0.4.0-rc.32' "$main"
          grep -Fq "const CONTRACT = 'mad4b.site-profile.v2';" "$profile"
          grep -Fq "const LEGACY_CONTRACT = 'mad4b.site-profile.v1';" "$profile"
          grep -Fq "const OPTION = 'mad4b_scp_site_profile_v2';" "$profile"
          grep -Fq "const LEGACY_OPTION = 'mad4b_scp_site_profile_v1';" "$profile"
          grep -Fq 'site_profile_reenrollment_required' "$profile"
          grep -Fq 'migration_requires_reenrollment' "$profile"
          grep -Fq 'PRODUCTION_WRITE_CONFIRMATION' "$profile"
          for forbidden in 'plugin_asdk_app_6aa05fa2f97481919c24b99855fadba2' 'staging.egypttourgates.com' 'https://egypttourgates.com'; do
            ! grep -R -F -n "$forbidden" "$root/includes" "$main"
          done
          php -r '$p=json_decode(file_get_contents($argv[1]),true); if(($p["contract"]??"")!=="mad4b.site-profile-presets.v2" || count($p["profiles"]??[])!==0) exit(1);' "$root/config/site-profile-presets.json"
          unexpected="$(grep -R -l -E 'mad4b\.site-profile\.v1|mad4b_scp_site_profile_v1' "$root/includes" "$main" || true)"
          test "$unexpected" = "$profile"

      - name: Run focused runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane/tests'
          php "$root/site-profile-general-distribution-runtime.php"
          if [ -f "$root/oauth-multi-user-tenant-runtime.php" ]; then php "$root/oauth-multi-user-tenant-runtime.php"; fi

      - name: Remove staging payload and commit generalized source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/rc32-generalization.patch.gz.b64 .github/rc32-generalization.patch.gz.b64.part{01,02,03,04,05}
          rm -f .github/rc32.part{01,02,03,04,05}
          rm -f .github/workflows/rc32-apply-generalization.yml
          git config user.name 'MAD4B Automation'
          git config user.email 'mad4b.digital@gmail.com'
          git add -A
          git commit -m 'refactor(core): make control plane tenant-neutral'
          git push origin HEAD:feat/dynamic-wordpress-skills-20260909
