name: MAD4B Dynamic Skills

on:
  pull_request:
    paths:
      - 'plugins/mad4b-wordpress/**'
      - '.agents/plugins/marketplace.json'
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - '.github/workflows/mad4b-dynamic-skills.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-dynamic-skills-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Dynamic Skills contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Reject package symlinks and secret-like files
        shell: bash
        run: |
          set -euo pipefail
          roots=(
            plugins/mad4b-wordpress
            wp-content/plugins/mad4b-site-control-plane/skill-seeds
          )
          symlink="$(find "${roots[@]}" -type l -print -quit)"
          if [ -n "$symlink" ]; then
            echo "Symlink is forbidden in portable Skill package inputs: $symlink" >&2
            exit 1
          fi
          suspicious="$(find "${roots[@]}" -type f \( \
            -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.p12' -o \
            -name '*.pfx' -o -name '*.key' -o -name 'id_rsa' -o -name 'id_ed25519' \
          \) -print -quit)"
          if [ -n "$suspicious" ]; then
            echo "Secret-like file is forbidden in portable Skill package inputs: $suspicious" >&2
            exit 1
          fi

      - name: PHP lint Skill/write implementation
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          for file in \
            includes/class-mad4b-scp-site-profile.php \
            includes/class-mad4b-scp-skill-autoconfig.php \
            includes/class-mad4b-scp-skill-registry.php \
            includes/class-mad4b-scp-skill-seeder.php \
            includes/class-mad4b-scp-skill-provider-discovery.php \
            includes/class-mad4b-scp-skill-resource-reader.php \
            includes/class-mad4b-scp-skill-resource-writer.php \
            includes/class-mad4b-scp-skill-snapshot-identity.php \
            includes/class-mad4b-scp-skill-exporter.php \
            includes/class-mad4b-scp-skill-runtime-certification.php \
            includes/class-mad4b-scp-skill-abilities.php \
            includes/class-mad4b-scp-skills-admin-ui.php \
            includes/class-mad4b-scp-staging-write-authority.php \
            includes/class-mad4b-scp-staging-write-planning-guard.php \
            includes/class-mad4b-scp-write-runtime-certification.php \
            includes/class-mad4b-scp-rest-compatibility.php \
            includes/class-mad4b-scp-authorization.php \
            includes/class-mad4b-scp-transport-context.php \
            includes/class-mad4b-scp-servers.php \
            includes/adapters/class-mad4b-scp-skills-adapter.php \
            tests/runtime-dynamic-skills-smoke.php \
            tests/runtime-governance-readonly-immutability.php \
            tests/runtime-plugin-lifecycle-data-continuity.php \
            tests/runtime-authority-concurrency-worker.php \
            tests/runtime-authority-concurrency-verify.php \
            tests/authority-candidate-binding-runtime.php \
            tests/runtime-wp-import-export-governance.php \
            tests/runtime-write-authority-persisted-readback.php \
            tests/runtime-write-surface-smoke.php \
            tests/runtime-dynamic-skills-production-smoke.php; do
            php -l "$root/$file"
          done

      - name: Verify dynamic Skill and governed write contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 wp-content/plugins/mad4b-site-control-plane/tests/dynamic-skills-contract.py
          python3 wp-content/plugins/mad4b-site-control-plane/tests/skill-runtime-certification-contract.py
          python3 wp-content/plugins/mad4b-site-control-plane/tests/staging-write-authority-contract.py
          python3 wp-content/plugins/mad4b-site-control-plane/tests/plugin-lifecycle-data-retention-contract.py
          php wp-content/plugins/mad4b-site-control-plane/tests/authority-candidate-binding-runtime.php

      - name: Deny Skill mutation and breakglass leakage
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          abilities="$root/includes/class-mad4b-scp-skill-abilities.php"
          adapter="$root/includes/adapters/class-mad4b-scp-skills-adapter.php"
          write="$root/includes/class-mad4b-scp-staging-write-authority.php"
          grep -Fq "'readonly' => true" "$abilities"
          grep -Fq "'content' => array()" "$adapter"
          grep -Fq "'admin' => array()" "$adapter"
          if grep -Eiq "mad4b/skill-(create|update|delete|write)" "$abilities" "$adapter"; then
            echo 'Skill write ability leaked into MCP projection.' >&2
            exit 1
          fi
          grep -Fq "array_diff( \$tools, array( 'mad4b/database-raw-query' ) )" "$write"

      - name: Build portable Plugin snapshot artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (
            cd plugins
            zip -qr ../dist/mad4b-wordpress-portable.zip mad4b-wordpress
          )
          unzip -tqq dist/mad4b-wordpress-portable.zip
          sha256sum dist/mad4b-wordpress-portable.zip > dist/mad4b-wordpress-portable.zip.sha256
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > dist/SOURCE_HEAD.txt

      - name: Upload portable Plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: mad4b-wordpress-portable-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/mad4b-wordpress-portable.zip
            dist/mad4b-wordpress-portable.zip.sha256
            dist/SOURCE_HEAD.txt
          if-no-files-found: error
          retention-days: 14

  runtime-staging:
    name: Dynamic Skills + governed write generic Staging runtime
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, openssl, zip
          coverage: none
      - name: Install WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar --info
      - name: Provision disposable generic Staging WordPress
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-dynamic-skills-staging
          rm -rf "$WP_PATH"
          mkdir -p "$WP_PATH"
          php /tmp/wp-cli.phar core download --path="$WP_PATH" --version=latest --force
          php /tmp/wp-cli.phar config create --path="$WP_PATH" --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core install --path="$WP_PATH" --url='https://dynamic-skills.test' --title='MAD4B Dynamic Skills' --admin_user='mad4b-ci-admin' --admin_password='ci-only-not-a-secret' --admin_email='ci@example.invalid' --skip-email
          php /tmp/wp-cli.phar config set WP_ENVIRONMENT_TYPE staging --type=constant --path="$WP_PATH"
      - name: Install exact MCP Adapter and Control Plane with zero authority
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-dynamic-skills-staging
          unzip -q wp-content/plugins/mcp-adapter.zip -d "$WP_PATH/wp-content/plugins"
          rm -rf "$WP_PATH/wp-content/plugins/mad4b-site-control-plane"
          cp -R wp-content/plugins/mad4b-site-control-plane "$WP_PATH/wp-content/plugins/mad4b-site-control-plane"
          php /tmp/wp-cli.phar plugin activate mcp-adapter --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate mad4b-site-control-plane --path="$WP_PATH"
          php /tmp/wp-cli.phar eval '
          $profile = MAD4B_SCP_Site_Profile::status();
          $skills = MAD4B_SCP_Skill_Autoconfig::status();
          if ( ! empty( $profile["configured"] ) || ! empty( $skills["configured"] ) || MAD4B_SCP_Staging_Write_Authority::eligible() ) {
              throw new RuntimeException( "Fresh generic install unexpectedly acquired Skills or write authority." );
          }
          ' --path="$WP_PATH" --user=mad4b-ci-admin
      - name: Explicitly enroll generic Skills and governed-write tenant
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-dynamic-skills-staging
          php /tmp/wp-cli.phar eval '
          $result = MAD4B_SCP_Site_Profile::save_current_site( array(
              "expected_revision" => 0,
              "display_name" => "MAD4B Dynamic Skills CI",
              "chatgpt_app_id" => "plugin_asdk_app_MAD4BCI",
              "oauth_user_ids" => array( get_current_user_id() ),
              "oauth_enabled" => true,
              "skills_enabled" => true,
              "write_enabled" => true,
              "production_write_confirmed" => false,
              "provider_isolation_enabled" => true,
              "managed_runtime_enabled" => true,
              "acceptance_enabled" => true,
          ) );
          if ( is_wp_error( $result ) ) throw new RuntimeException( $result->get_error_code() . ":" . $result->get_error_message() );
          if ( empty( $result["configured"] ) || empty( $result["origin_match"] ) || empty( $result["environment_match"] ) || empty( $result["skills_enabled"] ) || empty( $result["write_enabled"] ) ) {
              throw new RuntimeException( "Explicit generic Site Profile did not bind Skills + write authority." );
          }
          ' --path="$WP_PATH" --user=mad4b-ci-admin
      - name: Prove tenant-bound Skills, governed writes, WPML REST pass-through and portable certification
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-dynamic-skills-smoke.php" --path=/tmp/mad4b-dynamic-skills-staging --user=mad4b-ci-admin
      - name: Prove bulk Import Export remains exact-plan-only and fail-closed
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-wp-import-export-governance.php" --path=/tmp/mad4b-dynamic-skills-staging --user=mad4b-ci-admin

      - name: Prove persisted authority survives an independent request
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-write-authority-persisted-readback.php" --path=/tmp/mad4b-dynamic-skills-staging --user=mad4b-ci-admin

      - name: Prove read and status surfaces preserve authority-bearing persistence
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-governance-readonly-immutability.php" --path=/tmp/mad4b-dynamic-skills-staging --user=mad4b-ci-admin

      - name: Prove deactivate and reactivate preserve governance data
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-dynamic-skills-staging
          SNAPSHOT=/tmp/mad4b-scp-plugin-lifecycle-snapshot.json
          export MAD4B_LIFECYCLE_SNAPSHOT_FILE="$SNAPSHOT"

          export MAD4B_LIFECYCLE_PHASE=capture
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-plugin-lifecycle-data-continuity.php" --path="$WP_PATH" --user=mad4b-ci-admin

          php /tmp/wp-cli.phar plugin deactivate mad4b-site-control-plane --path="$WP_PATH"
          export MAD4B_LIFECYCLE_PHASE=verify
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-plugin-lifecycle-data-continuity.php" --path="$WP_PATH" --user=mad4b-ci-admin

          php /tmp/wp-cli.phar plugin activate mad4b-site-control-plane --path="$WP_PATH"
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-plugin-lifecycle-data-continuity.php" --path="$WP_PATH" --user=mad4b-ci-admin
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-governance-readonly-immutability.php" --path="$WP_PATH" --user=mad4b-ci-admin

      - name: Prove concurrent reconcile and read requests preserve exact grants
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-dynamic-skills-staging
          SNAPSHOT=/tmp/mad4b-authority-concurrency.json
          export MAD4B_AUTHORITY_CONCURRENCY_SNAPSHOT_FILE="$SNAPSHOT"

          export MAD4B_AUTHORITY_CONCURRENCY_PHASE=capture
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-authority-concurrency-verify.php" --path="$WP_PATH" --user=mad4b-ci-admin

          pids=()
          logs=()
          for i in 1 2 3 4 5 6; do
            log="/tmp/mad4b-authority-read-$i.log"
            MAD4B_AUTHORITY_CONCURRENCY_MODE=read php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-authority-concurrency-worker.php" --path="$WP_PATH" --user=mad4b-ci-admin >"$log" 2>&1 &
            pids+=("$!")
            logs+=("$log")
          done
          reconcile_log=/tmp/mad4b-authority-reconcile.log
          MAD4B_AUTHORITY_CONCURRENCY_MODE=reconcile php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-authority-concurrency-worker.php" --path="$WP_PATH" --user=mad4b-ci-admin >"$reconcile_log" 2>&1 &
          pids+=("$!")
          logs+=("$reconcile_log")

          failed=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then failed=1; fi
          done
          for log in "${logs[@]}"; do cat "$log"; done
          test "$failed" -eq 0

          export MAD4B_AUTHORITY_CONCURRENCY_PHASE=verify
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-authority-concurrency-verify.php" --path="$WP_PATH" --user=mad4b-ci-admin

      - name: Prove provider-uncertified mutations stay outside governed remote write projection
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-write-surface-smoke.php" --path=/tmp/mad4b-dynamic-skills-staging --user=mad4b-ci-admin

  runtime-production:
    name: Dynamic Skills + write authority Production fail-closed runtime
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_production
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, openssl
          coverage: none
      - name: Install WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar --info
      - name: Provision disposable Production WordPress
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-dynamic-skills-production
          rm -rf "$WP_PATH"
          mkdir -p "$WP_PATH"
          php /tmp/wp-cli.phar core download --path="$WP_PATH" --version=latest --force
          php /tmp/wp-cli.phar config create --path="$WP_PATH" --dbname=wordpress_production --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core install --path="$WP_PATH" --url='https://mad4b-dynamic-skills-production.test' --title='MAD4B Dynamic Skills Production' --admin_user='mad4b-ci-admin' --admin_password='ci-only-not-a-secret' --admin_email='ci@example.invalid' --skip-email
          php /tmp/wp-cli.phar config set WP_ENVIRONMENT_TYPE production --type=constant --path="$WP_PATH"
      - name: Install exact MCP Adapter and Control Plane
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-dynamic-skills-production
          unzip -q wp-content/plugins/mcp-adapter.zip -d "$WP_PATH/wp-content/plugins"
          rm -rf "$WP_PATH/wp-content/plugins/mad4b-site-control-plane"
          cp -R wp-content/plugins/mad4b-site-control-plane "$WP_PATH/wp-content/plugins/mad4b-site-control-plane"
          php /tmp/wp-cli.phar plugin activate mcp-adapter --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate mad4b-site-control-plane --path="$WP_PATH"
      - name: Prove unconfigured Production receives no Skill/App/write authority
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-dynamic-skills-production-smoke.php" --path=/tmp/mad4b-dynamic-skills-production --user=mad4b-ci-admin
