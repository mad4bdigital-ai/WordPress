name: MAD4B Admin Performance

on:
  push:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - '.github/workflows/mad4b-admin-performance.yml'
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - '.github/workflows/mad4b-admin-performance.yml'

permissions:
  contents: read

jobs:
  admin-performance-contract:
    name: Admin performance contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint plugin coordinator
        run: php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-plugin.php

      - name: Prove expensive governance work is scoped
        shell: python
        run: |
          from pathlib import Path

          root = Path('wp-content/plugins/mad4b-site-control-plane')
          plugin = (root / 'includes/class-mad4b-scp-plugin.php').read_text(encoding='utf-8')
          main = (root / 'mad4b-site-control-plane.php').read_text(encoding='utf-8')
          marker = (root / 'MAD4B-RUNTIME-BUILD.txt').read_text(encoding='utf-8')

          required = [
              "remove_action( 'admin_init', array( 'MAD4B_SCP_Staging_Write_Authority', 'reconcile' ), 20 );",
              "add_action( 'admin_init', array( __CLASS__, 'reconcile_authority_on_mad4b_admin' ), 20 );",
              "remove_action( 'mcp_adapter_init', array( 'MAD4B_SCP_Write_Runtime_Certification', 'observe' ), 110 );",
              "remove_action( 'admin_init', array( 'MAD4B_SCP_Write_Runtime_Certification', 'observe' ), 110 );",
              "add_action( 'admin_init', array( __CLASS__, 'observe_write_certification_on_certification_page' ), 110 );",
              "add_filter( 'wp_register_ability_args', array( __CLASS__, 'make_write_certification_explicit' ), 90, 2 );",
              "'mad4b/write-runtime-certification' !== (string) $name",
              "array( 'MAD4B_SCP_Write_Runtime_Certification', 'observe' )",
              "'mad4b-control-plane-connection' !== $page || 'certification' !== $tab",
              "MAD4B_SCP_MCP_Registration_Rescue::reconcile( 'admin_connection_prime' );",
          ]
          missing = [item for item in required if item not in plugin]
          if missing:
              raise SystemExit('Missing admin-performance contract: ' + ' | '.join(missing))

          prime = plugin.index('rest_get_server();', plugin.index('public static function prime_admin_mcp_runtime'))
          rescue = plugin.index("MAD4B_SCP_MCP_Registration_Rescue::reconcile( 'admin_connection_prime' );", prime)
          if rescue <= prime:
              raise SystemExit('Readiness rescue must run after REST priming and before page rendering')

          if 'Version: 0.4.0-rc.11' not in main or "MAD4B_SCP_VERSION', '0.4.0-rc.11'" not in main:
              raise SystemExit('rc.11 plugin version mismatch')
          if 'release=0.4.0-rc.11' not in marker:
              raise SystemExit('rc.11 build marker mismatch')

          print('mad4b-admin-performance.v2: PASS')
