name: MAD4B Cache Control v1

on:
  pull_request:
    paths:
      - 'ops/mad4b-cache-control-v1/**'
      - '.github/workflows/mad4b-cache-control-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax and pure preview/URL contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=ops/mad4b-cache-control-v1
          php -l "$ROOT/mu-plugins/mad4b-cache-control-v1.php"
          php -l "$ROOT/mu-plugins/mad4b-litespeed-fastcgi-coherence-v1.php"
          php -l "$ROOT/mu-plugins/mad4b-safe-public-html-purge-v1.php"
          php -l "$ROOT/overlays/mad4b-company-policy-registry-v2.php"
          php -l "$ROOT/overlays/mad4b-policy-registry-admin-bridge-v1.php"
          php "$ROOT/tests/test_cache_control_contract.php" "$ROOT/mu-plugins/mad4b-cache-control-v1.php"
          php "$ROOT/tests/test_preview_confirm_contract.php" "$ROOT/mu-plugins/mad4b-cache-control-v1.php"
          php "$ROOT/tests/test_saved_batch_no_socket.php" "$ROOT/mu-plugins/mad4b-cache-control-v1.php" "$ROOT/tests/saved-tour-routes.json"
          php "$ROOT/tests/lsc-fastcgi-pure-contract.php" "$ROOT/mu-plugins/mad4b-litespeed-fastcgi-coherence-v1.php"
          php "$ROOT/tests/lsc-fastcgi-pure-contract.php" "$ROOT/mu-plugins/mad4b-litespeed-fastcgi-coherence-v1.php" batch
          php "$ROOT/tests/lsc-fastcgi-pure-contract.php" "$ROOT/mu-plugins/mad4b-litespeed-fastcgi-coherence-v1.php" partial
          php "$ROOT/tests/lsc-fastcgi-pure-contract.php" "$ROOT/mu-plugins/mad4b-litespeed-fastcgi-coherence-v1.php" overflow
          php "$ROOT/tests/test-safe-public-html.php" "$ROOT/mu-plugins/mad4b-safe-public-html-purge-v1.php"
          git diff --check
      - name: Pure-Python readiness contract and syntax
        run: |
          python3 -m unittest discover -s ops/mad4b-cache-control-v1/tests -p 'test_readiness.py' -v
          python3 -m py_compile ops/mad4b-cache-control-v1/bin/company-cache-control-readiness-v1.py
          python3 ops/mad4b-cache-control-v1/tools/mad4b-nginx-public-html-epoch-v1.py --selftest
          python3 ops/mad4b-cache-control-v1/tools/mad4b-safe-public-cache-callsite-guard-v1.py --selftest
          python3 ops/mad4b-cache-control-v1/tools/mad4b-cache-purge-origin-inventory-v1.py --selftest
          python3 -m py_compile ops/mad4b-cache-control-v1/tools/mad4b-nginx-public-html-epoch-v1.py ops/mad4b-cache-control-v1/tools/mad4b-safe-public-cache-callsite-guard-v1.py
