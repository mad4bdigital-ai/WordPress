name: ARE Operator Asymmetric Attestation
on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-operator-attestation.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-operator-receipt-verifier.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-operator-sessions.php'
      - 'tools/are-staging-unified-remote-plane/operator-seal-verifier.py'
      - 'tools/are-staging-unified-remote-plane/operator-worker-receipt.py'
      - 'tools/are-staging-unified-remote-plane/operator-signature-fixture.php'
      - 'tests/are-operator-asymmetric-roundtrip.py'
      - 'tests/are-operator-receipt-verify-offline.php'
      - '.github/workflows/are-operator-asymmetric-attestation.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dual-asymmetric-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cryptography for test runner
        run: python -m pip install --disable-pip-version-check 'cryptography==46.0.3'
      - name: PHP/Python syntax
        run: |
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-operator-attestation.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-operator-receipt-verifier.php
          php -l tools/are-staging-unified-remote-plane/operator-signature-fixture.php
          php -l tests/are-operator-receipt-verify-offline.php
          python -m py_compile tools/are-staging-unified-remote-plane/operator-seal-verifier.py
          python -m py_compile tools/are-staging-unified-remote-plane/operator-worker-receipt.py
          python -m py_compile tests/are-operator-asymmetric-roundtrip.py
      - name: Sign and independently verify fixture
        run: python tests/are-operator-asymmetric-roundtrip.py
