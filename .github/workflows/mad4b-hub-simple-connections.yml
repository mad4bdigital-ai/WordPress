name: MAD4B Simple REST and Hub Auto Distribute

on:
  pull_request:
    paths:
      - 'ops/central-company-rest/central/240-mad4b-central-simple-connections.php'
      - 'ops/central-company-rest/central/250-mad4b-hub-auto-distribute.php'
      - 'ops/central-company-rest/central/260-mad4b-hub-source-import.php'
      - 'ops/central-company-rest/central/270-mad4b-hub-dedup-intelligence.php'
      - 'ops/central-company-rest/central/271-mad4b-hub-dedup-tourism-nile.php'
      - 'ops/central-company-rest/central/272-mad4b-hub-dedup-typed.php'
      - 'ops/central-company-rest/central/273-mad4b-hub-field-fusion.php'
      - 'ops/central-company-rest/central/274-mad4b-tourism-field-policy.php'
      - 'ops/central-company-rest/central/275-mad4b-hub-source-provider-registry.php'
      - 'ops/central-company-rest/central/276-mad4b-hub-source-sync-jobs.php'
      - 'ops/central-company-rest/ssh/tourism-source-export.php'
      - 'ops/central-company-rest/remote/240-mad4b-company-simple-identity.php'
      - 'ops/central-company-rest/remote/250-mad4b-company-private-hub-inbox.php'
      - 'ops/central-company-rest/remote/260-mad4b-company-simple-content-feed.php'
      - 'ops/central-company-rest/tests/test-simple-connections.php'
      - 'ops/central-company-rest/tests/test-auto-distribute.php'
      - 'ops/central-company-rest/tests/test-hub-source-import.php'
      - 'ops/central-company-rest/tests/test-hub-dedup-intelligence.php'
      - 'ops/central-company-rest/tests/test-hub-field-fusion.php'
      - 'ops/central-company-rest/tests/test-hub-source-provider-registry.php'
      - 'ops/central-company-rest/tests/test-hub-source-sync-jobs.php'
      - 'ops/central-company-rest/tests/test-hub-native-write-mount.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-server-write-catalog.php'
      - '.github/workflows/mad4b-hub-simple-connections.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-hub-mad4b-hub-simple-connections-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  simple-rest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl
          coverage: none
      - name: Syntax lint
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            ops/central-company-rest/central/240-mad4b-central-simple-connections.php \
            ops/central-company-rest/central/250-mad4b-hub-auto-distribute.php \
            ops/central-company-rest/central/260-mad4b-hub-source-import.php \
            ops/central-company-rest/central/270-mad4b-hub-dedup-intelligence.php \
            ops/central-company-rest/central/271-mad4b-hub-dedup-tourism-nile.php \
            ops/central-company-rest/central/272-mad4b-hub-dedup-typed.php \
            ops/central-company-rest/central/273-mad4b-hub-field-fusion.php \
            ops/central-company-rest/central/274-mad4b-tourism-field-policy.php \
            ops/central-company-rest/central/275-mad4b-hub-source-provider-registry.php \
            ops/central-company-rest/central/276-mad4b-hub-source-sync-jobs.php \
            ops/central-company-rest/ssh/tourism-source-export.php \
            ops/central-company-rest/remote/240-mad4b-company-simple-identity.php \
            ops/central-company-rest/remote/250-mad4b-company-private-hub-inbox.php \
            ops/central-company-rest/remote/260-mad4b-company-simple-content-feed.php \
            ops/central-company-rest/tests/test-simple-connections.php \
            ops/central-company-rest/tests/test-auto-distribute.php \
            ops/central-company-rest/tests/test-hub-source-import.php \
            ops/central-company-rest/tests/test-hub-dedup-intelligence.php \
            ops/central-company-rest/tests/test-hub-field-fusion.php \
            ops/central-company-rest/tests/test-hub-source-provider-registry.php \
            ops/central-company-rest/tests/test-hub-source-sync-jobs.php \
            ops/central-company-rest/tests/test-hub-native-write-mount.php \
            wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-server-write-catalog.php; do
            php -l "$file"
          done
      - name: Functional safety contracts
        shell: bash
        run: |
          set -euo pipefail
          php ops/central-company-rest/tests/test-simple-connections.php
          php ops/central-company-rest/tests/test-auto-distribute.php
          php ops/central-company-rest/tests/test-hub-source-import.php
          php ops/central-company-rest/tests/test-hub-dedup-intelligence.php
          php ops/central-company-rest/tests/test-hub-field-fusion.php
          php ops/central-company-rest/tests/test-hub-source-provider-registry.php
          php ops/central-company-rest/tests/test-hub-source-sync-jobs.php
          php ops/central-company-rest/tests/test-hub-native-write-mount.php
