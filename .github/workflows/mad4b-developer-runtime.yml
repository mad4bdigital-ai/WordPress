name: MAD4B Developer Runtime

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - '.github/workflows/mad4b-developer-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-developer-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    name: Developer Plane contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-developer-runtime.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-developer-authority.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-agent-registry.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-connection-status.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-oauth-resource-bridge.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-oauth-request-context-guard.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-oauth-jwt-header-guard.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-oauth-subject-gate.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-oauth-challenge-alignment.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-mcp-client-compatibility.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-policy.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-servers.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-authorization.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-execution-fence.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-impact-policy.php
          php -l wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php

      - name: Developer Plane static contract
        shell: bash
        run: |
          set -euo pipefail
          python3 wp-content/plugins/mad4b-site-control-plane/tests/developer-runtime-contract.py
