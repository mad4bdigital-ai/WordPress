name: MAD4B Visitor Preference Continuity
on:
  push:
    branches:
      - fix/visitor-preferences-identity-woo-session-20261117
    paths:
      - 'wp-content/plugins/mad4b-country-switcher/**'
      - 'wp-content/plugins/mad4b-traveller-nationality/**'
      - 'wp-content/plugins/etg-traveller-nationality-switcher/**'
      - 'tests/visitor-preferences-wpml-guest-session-hermetic.php'
      - '.github/workflows/mad4b-visitor-preference-continuity.yml'
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-country-switcher/**'
      - 'wp-content/plugins/mad4b-traveller-nationality/**'
      - 'wp-content/plugins/etg-traveller-nationality-switcher/**'
      - 'tests/visitor-preferences-wpml-guest-session-hermetic.php'
      - '.github/workflows/mad4b-visitor-preference-continuity.yml'
permissions:
  contents: read
jobs:
  original-php-session:
    name: Original PHP signed preference and WooCommerce session contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax and original-class behavior
        run: |
          php -v
          php -l wp-content/plugins/mad4b-country-switcher/mad4b-country-switcher.php
          php -l wp-content/plugins/etg-traveller-nationality-switcher/etg-traveller-nationality-switcher.php
          php -l tests/visitor-preferences-wpml-guest-session-hermetic.php
          php tests/visitor-preferences-wpml-guest-session-hermetic.php
