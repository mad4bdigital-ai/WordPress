name: MAD4B Cross Plugin Source Artifact Candidate

on:
  pull_request:
    paths:
      - 'wp-content/plugins/**'
      - 'tools/mad4b-cross-plugin-*.py'
      - 'wp-content/plugins/mad4b-site-control-plane/config/cross-plugin-sources.json'
      - '.github/workflows/mad4b-cross-plugin-candidate.yml'
  workflow_dispatch:
    inputs:
      source_id:
        description: Optional reviewed source ID (empty = all eligible sources)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cross-plugin-candidate-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  discover-candidates:
    name: Resolve immutable reviewed candidate matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
      has_candidates: ${{ steps.selection.outputs.has_candidates }}
    steps:
      - name: Checkout exact trusted PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify generalized hermetic package contract
        run: |
          set -euo pipefail
          python3 wp-content/plugins/mad4b-site-control-plane/tests/cross-plugin-artifact-builder-contract.py
          python3 wp-content/plugins/mad4b-site-control-plane/tests/cross-plugin-workflow-dynamic-contract.py
          python3 wp-content/plugins/mad4b-site-control-plane/tests/cross-plugin-source-matrix-contract.py
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-cross-plugin-lifecycle.php
          php wp-content/plugins/mad4b-site-control-plane/tests/cross-plugin-lifecycle-gates-runtime.php
      - name: Select exact candidates from reviewed source registry
        id: selection
        env:
          SOURCE_ID: ${{ inputs.source_id || '' }}
        run: |
          set -euo pipefail
          python3 tools/mad4b-cross-plugin-candidates.py \
            --manifest wp-content/plugins/mad4b-site-control-plane/config/cross-plugin-sources.json \
            --source-id "$SOURCE_ID" --github-output "$GITHUB_OUTPUT"

  package-candidate:
    name: Build candidate ${{ matrix.source_id }}
    needs: discover-candidates
    if: needs.discover-candidates.outputs.has_candidates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-candidates.outputs.matrix) }}
    steps:
      - name: Checkout exact trusted PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch exact source SHA (read-only, never execute source)
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ matrix.repository }}
          SOURCE_SHA: ${{ matrix.source_commit_sha }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          git -C candidate init -q
          git -C candidate remote add origin "https://github.com/$SOURCE_REPOSITORY.git"
          git -C candidate -c protocol.version=2 fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git -C candidate -c advice.detachedHead=false checkout --detach --force FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Build only source-registered plugin directory
        shell: bash
        env:
          SOURCE_ID: ${{ matrix.source_id }}
          SOURCE_SHA: ${{ matrix.source_commit_sha }}
        run: |
          set -euo pipefail
          python3 tools/mad4b-cross-plugin-package.py \
            --trusted-manifest wp-content/plugins/mad4b-site-control-plane/config/cross-plugin-sources.json \
            --checkout candidate --source-id "$SOURCE_ID" --sha "$SOURCE_SHA" \
            --out "$RUNNER_TEMP/candidate-artifact"
      - name: Verify exact artifact and generate independent certification evidence
        shell: bash
        env:
          SOURCE_ID: ${{ matrix.source_id }}
          SOURCE_SHA: ${{ matrix.source_commit_sha }}
        run: |
          set -euo pipefail
          python3 tools/mad4b-cross-plugin-certification-review.py \
            --manifest wp-content/plugins/mad4b-site-control-plane/config/cross-plugin-sources.json \
            --source-id "$SOURCE_ID" \
            --zip "$RUNNER_TEMP/candidate-artifact/$SOURCE_ID-$SOURCE_SHA.zip" \
            --receipt "$RUNNER_TEMP/candidate-artifact/$SOURCE_ID-$SOURCE_SHA.json" \
            --out "$RUNNER_TEMP/candidate-artifact/$SOURCE_ID-$SOURCE_SHA.certification-evidence.json"
      - name: Retain non-authorizing candidate ZIP and receipt
        uses: actions/upload-artifact@v4
        with:
          name: cross-plugin-${{ matrix.source_id }}-${{ matrix.source_commit_sha }}
          path: ${{ runner.temp }}/candidate-artifact/
          if-no-files-found: error
          retention-days: 14
