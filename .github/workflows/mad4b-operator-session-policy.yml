name: MAD4B Unified Operator Session Policy

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-operator-session-policy.php'
      - 'tests/remote-execution/unified-operator-session-policy-smoke.php'
      - 'tests/remote-execution/operator-oauth-session-smoke.php'
      - 'tests/remote-execution/operator-grant-rollout-smoke.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-developer-runtime.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-operator-sessions.php'
      - '.github/workflows/mad4b-operator-session-policy.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Show PHP runtime
        run: php -v
      - name: PHP syntax check
        run: |
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-operator-session-policy.php
          php -l tests/remote-execution/unified-operator-session-policy-smoke.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-operator-sessions.php
          php -l tests/remote-execution/operator-oauth-session-smoke.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-developer-runtime.php
          php -l tests/remote-execution/operator-grant-rollout-smoke.php
      - name: Staging policy smoke test
        run: |
          php tests/remote-execution/unified-operator-session-policy-smoke.php
          php tests/remote-execution/operator-oauth-session-smoke.php
          php tests/remote-execution/operator-grant-rollout-smoke.php
          php tests/remote-execution/operator-grant-rollout-smoke.php operator
