name: RC32 Final Environment Generalization v6

on:
  push:
    branches:
      - feat/dynamic-wordpress-skills-20260909
    paths:
      - '.github/workflows/rc32-final-generalization-runtime-v6.yml'

permissions:
  contents: write

jobs:
  generalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Guard exact migration parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '5db594de60085403b1cc4186a19953855ee31357'
          mapfile -t changed < <(git diff --name-only HEAD^..HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/rc32-final-generalization-runtime-v6.yml'
          python3 -m py_compile .github/rc32-final-generalization.py

      - name: Apply strict final generalization
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/rc32-final-generalization.py

      - name: Lint modified runtime
        shell: bash
        run: |
          set -euo pipefail
          root=wp-content/plugins/mad4b-site-control-plane
          for file in \
            includes/class-mad4b-scp-local-oauth-server.php \
            includes/class-mad4b-scp-oauth-resource-bridge.php \
            includes/class-mad4b-scp-mcp-client-compatibility.php \
            includes/class-mad4b-scp-external-handshake-evidence.php \
            includes/class-mad4b-scp-chatgpt-connection-admin-ui.php \
            includes/class-mad4b-scp-live-acceptance-observer.php \
            includes/class-mad4b-scp-mcp-adapter-metadata-bridge.php \
            includes/class-mad4b-scp-mcp-request-scope.php \
            includes/class-mad4b-scp-transport-context.php \
            includes/class-mad4b-scp-skills-admin-ui.php; do
            php -l "$root/$file" >/dev/null
          done

      - name: Run generalized contract suite
        shell: bash
        run: |
          set -euo pipefail
          root=wp-content/plugins/mad4b-site-control-plane
          python3 "$root/tests/general-distribution-environment-contract.py"
          python3 "$root/tests/chatgpt-connection-ui-contract.py"
          python3 "$root/tests/local-oauth-standalone-contract.py"
          python3 "$root/tests/oauth-resource-bridge-contract.py"
          python3 "$root/tests/mcp-client-compatibility-contract.py"
          python3 "$root/tests/live-acceptance-evidence-contract.py"
          python3 "$root/tests/dynamic-skills-contract.py"
          php "$root/tests/external-handshake-inventory-runtime.php"

      - name: Commit validated runtime and regressions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wp-content/plugins/mad4b-site-control-plane
          git diff --cached --quiet && { echo 'No runtime changes staged.' >&2; exit 1; }
          git commit -m 'fix(rc32): generalize enrolled environment gates'
          git push origin HEAD:feat/dynamic-wordpress-skills-20260909
