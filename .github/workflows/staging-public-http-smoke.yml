name: Configured Staging Public HTTP Evidence

on:
  pull_request:
    paths:
      - 'tools/staging-public-http-smoke.py'
      - 'tests/staging-public-http-contract.py'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-frontend-origin-diagnostic.php'
      - '.github/workflows/staging-public-http-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configured-staging-public-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    name: Configured Staging public observation only
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout exact repository SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Enforce safe source script syntax
        run: python3 -m py_compile tools/staging-public-http-smoke.py
      - name: Test configured-origin fail-closed and evidence-only contracts
        run: python3 tests/staging-public-http-contract.py
      - name: Collect read-only independent external observations
        env:
          MAD4B_STAGING_PUBLIC_PROBE_TARGETS_JSON: ${{ vars.MAD4B_STAGING_PUBLIC_PROBE_TARGETS_JSON }}
        run: python3 tools/staging-public-http-smoke.py --output-dir public-http-evidence
      - name: Preserve evidence independent of release decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: configured-staging-public-http-${{ github.sha }}
          path: public-http-evidence/*-staging-public-smoke.json
          if-no-files-found: warn
          retention-days: 14
