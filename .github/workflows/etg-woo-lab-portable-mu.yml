name: ETG Woo Lab Portable MU — source CI

on:
  pull_request:
    paths:
      - 'packages/etg-woo-lab-portable-mu/**'
      - '.github/workflows/etg-woo-lab-portable-mu.yml'
  push:
    branches: [master]
    paths:
      - 'packages/etg-woo-lab-portable-mu/**'
      - '.github/workflows/etg-woo-lab-portable-mu.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woo-lab-mu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-source:
    name: Canonical source / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify exact source and lint 32 MU entrypoints
        run: |
          python3 packages/etg-woo-lab-portable-mu/tools/deploy_reviewed_mu.py --check
      - name: Verify fail-closed installer and no symlink/drift acceptance
        run: |
          python3 packages/etg-woo-lab-portable-mu/tests/test_deploy.py

  archive:
    name: Publish tested source-only rollback-capable archive
    needs: verify-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Create exact source artifact
        run: |
          tar -czf etg-woo-lab-portable-mu-${{ github.sha }}.tar.gz -C packages etg-woo-lab-portable-mu
      - uses: actions/upload-artifact@v4
        with:
          name: woo-lab-portable-mu-source
          path: etg-woo-lab-portable-mu-${{ github.sha }}.tar.gz
          if-no-files-found: error

