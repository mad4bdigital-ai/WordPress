      - 'wp-content/plugins/mad4b-site-control-plane/tests/g5-*.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-adaptive-operations-context.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-ownership-reconciliation.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-g7-operator-journal.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/g7-*.php'

permissions:
  contents: read

concurrency:
  group: feature-007-spec-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  spec-quality:
    name: Feature 007 specification quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Enforce current baseline ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          INTEGRATION_REF="spec/007-competitive-experience-20261006"
          if ! git merge-base --is-ancestor "$BASE" HEAD; then
            echo "BASELINE_STALE"
            git rev-list --left-right --count "$BASE"...HEAD || true
            exit 1
          fi

          META_BASE="$(python -c 'import json; print(json.load(open("specs/007-content-intelligence-workflow-platform/feature.json"))["last_reviewed_master_parent_sha"])')"
          if [ "$BASE_REF" = "master" ]; then
            if [ "$META_BASE" != "$BASE" ]; then
              echo "BASELINE_METADATA_STALE expected_reviewed_master_parent=$BASE recorded=$META_BASE"
              exit 1
            fi
          elif [ "$BASE_REF" = "$INTEGRATION_REF" ]; then
            git fetch --no-tags origin master
            CURRENT_MASTER="$(git rev-parse FETCH_HEAD)"
            if ! git merge-base --is-ancestor "$CURRENT_MASTER" "$BASE"; then
              echo "INTEGRATION_HUB_STALE current_master=$CURRENT_MASTER integration_base=$BASE"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$META_BASE" "$BASE"; then
              echo "INTEGRATION_MASTER_PROVENANCE_INVALID recorded_master_parent=$META_BASE integration_base=$BASE"
              exit 1
            fi
            echo "INTEGRATION_CHILD_BASE_OK current_master=$CURRENT_MASTER integration_base=$BASE recorded_master_parent=$META_BASE"
          else
            if ! git merge-base --is-ancestor "$META_BASE" "$BASE"; then
              echo "BASELINE_METADATA_PROVENANCE_INVALID base_ref=$BASE_REF base=$BASE recorded_master_parent=$META_BASE"
              exit 1
            fi
          fi

          python - "$BASE" <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          base=sys.argv[1]
          feature=json.load(open("specs/007-content-intelligence-workflow-platform/feature.json",encoding="utf-8"))
          release=feature.get("runtime_release_identity") or {}
          source=str(release.get("source_commit_sha") or "")
          state=str(release.get("state") or "")
          expected_runtime_paths=[
              "wp-content/plugins/mad4b-site-control-plane/",
              "wp-content/plugins/mcp-adapter.zip",
              "plugins/mad4b-wordpress/",
              "tools/capture-functional-gap-contract-evidence.py",
          ]
          if feature.get("runtime_identity_paths") != expected_runtime_paths:
              raise SystemExit("RUNTIME_IDENTITY_PATH_POLICY_DRIFT")
          paths=expected_runtime_paths
          if len(source)!=40:
              raise SystemExit("RUNTIME_RELEASE_IDENTITY_INVALID_SOURCE")
          try:
              subprocess.check_call(["git","merge-base","--is-ancestor",source,base])
          except subprocess.CalledProcessError:
              raise SystemExit(f"RUNTIME_RELEASE_NOT_ANCESTOR release={source} base={base}")

          def is_runtime(path):
              return any(path==p or (p.endswith("/") and path.startswith(p)) for p in paths)

          base_delta=subprocess.check_output(["git","diff","--name-only",f"{source}..{base}"],text=True).splitlines()
          pr_delta=subprocess.check_output(["git","diff","--name-only",f"{base}...HEAD"],text=True).splitlines()
          runtime_base=sorted(p for p in base_delta if is_runtime(p))
          runtime_pr=sorted(p for p in pr_delta if is_runtime(p))

          if state=="CURRENT_FOR_DEPLOYMENT":
              if runtime_base or runtime_pr:
                  raise SystemExit(
                      "RUNTIME_RELEASE_IDENTITY_STALE state=CURRENT_FOR_DEPLOYMENT "
                      f"base_delta={runtime_base} pr_delta={runtime_pr}"
                  )
          elif state=="RECAPTURE_REQUIRED":
              if not runtime_base and not runtime_pr:
                  raise SystemExit("RUNTIME_RELEASE_RECAPTURE_REQUIRED_WITHOUT_RUNTIME_DELTA")
          else:
              raise SystemExit(f"RUNTIME_RELEASE_STATE_INVALID:{state!r}")

          print(
              "RUNTIME_RELEASE_IDENTITY_OK "
              f"state={state} release={source} runtime_base_delta={len(runtime_base)} runtime_pr_delta={len(runtime_pr)}"
          )
          PY

      - name: Preserve cross-feature global metadata
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          git diff --exit-code "$BASE"...HEAD -- .specify/feature.json .specify/memory/constitution.md

      - name: Enforce baseline-owned repository feature boundary
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          VERIFY_BRANCH="$HEAD_BRANCH"
          if ! git cat-file -e "$BASE:tools/verify_feature_boundary.py" 2>/dev/null; then
            echo "ROOT_OF_TRUST_BOOTSTRAP_REQUIRED base=$BASE expected=tools/verify_feature_boundary.py"
            echo "Merge the separately governed repository root-of-trust prerequisite before Feature 007 can pass this gate."
            exit 1
          fi
          git show "$BASE:tools/verify_feature_boundary.py" > /tmp/verify_feature_boundary.py

          # PR #258 is the locked integration hub. Its historical branch name is
          # spec/007-..., but after child integration it intentionally carries
          # Feature 007 runtime implementation. For cumulative integration CI only,
          # evaluate its changed paths under the baseline-owned implementation
          # boundary. The master pull_request_target/release gates remain unchanged.
          if [ "$PR_NUMBER" = "258" ] && [ "$HEAD_BRANCH" = "spec/007-competitive-experience-20261006" ]; then
            VERIFY_BRANCH="feat/007-integration-hub"
            echo "INTEGRATION_HUB_BOUNDARY_MODE actual_branch=$HEAD_BRANCH verifier_branch=$VERIFY_BRANCH"
          fi

          python3 /tmp/verify_feature_boundary.py \
            --base "$BASE" \
            --head "$HEAD_SHA" \
            --head-branch "$VERIFY_BRANCH" \
            --pr-number "$PR_NUMBER" \
            --output /tmp/MAD4B-FEATURE-BOUNDARY.json

      - name: Verify reconciled task ledger
        run: python specs/007-content-intelligence-workflow-platform/reconcile_task_ledger.py --check

      - name: Validate Feature 007 contracts and gate liveness
        run: python specs/007-content-intelligence-workflow-platform/validate_spec.py

      - name: Reject unsafe competitor evidence and false extension completion
        run: python specs/007-content-intelligence-workflow-platform/extensions/competitive-experience/test_validation.py

      - name: Verify Competitive Experience G1 evidence and classifier contracts
        run: |
          python specs/007-content-intelligence-workflow-platform/extensions/competitive-experience/test_competitive_evidence.py
          python wp-content/plugins/mad4b-site-control-plane/tests/g1-runtime-evidence-contract.py
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-competitive-evidence.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-runtime-evidence-graph.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-runtime-policy-classifier.php
          php -l wp-content/plugins/mad4b-site-control-plane/config/competitive-evidence-summary.php
          test -z "$(php wp-content/plugins/mad4b-site-control-plane/config/competitive-evidence-summary.php)"
          php wp-content/plugins/mad4b-site-control-plane/tests/runtime-g1-evidence-graph.php

      - name: Verify Competitive Experience G2 governance contracts
        run: |
          python wp-content/plugins/mad4b-site-control-plane/tests/g2-governance-experience-contract.py
          python wp-content/plugins/mad4b-site-control-plane/tests/g2-permission-reduction-contract.py
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-g2-governance-experience.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-g2-permission-changes.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-admin-ui.php
          php wp-content/plugins/mad4b-site-control-plane/tests/g2-governance-experience-runtime.php
          php wp-content/plugins/mad4b-site-control-plane/tests/g2-permission-reduction-runtime.php

      - name: Enforce bulk closure hardening contract
        run: python wp-content/plugins/mad4b-site-control-plane/tests/feature007-bulk-closure-hardening-contract.py

      - name: Enforce fenced remote work queue contract
        run: |
          python wp-content/plugins/mad4b-site-control-plane/tests/remote-work-queue-contract.py
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-remote-work-queue.php
          php wp-content/plugins/mad4b-site-control-plane/tests/remote-work-queue-cancellation-runtime.php
      - name: Verify adaptive search P0 + Phase 38A runtime contracts
        run: |
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-search-measurement.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-search-runtime-context.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-search-eligibility.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-search-evidence-policy.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-provider-account-budget-authority.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-search-decision-policy.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-adaptive-search-acceptance.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-adaptive-search-fault-guard.php
          php wp-content/plugins/mad4b-site-control-plane/tests/adaptive-search-context-runtime.php
          php wp-content/plugins/mad4b-site-control-plane/tests/adaptive-search-p0-runtime.php
          php wp-content/plugins/mad4b-site-control-plane/tests/adaptive-search-cross-fault-runtime.php
          python3 wp-content/plugins/mad4b-site-control-plane/tests/adaptive-search-p0-acceptance-contract.py

  g3-runtime:
    name: Feature 007 G3 runtime (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verify G3 contracts and existing canary compatibility
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN=wp-content/plugins/mad4b-site-control-plane
          for service in declarative-adapter-manifest provider-shadow-read reversible-canary-certification certification-pack-registry provider-canary-execution; do
            php -l "$PLUGIN/includes/class-mad4b-scp-$service.php"
          done
          php -l "$PLUGIN/mad4b-site-control-plane.php"
          for contract in declarative-adapter-manifest provider-shadow-read reversible-canary-certification certification-pack-registry g3-registration provider-canary-execution provider-canary-authorization-finalization provider-canary-authorization-surface; do
            php "$PLUGIN/tests/$contract-contract.php"
          done
          python3 "$PLUGIN/tests/receipt-crypto-profile-contract.py"

  g7-runtime:
    name: Feature 007 G7 ownership safety (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify non-authorizing G7 ownership and current-binding safeguards
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN=wp-content/plugins/mad4b-site-control-plane
          php -l "$PLUGIN/mad4b-site-control-plane.php"
          for source in adaptive-operations-context ownership-reconciliation g7-operator-journal; do
            php -l "$PLUGIN/includes/class-mad4b-scp-$source.php"
          done
          php "$PLUGIN/tests/g7-ownership-reconciliation-runtime.php"
          php "$PLUGIN/tests/g7-operator-journal-runtime.php"

  g5-runtime:
    name: Feature 007 G5 runtime (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verify G5 growth, SEO and external-provider contracts
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN=wp-content/plugins/mad4b-site-control-plane
          for source in g5-external-providers g5-growth-evidence g5-provider-profiles g5-seo-provider-families g5-acceptance; do
            php -l "$PLUGIN/includes/class-mad4b-scp-$source.php"
          done
          php -l "$PLUGIN/mad4b-site-control-plane.php"
          for contract in g5-external-provider-contract g5-growth-evidence-runtime g5-provider-profile-contract g5-seo-provider-family-contract g5-acceptance-contract g5-registration-contract; do
            php "$PLUGIN/tests/$contract.php"
          done
          python3 "$PLUGIN/tests/admin-route-registry-contract.py"

  g4-runtime:
    name: Feature 007 G4 runtime (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verify G4 typed provider-family contracts
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN=wp-content/plugins/mad4b-site-control-plane
          php -l "$PLUGIN/includes/class-mad4b-scp-g4-provider-families.php"
          php -l "$PLUGIN/mad4b-site-control-plane.php"
          php "$PLUGIN/tests/g4-provider-family-contract.php"
          php -l "$PLUGIN/includes/class-mad4b-scp-wordpress-domain-coverage.php"
          for source in "$PLUGIN"/includes/domains/*.php; do php -l "$source"; done
          for domain in forms commerce builders site-operations wordpress; do
            php "$PLUGIN/tests/g4-$domain-contract.php"
          done
          php "$PLUGIN/tests/g4-domain-coverage-runtime.php"
          php "$PLUGIN/tests/g4-native-read-bridges-runtime.php"

