name: Feature 007 Spec Quality CI

on:
  pull_request:
    paths:
      - 'specs/007-content-intelligence-workflow-platform/**'
      - '.github/workflows/feature-007-spec-ci.yml'
      - 'tools/mad4b_recovery_plane.py'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/feature007-bulk-closure-hardening-contract.py'

permissions:
  contents: read

concurrency:
  group: feature-007-spec-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  spec-quality:
    name: Feature 007 specification quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Enforce current baseline ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if ! git merge-base --is-ancestor "$BASE" HEAD; then
            echo "BASELINE_STALE"
            git rev-list --left-right --count "$BASE"...HEAD || true
            exit 1
          fi
          META_BASE="$(python -c 'import json; print(json.load(open("specs/007-content-intelligence-workflow-platform/feature.json"))["last_reviewed_master_parent_sha"])')"
          if [ "$META_BASE" != "$BASE" ]; then
            echo "BASELINE_METADATA_STALE expected_reviewed_parent=$BASE recorded=$META_BASE"
            exit 1
          fi

          python - "$BASE" <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          base=sys.argv[1]
          feature=json.load(open("specs/007-content-intelligence-workflow-platform/feature.json",encoding="utf-8"))
          release=feature.get("runtime_release_identity") or {}
          source=str(release.get("source_commit_sha") or "")
          state=str(release.get("state") or "")
          expected_runtime_paths=[
              "wp-content/plugins/mad4b-site-control-plane/",
              "wp-content/plugins/mcp-adapter.zip",
              "plugins/mad4b-wordpress/",
              "tools/capture-functional-gap-contract-evidence.py",
          ]
          if feature.get("runtime_identity_paths") != expected_runtime_paths:
              raise SystemExit("RUNTIME_IDENTITY_PATH_POLICY_DRIFT")
          paths=expected_runtime_paths
          if len(source)!=40:
              raise SystemExit("RUNTIME_RELEASE_IDENTITY_INVALID_SOURCE")
          try:
              subprocess.check_call(["git","merge-base","--is-ancestor",source,base])
          except subprocess.CalledProcessError:
              raise SystemExit(f"RUNTIME_RELEASE_NOT_ANCESTOR release={source} base={base}")

          def is_runtime(path):
              return any(path==p or (p.endswith("/") and path.startswith(p)) for p in paths)

          base_delta=subprocess.check_output(["git","diff","--name-only",f"{source}..{base}"],text=True).splitlines()
          pr_delta=subprocess.check_output(["git","diff","--name-only",f"{base}...HEAD"],text=True).splitlines()
          runtime_base=sorted(p for p in base_delta if is_runtime(p))
          runtime_pr=sorted(p for p in pr_delta if is_runtime(p))

          if state=="CURRENT_FOR_DEPLOYMENT":
              if runtime_base or runtime_pr:
                  raise SystemExit(
                      "RUNTIME_RELEASE_IDENTITY_STALE state=CURRENT_FOR_DEPLOYMENT "
                      f"base_delta={runtime_base} pr_delta={runtime_pr}"
                  )
          elif state=="RECAPTURE_REQUIRED":
              if not runtime_base and not runtime_pr:
                  raise SystemExit("RUNTIME_RELEASE_RECAPTURE_REQUIRED_WITHOUT_RUNTIME_DELTA")
          else:
              raise SystemExit(f"RUNTIME_RELEASE_STATE_INVALID:{state!r}")

          print(
              "RUNTIME_RELEASE_IDENTITY_OK "
              f"state={state} release={source} runtime_base_delta={len(runtime_base)} runtime_pr_delta={len(runtime_pr)}"
          )
          PY

      - name: Preserve cross-feature global metadata
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          git diff --exit-code "$BASE"...HEAD -- .specify/feature.json .specify/memory/constitution.md

      - name: Enforce phase-aware Feature 007 change boundary
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          python - "$BASE" "$HEAD_BRANCH" <<'PY'
          import json
          import subprocess
          import sys

          base, head_branch = sys.argv[1], sys.argv[2]
          feature = json.load(open("specs/007-content-intelligence-workflow-platform/feature.json", encoding="utf-8"))
          status = feature.get("status")

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}...HEAD"],
              text=True,
          ).splitlines()

          feature_dir = str(feature.get("feature_directory") or "").strip("/")
          expected_feature_dir = "specs/007-content-intelligence-workflow-platform"
          if feature_dir != expected_feature_dir:
              raise SystemExit(f"FEATURE_DIRECTORY_POLICY_DRIFT:{feature_dir!r}")

          implementation_prefixes = ("feat/007-", "fix/007-")
          spec_maintenance_prefixes = ("spec/007-",)
          expected_branch_policy = {
              "contract": "mad4b.feature007-implementation-branch-policy.v1",
              "implementation_prefixes": list(implementation_prefixes),
              "specification_maintenance_prefixes": list(spec_maintenance_prefixes),
              "requires_exact_pr_base_ancestry": True,
              "mutable_metadata_cannot_widen_policy": True,
          }
          if feature.get("implementation_branch_policy") != expected_branch_policy:
              raise SystemExit("IMPLEMENTATION_METADATA_BRANCH_POLICY_DRIFT")

          boundary = feature.get("implementation_boundary_contract") or {}
          expected_boundary = {
              "contract": "mad4b.feature007-dynamic-boundary.v2",
              "feature_directory": expected_feature_dir,
              "runtime_root": "wp-content/plugins/mad4b-site-control-plane/",
              "workflow_prefixes": ["feature-007-", "mad4b-"],
              "tool_prefixes": ["mad4b_", "verify_"],
              "skill_inventory_source": "wp-content/plugins/mad4b-site-control-plane/config/skill-seed-manifest.json",
              "cross_feature_dependencies_are_exact": True,
              "mutable_metadata_cannot_widen_policy": True,
          }
          if boundary != expected_boundary:
              raise SystemExit("IMPLEMENTATION_DYNAMIC_BOUNDARY_POLICY_DRIFT")

          cross_feature_dependencies = feature.get("cross_feature_contract_dependencies") or []
          expected_cross_feature_dependencies = [
              ".github/workflows/wpl-client-contract.yml",
              "specs/006-agent-governed-reversible-control-plane/data-model.md",
          ]
          if cross_feature_dependencies != expected_cross_feature_dependencies:
              raise SystemExit("CROSS_FEATURE_METADATA_DEPENDENCY_DRIFT")

          skill_manifest = json.load(open(boundary["skill_inventory_source"], encoding="utf-8"))
          if skill_manifest.get("contract") != "mad4b.skill-seed-manifest.v1":
              raise SystemExit("SKILL_INVENTORY_CONTRACT_INVALID")
          skill_names = {
              str(row.get("name") or "")
              for row in skill_manifest.get("skills", [])
              if isinstance(row, dict) and row.get("name")
          }

          def is_feature_owned(path):
              if path.startswith(expected_feature_dir + "/"):
                  return True
              if path.startswith(boundary["runtime_root"]):
                  return True
              if path == "wp-content/plugins/mcp-adapter.zip":
                  return True
              if path == ".github/mad4b-repository-governance-policy.json":
                  return True
              if path.startswith(".github/workflows/"):
                  name = path.rsplit("/", 1)[-1]
                  return any(name.startswith(prefix) for prefix in boundary["workflow_prefixes"])
              if path.startswith("tools/"):
                  name = path.rsplit("/", 1)[-1]
                  return (
                      any(name.startswith(prefix) for prefix in boundary["tool_prefixes"])
                      or name == "capture-functional-gap-contract-evidence.py"
                  )
              for skill_name in skill_names:
                  if path.startswith(f"plugins/mad4b-wordpress/skills/{skill_name}/"):
                      return True
                  if path.startswith(f"wp-content/plugins/mad4b-site-control-plane/skill-seeds/{skill_name}/"):
                      return True
              return False

          def is_spec_maintenance_owned(path):
              if path.startswith(expected_feature_dir + "/"):
                  return True
              if path in {
                  ".github/workflows/feature-007-spec-ci.yml",
                  ".github/workflows/feature-007-pre-staging-hybrid-audit.yml",
                  "tools/mad4b_pre_staging_hybrid_audit.py",
              }:
                  return True
              for skill_name in skill_names:
                  if path.startswith(f"plugins/mad4b-wordpress/skills/{skill_name}/"):
                      return True
                  if path.startswith(f"wp-content/plugins/mad4b-site-control-plane/skill-seeds/{skill_name}/"):
                      return True
              return False

          def is_exact_cross_feature_dependency(path):
              return path in cross_feature_dependencies

          if status == "specification":
              forbidden = [p for p in changed if not is_spec_maintenance_owned(p)]
              boundary_mode = "specification_dynamic"
          elif status == "implementation":
              if any(head_branch.startswith(prefix) for prefix in implementation_prefixes):
                  forbidden = [
                      p for p in changed
                      if not is_feature_owned(p) and not is_exact_cross_feature_dependency(p)
                  ]
                  touched_cross_feature = [
                      p for p in changed
                      if p.startswith("specs/") and not p.startswith(expected_feature_dir + "/")
                  ]
                  undeclared = [p for p in touched_cross_feature if not is_exact_cross_feature_dependency(p)]
                  if undeclared:
                      raise SystemExit("UNDECLARED_CROSS_FEATURE_CHANGE: " + ",".join(sorted(undeclared)))
                  boundary_mode = "implementation_dynamic"
              elif any(head_branch.startswith(prefix) for prefix in spec_maintenance_prefixes):
                  forbidden = [p for p in changed if not is_spec_maintenance_owned(p)]
                  boundary_mode = "implementation_spec_maintenance_dynamic"
              else:
                  raise SystemExit(
                      "IMPLEMENTATION_BRANCH_MISMATCH expected_prefixes="
                      f"{implementation_prefixes} or spec maintenance {spec_maintenance_prefixes}; actual={head_branch}"
                  )
          else:
              raise SystemExit(f"UNKNOWN_FEATURE_STATUS: {status!r}")

          if forbidden:
              raise SystemExit("FORBIDDEN_CHANGE: " + ",".join(sorted(forbidden)))

          print(f"FEATURE_007_BOUNDARY_OK status={status} mode={boundary_mode} changed={len(changed)}")
          PY

      - name: Verify reconciled task ledger
        run: python specs/007-content-intelligence-workflow-platform/reconcile_task_ledger.py --check

      - name: Validate Feature 007 contracts and gate liveness
        run: python specs/007-content-intelligence-workflow-platform/validate_spec.py

      - name: Enforce bulk closure hardening contract
        run: python wp-content/plugins/mad4b-site-control-plane/tests/feature007-bulk-closure-hardening-contract.py
