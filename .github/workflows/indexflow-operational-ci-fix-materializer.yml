name: IndexFlow Operational CI Fix Materializer

on:
  push:
    branches: [tmp-indexflow-operational-ci-fix-20260914]
    paths:
      - '.github/workflows/indexflow-operational-ci-fix-materializer.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-indexflow-operational-ci-fix-20260914
          fetch-depth: 0
      - name: Apply exact bounded CI fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          parser = Path('wp-content/plugins/etg-dynamic-filter-seo-bridge/tests/parser-smoke.php')
          text = parser.read_text()
          old = "new ETG\\DynamicFilterSEOBridge\\JetSmartFilters\\FilterUrlParser( array(), array(), array( 'gclid', 'fbclid' ) );"
          new = "new ETG\\DynamicFilterSEOBridge\\JetSmartFilters\\FilterUrlParser( array( 'location_jet', 'tour-types_jet', 'tour-styles_jet' ), array(), array( 'gclid', 'fbclid' ) );"
          assert text.count(old) == 1, f'parser fixture pattern count={text.count(old)}'
          parser.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/etg-dfsb-ci.yml')
          text = workflow.read_text()
          trigger = "      - '.github/workflows/etg-dfsb-jetengine-ci.yml'\n"
          addition = "      - '.github/workflows/indexflow-foundation-ci.yml'\n"
          assert text.count(trigger) == 2, f'trigger anchor count={text.count(trigger)}'
          text = text.replace(trigger, trigger + addition)
          boundary = ".github/workflows/etg-dfsb-ci.yml|.github/workflows/etg-dfsb-jetengine-ci.yml) ;;"
          expanded = ".github/workflows/etg-dfsb-ci.yml|.github/workflows/etg-dfsb-jetengine-ci.yml|.github/workflows/indexflow-foundation-ci.yml) ;;"
          assert text.count(boundary) == 1, f'boundary anchor count={text.count(boundary)}'
          workflow.write_text(text.replace(boundary, expanded, 1))
          PY
          rm -f .github/workflows/indexflow-operational-ci-fix-materializer.yml
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | wc -l)" -eq 3
      - name: Commit clean fix tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MAD4B Object Staging'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'test(indexflow): align operational CI with foundation'
          git push origin HEAD:tmp-indexflow-operational-ci-fix-20260914
