name: IndexFlow Object Transfer

on:
  push:
    branches: [tmp-indexflow-foundation-object-staging-20260914]
    paths:
      - '.indexflow-transfer/**'
      - '.github/workflows/indexflow-object-transfer.yml'

concurrency:
  group: indexflow-object-transfer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-indexflow-foundation-object-staging-20260914
          fetch-depth: 0
      - name: Wait for complete bounded transfer
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          for i in 00 01 02 03 04 05 06; do
            if [[ ! -s ".indexflow-transfer/part-${i}.txt" ]]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Materialize exact runtime overlay
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .indexflow-transfer/part-*.txt | base64 -d > "$RUNNER_TEMP/indexflow-runtime-overlay.tgz"
          echo 'cfb460c8b48a54b585bd90208c9adc0885a8ba3e8d24e8721e588de52fe6487f  '"$RUNNER_TEMP/indexflow-runtime-overlay.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/indexflow-runtime-overlay.tgz" -C .
          rm -rf .indexflow-transfer
          rm -f .github/workflows/indexflow-object-transfer.yml
          git diff --check
          git status --short
      - name: Commit clean object-staging tree
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MAD4B Object Staging'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m 'checkpoint(indexflow): materialize object staging tree'
          git push origin HEAD:tmp-indexflow-foundation-object-staging-20260914
