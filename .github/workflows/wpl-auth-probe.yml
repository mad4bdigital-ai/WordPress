name: WPL Auth Probe

on:
  push:
    branches:
      - fix/wpl-client-db-lifecycle-cleanup-20260906
    paths:
      - '.github/workflows/wpl-auth-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe bundled credentials without exposing them
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wpl-auth-probe
          mkdir -p /tmp/wpl-auth-probe/current /tmp/wpl-auth-probe/account
          unzip -q wp-content/plugins/wpl-client.zip -d /tmp/wpl-auth-probe/current
          unzip -q wp-content/plugins/wpl-client-1238.zip -d /tmp/wpl-auth-probe/account
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess

          endpoint = 'https://wordpresslicenses.com/wp-json/wpl/v1/products?search=__wpl_auth_probe__'
          packages = {
              'current_2_7_x': Path('/tmp/wpl-auth-probe/current/wpl-client/wpl-client.php'),
              'account_reference': Path('/tmp/wpl-auth-probe/account/wpl-client/wpl-client.php'),
          }

          def credential(path):
              text = path.read_text('utf-8', errors='ignore')
              matches = re.findall(r'wpl_live_[A-Za-z0-9_-]+', text)
              if not matches:
                  raise SystemExit(f'{path}: no WPL credential found')
              return matches[0]

          for label, path in packages.items():
              key = credential(path)
              fp = hashlib.sha256(key.encode()).hexdigest()[:16]
              proc = subprocess.run([
                  'curl', '--silent', '--show-error', '--output', '/dev/null',
                  '--write-out', '%{http_code}', '--max-time', '20',
                  '--header', 'X-WPL-Key: ' + key,
                  '--header', 'Accept: application/json',
                  endpoint,
              ], text=True, capture_output=True)
              code = proc.stdout.strip() if proc.returncode == 0 else 'network_error'
              print(f'{label}: credential_sha256={fp} http_status={code}')
          PY
