name: Control Plane Runtime Provenance Regression

on:
  pull_request:
    paths:
      - "ops/control-plane-runtime-provenance/**"
      - "wp-content/plugins/mad4b-site-control-plane/includes/**"
      - ".github/workflows/control-plane-runtime-provenance-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-runtime-provenance-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  manifest-integrity-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate fail-closed runtime manifest checks
        run: python3 -m unittest discover -s ops/control-plane-runtime-provenance -p "test_*.py" -v
      - name: Verify Context foreign-source recycle fail-closed contracts
        run: python3 wp-content/plugins/mad4b-site-control-plane/tests/context-foreign-recycle-source-contract.py -v
