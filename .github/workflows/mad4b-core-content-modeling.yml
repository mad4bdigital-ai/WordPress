name: MAD4B Core Content Modeling

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/adapters/class-mad4b-scp-core-content-modeling-adapter.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-adapter-registry.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-servers.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/core-content-modeling-contract.py'
      - '.github/workflows/mad4b-core-content-modeling.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-core-content-modeling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Core content modeling contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: Lint governed content modeling sources
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/plugins/mad4b-site-control-plane/includes/adapters/class-mad4b-scp-core-content-modeling-adapter.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-adapter-registry.php
      - name: Verify governed content modeling contract
        shell: bash
        run: |
          set -euo pipefail
          python3 wp-content/plugins/mad4b-site-control-plane/tests/core-content-modeling-contract.py
