name: MAD4B rc129 Live Safety Reconciliation

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-self-update.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-authorization.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-addon-registry.php'
      - 'wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-public-document-kernel.php'
      - 'wp-content/plugins/mad4b-site-control-plane/config/public-document-kernel-manifest-v1.json'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/public-document-kernel-*-contract.py'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/public-document-kernel-*-runtime.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/live-safety-rc129-reconciliation-runtime.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/wordpress-addon-execution-guard-contract.php'
      - 'ops/rc129-live-safety-reconciliation-20261123/**'
      - 'ops/release-source-host-v1/**'
      - 'tests/test_central_release_issuer_anchor_source.py'
      - '.github/workflows/mad4b-rc129-live-safety-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-rc129-live-safety-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  isolated-guards:
    name: Signed source and addon guards (no live authority)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify PHP CLI and ZipArchive
        run: |
          php -v
          php -r 'if (!class_exists("ZipArchive")) { fwrite(STDERR,"ZipArchive required for signed archive guard tests\n"); exit(1); }'
      - name: Validate Git-pinned candidate manifest generation without signing
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/rc129-live-safety-reconciliation-20261123/test_local_candidate_manifest.py
      - name: Verify original Host preflight provenance and non-authorizing candidate semantics
        shell: bash
        run: |
          set -euo pipefail
          (cd ops/release-source-host-v1 && sha256sum -c SHA256SUMS)
          python3 -m py_compile ops/release-source-host-v1/source_preflight.py ops/release-source-host-v1/host_worker.py
          # Exact, no-network, root-owned filesystem fixtures. The test must
          # never sign an actual package or load live WordPress state.
          sudo -n python3 ops/release-source-host-v1/tests/test_postcommit_manifest.py
      - name: Ensure pinned central issuer RSA public key is unchanged from both installed sites
        run: python3 tests/test_central_release_issuer_anchor_source.py
      - name: Guard live-shared public singular document kernel (OFF by default)
        shell: bash
        run: |
          set -euo pipefail
          p=wp-content/plugins/mad4b-site-control-plane
          python3 "$p/tests/public-document-kernel-source-contract.py"
          php -l "$p/includes/class-mad4b-scp-public-document-kernel.php"
          php -l "$p/mad4b-site-control-plane.php"
          php "$p/tests/public-document-kernel-live-parity-runtime.php"
      - name: Lint only reconciled runtime and test files
        shell: bash
        run: |
          set -euo pipefail
          p=wp-content/plugins/mad4b-site-control-plane
          php -l "$p/includes/class-mad4b-scp-self-update.php"
          php -l "$p/includes/class-mad4b-scp-authorization.php"
          php -l "$p/includes/class-mad4b-scp-addon-registry.php"
          php -l "$p/tests/live-safety-rc129-reconciliation-runtime.php"
          php -l "$p/tests/wordpress-addon-execution-guard-contract.php"
      - name: Isolated signed source, release and execution-boundary regression checks
        shell: bash
        run: |
          set -euo pipefail
          php wp-content/plugins/mad4b-site-control-plane/tests/live-safety-rc129-reconciliation-runtime.php
      - name: Existing Addon Registry and dynamic site-bound ring policy
        shell: bash
        run: |
          set -euo pipefail
          python3 wp-content/plugins/mad4b-site-control-plane/tests/wordpress-addon-registry-contract.py
          php wp-content/plugins/mad4b-site-control-plane/tests/wordpress-addon-execution-guard-contract.php
