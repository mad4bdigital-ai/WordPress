name: MAD4B Company Reconcile Production Admission
on:
  pull_request:
    paths:
      - 'ops/company-reconcile-production-admission-v1/**'
      - 'ops/unified-production-authority-v1/**'
      - 'ops/original-host-v2-readonly-scope/**'
      - 'ops/original305-incident-reconciliation-v1/**'
      - 'wp-content/mu-plugins/502-mad4b-production-identity-quickstart.php'
      - 'tests/mad4b-production-identity-quickstart-hermetic.php'
      - '.github/workflows/mad4b-company-reconcile-production-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mad4b-company-production-admission-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  fail-closed-admission-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Hermetic read-only external identity and Original305/312/313 guard
        run: |
          python3 -m unittest discover -s ops/company-reconcile-production-admission-v1 -p 'test_*.py' -v
          python3 -m py_compile ops/company-reconcile-production-admission-v1/*.py
          python3 -B -m unittest discover -s ops/unified-production-authority-v1 -p 'test_*.py' -v
          python3 -B -m unittest discover -s ops/original-host-v2-readonly-scope -p 'test_*.py' -v
          python3 -B -m unittest discover -s ops/original305-incident-reconciliation-v1 -p 'test_*.py' -v
          python3 -B - <<'PY_INNER'
          from pathlib import Path
          for file in Path('ops/unified-production-authority-v1').glob('*.py'):
              compile(file.read_text(),str(file),'exec')
          PY_INNER

  owner-session-production-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4','8.3','8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate one-click Site Profile and all denial cases
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -w /src php:${{ matrix.php }}-cli sh -euc '
            php -l wp-content/mu-plugins/502-mad4b-production-identity-quickstart.php
            php -l tests/mad4b-production-identity-quickstart-hermetic.php
            php tests/mad4b-production-identity-quickstart-hermetic.php
          '
