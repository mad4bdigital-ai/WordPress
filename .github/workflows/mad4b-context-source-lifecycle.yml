name: MAD4B Context Source Lifecycle — parity and contracts
on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - 'ops/context-source-lifecycle/**'
      - '.github/workflows/mad4b-context-source-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  lifecycle-contract:
    name: PHP ${{ matrix.php }} read, scan and recycle contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip,dom,mbstring,libxml
          coverage: none
      - name: Verify Staging source parity
        run: sha256sum -c ops/context-source-lifecycle/2026-11-05-source-runtime-parity.sha256
      - name: Validate all lifecycle PHP files
        run: |
          set -e
          cd wp-content/plugins/mad4b-site-control-plane
          php -l mad4b-site-control-plane.php
          for file in \
            includes/class-mad4b-scp-context-local-document-normalizer.php \
            includes/class-mad4b-scp-source-lifecycle.php \
            includes/class-mad4b-scp-wordpress-media-context.php \
            includes/class-mad4b-scp-context-provider-gateway.php \
            includes/class-mad4b-scp-context-source-pipeline.php \
            includes/class-mad4b-scp-drive-scan-admin.php \
            includes/class-mad4b-scp-context-admin-ui.php \
            includes/class-mad4b-scp-context-authority.php \
            includes/class-mad4b-scp-google-drive-context.php \
            includes/class-mad4b-scp-brand-context-builder.php; do
            php -l "$file"
          done
      - name: Read-only local Media gateway checks
        run: php wp-content/plugins/mad4b-site-control-plane/tests/context-media-read-gateway-hermetic.php
      - name: MIME scoped scan continuation and partial-failure isolation
        run: php wp-content/plugins/mad4b-site-control-plane/tests/context-media-scan-steps-hermetic.php
      - name: Reversible archive and restore checks
        run: php wp-content/plugins/mad4b-site-control-plane/tests/context-source-recycle-hermetic.php
      - name: Local DOCX PDF XLSX normalization checks
        run: php wp-content/plugins/mad4b-site-control-plane/tests/context-local-documents-hermetic.php
