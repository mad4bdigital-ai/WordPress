name: RC32 Final Environment Generalization v5

on:
  push:
    branches:
      - feat/dynamic-wordpress-skills-20260909
    paths:
      - '.github/workflows/rc32-final-generalization-runtime-v5.yml'

permissions:
  contents: write

jobs:
  generalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Guard exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'd6b711f99ded62f69248b976b57da0e5e0ca2716'
          mapfile -t changed < <(git diff --name-only HEAD^..HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/rc32-final-generalization-runtime-v5.yml'

      - name: Recover and apply audited runtime patch
        shell: python
        run: |
          from pathlib import Path
          import re, base64, gzip, subprocess
          source=Path('.github/workflows/rc32-final-generalization-runtime-v4.yml').read_text(encoding='utf-8')
          match=re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d \| gzip -d > /tmp/rc32\.patch", source)
          if not match: raise SystemExit('v4 runtime patch payload missing')
          patch=gzip.decompress(base64.b64decode(match.group(1)))
          Path('/tmp/rc32.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/rc32.patch'],check=True)
          subprocess.run(['git','apply','/tmp/rc32.patch'],check=True)

      - name: Install lossless environment regression
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > wp-content/plugins/mad4b-site-control-plane/tests/general-distribution-environment-contract.py
          chmod +x wp-content/plugins/mad4b-site-control-plane/tests/general-distribution-environment-contract.py

      - name: Align regression contracts
        shell: python
        run: |
          from pathlib import Path
          def replace(path, old, new, expected=1):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count != expected: raise SystemExit(f'{path}: expected {expected} of {old!r}, got {count}')
              p.write_text(text.replace(old,new), encoding='utf-8')
          root='wp-content/plugins/mad4b-site-control-plane/tests/'
          replace(root+'chatgpt-connection-ui-contract.py', 'Governed write actions, when available, require separate Staging write authority and a one-time approval.', 'Governed write actions, when available, require separate governed write authority and a one-time approval.')
          replace(root+'live-acceptance-evidence-contract.py', 'stable registered Staging catalog', 'stable registered tenant-bound catalog')
          replace(root+'dynamic-skills-contract.py', "'enables the Skill editor automatically'", "'may enable the Skill editor automatically'")
          fixture=root+'external-handshake-inventory-runtime.php'
          p=Path(fixture); text=p.read_text(encoding='utf-8')
          anchor="final class MAD4B_SCP_Identity_Context { public static function current() { return array( 'authenticated' => true, 'auth_method' => 'oauth2_bearer', 'subject_fingerprint' => str_repeat( 'a', 64 ), 'token_scopes' => array( 'mad4b:read' ), 'wp_user_id' => 7 ); } }\n"
          addition=anchor+"final class MAD4B_SCP_Site_Profile { public static function current_environment() { return 'staging'; } public static function origin_enrolled() { return true; } public static function oauth_enabled() { return true; } }\n"
          if text.count(anchor)!=1: raise SystemExit('external handshake fixture anchor drifted')
          p.write_text(text.replace(anchor,addition),encoding='utf-8')

      - name: Prepare canonical workflow patches
        shell: python
        run: |
          from pathlib import Path
          def replace_text(text, old, new, expected=1):
              count=text.count(old)
              if count != expected: raise SystemExit(f'expected {expected} of {old!r}, got {count}')
              return text.replace(old,new)
          pkg=Path('.github/workflows/mad4b-control-plane-package.yml')
          text=pkg.read_text(encoding='utf-8')
          text=replace_text(text,'name: Build reviewed staging installation kit','name: Build reviewed General Distribution installation kit')
          text=replace_text(text,'- name: Verify tenant-bound governed Staging kit invariants','- name: Verify tenant-neutral General Distribution kit invariants')
          anchor="          grep -Fq '\"production_mutation_auto_enabled\": false' \"$stage/install-manifest.json\"\n"
          extra=anchor+"          grep -Fq 'mad4b-site-control-plane-general-distribution-kit-{exact_head_sha}' \"$stage/package/mad4b-site-control-plane/config/staging-deployment-handoff.json\"\n          grep -Fq \"Current plugin version: **${expected_version}**.\" \"$stage/package/mad4b-site-control-plane/README.md\"\n          grep -Fq 'six MAD4B custom servers' \"$stage/package/mad4b-site-control-plane/README.md\"\n          if grep -Fq 'Egypt Tour Gates' \"$stage/package/mad4b-site-control-plane/README.md\" || grep -Fq 'staging.egypttourgates.com' \"$stage/package/mad4b-site-control-plane/README.md\"; then\n            echo 'General Distribution README retained tenant-specific identity.' >&2\n            exit 1\n          fi\n"
          text=replace_text(text,anchor,extra)
          pkg.write_text(text,encoding='utf-8')
          gd=Path('.github/workflows/mad4b-general-distribution-foundation.yml')
          text=gd.read_text(encoding='utf-8')
          path_anchor="      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-skill-autoconfig.php'\n"
          extra_paths=path_anchor+"      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-local-oauth-server.php'\n      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-oauth-resource-bridge.php'\n      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-mcp-client-compatibility.php'\n      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-external-handshake-evidence.php'\n      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-chatgpt-connection-admin-ui.php'\n      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-live-acceptance-observer.php'\n      - 'wp-content/plugins/mad4b-site-control-plane/tests/general-distribution-environment-contract.py'\n"
          text=replace_text(text,path_anchor,extra_paths,2)
          run_anchor="      - name: Run tenant-bound multi-user OAuth runtime contract\n        shell: bash\n        run: |\n          set -euo pipefail\n          php wp-content/plugins/mad4b-site-control-plane/tests/oauth-multi-user-tenant-runtime.php\n"
          run_extra=run_anchor+"\n      - name: Run General Distribution environment contract\n        shell: bash\n        run: |\n          set -euo pipefail\n          python3 wp-content/plugins/mad4b-site-control-plane/tests/general-distribution-environment-contract.py\n"
          text=replace_text(text,run_anchor,run_extra)
          gd.write_text(text,encoding='utf-8')
          out=Path('/tmp/rc32-workflow-patches/.github/workflows'); out.mkdir(parents=True,exist_ok=True)
          for src in [pkg,gd]: (out/src.name).write_bytes(src.read_bytes())

      - name: Validate generalized runtime and contracts
        shell: bash
        run: |
          set -euo pipefail
          root=wp-content/plugins/mad4b-site-control-plane
          for file in includes/class-mad4b-scp-local-oauth-server.php includes/class-mad4b-scp-oauth-resource-bridge.php includes/class-mad4b-scp-mcp-client-compatibility.php includes/class-mad4b-scp-external-handshake-evidence.php includes/class-mad4b-scp-chatgpt-connection-admin-ui.php includes/class-mad4b-scp-live-acceptance-observer.php includes/class-mad4b-scp-mcp-adapter-metadata-bridge.php includes/class-mad4b-scp-mcp-request-scope.php includes/class-mad4b-scp-transport-context.php includes/class-mad4b-scp-skills-admin-ui.php; do php -l "$root/$file" >/dev/null; done
          python3 "$root/tests/general-distribution-environment-contract.py"
          python3 "$root/tests/chatgpt-connection-ui-contract.py"
          python3 "$root/tests/local-oauth-standalone-contract.py"
          python3 "$root/tests/oauth-resource-bridge-contract.py"
          python3 "$root/tests/mcp-client-compatibility-contract.py"
          python3 "$root/tests/live-acceptance-evidence-contract.py"
          python3 "$root/tests/dynamic-skills-contract.py"
          php "$root/tests/external-handshake-inventory-runtime.php"

      - name: Upload reviewed workflow patches
        uses: actions/upload-artifact@v4
        with:
          name: rc32-final-workflow-patches-${{ github.sha }}
          path: /tmp/rc32-workflow-patches
          if-no-files-found: error
          retention-days: 7

      - name: Commit runtime and regression changes only
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/mad4b-control-plane-package.yml .github/workflows/mad4b-general-distribution-foundation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wp-content/plugins/mad4b-site-control-plane
          git diff --cached --quiet && { echo 'No runtime changes staged' >&2; exit 1; }
          git commit -m 'fix(rc32): generalize enrolled environment gates'
          git push origin HEAD:feat/dynamic-wordpress-skills-20260909
