name: MAD4B Browser Acceptance Core

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-browser-acceptance-provider-registry.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-browser-acceptance-core.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-acceptance-core.php'
      - 'wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/browser-acceptance-core-contract.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/runtime-browser-acceptance-core-etg-smoke.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/runtime-elementor-etg-structural-primitives.php'
      - 'wp-content/plugins/etg-dynamic-filter-seo-bridge/assets/js/browser-acceptance-observer.js'
      - 'wp-content/plugins/etg-dynamic-filter-seo-bridge/includes/Acceptance/BrowserAcceptanceProvider.php'
      - 'wp-content/plugins/etg-dynamic-filter-seo-bridge/includes/Acceptance/BrowserObserverAsset.php'
      - 'wp-content/plugins/etg-dynamic-filter-seo-bridge/includes/Acceptance/BrowserAcceptanceFreshnessGuard.php'
      - 'wp-content/plugins/etg-dynamic-filter-seo-bridge/tests/alpha13-browser-acceptance-observer-smoke.js'
      - 'wp-content/plugins/jet-engine.zip'
      - 'wp-content/plugins/jet-smart-filters.zip'
      - 'tools/normalize-premium-provider-package.py'
      - '.github/workflows/mad4b-browser-acceptance-core.yml'
  push:
    branches: [master]
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-browser-acceptance-provider-registry.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-browser-acceptance-core.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-acceptance-core.php'
      - 'wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/browser-acceptance-core-contract.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/runtime-browser-acceptance-core-etg-smoke.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/runtime-elementor-etg-structural-primitives.php'
      - 'wp-content/plugins/etg-dynamic-filter-seo-bridge/assets/js/browser-acceptance-observer.js'
      - 'wp-content/plugins/etg-dynamic-filter-seo-bridge/includes/Acceptance/BrowserAcceptanceProvider.php'
      - 'wp-content/plugins/etg-dynamic-filter-seo-bridge/includes/Acceptance/BrowserObserverAsset.php'
      - 'wp-content/plugins/etg-dynamic-filter-seo-bridge/includes/Acceptance/BrowserAcceptanceFreshnessGuard.php'
      - 'wp-content/plugins/etg-dynamic-filter-seo-bridge/tests/alpha13-browser-acceptance-observer-smoke.js'
      - 'wp-content/plugins/jet-engine.zip'
      - 'wp-content/plugins/jet-smart-filters.zip'
      - 'tools/normalize-premium-provider-package.py'
      - '.github/workflows/mad4b-browser-acceptance-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-browser-acceptance-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    name: Browser Acceptance Core PHP ${{ matrix.php }} contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact PR head checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint Browser Acceptance Core
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-browser-acceptance-provider-registry.php \
            wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-browser-acceptance-core.php \
            wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-acceptance-core.php \
            wp-content/plugins/mad4b-site-control-plane/tests/browser-acceptance-core-contract.php \
            wp-content/plugins/mad4b-site-control-plane/tests/runtime-browser-acceptance-core-etg-smoke.php \
            wp-content/plugins/mad4b-site-control-plane/tests/runtime-elementor-etg-structural-primitives.php; do
              php -l "$file"
          done
      - name: Run fail-closed browser provider projection contract
        run: php wp-content/plugins/mad4b-site-control-plane/tests/browser-acceptance-core-contract.php

  observer-js:
    name: ETG Browser Observer JS contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact PR head checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run exact observer contract smoke
        run: node wp-content/plugins/etg-dynamic-filter-seo-bridge/tests/alpha13-browser-acceptance-observer-smoke.js

  exact-etg-runtime:
    name: Exact ETG Browser Acceptance Provider runtime
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - name: Verify exact PR head checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Bind Browser Acceptance to exact current ETG subtree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          ETG_TREE="$(git rev-parse "HEAD:wp-content/plugins/etg-dynamic-filter-seo-bridge")"
          test -n "$ETG_TREE"
          echo "ETG_BROWSER_ACCEPTANCE_HEAD=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "ETG_BROWSER_ACCEPTANCE_TREE=$ETG_TREE" >> "$GITHUB_ENV"
          grep -Fq "Version: 0.4.0-alpha.13" wp-content/plugins/etg-dynamic-filter-seo-bridge/etg-dynamic-filter-seo-bridge.php
          test -s wp-content/plugins/etg-dynamic-filter-seo-bridge/includes/Acceptance/LiveAcceptanceProvider.php
          test -s wp-content/plugins/etg-dynamic-filter-seo-bridge/includes/Acceptance/BrowserAcceptanceProvider.php
          test -s wp-content/plugins/etg-dynamic-filter-seo-bridge/includes/Acceptance/BrowserObserverAsset.php
          test -s wp-content/plugins/etg-dynamic-filter-seo-bridge/includes/Acceptance/BrowserAcceptanceFreshnessGuard.php
          test -s wp-content/plugins/etg-dynamic-filter-seo-bridge/assets/js/browser-acceptance-observer.js
          printf '%s\n' "{\"contract\":\"etg.dfsb.embedded-build-identity.v1\",\"git_sha\":\"$SOURCE_SHA\",\"tree_sha\":\"$ETG_TREE\",\"plugin_version\":\"0.4.0-alpha.13\"}" > wp-content/plugins/etg-dynamic-filter-seo-bridge/build-identity.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring
          coverage: none
      - name: Install WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar --info
      - name: Provision disposable WordPress 6.9
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-browser-acceptance-wordpress
          rm -rf "$WP_PATH"
          mkdir -p "$WP_PATH"
          php /tmp/wp-cli.phar core download --path="$WP_PATH" --version=6.9 --force
          php /tmp/wp-cli.phar config create --path="$WP_PATH" --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar config set WP_ENVIRONMENT_TYPE development --path="$WP_PATH"
          php /tmp/wp-cli.phar config set MAD4B_MCP_PROVIDER_ISOLATION_ENABLED true --raw --path="$WP_PATH"
          php /tmp/wp-cli.phar config set MAD4B_MCP_PROVIDER_ISOLATION_RUNTIME_SUPPRESSION_APPROVED true --raw --path="$WP_PATH"
          php /tmp/wp-cli.phar core install --path="$WP_PATH" --url='http://mad4b-browser-acceptance.test' --title='MAD4B Browser Acceptance Runtime' --admin_user='mad4b-ci-admin' --admin_password='ci-only-not-a-secret' --admin_email='ci@example.invalid' --skip-email
      - name: Normalize exact premium provider packages
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/mad4b-browser-acceptance-providers
          rm -rf "$out"
          mkdir -p "$out"
          python3 tools/normalize-premium-provider-package.py --provider jetengine --input wp-content/plugins/jet-engine.zip --output "$out/jet-engine.zip" --expected-version 3.8.15 --report "$out/jetengine-normalization.json"
          python3 tools/normalize-premium-provider-package.py --provider jetsmartfilters --input wp-content/plugins/jet-smart-filters.zip --output "$out/jet-smart-filters.zip" --expected-version 3.8.5 --report "$out/jetsmartfilters-normalization.json"
          unzip -tqq "$out/jet-engine.zip"
          unzip -tqq "$out/jet-smart-filters.zip"
      - name: Install exact providers, ETG and MAD4B Control Plane
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-browser-acceptance-wordpress
          python3 "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/materialize-packaged-plugin.py" --archive "wp-content/plugins/mcp-adapter.zip" --plugins-dir "$WP_PATH/wp-content/plugins" --slug mcp-adapter
          python3 "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/materialize-packaged-plugin.py" --archive "wp-content/plugins/elementor.zip" --plugins-dir "$WP_PATH/wp-content/plugins" --slug elementor
          python3 "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/materialize-packaged-plugin.py" --archive "/tmp/mad4b-browser-acceptance-providers/jet-engine.zip" --plugins-dir "$WP_PATH/wp-content/plugins" --slug jet-engine
          python3 "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/materialize-packaged-plugin.py" --archive "/tmp/mad4b-browser-acceptance-providers/jet-smart-filters.zip" --plugins-dir "$WP_PATH/wp-content/plugins" --slug jet-smart-filters
          cp -R wp-content/plugins/etg-dynamic-filter-seo-bridge "$WP_PATH/wp-content/plugins/etg-dynamic-filter-seo-bridge"
          cp -R wp-content/plugins/mad4b-site-control-plane "$WP_PATH/wp-content/plugins/mad4b-site-control-plane"
          php /tmp/wp-cli.phar plugin activate mcp-adapter --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate elementor --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate jet-engine --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate jet-smart-filters --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate etg-dynamic-filter-seo-bridge --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate mad4b-site-control-plane --path="$WP_PATH"
      - name: Complete exact ETG guarded full boot
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-browser-acceptance-wordpress
          php /tmp/wp-cli.phar eval '
            $config = new \ETG\DynamicFilterSEOBridge\Config\Configuration();
            $profile = array(
                "id" => "ci-browser",
                "enabled" => true,
                "inherit_global_defaults" => false,
                "archive_slugs" => array( "tours-and-activities" ),
                "archive_paths" => array( "/tours-and-activities/" ),
                "providers" => array( "jet-engine" ),
                "query_ids" => array( "tours_query_archive" ),
                "routes" => array(
                    array( "provider" => "jet-engine", "query_id" => "tours_query_archive" ),
                ),
                "publication" => array(
                    "metadata" => false,
                    "sitemap" => false,
                    "multilingual" => false,
                    "hreflang" => false,
                    "schema" => false,
                    "social" => false,
                    "include_images_in_sitemap" => false,
                    "require_elementor_content" => false,
                    "elementor_render_when_global_off" => true,
                    "provider_observation_verified" => false,
                    "require_result_count_parity_for_publication" => false
                )
            );
            $settings = $config->sanitizeForStorage( array(
                "enabled" => false,
                "compatibility_profile" => "",
                "profiles_json" => wp_json_encode( array( $profile ) )
            ) );
            update_option( \ETG\DynamicFilterSEOBridge\Config\Configuration::OPTION_NAME, $settings, false );
            $profiles = new \ETG\DynamicFilterSEOBridge\Config\ProfileRegistry( new \ETG\DynamicFilterSEOBridge\Config\Configuration() );
            $requirements = \ETG\DynamicFilterSEOBridge\Runtime\CapabilityRequirements::forProfiles( $profiles->all(), true );
            if ( ! in_array( "elementor", (array) ( $requirements["adapters"] ?? array() ), true ) ) {
                throw new RuntimeException( "Disposable ETG profile did not resolve the Elementor adapter: " . wp_json_encode( $requirements ) );
            }
            if ( in_array( "elementor_pro", (array) ( $requirements["adapters"] ?? array() ), true ) ) {
                throw new RuntimeException( "Disposable ETG profile unexpectedly requires Elementor Pro." );
            }

            $ok = \ETG\DynamicFilterSEOBridge\Runtime\BootGuard::run( static function () {
                \ETG\DynamicFilterSEOBridge\Bootstrap::instance()->boot();
            } );
            if ( ! $ok ) throw new RuntimeException( "ETG guarded full boot failed." );
            $status = \ETG\DynamicFilterSEOBridge\Runtime\BootGuard::status();
            if ( empty( $status["boot_ok"] ) ) throw new RuntimeException( "ETG Safe Boot did not close to boot_ok: " . wp_json_encode( $status ) );
            echo "etg-safe-boot=PASS\n";
          ' --path="$WP_PATH" --user=mad4b-ci-admin
      - name: Prove exact Elementor ETG structural helper runtime
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file \
            "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-elementor-etg-structural-primitives.php" \
            --path=/tmp/mad4b-browser-acceptance-wordpress --user=mad4b-ci-admin

      - name: Prove generic Browser Acceptance Core discovers and safely projects exact ETG provider
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file \
            "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-browser-acceptance-core-etg-smoke.php" \
            --path=/tmp/mad4b-browser-acceptance-wordpress --user=mad4b-ci-admin
      - name: Upload provider normalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mad4b-browser-acceptance-provider-normalization-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/mad4b-browser-acceptance-providers/*-normalization.json
          if-no-files-found: error
          retention-days: 14
