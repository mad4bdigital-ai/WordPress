name: RC32 Final General Distribution Cleanup v2

on:
  push:
    branches:
      - feat/dynamic-wordpress-skills-20260909
    paths:
      - '.github/workflows/rc32-final-generalization-cleanup-v2.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - name: Guard bounded staging delta
        shell: bash
        run: |
          set -euo pipefail
          base=e7282c0898898fe50904fe5f67450ce9948c2579
          git merge-base --is-ancestor "$base" HEAD
          mapfile -t changed < <(git diff --name-only "$base"..HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/rc32-final-generalization-cleanup-v2.yml'
          test "${changed[1]}" = '.github/workflows/rc32-final-generalization-cleanup.yml'
      - name: Apply bounded General Distribution cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s) of {old!r}, found {found}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace('wp-content/plugins/mad4b-site-control-plane/config/staging-deployment-handoff.json', 'mad4b-site-control-plane-kit-{exact_head_sha}', 'mad4b-site-control-plane-general-distribution-kit-{exact_head_sha}')
          replace('wp-content/plugins/mad4b-site-control-plane/tests/staging-write-authority-contract.py', "'artifact_name_template': 'mad4b-site-control-plane-kit-{exact_head_sha}'", "'artifact_name_template': 'mad4b-site-control-plane-general-distribution-kit-{exact_head_sha}'")

          replace('wp-content/plugins/mad4b-site-control-plane/README.md', 'Current plugin version: **0.3.0**.', 'Current plugin version: **0.4.0-rc.32**.')
          replace('wp-content/plugins/mad4b-site-control-plane/README.md', 'MAD4B Site Control Plane 0.3.0', 'MAD4B Site Control Plane 0.4.0-rc.32')
          replace('wp-content/plugins/mad4b-site-control-plane/README.md', 'five MAD4B custom servers', 'six MAD4B custom servers')
          replace('wp-content/plugins/mad4b-site-control-plane/README.md', 'all five MAD4B servers', 'all six MAD4B servers')
          replace('wp-content/plugins/mad4b-site-control-plane/README.md', 'the staging NHI uses exact minimal non-wildcard grants', 'the governed write NHI uses exact minimal non-wildcard grants')
          replace('wp-content/plugins/mad4b-site-control-plane/README.md', 'unless controlled staging is intentionally continuing', 'unless a controlled governed acceptance cycle is intentionally continuing')
          replace('wp-content/plugins/mad4b-site-control-plane/README.md', 'until Staging T103', 'until target live acceptance')
          replace('wp-content/plugins/mad4b-site-control-plane/README.md', 'until staging certification', 'until target-site certification')

          replace('wp-content/plugins/mad4b-site-control-plane/docs/PROVIDER-COMPATIBILITY-CERTIFICATION.md', '- exact Staging origin and environment;', '- exact enrolled governed non-production Site Profile origin and environment;')
          replace('wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-local-oauth-consent-ui.php', 'require separate Staging write authority and a one-time approval.', 'require separate governed write authority and a one-time approval.')
          replace('wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-authorization.php', 'no certified one-time Staging write delegation applies.', 'no certified one-time governed write delegation applies.')
          replace('wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-staging-write-planning-guard.php', 'dedicated Staging write agent.', 'dedicated governed write agent.')
          replace('wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-staging-write-planning-guard.php', 'certified Staging write inventory.', 'certified governed write inventory.')
          replace('wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-skill-registry.php', 'Skill authoring is disabled. Staging is normally auto-configured; Production requires both explicit editor gates.', 'Skill authoring is disabled. Enrolled non-production sites may enable it through Site Profile automation; Production requires both explicit editor gates.')
          replace('wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-servers.php', 'Stable Staging ChatGPT write catalog.', 'Stable governed ChatGPT write catalog.')
          replace('wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-servers.php', 'ChatGPT Staging gateway with read diagnostics plus a stable governed write catalog.', 'ChatGPT governed gateway with read diagnostics plus a stable governed write catalog.')
          replace('wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-mcp-registration-rescue-v1.php', '// Do not even bind global REST hooks outside the exact governed site\n\t\t// origin. Production and every other origin remain completely untouched.', '// Do not bind global REST hooks outside an explicitly enrolled Site Profile\n\t\t// with managed runtime enabled. Unenrolled sites remain untouched; Production\n\t\t// is eligible only after explicit Site Profile enrollment and feature enablement.')
          replace('wp-content/plugins/mad4b-site-control-plane/assets/local-oauth-canary.js', 'Complete the explicit Staging configuration and reload this page.', 'Complete the explicit enrolled-site OAuth configuration and reload this page.')

          portable = Path('plugins/mad4b-wordpress/README.md')
          text = portable.read_text(encoding='utf-8')
          replacements = [
              ('This package wraps the existing MAD4B WordPress MCP App with reusable workflow Skills and an exact-origin governed Staging write plane. Live WordPress data, OAuth authentication, NHI authorization, approvals, audit and tool execution stay in the MAD4B MCP control plane.', 'This package wraps the MAD4B WordPress MCP App with reusable workflow Skills and a tenant-neutral governed write plane. Live WordPress data, Site Profile identity, OAuth authentication, NHI authorization, approvals, audit and tool execution stay in the MAD4B MCP control plane.', 1),
              ('- On **`staging.egypttourgates.com` only**, supported non-readonly MAD4B/core and certified-adapter actions are exposed through the same Plugin and rebound to the dedicated `mad4b-write` authority server.', '- On an explicitly enrolled Site Profile with governed write enabled, supported non-readonly MAD4B/core and certified-adapter actions are exposed through the same Plugin and rebound to the dedicated `mad4b-write` authority server.', 1),
              ('- Production never receives this automatic write authority.', '- Production never receives write authority by installation; Production write requires explicit Site Profile enrollment plus the separate Production-write confirmation.', 1),
              ('## Zero-touch Staging lifecycle', '## Explicit tenant enrollment lifecycle', 1),
              ('On the exact governed Staging origin the Control Plane performs the normal setup without administrator intervention. It **automatically enables the local Skill editor**, binds the governed Staging OpenAI App mapping and configures the governed mutation gate unless an explicit operator disable is already present.', 'Fresh installation is zero-authority. After an administrator completes explicit Site Profile v2 enrollment, the Control Plane reconciles only the features enabled for that tenant. On an enrolled non-production site, Skill editor/App mapping/write automation remains bound to the current Site Profile rather than to a bundled tenant preset.', 1),
              ('Exact environment + staging.egypttourgates.com origin check', 'Exact environment + enrolled Site Profile origin check', 1),
              ('Skill editor + Staging App mapping', 'Skill editor + Site Profile App mapping', 1),
              ('Dedicated Staging write NHI + exact mad4b-write grants', 'Dedicated governed write NHI + exact mad4b-write grants', 1),
              ('No `wp-config.php` edit is required on Staging for the normal governed path. No administrator form submission is required for the automatic bootstrap.', 'No `wp-config.php` edit is required for normal Site Profile enrollment. Administrator enrollment is explicit, and fresh installation does not auto-bind a tenant, App ID, OAuth user or write authority.', 1),
              ('Production is never auto-enabled for Staging Skill authoring, Staging App binding or the governed mutation gate. Supporting Skill `scripts/` authoring also remains separately gated.', 'Production is never auto-enabled for Skill authoring, App binding or governed mutation. Production write requires the separate confirmation, and supporting Skill `scripts/` authoring remains separately gated.', 1),
              ('dedicated Staging NHI', 'dedicated governed write NHI', 2),
              ('exact Staging App mapping', 'exact Site Profile App mapping', 1),
              ('exact Staging environment and origin', 'exact enrolled Site Profile environment and origin', 1),
              ('certified Staging Plugin snapshot', 'certified tenant-bound Plugin snapshot', 1),
              ('`MAD4B Dynamic Skills` provisions disposable Staging and Production WordPress runtimes. Staging proves zero-touch Skills, governed write inventory, approval bootstrap boundaries, WPML-compatible REST query pass-through, deterministic export and Read + Write certification. Production proves the Staging App/Skill/write authority and write tools remain absent.', '`MAD4B Dynamic Skills` provisions disposable generic Staging and Production WordPress runtimes. The Staging fixture proves explicit Site Profile enrollment, governed write inventory, approval bootstrap boundaries, WPML-compatible REST query pass-through, deterministic export and Read + Write certification. Production proves an unconfigured installation receives no tenant App/Skill/write authority or write tools.', 1),
              ('The repository marketplace entry is `.agents/plugins/marketplace.json`. This branch remains wired to the already registered **Staging** App for controlled acceptance.', 'The repository marketplace entry is `.agents/plugins/marketplace.json`. The portable `.app.json` identifies the ChatGPT Plugin package; each WordPress deployment independently binds its tenant App mapping through Site Profile v2.', 1),
          ]
          for old, new, expected in replacements:
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f'plugins/mad4b-wordpress/README.md: expected {expected} occurrence(s) of {old!r}, found {found}')
              text = text.replace(old, new)
          portable.write_text(text, encoding='utf-8')

          for path in ['plugins/mad4b-wordpress/plugin.json', 'plugins/mad4b-wordpress/.codex-plugin/plugin.json']:
              replace(path, 'Governed WordPress diagnostics, reusable workflow skills and exact-approval Staging write operations', 'Governed WordPress diagnostics, reusable workflow skills and exact-approval tenant-bound write operations')
              replace(path, 'MAD4B WordPress — Egypt Tour Gates', 'MAD4B WordPress')
              replace(path, 'Governed WordPress diagnostics, workflows and Staging changes.', 'Governed WordPress diagnostics, workflows and approved tenant-bound changes.')
              replace(path, 'WordPress diagnostics, connection checks, Elementor, JetEngine, archive audits and governed Staging update/write/mutation workflows backed by exact NHI grants, one-time approvals and MAD4B MCP certification.', 'WordPress diagnostics, connection checks, Elementor, JetEngine, archive audits and governed tenant-bound update/write/mutation workflows backed by explicit Site Profile enrollment, exact NHI grants, one-time approvals and MAD4B MCP certification.')
          replace('plugins/mad4b-wordpress/plugin.json', '"Show the governed Staging write authority status."', '"Show the governed write authority status for the enrolled site."')
          replace('plugins/mad4b-wordpress/plugin.json', '"Plan a safe approved change on Staging."', '"Plan a safe approved change on the enrolled site."')

          test_path = Path('wp-content/plugins/mad4b-site-control-plane/tests/dynamic-skills-contract.py')
          test = test_path.read_text(encoding='utf-8')
          old_block = """for marker in [\n    'automatically enables the local Skill editor',\n    'No `wp-config.php` edit is required',\n    'Production is never auto-enabled',\n    'Portable Plugin capability: `Read + Write`',\n    'mad4b-write',\n    'approval-plan',\n    'rest-compatibility-status',\n    'WPML',\n]:\n    if marker not in readme:\n        raise SystemExit(f'missing governed Staging documentation marker: {marker}')\n"""
          new_block = """for marker in [\n    'Fresh installation is zero-authority',\n    'explicit Site Profile v2 enrollment',\n    'Production never receives write authority by installation',\n    'Portable Plugin capability: `Read + Write`',\n    'mad4b-write',\n    'approval-plan',\n    'rest-compatibility-status',\n    'WPML',\n]:\n    if marker not in readme:\n        raise SystemExit(f'missing tenant-neutral governed documentation marker: {marker}')\n"""
          if test.count(old_block) != 1:
              raise SystemExit('dynamic-skills documentation marker block drifted')
          test = test.replace(old_block, new_block)
          anchor = "if compat.get('version') != manifest.get('version'):\n    raise SystemExit('portable and Codex compatibility manifest versions must match')\n"
          addition = anchor + "\nfor label, payload in [('portable README', readme), ('portable manifest', json.dumps(manifest)), ('Codex manifest', json.dumps(compat))]:\n    for forbidden in ['staging.egypttourgates.com', 'Egypt Tour Gates']:\n        if forbidden in payload:\n            raise SystemExit(f'{label} retained deployment-specific identity: {forbidden}')\n"
          if test.count(anchor) != 1:
              raise SystemExit('dynamic-skills manifest anchor drifted')
          test_path.write_text(test.replace(anchor, addition), encoding='utf-8')

          workflow = Path('.github/workflows/mad4b-control-plane-package.yml')
          wf = workflow.read_text(encoding='utf-8')
          for old, new in [
              ('name: Build reviewed staging installation kit', 'name: Build reviewed General Distribution installation kit'),
              ('- name: Verify tenant-bound governed Staging kit invariants', '- name: Verify tenant-neutral General Distribution kit invariants'),
          ]:
              if wf.count(old) != 1:
                  raise SystemExit(f'package workflow label drift: {old!r}')
              wf = wf.replace(old, new)
          anchor = "          grep -Fq '\"production_mutation_auto_enabled\": false' \"$stage/install-manifest.json\"\n"
          extra = anchor + "          grep -Fq 'mad4b-site-control-plane-general-distribution-kit-{exact_head_sha}' \"$stage/package/mad4b-site-control-plane/config/staging-deployment-handoff.json\"\n          grep -Fq \"Current plugin version: **${expected_version}**.\" \"$stage/package/mad4b-site-control-plane/README.md\"\n          grep -Fq 'six MAD4B custom servers' \"$stage/package/mad4b-site-control-plane/README.md\"\n          if grep -Fq 'Egypt Tour Gates' \"$stage/package/mad4b-site-control-plane/README.md\" || grep -Fq 'staging.egypttourgates.com' \"$stage/package/mad4b-site-control-plane/README.md\"; then\n            echo 'General Distribution README retained tenant-specific identity.' >&2\n            exit 1\n          fi\n"
          if wf.count(anchor) != 1:
              raise SystemExit('package workflow verification anchor drifted')
          workflow.write_text(wf.replace(anchor, extra), encoding='utf-8')
          PY
      - name: Validate cleanup locally
        shell: bash
        run: |
          set -euo pipefail
          php_files=(
            wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-local-oauth-consent-ui.php
            wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-authorization.php
            wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-staging-write-planning-guard.php
            wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-skill-registry.php
            wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-servers.php
            wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-mcp-registration-rescue-v1.php
          )
          for file in "${php_files[@]}"; do php -l "$file" >/dev/null; done
          python3 -m json.tool wp-content/plugins/mad4b-site-control-plane/config/staging-deployment-handoff.json >/dev/null
          python3 -m json.tool plugins/mad4b-wordpress/plugin.json >/dev/null
          python3 -m json.tool plugins/mad4b-wordpress/.codex-plugin/plugin.json >/dev/null
          node --check wp-content/plugins/mad4b-site-control-plane/assets/local-oauth-canary.js
          python3 wp-content/plugins/mad4b-site-control-plane/tests/dynamic-skills-contract.py
          python3 wp-content/plugins/mad4b-site-control-plane/tests/staging-write-authority-contract.py
          ! grep -Fq 'staging.egypttourgates.com' plugins/mad4b-wordpress/README.md
          ! grep -Fq 'Egypt Tour Gates' plugins/mad4b-wordpress/README.md
          ! grep -Fq 'Egypt Tour Gates' plugins/mad4b-wordpress/plugin.json
          ! grep -Fq 'Egypt Tour Gates' plugins/mad4b-wordpress/.codex-plugin/plugin.json
          ! grep -Fq '0.3.0' wp-content/plugins/mad4b-site-control-plane/README.md
          grep -Fq 'mad4b-site-control-plane-general-distribution-kit-{exact_head_sha}' wp-content/plugins/mad4b-site-control-plane/config/staging-deployment-handoff.json
      - name: Commit exact cleanup and remove staging workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rc32-final-generalization-cleanup.yml
          rm -f .github/workflows/rc32-final-generalization-cleanup-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(rc32): close general distribution identity gaps'
          git push origin HEAD:feat/dynamic-wordpress-skills-20260909
