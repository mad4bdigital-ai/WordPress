name: WPL License Final Audit

on:
  push:
    branches:
      - fix/wpl-client-db-lifecycle-cleanup-20260906
    paths:
      - .github/workflows/wpl-license-final-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact WPML and Crocoblock runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wpl-final-audit
          rm -rf "$ROOT"
          mkdir -p "$ROOT/otgs" "$ROOT/croco"
          unzip -q wp-content/plugins/otgs-installer-plugin.zip -d "$ROOT/otgs"
          unzip -q wp-content/plugins/crocoblock-wizard.zip -d "$ROOT/croco"

          echo '=== WPML bootstrap + validation symbols ==='
          grep -RniE 'function[[:space:]]+WP_Installer|repository_has_valid_subscription|repository_has_subscription|refresh_subscriptions_data|save_site_key|get_site_key' "$ROOT/otgs" --include='*.php' | head -n 250 || true

          echo '=== Crocoblock class + license option + module loading ==='
          grep -RniE 'class[[:space:]]+API|license_option|new[[:space:]]+API|Modules\\License|modules/license|activate_license|check_license' "$ROOT/croco" --include='*.php' | head -n 350 || true

          echo '=== Crocoblock license API header ==='
          API_FILE=$(find "$ROOT/croco" -path '*/includes/modules/license/api.php' | head -n1)
          test -n "$API_FILE"
          sed -n '1,90p' "$API_FILE"
