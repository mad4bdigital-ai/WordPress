name: MAD4B Authority Reviews
on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-authority-reviews-bridge.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/authority-reviews-bridge-contract.php'
      - '.github/workflows/mad4b-authority-reviews.yml'
  push:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-authority-reviews-bridge.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/authority-reviews-bridge-contract.php'
      - '.github/workflows/mad4b-authority-reviews.yml'
jobs:
  reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax and source-backed review contracts
        run: |
          ROOT=wp-content/plugins/mad4b-site-control-plane
          php -l "$ROOT/includes/class-mad4b-scp-authority-reviews-bridge.php"
          php -l "$ROOT/tests/authority-reviews-bridge-contract.php"
          php "$ROOT/tests/authority-reviews-bridge-contract.php"
