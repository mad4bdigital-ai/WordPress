name: MAD4B One-shot Approval Handoff Source Patch v3

on:
  push:
    branches: [feat/dynamic-wordpress-skills-20260909]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore(ci): separate source patch from workflow transport' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Guard exact untouched source ancestor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~3)" = "7aa042bb18d920c11367e42c6ccd3a22373bd035"
          unexpected="$(git diff --name-only 7aa042bb18d920c11367e42c6ccd3a22373bd035..HEAD | grep -v '^\.github/workflows/mad4b-one-shot-approval-etg-identity-patch' || true)"
          test -z "$unexpected"

      - name: Replay already-validated bounded source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/mad4b-one-shot-approval-etg-identity-patch-v2.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(workflow[start:end]))
          exec(compile(script, 'bounded-source-patch', 'exec'), {})
          PY
          git checkout -- .github/workflows/mad4b-approval-decision-contract.yml .github/workflows/mad4b-etg-dfsb-adapter.yml

      - name: Revalidate source contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/plugins/mad4b-site-control-plane/includes/adapters/class-mad4b-scp-approval-handoff-adapter.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/adapters/class-mad4b-scp-etg-dfsb-adapter.php
          python3 wp-content/plugins/mad4b-site-control-plane/tests/approval-decision-contract.py
          python3 wp-content/plugins/mad4b-site-control-plane/tests/etg-dfsb-adapter-contract.py
          python3 -m json.tool wp-content/plugins/mad4b-site-control-plane/config/adapter-support-catalog.json >/dev/null
          test -z "$(git diff --name-only | grep '^\.github/workflows/' || true)"

      - name: Commit source patch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MAD4B'
          git config user.email 'mad4b.digital@gmail.com'
          git add wp-content/plugins/mad4b-site-control-plane
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"
          git commit -m 'fix(governance): expose human approval handoff and ETG build identity'
          git push origin HEAD:feat/dynamic-wordpress-skills-20260909
