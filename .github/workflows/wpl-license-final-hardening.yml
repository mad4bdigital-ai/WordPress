name: WPL License Final Hardening

on:
  push:
    branches:
      - fix/wpl-client-db-lifecycle-cleanup-20260906
    paths:
      - .github/workflows/wpl-license-final-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close scheduler lifecycle gaps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          monitor = 'wp-content/plugins/wpl-client/includes/class-wpl-license-health-monitor.php'
          replace_once(
              monitor,
              "        add_action( self::SOON_HOOK, [ __CLASS__, 'run' ] );",
              "        add_action( self::SOON_HOOK, [ __CLASS__, 'run_event_driven' ] );",
              'event hook force refresh',
          )
          replace_once(
              monitor,
              "    public static function schedule_soon() {\n        if ( ! wp_next_scheduled( self::SOON_HOOK ) ) {\n            wp_schedule_single_event( time() + 30, self::SOON_HOOK );\n        }\n    }",
              "    public static function schedule_soon() {\n        if ( ! wp_next_scheduled( self::SOON_HOOK ) ) {\n            wp_schedule_single_event( time() + 30, self::SOON_HOOK );\n        }\n    }\n\n    /**\n     * Plugin activation/update is a strong signal that registration state may have\n     * changed. Bypass stale backoff once for this event-driven verification.\n     */\n    public static function run_event_driven() {\n        return self::run( true );\n    }",
              'event force handler',
          )

          maintenance = 'wp-content/plugins/wpl-client/includes/class-wpl-database-maintenance.php'
          replace_once(
              maintenance,
              "        wp_clear_scheduled_hook( 'wpl_license_health_check' );\n\n        self::clear_transients();",
              "        wp_clear_scheduled_hook( 'wpl_license_health_check' );\n        wp_clear_scheduled_hook( 'wpl_license_health_check_soon' );\n\n        self::clear_transients();",
              'uninstall event hook cleanup',
          )
          PY

      - name: PHP lint and final assertions
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/plugins/wpl-client -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -q "SOON_HOOK, \[ __CLASS__, 'run_event_driven' \]" wp-content/plugins/wpl-client/includes/class-wpl-license-health-monitor.php
          grep -q "return self::run( true )" wp-content/plugins/wpl-client/includes/class-wpl-license-health-monitor.php
          test "$(grep -c "wp_clear_scheduled_hook( 'wpl_license_health_check_soon' )" wp-content/plugins/wpl-client/includes/class-wpl-database-maintenance.php)" -eq 1

      - name: Rebuild and verify distributable ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd wp-content/plugins
          rm -f wpl-client.zip
          zip -qr wpl-client.zip wpl-client -x '*/.DS_Store'
          rm -rf /tmp/wpl-client-package-check
          mkdir -p /tmp/wpl-client-package-check
          unzip -q wpl-client.zip -d /tmp/wpl-client-package-check
          diff -qr wpl-client /tmp/wpl-client-package-check/wpl-client
          cd ../..

      - name: Commit final patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wp-content/plugins/wpl-client wp-content/plugins/wpl-client.zip
          git commit -m "fix(wpl-client): force event-driven license verification"
          git push
