name: WPL License Final Hardening

on:
  push:
    branches:
      - fix/wpl-client-db-lifecycle-cleanup-20260906
    paths:
      - .github/workflows/wpl-license-final-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Persist Crocoblock activation response completely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('wp-content/plugins/wpl-client/includes/class-wpl-license-health-monitor.php')
          text = p.read_text(encoding='utf-8')
          old_call = "self::save_crocoblock_key( $api, $key );"
          if text.count(old_call) != 2:
              raise SystemExit(f'expected 2 Crocoblock persistence calls, got {text.count(old_call)}')
          text = text.replace(old_call, "self::persist_crocoblock_activation( $api, $key, $activate );")
          old_fn = "    private static function save_crocoblock_key( $api, $key ) {\n        $option = isset( $api->license_option ) && is_string( $api->license_option )\n            ? $api->license_option\n            : 'jet_theme_core_license';\n        update_option( $option, $key, false );\n    }\n"
          new_lines = [
              "    /**",
              "     * Mirror the state Crocoblock's own activate_license() persists. The cron",
              "     * adapter uses the vendor's lower-level request because activate_license()",
              "     * requires an interactive manage_options user, which WP-Cron does not have.",
              "     */",
              "    private static function persist_crocoblock_activation( $api, $key, $response ) {",
              "        if ( ! self::crocoblock_response_is_valid( $response ) ) return;",
              "",
              "        $license_option = isset( $api->license_option ) && is_string( $api->license_option )",
              "            ? $api->license_option",
              "            : 'jet_theme_core_license';",
              "        update_option( $license_option, $key, false );",
              "",
              "        if ( array_key_exists( 'has_templates_access', $response ) ) {",
              "            update_option( 'has_template_access', $response['has_templates_access'] === true ? 1 : -1, false );",
              "        }",
              "        if ( array_key_exists( 'has_design_templates_access', $response ) ) {",
              "            update_option( 'has_design_templates_access', $response['has_design_templates_access'] === true ? 1 : -1, false );",
              "        }",
              "        if ( isset( $response['excluded_plugins'] ) && is_array( $response['excluded_plugins'] ) ) {",
              "            $plugins_option = isset( $api->plugins_option ) && is_string( $api->plugins_option )",
              "                ? $api->plugins_option",
              "                : 'jet_excluded_plugins';",
              "            update_option( $plugins_option, $response['excluded_plugins'], false );",
              "        }",
              "    }",
              "",
          ]
          new_fn = "\n".join(new_lines)
          if text.count(old_fn) != 1:
              raise SystemExit('Crocoblock persistence function anchor mismatch')
          p.write_text(text.replace(old_fn, new_fn, 1), encoding='utf-8')
          PY

      - name: PHP lint and vendor-state assertions
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/plugins/wpl-client -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          test "$(grep -c 'persist_crocoblock_activation' wp-content/plugins/wpl-client/includes/class-wpl-license-health-monitor.php)" -eq 3
          grep -q "has_templates_access" wp-content/plugins/wpl-client/includes/class-wpl-license-health-monitor.php
          grep -q "has_design_templates_access" wp-content/plugins/wpl-client/includes/class-wpl-license-health-monitor.php
          grep -q "excluded_plugins" wp-content/plugins/wpl-client/includes/class-wpl-license-health-monitor.php

      - name: Rebuild and verify distributable ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd wp-content/plugins
          rm -f wpl-client.zip
          zip -qr wpl-client.zip wpl-client -x '*/.DS_Store'
          rm -rf /tmp/wpl-client-package-check
          mkdir -p /tmp/wpl-client-package-check
          unzip -q wpl-client.zip -d /tmp/wpl-client-package-check
          diff -qr wpl-client /tmp/wpl-client-package-check/wpl-client
          cd ../..

      - name: Commit Crocoblock persistence hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wp-content/plugins/wpl-client wp-content/plugins/wpl-client.zip
          git commit -m "fix(wpl-client): persist Crocoblock activation capabilities"
          git push
