name: WPL License Final Hardening

on:
  push:
    branches:
      - fix/wpl-client-db-lifecycle-cleanup-20260906
    paths:
      - .github/workflows/wpl-license-final-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make license-health execution lock atomic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          monitor = 'wp-content/plugins/wpl-client/includes/class-wpl-license-health-monitor.php'
          replace_once(
              monitor,
              "    const RETRY_OPTION       = 'wpl_license_health_retry_state';\n    const LOCK_TRANSIENT     = 'wpl_license_health_lock';\n    const FAILURE_RETRY_SECS = DAY_IN_SECONDS;",
              "    const RETRY_OPTION       = 'wpl_license_health_retry_state';\n    const LOCK_OPTION        = 'wpl_license_health_lock_state';\n    const LOCK_TTL           = 10 * MINUTE_IN_SECONDS;\n    const FAILURE_RETRY_SECS = DAY_IN_SECONDS;",
              'lock constants',
          )
          replace_once(
              monitor,
              "        wp_clear_scheduled_hook( self::CRON_HOOK );\n        wp_clear_scheduled_hook( self::SOON_HOOK );\n        delete_transient( self::LOCK_TRANSIENT );",
              "        wp_clear_scheduled_hook( self::CRON_HOOK );\n        wp_clear_scheduled_hook( self::SOON_HOOK );\n        delete_option( self::LOCK_OPTION );\n        delete_transient( 'wpl_license_health_lock' );",
              'lock deactivation cleanup',
          )
          replace_once(
              monitor,
              "        if ( get_transient( self::LOCK_TRANSIENT ) ) {\n            return self::get_report();\n        }\n        set_transient( self::LOCK_TRANSIENT, 1, 10 * MINUTE_IN_SECONDS );",
              "        if ( ! self::acquire_lock() ) {\n            return self::get_report();\n        }",
              'atomic lock acquisition',
          )
          replace_once(
              monitor,
              "        } finally {\n            delete_transient( self::LOCK_TRANSIENT );\n        }",
              "        } finally {\n            self::release_lock();\n        }",
              'atomic lock release',
          )
          anchor = "    private static function retry_allowed( $id ) {\n"
          insert = "    private static function acquire_lock() {\n        $now  = time();\n        $held = (int) get_option( self::LOCK_OPTION, 0 );\n\n        if ( $held && ( $now - $held ) < self::LOCK_TTL ) {\n            return false;\n        }\n        if ( $held ) {\n            delete_option( self::LOCK_OPTION );\n        }\n\n        return add_option( self::LOCK_OPTION, $now, '', 'no' );\n    }\n\n    private static function release_lock() {\n        delete_option( self::LOCK_OPTION );\n    }\n\n"
          p = Path(monitor)
          text = p.read_text(encoding='utf-8')
          if text.count(anchor) != 1:
              raise SystemExit('retry anchor mismatch')
          p.write_text(text.replace(anchor, insert + anchor, 1), encoding='utf-8')

          maintenance = 'wp-content/plugins/wpl-client/includes/class-wpl-database-maintenance.php'
          replace_once(
              maintenance,
              "        'wpl_bg_install_worker_lock',\n        // A pending activation request is business state, not disposable runtime state.",
              "        'wpl_bg_install_worker_lock',\n        'wpl_license_health_lock_state',\n        // A pending activation request is business state, not disposable runtime state.",
              'activation lock cleanup',
          )
          PY

      - name: PHP lint and concurrency assertions
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/plugins/wpl-client -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -q "LOCK_OPTION" wp-content/plugins/wpl-client/includes/class-wpl-license-health-monitor.php
          grep -q "add_option( self::LOCK_OPTION" wp-content/plugins/wpl-client/includes/class-wpl-license-health-monitor.php
          grep -q "wpl_license_health_lock_state" wp-content/plugins/wpl-client/includes/class-wpl-database-maintenance.php
          ! grep -q "get_transient( self::LOCK_TRANSIENT" wp-content/plugins/wpl-client/includes/class-wpl-license-health-monitor.php

      - name: Rebuild and verify distributable ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd wp-content/plugins
          rm -f wpl-client.zip
          zip -qr wpl-client.zip wpl-client -x '*/.DS_Store'
          rm -rf /tmp/wpl-client-package-check
          mkdir -p /tmp/wpl-client-package-check
          unzip -q wpl-client.zip -d /tmp/wpl-client-package-check
          diff -qr wpl-client /tmp/wpl-client-package-check/wpl-client
          cd ../..

      - name: Commit concurrency hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wp-content/plugins/wpl-client wp-content/plugins/wpl-client.zip
          git commit -m "fix(wpl-client): serialize license-health repair runs"
          git push
