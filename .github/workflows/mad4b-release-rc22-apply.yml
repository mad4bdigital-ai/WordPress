name: MAD4B RC22 Release Apply

on:
  pull_request:
    paths:
      - '.github/workflows/mad4b-release-rc22-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Apply scoped rc.22 release bump
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/dynamic-wordpress-skills-20260909'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Verify exact head and scoped allowlist
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$GITHUB_REPOSITORY" = 'mad4bdigital-ai/WordPress'
          test "${{ github.event.pull_request.head.ref }}" = 'feat/dynamic-wordpress-skills-20260909'

          cat > /tmp/expected-files.txt <<'EOF'
          .github/workflows/mad4b-control-plane-package.yml
          .github/workflows/mad4b-live-acceptance-evidence.yml
          wp-content/plugins/mad4b-site-control-plane/MAD4B-RUNTIME-BUILD.txt
          wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php
          wp-content/plugins/mad4b-site-control-plane/tests/live-acceptance-evidence-contract.py
          wp-content/plugins/mad4b-site-control-plane/tests/live-acceptance-observer-runtime.php
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt

          git grep -l '0.4.0-rc.21' \
            | grep -v '^.github/workflows/mad4b-release-rc22-audit.yml$' \
            | grep -v '^.github/workflows/mad4b-release-rc22-apply.yml$' \
            | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          test "$(wc -l < /tmp/actual-files.txt | tr -d ' ')" = '6'

      - name: Replace only rc.21 with rc.22 in allowlisted files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files = [
              '.github/workflows/mad4b-control-plane-package.yml',
              '.github/workflows/mad4b-live-acceptance-evidence.yml',
              'wp-content/plugins/mad4b-site-control-plane/MAD4B-RUNTIME-BUILD.txt',
              'wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php',
              'wp-content/plugins/mad4b-site-control-plane/tests/live-acceptance-evidence-contract.py',
              'wp-content/plugins/mad4b-site-control-plane/tests/live-acceptance-observer-runtime.php',
          ]
          old = '0.4.0-rc.21'
          new = '0.4.0-rc.22'
          total = 0
          for name in files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'{name}: expected at least one rc.21 reference')
              path.write_text(text.replace(old, new), encoding='utf-8')
              total += count
          if total < 6:
              raise SystemExit('unexpectedly low rc.21 replacement count')
          print(f'replaced {total} exact release references')
          PY

      - name: Verify no scope expansion
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files.txt <<'EOF'
          .github/workflows/mad4b-control-plane-package.yml
          .github/workflows/mad4b-live-acceptance-evidence.yml
          wp-content/plugins/mad4b-site-control-plane/MAD4B-RUNTIME-BUILD.txt
          wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php
          wp-content/plugins/mad4b-site-control-plane/tests/live-acceptance-evidence-contract.py
          wp-content/plugins/mad4b-site-control-plane/tests/live-acceptance-observer-runtime.php
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          git diff --name-only | sort > /tmp/changed-files.txt
          diff -u /tmp/expected-files.txt /tmp/changed-files.txt
          ! git grep -n '0.4.0-rc.21' -- \
            .github/workflows/mad4b-control-plane-package.yml \
            .github/workflows/mad4b-live-acceptance-evidence.yml \
            wp-content/plugins/mad4b-site-control-plane/MAD4B-RUNTIME-BUILD.txt \
            wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php \
            wp-content/plugins/mad4b-site-control-plane/tests/live-acceptance-evidence-contract.py \
            wp-content/plugins/mad4b-site-control-plane/tests/live-acceptance-observer-runtime.php
          grep -q '0.4.0-rc.22' wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php
          grep -q '^release=0.4.0-rc.22$' wp-content/plugins/mad4b-site-control-plane/MAD4B-RUNTIME-BUILD.txt

      - name: Commit exact scoped release bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/mad4b-control-plane-package.yml \
            .github/workflows/mad4b-live-acceptance-evidence.yml \
            wp-content/plugins/mad4b-site-control-plane/MAD4B-RUNTIME-BUILD.txt \
            wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php \
            wp-content/plugins/mad4b-site-control-plane/tests/live-acceptance-evidence-contract.py \
            wp-content/plugins/mad4b-site-control-plane/tests/live-acceptance-observer-runtime.php
          git diff --cached --check
          git commit -m 'chore(release): bump Control Plane to rc.22'
          git push origin HEAD:feat/dynamic-wordpress-skills-20260909
