name: MAD4B Host v128 persistent enrollment source tests
on:
  pull_request:
    paths:
      - 'ops/host-authority-v128/**'
      - 'tests/host-v128/**'
      - 'docs/host-v128/**'
      - '.github/workflows/host-v128-persistent-mode.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-v128-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  host-mode-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ed25519 verification library
        run: python -m pip install 'cryptography>=41,<48'
      - name: Compile source
        run: python -m compileall -q ops/host-authority-v128 tests/host-v128
      - name: Verify strict host-mode and operation lifecycle contracts
        run: python -m unittest discover -s tests/host-v128 -p 'test_*.py' -v
# Review-only. Nothing is installed into WordPress; no owner attestation,
# host grants, Root signing, SSH, self-update, or Production deployment.
