name: MAD4B Host v128 persistent enrollment source tests
on:
  pull_request:
    paths:
      - 'ops/host-authority-v128/**'
      - 'deploy/host-authority/reconciliation/v128/**'
      - 'deploy/host-authority/reconciliation/v135/**'
      - 'deploy/host-authority/reconciliation/v136/**'
      - 'tests/host-v128/**'
      - 'tests/host-v135/**'
      - 'tests/host-v136/**'
      - 'tests/release-qualification/**'
      - 'tools/mad4b_release_qualification_mode.py'
      - 'tools/mad4b_host_runner.py'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/host-runner-kernel-contract.py'
      - 'docs/host-v128/**'
      - '.github/mad4b-release-qualification-mode.json'
      - '.github/workflows/host-v128-persistent-mode.yml'
      - '.github/workflows/mad4b-release-verdict.yml'
  push:
    branches:
      - master
    paths:
      - 'ops/host-authority-v128/**'
      - 'deploy/host-authority/reconciliation/v128/**'
      - 'deploy/host-authority/reconciliation/v135/**'
      - 'deploy/host-authority/reconciliation/v136/**'
      - 'tests/host-v128/**'
      - 'tests/host-v135/**'
      - 'tests/host-v136/**'
      - 'tests/release-qualification/**'
      - 'tools/mad4b_release_qualification_mode.py'
      - 'tools/mad4b_host_runner.py'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/host-runner-kernel-contract.py'
      - 'docs/host-v128/**'
      - '.github/mad4b-release-qualification-mode.json'
      - '.github/workflows/host-v128-persistent-mode.yml'
      - '.github/workflows/mad4b-release-verdict.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-v128-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  host-mode-contract:
    name: Host v128 lifecycle contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PHP runtime for Original318 Ed25519 parity
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium
      - name: Install Ed25519 verification library
        run: python -m pip install 'cryptography>=41,<48'
      - name: Compile source
        run: python -m compileall -q ops/host-authority-v128 tests/host-v128 tests/host-v135 tests/host-v136
      - name: Verify strict cross-company host modes and Original318 PHP Ed25519 parity
        env:
          MAD4B_REQUIRE_PHP: '1'
        run: python -B -m unittest discover -s tests/host-v128 -p 'test_*.py' -v
      - name: Verify remote signed Owner proof and Root re-verification cannot grant Write
        env:
          MAD4B_TEST_PHP: php
          MAD4B_REQUIRE_PHP: '1'
          MAD4B_REQUIRE_NODE: '1'
        run: python -B -m unittest discover -s tests/host-v135 -p 'test_*.py' -v
      - name: Verify human-readable Owner review UX and no signing
        env:
          MAD4B_TEST_PHP: php
          MAD4B_REQUIRE_PHP: '1'
          MAD4B_REQUIRE_NODE: '1'
        run: python -B -m unittest discover -s tests/host-v136 -p 'test_*.py' -v
      - name: Verify existing bounded Host Runner write limits and path safety
        run: |
          python -B wp-content/plugins/mad4b-site-control-plane/tests/host-runner-kernel-contract.py
          python -B wp-content/plugins/mad4b-site-control-plane/tests/host-runner-bootstrap-contract.py
          python -B wp-content/plugins/mad4b-site-control-plane/tests/host-runner-path-security-contract.py
      - name: Verify globally optional release qualification never weakens host authority
        run: python -B -m unittest discover -s tests/release-qualification -p 'test_*.py' -v
# Review-only. Nothing is installed into WordPress; no owner attestation,
# host grants, Root signing, SSH, self-update, or Production deployment.
