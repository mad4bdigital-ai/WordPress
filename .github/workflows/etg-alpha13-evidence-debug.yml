name: ETG Alpha13 Evidence Hardening Debug

on:
  push:
    branches:
      - feat/etg-dynamic-filter-seo-bridge

permissions:
  contents: read

jobs:
  debug:
    if: "${{ github.event.head_commit.message == 'chore(etg): rerun evidence hardening debug' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard source baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 48936c4ff65f957599b6f18c892bf1ccb239efca HEAD^
          unexpected="$(git diff --name-only 48936c4ff65f957599b6f18c892bf1ccb239efca..HEAD^ | grep -Ev '^\.github/(workflows/etg-alpha13-evidence-hardening-one-shot\.yml|workflows/etg-alpha13-evidence-hardening-v2\.yml|workflows/etg-alpha13-evidence-debug\.yml|etg-alpha13-evidence-hardening\.py)$' || true)"
          test -z "$unexpected"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Apply patch in workspace
        run: python3 .github/etg-alpha13-evidence-hardening.py
      - name: Print transformed planner fixture and result
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('wp-content/plugins/etg-dynamic-filter-seo-bridge/tests/alpha12-inventory-control-smoke.php')
          s=p.read_text()
          needle="$propertiesPlan=$plan['proposals']['properties'];\n"
          assert needle in s
          s=s.replace(needle, needle+"fwrite(STDERR, 'DEBUG_PROPERTIES ' . var_export($propertiesPlan,true) . PHP_EOL);\n",1)
          p.write_text(s)
          PY
          grep -n "provider_group_drift\|propertiesPlan" wp-content/plugins/etg-dynamic-filter-seo-bridge/tests/alpha12-inventory-control-smoke.php
          php wp-content/plugins/etg-dynamic-filter-seo-bridge/tests/alpha12-inventory-control-smoke.php || true
