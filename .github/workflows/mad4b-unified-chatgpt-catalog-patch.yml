name: MAD4B Unified ChatGPT Catalog Patch

on:
  push:
    branches:
      - feat/dynamic-wordpress-skills-20260909

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynamic-wordpress-skills-20260909
          fetch-depth: 0

      - name: Apply exact bounded unified catalog patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-servers.php')
          text = path.read_text(encoding='utf-8')

          old = r'''\tpublic static function chatgpt_tools() {
          \t\t$core = self::core_tools( 'mad4b-chatgpt' );
          \t\t$adapter_candidates = array();
          \t\tif ( class_exists( 'MAD4B_SCP_Adapter_Registry' ) ) {
          \t\t\t$registry = MAD4B_SCP_Adapter_Registry::instance();
          \t\t\t$registry->register_defaults();
          \t\t\t$adapter_candidates = $registry->ability_names( 'read' );
          \t\t}
          \t\t$forbidden = array(
          \t\t\t'mad4b/filesystem-list', 'mad4b/filesystem-read',
          \t\t\t'mad4b/database-list-tables', 'mad4b/database-describe-table', 'mad4b/database-select', 'mad4b/database-raw-query',
          \t\t);
          \t\t$tools = array_values( array_diff( $core, $forbidden ) );
          \t\tforeach ( array_values( array_unique( $adapter_candidates ) ) as $ability_name ) {
          \t\t\tif ( in_array( $ability_name, $forbidden, true ) ) continue;
          \t\t\tif ( ! function_exists( 'wp_has_ability' ) || ! function_exists( 'wp_get_ability' ) || ! wp_has_ability( $ability_name ) ) continue;
          \t\t\t$ability = wp_get_ability( $ability_name );
          \t\t\tif ( ! is_object( $ability ) || ! method_exists( $ability, 'get_meta' ) ) continue;
          \t\t\t$meta = $ability->get_meta();
          \t\t\t$annotations = isset( $meta['annotations'] ) && is_array( $meta['annotations'] ) ? $meta['annotations'] : array();
          \t\t\tif ( ! array_key_exists( 'readonly', $annotations ) || true !== $annotations['readonly'] ) continue;
          \t\t\t$tools[] = (string) $ability_name;
          \t\t}
          \t\tif ( class_exists( 'MAD4B_SCP_Staging_Write_Authority' ) && MAD4B_SCP_Staging_Write_Authority::effective() ) {
          \t\t\t$tools = array_merge( $tools, self::write_tools() );
          \t\t\t$gated_write_tools = array_values( array_diff( self::external_write_tools(), self::write_tools() ) );
          \t\t\t$tools = array_merge( $tools, $gated_write_tools );
          \t\t}
          \t\treturn array_values( array_unique( $tools ) );
          \t}
          '''

          new = r'''\tprivate static function chatgpt_unified_catalog_enabled() {
          \t\treturn class_exists( 'MAD4B_SCP_Site_Profile' )
          \t\t\t&& MAD4B_SCP_Site_Profile::configured()
          \t\t\t&& 'staging' === MAD4B_SCP_Site_Profile::current_environment()
          \t\t\t&& MAD4B_SCP_Site_Profile::origin_enrolled()
          \t\t\t&& MAD4B_SCP_Site_Profile::site_urls_match_enrollment();
          \t}

          \tpublic static function chatgpt_tools() {
          \t\t$core = self::core_tools( 'mad4b-chatgpt' );
          \t\t$adapter_candidates = array();
          \t\tif ( class_exists( 'MAD4B_SCP_Adapter_Registry' ) ) {
          \t\t\t$registry = MAD4B_SCP_Adapter_Registry::instance();
          \t\t\t$registry->register_defaults();
          \t\t\t$adapter_candidates = $registry->ability_names( 'read' );
          \t\t}

          \t\tif ( ! self::chatgpt_unified_catalog_enabled() ) {
          \t\t\t$forbidden = array(
          \t\t\t\t'mad4b/filesystem-list', 'mad4b/filesystem-read',
          \t\t\t\t'mad4b/database-list-tables', 'mad4b/database-describe-table', 'mad4b/database-select', 'mad4b/database-raw-query',
          \t\t\t);
          \t\t\t$tools = array_values( array_diff( $core, $forbidden ) );
          \t\t\tforeach ( array_values( array_unique( $adapter_candidates ) ) as $ability_name ) {
          \t\t\t\tif ( in_array( $ability_name, $forbidden, true ) ) continue;
          \t\t\t\tif ( ! function_exists( 'wp_has_ability' ) || ! function_exists( 'wp_get_ability' ) || ! wp_has_ability( $ability_name ) ) continue;
          \t\t\t\t$ability = wp_get_ability( $ability_name );
          \t\t\t\tif ( ! is_object( $ability ) || ! method_exists( $ability, 'get_meta' ) ) continue;
          \t\t\t\t$meta = $ability->get_meta();
          \t\t\t\t$annotations = isset( $meta['annotations'] ) && is_array( $meta['annotations'] ) ? $meta['annotations'] : array();
          \t\t\t\tif ( ! array_key_exists( 'readonly', $annotations ) || true !== $annotations['readonly'] ) continue;
          \t\t\t\t$tools[] = (string) $ability_name;
          \t\t\t}
          \t\t\tif ( class_exists( 'MAD4B_SCP_Staging_Write_Authority' ) && MAD4B_SCP_Staging_Write_Authority::effective() ) {
          \t\t\t\t$tools = array_merge( $tools, self::write_tools() );
          \t\t\t\t$gated_write_tools = array_values( array_diff( self::external_write_tools(), self::write_tools() ) );
          \t\t\t\t$tools = array_merge( $tools, $gated_write_tools );
          \t\t\t}
          \t\t\treturn array_values( array_unique( $tools ) );
          \t\t}

          \t\t$candidates = array_merge(
          \t\t\tself::core_tools( 'mad4b-read' ),
          \t\t\tself::core_tools( 'mad4b-chatgpt' ),
          \t\t\tself::core_tools( 'mad4b-enrollment' ),
          \t\t\tself::core_tools( 'mad4b-content' ),
          \t\t\tself::core_tools( 'mad4b-admin' ),
          \t\t\tself::external_write_tools()
          \t\t);
          \t\tif ( class_exists( 'MAD4B_SCP_Adapter_Registry' ) ) {
          \t\t\t$registry = MAD4B_SCP_Adapter_Registry::instance();
          \t\t\t$registry->register_defaults();
          \t\t\tforeach ( array( 'read', 'content', 'admin', 'write' ) as $surface ) {
          \t\t\t\t$candidates = array_merge( $candidates, $registry->ability_names( $surface ) );
          \t\t\t}
          \t\t}

          \t\t$tools = array();
          \t\t$breakglass = self::core_tools( 'mad4b-breakglass' );
          \t\tforeach ( array_values( array_unique( array_map( 'strval', $candidates ) ) ) as $ability_name ) {
          \t\t\tif ( '' === $ability_name || 'mad4b/database-raw-query' === $ability_name || in_array( $ability_name, $breakglass, true ) ) continue;
          \t\t\tif ( ! function_exists( 'wp_has_ability' ) || ! function_exists( 'wp_get_ability' ) || ! wp_has_ability( $ability_name ) ) continue;
          \t\t\tif ( 'mad4b/site-profile-feature-reenroll' === $ability_name ) {
          \t\t\t\t$tools[] = $ability_name;
          \t\t\t\tcontinue;
          \t\t\t}
          \t\t\t$ability = wp_get_ability( $ability_name );
          \t\t\tif ( ! is_object( $ability ) || ! method_exists( $ability, 'get_meta' ) ) continue;
          \t\t\t$meta = $ability->get_meta();
          \t\t\t$annotations = isset( $meta['annotations'] ) && is_array( $meta['annotations'] ) ? $meta['annotations'] : array();
          \t\t\tif ( array_key_exists( 'readonly', $annotations ) && true === $annotations['readonly'] ) {
          \t\t\t\t$tools[] = $ability_name;
          \t\t\t\tcontinue;
          \t\t\t}
          \t\t\tif ( array_key_exists( 'readonly', $annotations ) && false === $annotations['readonly'] && self::is_external_write_candidate( $ability_name ) ) {
          \t\t\t\t$tools[] = $ability_name;
          \t\t\t}
          \t\t}
          \t\t$tools = array_values( array_unique( $tools ) );
          \t\tsort( $tools, SORT_STRING );
          \t\treturn $tools;
          \t}
          '''

          old_provider = r'''\t\tif ( 'mad4b-chatgpt' === $server_id ) {
          \t\t\tif ( ! in_array( $ability_name, self::chatgpt_tools(), true ) ) return null;
          \t\t\tif ( class_exists( 'MAD4B_SCP_Staging_Write_Authority' ) && MAD4B_SCP_Staging_Write_Authority::effective() && self::is_external_write_candidate( $ability_name ) ) {
          \t\t\t\tif ( null !== self::provider_for_ability( 'mad4b-write', $ability_name ) ) return self::provider_for_ability( 'mad4b-write', $ability_name );
          \t\t\t\treturn self::provider_for_external_write_candidate( $ability_name );
          \t\t\t}
          \t\t}
          '''

          new_provider = r'''\t\tif ( 'mad4b-chatgpt' === $server_id ) {
          \t\t\tif ( ! in_array( $ability_name, self::chatgpt_tools(), true ) ) return null;
          \t\t\tif ( self::is_external_write_candidate( $ability_name ) ) {
          \t\t\t\tif ( null !== self::provider_for_ability( 'mad4b-write', $ability_name ) ) return self::provider_for_ability( 'mad4b-write', $ability_name );
          \t\t\t\treturn self::provider_for_external_write_candidate( $ability_name );
          \t\t\t}
          \t\t\tif ( self::chatgpt_unified_catalog_enabled() ) {
          \t\t\t\tforeach ( array( 'mad4b-read', 'mad4b-enrollment', 'mad4b-content', 'mad4b-admin' ) as $core_server ) {
          \t\t\t\t\tif ( in_array( $ability_name, self::core_tools( $core_server ), true ) ) return 'core';
          \t\t\t\t}
          \t\t\t\tif ( class_exists( 'MAD4B_SCP_Adapter_Registry' ) ) {
          \t\t\t\t\t$registry = MAD4B_SCP_Adapter_Registry::instance();
          \t\t\t\t\t$registry->register_defaults();
          \t\t\t\t\tforeach ( $registry->all() as $adapter ) {
          \t\t\t\t\t\t$map = $adapter->ability_names();
          \t\t\t\t\t\tforeach ( array( 'read', 'content', 'admin', 'write' ) as $surface ) {
          \t\t\t\t\t\t\tif ( isset( $map[ $surface ] ) && is_array( $map[ $surface ] ) && in_array( $ability_name, $map[ $surface ], true ) ) {
          \t\t\t\t\t\t\t\treturn method_exists( $adapter, 'provider_key' ) ? $adapter->provider_key() : sanitize_key( (string) $adapter->id() );
          \t\t\t\t\t\t\t}
          \t\t\t\t\t\t}
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t\t}
          \t\t}
          '''

          old_desc = r'''\t\t$chatgpt_write_ready = class_exists( 'MAD4B_SCP_Staging_Write_Authority' ) && MAD4B_SCP_Staging_Write_Authority::effective();
          \t\t$chatgpt_description = $chatgpt_write_ready ? 'ChatGPT governed gateway with read diagnostics plus a stable governed write catalog. Provider writes may be discoverable before activation but remain fail-closed until mounted on mad4b-write, exactly granted and approved. Generic filesystem/database introspection and breakglass remain excluded.' : 'ChatGPT-safe read gateway. Generic filesystem/database inspection and all content/write/admin/breakglass mutation surfaces are excluded.';
          '''
          new_desc = r'''\t\t$chatgpt_write_ready = class_exists( 'MAD4B_SCP_Staging_Write_Authority' ) && MAD4B_SCP_Staging_Write_Authority::effective();
          \t\tif ( self::chatgpt_unified_catalog_enabled() ) {
          \t\t\t$chatgpt_description = 'Exact enrolled Staging unified governed gateway exposing all registered normal read capabilities, bounded Site Profile bootstrap, and the stable governed write catalog. Write visibility never grants authority: execution remains delegated to mad4b-write and requires runtime eligibility, exact grants and approval. Breakglass and Raw SQL remain excluded.';
          \t\t} else {
          \t\t\t$chatgpt_description = $chatgpt_write_ready ? 'ChatGPT governed gateway with read diagnostics plus a stable governed write catalog. Provider writes may be discoverable before activation but remain fail-closed until mounted on mad4b-write, exactly granted and approved. Generic filesystem/database introspection and breakglass remain excluded.' : 'ChatGPT-safe read gateway. Generic filesystem/database inspection and all content/write/admin/breakglass mutation surfaces are excluded.';
          \t\t}
          '''

          replacements = [
              ('chatgpt_tools', old, new),
              ('provider_for_ability', old_provider, new_provider),
              ('description', old_desc, new_desc),
          ]
          for label, before, after in replacements:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected exact snippet once, found {count}')
              text = text.replace(before, after, 1)

          path.write_text(text, encoding='utf-8')
          PY

          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-servers.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-transport-context.php

          git rm .github/workflows/mad4b-unified-chatgpt-catalog-patch.yml
          git config user.name 'MAD4B Governed Writer'
          git config user.email 'mad4b.digital@gmail.com'
          git add wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-servers.php \
                  wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-transport-context.php
          git diff --cached --check
          git commit -m 'feat(mcp): expose unified governed ChatGPT catalog'
          git push origin HEAD:feat/dynamic-wordpress-skills-20260909
