name: MAD4B Universal Runtime Resolver
on:
  pull_request:
    paths:
      - 'tools/mad4b-universal-runtime-resolver/**'
      - '.github/workflows/mad4b-universal-runtime-resolver.yml'
  push:
    paths:
      - 'tools/mad4b-universal-runtime-resolver/**'
      - '.github/workflows/mad4b-universal-runtime-resolver.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolver-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile runtime and tests
        run: python -m py_compile resolver.py test_resolver.py
        working-directory: tools/mad4b-universal-runtime-resolver
      - name: Isolated resolver contract tests
        run: python -m unittest -v test_resolver
        working-directory: tools/mad4b-universal-runtime-resolver
