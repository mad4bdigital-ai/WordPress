name: WPL Auth Hardening Apply

on:
  push:
    branches:
      - fix/wpl-client-db-lifecycle-cleanup-20260906
    paths:
      - '.github/workflows/wpl-auth-hardening-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply auth hardening patch
        run: python3 .github/scripts/wpl-auth-hardening.py
      - name: PHP lint and security assertions
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/plugins/wpl-client -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          ! grep -R -n -E 'wpl_live_[A-Za-z0-9_-]+' wp-content/plugins/wpl-client
          ! grep -R -n --include='*.php' 'sslverify' wp-content/plugins/wpl-client | grep -q 'false'
          ! grep -R -n --include='*.php' -E 'SSL_VERIFYPEER.*false|SSL_VERIFYHOST.*false|DEFAULT@SECLEVEL=1|CURL_SSLVERSION_TLSv1' wp-content/plugins/wpl-client
          grep -q 'Version:     2.8.0' wp-content/plugins/wpl-client/wpl-client.php
          grep -q "WPL_CLIENT_VERSION', '2.8.0'" wp-content/plugins/wpl-client/wpl-client.php
          grep -q 'wpl_save_server_credential' wp-content/plugins/wpl-client/includes/class-wpl-client-admin.php
          grep -q 'WPL_Server_Client::request' wp-content/plugins/wpl-client/includes/class-wpl-installer.php
      - name: Rebuild and verify public distributable ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd wp-content/plugins
          rm -f wpl-client.zip
          zip -qr wpl-client.zip wpl-client -x '*/.DS_Store' '*/includes/wpl-package-credential.php'
          rm -rf /tmp/wpl-client-package-check
          mkdir -p /tmp/wpl-client-package-check
          unzip -q wpl-client.zip -d /tmp/wpl-client-package-check
          diff -qr wpl-client /tmp/wpl-client-package-check/wpl-client
          test ! -e /tmp/wpl-client-package-check/wpl-client/includes/wpl-package-credential.php
          ! grep -R -n -E 'wpl_live_[A-Za-z0-9_-]+' /tmp/wpl-client-package-check/wpl-client
          cd ../..
      - name: Commit auth hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wp-content/plugins/wpl-client wp-content/plugins/wpl-client.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(wpl-client): recover account credentials without embedded secrets'
          git push origin HEAD:fix/wpl-client-db-lifecycle-cleanup-20260906
