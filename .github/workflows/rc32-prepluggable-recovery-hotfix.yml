name: RC32 Pre-Pluggable Recovery Hotfix

on:
  push:
    branches:
      - feat/dynamic-wordpress-skills-20260909
    paths:
      - .github/workflows/rc32-prepluggable-recovery-hotfix.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynamic-wordpress-skills-20260909
          fetch-depth: 3

      - name: Guard exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '830808fc1be92663d6d906c2f65482c486e381c7'

      - name: Remove pre-pluggable get_userdata dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-upgrade-continuity.php')
          s = p.read_text()
          old = "\t\t$user = get_userdata( $owner_user_id );\n\t\tif ( ! $user || ! user_can( $user, 'manage_options' ) ) return self::recovery_result( 'blocked', false, 'prior_oauth_owner_not_administrator' );"
          new = "\t\t$user = class_exists( 'WP_User' ) ? new WP_User( $owner_user_id ) : ( function_exists( 'get_userdata' ) ? get_userdata( $owner_user_id ) : false );\n\t\tif ( ! $user || ! function_exists( 'user_can' ) || ! user_can( $user, 'manage_options' ) ) return self::recovery_result( 'blocked', false, 'prior_oauth_owner_not_administrator' );"
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 owner lookup sites, found {count}')
          s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Verify focused runtime contract
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-upgrade-continuity.php
          php wp-content/plugins/mad4b-site-control-plane/tests/upgrade-continuity-runtime.php
          python3 - <<'PY'
          from pathlib import Path
          s = Path('wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-upgrade-continuity.php').read_text()
          needle = "class_exists( 'WP_User' ) ? new WP_User( $owner_user_id ) : ( function_exists( 'get_userdata' ) ? get_userdata( $owner_user_id ) : false )"
          if s.count(needle) != 2:
              raise SystemExit('pre-pluggable-safe owner lookup guard missing')
          PY
          git diff --check

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MAD4B'
          git config user.email 'mad4b.digital@gmail.com'
          git add wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-upgrade-continuity.php
          test -n "$(git status --porcelain)"
          git commit -m 'fix(rc32): avoid pluggable user lookup during early recovery'
          git push origin HEAD:feat/dynamic-wordpress-skills-20260909
