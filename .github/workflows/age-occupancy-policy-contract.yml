name: Age and Occupancy Policy Contract

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-age-occupancy-registry/**'
      - 'wp-content/plugins/commerce-composition/includes/InquiryQualification.php'
      - 'wp-content/plugins/commerce-composition/includes/RequestReviewAdmin.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/adapters/presentation-form6-price-quote-v1.php'
      - 'packages/mad4b-shared-product-core/tests/form6-missing-minor-policy-contract.php'
      - 'packages/mad4b-shared-product-core/tests/form6-preview-widget-smoke.js'
      - '.github/workflows/age-occupancy-policy-contract.yml'
  push:
    branches: [master]
    paths:
      - 'wp-content/plugins/mad4b-age-occupancy-registry/**'
      - 'wp-content/plugins/commerce-composition/includes/InquiryQualification.php'
      - 'wp-content/plugins/commerce-composition/includes/RequestReviewAdmin.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/adapters/presentation-form6-price-quote-v1.php'
      - 'packages/mad4b-shared-product-core/tests/form6-missing-minor-policy-contract.php'
      - 'packages/mad4b-shared-product-core/tests/form6-preview-widget-smoke.js'
      - '.github/workflows/age-occupancy-policy-contract.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
      - name: PHP syntax and global policy contracts
        run: |
          find wp-content/plugins/mad4b-age-occupancy-registry -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php wp-content/plugins/mad4b-age-occupancy-registry/tests/global-patterns-contract.php
          php -l wp-content/plugins/commerce-composition/includes/InquiryQualification.php
          php -l wp-content/plugins/commerce-composition/includes/RequestReviewAdmin.php
          php -l packages/mad4b-shared-product-core/mu-plugins/shared-product-core/adapters/presentation-form6-price-quote-v1.php
          php packages/mad4b-shared-product-core/tests/form6-missing-minor-policy-contract.php
      - name: Form 6 browser adapter JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('packages/mad4b-shared-product-core/mu-plugins/shared-product-core/adapters/presentation-form6-price-quote-v1.php').read_text()
          start=src.index('<script>',src.index("add_action('fluentform/after_form_render'"))+len('<script>')
          end=src.index('</script>',start)
          js=src[start:end]
          assert "partial_price_preview_only" in js and "adults_only_reference" in js
          assert "cache:'no-store'" in js and "Final group price requires review" in js
          assert "total:" not in js and "checkout" not in js.lower()
          Path('/tmp/mad4b-form6-ref-preview.js').write_text(js)
          PY
          node --check /tmp/mad4b-form6-ref-preview.js
          node packages/mad4b-shared-product-core/tests/form6-preview-widget-smoke.js
