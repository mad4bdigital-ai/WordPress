name: Age and Occupancy Policy Contract

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-age-occupancy-registry/**'
      - 'wp-content/plugins/commerce-composition/includes/InquiryQualification.php'
      - 'wp-content/plugins/commerce-composition/includes/RequestReviewAdmin.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/adapters/presentation-form6-price-quote-v1.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/assets/presentation-fluent-quote-v1.js'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/pricing/taxonomy-pricing-context.php'
      - 'packages/mad4b-shared-product-core/tests/season-wpml-inheritance-contract.php'
      - 'packages/mad4b-shared-product-core/tests/rate-localized-pricing-source-contract.php'
      - 'packages/mad4b-shared-product-core/tests/rate-locale-policy-runtime.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/pricing/rate-locale-policy.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/pricing/price-resolver.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/pricing/audience-resolver.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/pricing/booking-configuration-v2.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core-loader.php'
      - 'ops/etg-staging-locale-switchers/local-presentation-selection-registry-v1.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/pricing/rate-generation.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/pricing/accommodation-assignment.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/pricing/rate-source-batch.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/admin/rate-generation.php'
      - 'packages/mad4b-shared-product-core/tests/form6-missing-minor-policy-contract.php'
      - 'packages/mad4b-shared-product-core/tests/form6-native-pricing-contract.js'
      - '.github/workflows/age-occupancy-policy-contract.yml'
  push:
    branches: [master]
    paths:
      - 'wp-content/plugins/mad4b-age-occupancy-registry/**'
      - 'wp-content/plugins/commerce-composition/includes/InquiryQualification.php'
      - 'wp-content/plugins/commerce-composition/includes/RequestReviewAdmin.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/adapters/presentation-form6-price-quote-v1.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/assets/presentation-fluent-quote-v1.js'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/pricing/taxonomy-pricing-context.php'
      - 'packages/mad4b-shared-product-core/tests/season-wpml-inheritance-contract.php'
      - 'packages/mad4b-shared-product-core/tests/rate-localized-pricing-source-contract.php'
      - 'packages/mad4b-shared-product-core/tests/rate-locale-policy-runtime.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/pricing/rate-locale-policy.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/pricing/price-resolver.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/pricing/audience-resolver.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/pricing/booking-configuration-v2.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core-loader.php'
      - 'ops/etg-staging-locale-switchers/local-presentation-selection-registry-v1.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/pricing/rate-generation.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/pricing/accommodation-assignment.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/pricing/rate-source-batch.php'
      - 'packages/mad4b-shared-product-core/mu-plugins/shared-product-core/admin/rate-generation.php'
      - 'packages/mad4b-shared-product-core/tests/form6-missing-minor-policy-contract.php'
      - 'packages/mad4b-shared-product-core/tests/form6-native-pricing-contract.js'
      - '.github/workflows/age-occupancy-policy-contract.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
      - name: PHP syntax and global policy contracts
        run: |
          find wp-content/plugins/mad4b-age-occupancy-registry -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php wp-content/plugins/mad4b-age-occupancy-registry/tests/global-patterns-contract.php
          php -l wp-content/plugins/commerce-composition/includes/InquiryQualification.php
          php -l wp-content/plugins/commerce-composition/includes/RequestReviewAdmin.php
          php -l packages/mad4b-shared-product-core/mu-plugins/shared-product-core/adapters/presentation-form6-price-quote-v1.php
          php packages/mad4b-shared-product-core/tests/form6-missing-minor-policy-contract.php
          php packages/mad4b-shared-product-core/tests/season-wpml-inheritance-contract.php
          php packages/mad4b-shared-product-core/tests/rate-localized-pricing-source-contract.php
          php packages/mad4b-shared-product-core/tests/rate-locale-policy-runtime.php
      - name: Canonical Fluent Form 6 pricing UI contract
        run: |
          node --check packages/mad4b-shared-product-core/mu-plugins/shared-product-core/assets/presentation-fluent-quote-v1.js
          node packages/mad4b-shared-product-core/tests/form6-native-pricing-contract.js
