name: MAD4B WPML External Diagnostic

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - '.github/workflows/mad4b-wpml-external-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-wpml-external-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  external-read-only:
    name: Raw Staging WPML HTTP evidence
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WPML_URL_BASE: https://staging.egypttourgates.com/wp-json/wpml/v1/rest/status?test_get_parameter=1
      REST_INDEX_URL: https://staging.egypttourgates.com/wp-json/
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Setup Node 24 for bounded hCDN browser fallback
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prove WPML response contract compatibility
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          php -l "$root/includes/class-mad4b-scp-wpml-response-contract.php"
          php -l "$root/tests/wpml-response-contract-runtime.php"
          php "$root/tests/wpml-response-contract-runtime.php"

      - name: Capture endpoint and REST index without writes
        shell: bash
        run: |
          set -u
          out=/tmp/mad4b-wpml-external
          rm -rf "$out"
          mkdir -p "$out"

          capture() {
            name="$1"
            url="$2"
            : > "$out/${name}.headers"
            : > "$out/${name}.body"
            set +e
            http_code="$(curl --silent --show-error --compressed --max-time 30 --connect-timeout 10 \
              --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36' \
              --header 'Accept: application/json,text/plain,*/*' \
              --header 'Accept-Language: en-US,en;q=0.9' \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              --dump-header "$out/${name}.headers" \
              --output "$out/${name}.body" \
              --write-out '%{http_code}' \
              "$url" 2>"$out/${name}.stderr")"
            curl_exit=$?
            set -e
            printf '%s\n' "$http_code" > "$out/${name}.http-status"
            printf '%s\n' "$curl_exit" > "$out/${name}.curl-exit"
          }

          WPML_URL="$WPML_URL_BASE&mad4b_probe=$SOURCE_SHA"
          export WPML_URL

          selected_attempt=0
          for attempt in 1 2 3; do
            wpml_name="wpml-attempt-${attempt}"
            rest_name="rest-index-attempt-${attempt}"
            capture "$wpml_name" "$WPML_URL&mad4b_attempt=$attempt"
            capture "$rest_name" "$REST_INDEX_URL?mad4b_probe=$SOURCE_SHA&mad4b_attempt=$attempt"

            ATTEMPT="$attempt" WPML_NAME="$wpml_name" REST_NAME="$rest_name" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/mad4b-wpml-external')
          attempt = int(os.environ['ATTEMPT'])
          wpml_name = os.environ['WPML_NAME']
          rest_name = os.environ['REST_NAME']

          def read_text(name, suffix):
              return (root / f'{name}.{suffix}').read_text(encoding='utf-8', errors='replace').strip()

          def read_int(name, suffix, default=-1):
              try:
                  return int(read_text(name, suffix) or default)
              except Exception:
                  return default

          wpml_curl_exit = read_int(wpml_name, 'curl-exit')
          rest_curl_exit = read_int(rest_name, 'curl-exit')
          wpml_http_status = read_int(wpml_name, 'http-status', 0)
          rest_http_status = read_int(rest_name, 'http-status', 0)
          transport_reachable = (
              wpml_curl_exit == 0
              and rest_curl_exit == 0
              and wpml_http_status != 0
              and rest_http_status != 0
          )
          transport_state = 'reachable' if transport_reachable else 'transport_unreachable'

          namespace_present = False
          route_present = False
          rest_index_parse_error = ''
          try:
              data = json.loads((root / f'{rest_name}.body').read_text(encoding='utf-8', errors='replace'))
              namespaces = data.get('namespaces', []) if isinstance(data, dict) else []
              routes = data.get('routes', {}) if isinstance(data, dict) else {}
              namespace_present = 'wpml/v1' in namespaces
              route_present = '/wpml/v1/rest/status' in routes
          except Exception as exc:
              rest_index_parse_error = f'{type(exc).__name__}: {exc}'

          wpml_parse_error = ''
          wpml_status = ''
          wpml_get_parameters = ''
          wpml_success_envelope = False
          try:
              wpml = json.loads((root / f'{wpml_name}.body').read_text(encoding='utf-8', errors='replace'))
              payload = wpml
              if isinstance(wpml, dict) and wpml.get('success') is True and isinstance(wpml.get('data'), dict):
                  payload = wpml['data']
                  wpml_success_envelope = True
              if isinstance(payload, dict):
                  wpml_status = str(payload.get('status', ''))
                  wpml_get_parameters = str(payload.get('get_parameters', ''))
          except Exception as exc:
              wpml_parse_error = f'{type(exc).__name__}: {exc}'

          evidence = {
              'contract': 'mad4b.wpml-external-http-diagnostic.v4',
              'source_sha': os.environ.get('SOURCE_SHA', ''),
              'attempt': attempt,
              'target_url': os.environ.get('WPML_URL', ''),
              'rest_index_url': os.environ.get('REST_INDEX_URL', ''),
              'transport_state': transport_state,
              'transport_reachable': transport_reachable,
              'wpml_curl_exit': wpml_curl_exit,
              'rest_index_curl_exit': rest_curl_exit,
              'wpml_http_status': wpml_http_status,
              'rest_index_http_status': rest_http_status,
              'namespace_present': namespace_present,
              'route_present': route_present,
              'rest_index_parse_error': rest_index_parse_error,
              'wpml_parse_error': wpml_parse_error,
              'wpml_success_envelope': wpml_success_envelope,
              'wpml_status': wpml_status,
              'wpml_get_parameters': wpml_get_parameters,
              'wpml_contract_compatible': wpml_status == 'valid' and wpml_get_parameters == 'valid',
              'mutation_performed': False,
          }
          evidence['accepted'] = (
              evidence['transport_reachable']
              and evidence['namespace_present']
              and evidence['route_present']
              and evidence['wpml_contract_compatible']
          )
          evidence['diagnostic_outcome'] = (
              'accepted_evidence'
              if evidence['accepted']
              else ( 'transport_unreachable' if not evidence['transport_reachable'] else 'reachable_contract_failure' )
          )
          evidence['inconclusive'] = not evidence['transport_reachable']
          evidence['acceptance_authorized'] = False
          evidence['authority_granted'] = False
          (root / f'diagnostic-attempt-{attempt}.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

            if python3 - "$out/diagnostic-attempt-${attempt}.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          raise SystemExit(0 if d.get('accepted') else 1)
          PY
            then
              selected_attempt="$attempt"
              break
            fi

            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done

          if [ "$selected_attempt" -eq 0 ]; then selected_attempt=3; fi
          printf '%s\n' "$selected_attempt" > "$out/selected-attempt.txt"
          cp "$out/diagnostic-attempt-${selected_attempt}.json" "$out/diagnostic.json"
          for suffix in headers body stderr http-status curl-exit; do
            cp "$out/wpml-attempt-${selected_attempt}.${suffix}" "$out/wpml.${suffix}"
            cp "$out/rest-index-attempt-${selected_attempt}.${suffix}" "$out/rest-index.${suffix}"
          done

          {
            echo '## External WPML raw diagnostic (read-only)'
            echo
            echo "- source HEAD: \`$SOURCE_SHA\`"
            echo "- target: \`$WPML_URL\`"
            echo "- selected attempt: \`$selected_attempt/3\`"
            echo "- WPML curl exit: \`$(cat "$out/wpml.curl-exit")\`"
            echo "- WPML HTTP status: \`$(cat "$out/wpml.http-status")\`"
            echo "- REST index curl exit: \`$(cat "$out/rest-index.curl-exit")\`"
            echo "- REST index HTTP status: \`$(cat "$out/rest-index.http-status")\`"
            echo "- transport state: \`$(python3 -c 'import json; print(json.load(open("/tmp/mad4b-wpml-external/diagnostic.json"))["transport_state"])')\`"
            echo "- diagnostic outcome: \`$(python3 -c 'import json; print(json.load(open("/tmp/mad4b-wpml-external/diagnostic.json"))["diagnostic_outcome"])')\`"
            echo "- namespace wpml/v1 present: \`$(python3 -c 'import json; print(str(json.load(open("/tmp/mad4b-wpml-external/diagnostic.json"))["namespace_present"]).lower())')\`"
            echo "- route /wpml/v1/rest/status present: \`$(python3 -c 'import json; print(str(json.load(open("/tmp/mad4b-wpml-external/diagnostic.json"))["route_present"]).lower())')\`"
            echo "- compatible WPML contract: \`$(python3 -c 'import json; print(str(json.load(open("/tmp/mad4b-wpml-external/diagnostic.json"))["wpml_contract_compatible"]).lower())')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture MCP and OAuth hotpaths without writes
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/mad4b-wpml-external/mcp-hotpath
          mkdir -p "$out"
          origin='https://staging.egypttourgates.com'

          probe() {
            name="$1"
            url="$2"
            set +e
            metrics="$(
              curl --silent --show-error --compressed \
                --max-time 12 \
                --connect-timeout 5 \
                --header 'Accept: application/json' \
                --header 'Cache-Control: no-cache, no-store, max-age=0' \
                --header 'Pragma: no-cache' \
                --user-agent 'MAD4B-External-MCP-Diagnostic/1.0' \
                --dump-header "$out/$name.headers" \
                --output "$out/$name.body" \
                --write-out '%{http_code}\t%{time_namelookup}\t%{time_connect}\t%{time_starttransfer}\t%{time_total}\t%{size_download}' \
                "$url" \
                2>"$out/$name.stderr"
            )"
            curl_exit=$?
            set -e
            printf '%s\n' "$curl_exit" > "$out/$name.curl-exit"
            printf '%s\n' "$metrics" > "$out/$name.metrics"
          }

          probe runtime-build "$origin/wp-content/plugins/mad4b-site-control-plane/MAD4B-RUNTIME-BUILD.txt?mad4b_probe=$SOURCE_SHA"
          probe rest-index "$origin/wp-json/?mad4b_probe=$SOURCE_SHA"
          probe mcp-chatgpt "$origin/wp-json/mcp/mad4b-chatgpt?mad4b_probe=$SOURCE_SHA"
          probe oauth-protected-resource "$origin/wp-json/mad4b/v1/oauth-protected-resource?mad4b_probe=$SOURCE_SHA"
          probe oauth-authorization-server "$origin/.well-known/oauth-authorization-server/oauth/mcp?mad4b_probe=$SOURCE_SHA"
          probe oauth-jwks "$origin/oauth/mcp/jwks?mad4b_probe=$SOURCE_SHA"

          SOURCE_SHA="$SOURCE_SHA" python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path('/tmp/mad4b-wpml-external/mcp-hotpath')
          origin = 'https://staging.egypttourgates.com'
          targets = {
              'runtime-build': origin + '/wp-content/plugins/mad4b-site-control-plane/MAD4B-RUNTIME-BUILD.txt',
              'rest-index': origin + '/wp-json/',
              'mcp-chatgpt': origin + '/wp-json/mcp/mad4b-chatgpt',
              'oauth-protected-resource': origin + '/wp-json/mad4b/v1/oauth-protected-resource',
              'oauth-authorization-server': origin + '/.well-known/oauth-authorization-server/oauth/mcp',
              'oauth-jwks': origin + '/oauth/mcp/jwks',
          }

          rows = {}
          for name, url in targets.items():
              metric_path = root / f'{name}.metrics'
              raw = metric_path.read_text(encoding='utf-8', errors='replace').strip() if metric_path.is_file() else ''
              parts = raw.split('\t') if raw else []
              while len(parts) < 6:
                  parts.append('')
              body_path = root / f'{name}.body'
              headers_path = root / f'{name}.headers'
              stderr_path = root / f'{name}.stderr'
              exit_path = root / f'{name}.curl-exit'
              body = body_path.read_text(encoding='utf-8', errors='replace') if body_path.is_file() else ''
              headers = headers_path.read_text(encoding='utf-8', errors='replace') if headers_path.is_file() else ''
              stderr = stderr_path.read_text(encoding='utf-8', errors='replace') if stderr_path.is_file() else ''
              try:
                  curl_exit = int(exit_path.read_text(encoding='utf-8').strip())
              except Exception:
                  curl_exit = -1
              def as_float(value):
                  try:
                      return float(value)
                  except Exception:
                      return None
              try:
                  http_status = int(parts[0])
              except Exception:
                  http_status = 0
              hcdn_challenge = bool(
                  re.search(r'/hcdn-cgi/jschallenge|Checking your browser before accessing', body, re.I)
              )
              json_payload = None
              json_parse_error = ''
              if body.strip():
                  try:
                      parsed = json.loads(body)
                      if isinstance(parsed, dict):
                          json_payload = parsed
                  except Exception as exc:
                      json_parse_error = f'{type(exc).__name__}: {exc}'
              www_authenticate = ''
              for line in headers.splitlines():
                  if line.lower().startswith('www-authenticate:'):
                      www_authenticate = line.split(':', 1)[1].strip()
              rows[name] = {
                  'url': url,
                  'curl_exit': curl_exit,
                  'http_status': http_status,
                  'dns_seconds': as_float(parts[1]),
                  'connect_seconds': as_float(parts[2]),
                  'ttfb_seconds': as_float(parts[3]),
                  'total_seconds': as_float(parts[4]),
                  'size_download': int(float(parts[5])) if parts[5] else 0,
                  'hcdn_challenge': hcdn_challenge,
                  'www_authenticate': www_authenticate,
                  'json_payload': json_payload,
                  'json_parse_error': json_parse_error,
                  'stderr': stderr[:4096],
              }

          evidence = {
              'contract': 'mad4b.external-mcp-hotpath-diagnostic.v1',
              'source_sha': os.environ.get('SOURCE_SHA', ''),
              'origin': origin,
              'read_only': True,
              'mutation_performed': False,
              'authority_granted': False,
              'targets': rows,
          }
          (root / 'diagnostic.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              name: {
                  'curl_exit': row['curl_exit'],
                  'http_status': row['http_status'],
                  'ttfb_seconds': row['ttfb_seconds'],
                  'total_seconds': row['total_seconds'],
                  'hcdn_challenge': row['hcdn_challenge'],
              }
              for name, row in rows.items()
          }, indent=2, sort_keys=True))
          PY

          {
            echo
            echo '## External MCP/OAuth hotpath diagnostic (read-only)'
            python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/mad4b-wpml-external/mcp-hotpath/diagnostic.json').read_text(encoding='utf-8'))
          for name,row in d['targets'].items():
              print(f"- {name}: HTTP {row['http_status']} · curl {row['curl_exit']} · TTFB {row['ttfb_seconds']}s · total {row['total_seconds']}s · hCDN challenge {str(row['hcdn_challenge']).lower()}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve hCDN challenge with bounded browser fallback
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/mad4b-wpml-external

          challenge_required="$(python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/mad4b-wpml-external')
          d = json.loads((root / 'diagnostic.json').read_text(encoding='utf-8'))
          bodies = []
          for name in ('wpml.body', 'rest-index.body'):
              p = root / name
              if p.is_file():
                  bodies.append(p.read_text(encoding='utf-8', errors='replace'))
          challenged = (
              not d.get('accepted')
              and (d.get('wpml_http_status') == 403 or d.get('rest_index_http_status') == 403)
              and any('/hcdn-cgi/jschallenge' in body or 'Checking your browser before accessing' in body for body in bodies)
          )
          print('1' if challenged else '0')
          PY
          )"

          if [ "$challenge_required" != "1" ]; then
            echo "No hCDN JavaScript challenge detected; preserving raw diagnostic result."
            exit 0
          fi

          npm install --prefix "$out" --no-save --no-package-lock playwright@1.55.0
          "$out/node_modules/.bin/playwright" install --with-deps chromium

          cat > "$out/browser-fallback.mjs" <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium } from 'playwright';

          const out = '/tmp/mad4b-wpml-external';
          const sourceSha = String(process.env.SOURCE_SHA || '');
          const wpmlUrl = String(process.env.WPML_URL_BASE || '') + '&mad4b_probe=' + encodeURIComponent(sourceSha) + '&mad4b_transport=browser';
          const restUrl = String(process.env.REST_INDEX_URL || '') + '?mad4b_probe=' + encodeURIComponent(sourceSha) + '&mad4b_transport=browser';

          if (!/^https:\/\/staging\.egypttourgates\.com\//.test(wpmlUrl) || !/^https:\/\/staging\.egypttourgates\.com\//.test(restUrl)) {
            throw new Error('browser_fallback_target_outside_fixed_staging_origin');
          }

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
            extraHTTPHeaders: {
              'Accept-Language': 'en-US,en;q=0.9',
              'Cache-Control': 'no-cache, no-store, max-age=0',
              'Pragma': 'no-cache'
            }
          });

          const challengeRe = /\/hcdn-cgi\/jschallenge|Checking your browser before accessing/i;

          async function capture(name, url) {
            const page = await context.newPage();
            let response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
            let challengeObserved = false;

            for (let i = 0; i < 4; i++) {
              const html = await page.content();
              if (!challengeRe.test(html)) break;
              challengeObserved = true;
              await page.waitForTimeout(4500);
              response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
            }

            const html = await page.content();
            if (challengeRe.test(html)) {
              await page.close();
              throw new Error('hcdn_browser_challenge_not_resolved:' + name);
            }

            const text = await page.locator('body').innerText({ timeout: 10000 }).catch(() => '');
            const status = response ? response.status() : 0;
            const headers = response ? await response.allHeaders() : {};
            fs.writeFileSync(path.join(out, name + '.body'), text, 'utf8');
            fs.writeFileSync(
              path.join(out, name + '.headers'),
              Object.entries(headers).map(([k,v]) => k + ': ' + v).join('\n') + '\n',
              'utf8'
            );
            fs.writeFileSync(path.join(out, name + '.http-status'), String(status) + '\n', 'utf8');
            fs.writeFileSync(path.join(out, name + '.curl-exit'), '0\n', 'utf8');
            fs.writeFileSync(path.join(out, name + '.stderr'), '', 'utf8');
            await page.close();
            return { status, text, challengeObserved };
          }

          try {
            const wpmlCapture = await capture('wpml', wpmlUrl);
            const restCapture = await capture('rest-index', restUrl);

            let namespacePresent = false;
            let routePresent = false;
            let restIndexParseError = '';
            try {
              const data = JSON.parse(restCapture.text);
              const namespaces = data && typeof data === 'object' && Array.isArray(data.namespaces) ? data.namespaces : [];
              const routes = data && typeof data === 'object' && data.routes && typeof data.routes === 'object' ? data.routes : {};
              namespacePresent = namespaces.includes('wpml/v1');
              routePresent = Object.prototype.hasOwnProperty.call(routes, '/wpml/v1/rest/status');
            } catch (error) {
              restIndexParseError = String(error?.name || 'Error') + ': ' + String(error?.message || error);
            }

            let wpmlParseError = '';
            let wpmlStatus = '';
            let wpmlGetParameters = '';
            let wpmlSuccessEnvelope = false;
            try {
              const parsed = JSON.parse(wpmlCapture.text);
              let payload = parsed;
              if (parsed && typeof parsed === 'object' && parsed.success === true && parsed.data && typeof parsed.data === 'object') {
                payload = parsed.data;
                wpmlSuccessEnvelope = true;
              }
              if (payload && typeof payload === 'object') {
                wpmlStatus = String(payload.status || '');
                wpmlGetParameters = String(payload.get_parameters || '');
              }
            } catch (error) {
              wpmlParseError = String(error?.name || 'Error') + ': ' + String(error?.message || error);
            }

            const compatible = wpmlStatus === 'valid' && wpmlGetParameters === 'valid';
            const accepted = (
              wpmlCapture.status >= 200 && wpmlCapture.status < 300
              && restCapture.status >= 200 && restCapture.status < 300
              && namespacePresent
              && routePresent
              && compatible
            );

            const evidence = {
              contract: 'mad4b.wpml-external-http-diagnostic.v4',
              source_sha: sourceSha,
              attempt: 'browser_fallback',
              capture_mode: 'headless_browser_after_hcdn_challenge',
              browser_challenge_observed: Boolean(wpmlCapture.challengeObserved || restCapture.challengeObserved),
              target_url: wpmlUrl,
              rest_index_url: restUrl,
              transport_state: 'reachable',
              transport_reachable: true,
              wpml_curl_exit: 0,
              rest_index_curl_exit: 0,
              wpml_http_status: wpmlCapture.status,
              rest_index_http_status: restCapture.status,
              namespace_present: namespacePresent,
              route_present: routePresent,
              rest_index_parse_error: restIndexParseError,
              wpml_parse_error: wpmlParseError,
              wpml_success_envelope: wpmlSuccessEnvelope,
              wpml_status: wpmlStatus,
              wpml_get_parameters: wpmlGetParameters,
              wpml_contract_compatible: compatible,
              mutation_performed: false,
              accepted,
              diagnostic_outcome: accepted ? 'accepted_evidence' : 'reachable_contract_failure',
              inconclusive: false,
              acceptance_authorized: false,
              authority_granted: false
            };
            fs.writeFileSync(path.join(out, 'diagnostic.json'), JSON.stringify(evidence, null, 2) + '\n', 'utf8');
          } finally {
            await context.close();
            await browser.close();
          }
          JS

          node "$out/browser-fallback.mjs"

          {
            echo
            echo '### hCDN browser fallback'
            echo "capture mode: $(python3 -c 'import json; print(json.load(open("/tmp/mad4b-wpml-external/diagnostic.json")).get("capture_mode","raw_http"))')"
            echo "WPML HTTP status: $(cat "$out/wpml.http-status")"
            echo "REST index HTTP status: $(cat "$out/rest-index.http-status")"
            echo "accepted: $(python3 -c 'import json; print(str(json.load(open("/tmp/mad4b-wpml-external/diagnostic.json")).get("accepted",False)).lower())')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw read-only HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mad4b-wpml-external-http-${{ env.SOURCE_SHA }}
          path: /tmp/mad4b-wpml-external/
          if-no-files-found: error
          retention-days: 14

      - name: Validate external WPML contract after retained evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('/tmp/mad4b-wpml-external/diagnostic.json').read_text(encoding='utf-8'))
          if evidence.get('contract') != 'mad4b.wpml-external-http-diagnostic.v4':
              raise SystemExit('WPML external diagnostic contract mismatch')
          if evidence.get('mutation_performed') is not False:
              raise SystemExit('WPML external diagnostic violated read-only boundary')
          if evidence.get('acceptance_authorized') is not False or evidence.get('authority_granted') is not False:
              raise SystemExit('Raw WPML HTTP diagnostic must never self-authorize acceptance or authority')
          state = evidence.get('transport_state')
          if state == 'transport_unreachable':
              if evidence.get('accepted') or not evidence.get('inconclusive'):
                  raise SystemExit('Transport-unreachable WPML evidence was misclassified')
              print('mad4b.wpml-external-http-diagnostic.v4: INCONCLUSIVE transport_unreachable; acceptance remains false')
              raise SystemExit(0)
          if state != 'reachable':
              raise SystemExit('WPML external diagnostic transport state is invalid: ' + repr(state))
          if not evidence.get('namespace_present') or not evidence.get('route_present'):
              raise SystemExit('WPML REST namespace/route is missing on a reachable endpoint after 3 attempts')
          if not evidence.get('wpml_contract_compatible'):
              raise SystemExit('WPML external contract failed on a reachable endpoint: status/get_parameters must both be valid')
          if not evidence.get('accepted'):
              raise SystemExit('Reachable WPML evidence did not become an accepted evidence candidate')
          print('mad4b.wpml-external-http-acceptance.v5: PASS')
          PY

      - name: Validate MCP and OAuth hotpath latency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/mad4b-wpml-external/mcp-hotpath/diagnostic.json')
          evidence = json.loads(path.read_text(encoding='utf-8'))
          if evidence.get('contract') != 'mad4b.external-mcp-hotpath-diagnostic.v1':
              raise SystemExit('external MCP hotpath diagnostic contract mismatch')
          if evidence.get('read_only') is not True or evidence.get('mutation_performed') is not False:
              raise SystemExit('external MCP hotpath diagnostic violated read-only boundary')
          if evidence.get('authority_granted') is not False:
              raise SystemExit('external MCP hotpath diagnostic must never grant authority')

          targets = evidence.get('targets') or {}
          expected = {
              'runtime-build': {200},
              'rest-index': {200},
              'mcp-chatgpt': {200, 400, 401, 405},
              'oauth-protected-resource': {200},
              'oauth-authorization-server': {200},
              'oauth-jwks': {200},
          }
          failures = []
          for name, allowed in expected.items():
              row = targets.get(name) or {}
              curl_exit = int(row.get('curl_exit', -1))
              status = int(row.get('http_status', 0))
              total = row.get('total_seconds')
              if curl_exit != 0:
                  failures.append(f'{name}:curl_exit={curl_exit}')
              if status not in allowed:
                  failures.append(f'{name}:http_status={status}:allowed={sorted(allowed)}')
              if row.get('hcdn_challenge'):
                  failures.append(f'{name}:hcdn_browser_challenge')
              if total is None or float(total) > 8.0:
                  failures.append(f'{name}:total_seconds={total}')

          def parse_build(text):
              fields = {}
              for line in text.splitlines():
                  if '=' in line:
                      key, value = line.split('=', 1)
                      fields[key.strip()] = value.strip()
              return fields

          live_build_path = Path('/tmp/mad4b-wpml-external/mcp-hotpath/runtime-build.body')
          live_build_text = live_build_path.read_text(encoding='utf-8', errors='replace') if live_build_path.is_file() else ''
          live_build = parse_build(live_build_text)

          expected_build_path = Path('wp-content/plugins/mad4b-site-control-plane/MAD4B-RUNTIME-BUILD.txt')
          expected_build_text = expected_build_path.read_text(encoding='utf-8')
          expected_build = parse_build(expected_build_text)

          if live_build.get('contract') != expected_build.get('contract'):
              failures.append(
                  'runtime-build:contract_mismatch:live=' + repr(live_build.get('contract'))
                  + ':expected=' + repr(expected_build.get('contract'))
              )
          if live_build.get('release') != expected_build.get('release'):
              failures.append(
                  'runtime-build:deployment_drift:live=' + repr(live_build.get('release'))
                  + ':expected=' + repr(expected_build.get('release'))
              )

          resource = (targets.get('oauth-protected-resource') or {}).get('json_payload')
          if not isinstance(resource, dict):
              failures.append('oauth-protected-resource:json_missing')
          else:
              if resource.get('resource') != 'https://staging.egypttourgates.com/wp-json/mcp/mad4b-chatgpt':
                  failures.append('oauth-protected-resource:resource_identity_mismatch')
              servers = resource.get('authorization_servers')
              if not isinstance(servers, list) or not servers:
                  failures.append('oauth-protected-resource:authorization_servers_missing')

          metadata = (targets.get('oauth-authorization-server') or {}).get('json_payload')
          if not isinstance(metadata, dict):
              failures.append('oauth-authorization-server:json_missing')
          else:
              if metadata.get('issuer') != 'https://staging.egypttourgates.com/oauth/mcp':
                  failures.append('oauth-authorization-server:issuer_mismatch')
              if metadata.get('jwks_uri') != 'https://staging.egypttourgates.com/oauth/mcp/jwks':
                  failures.append('oauth-authorization-server:jwks_uri_mismatch')

          jwks = (targets.get('oauth-jwks') or {}).get('json_payload')
          if not isinstance(jwks, dict) or not isinstance(jwks.get('keys'), list) or not jwks.get('keys'):
              failures.append('oauth-jwks:keys_missing')

          if failures:
              raise SystemExit('MCP/OAuth external hotpath diagnostic failed: ' + '; '.join(failures))

          print('mad4b.external-mcp-hotpath-diagnostic.v1: PASS')
          PY
