name: MAD4B Approval Console v2

on:
  push:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-schema.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-approval-tickets.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-approval-repository.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-approval-decision-admin.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/approval-console-v2-contract.py'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/schema-dbdelta-upgrade-contract.py'
      - 'wp-content/plugins/mad4b-site-control-plane/docs/APPROVAL-CONSOLE-V2.md'
      - '.github/workflows/mad4b-approval-console-v2.yml'
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-schema.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-approval-tickets.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-approval-repository.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-approval-decision-admin.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/approval-console-v2-contract.py'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/schema-dbdelta-upgrade-contract.py'
      - 'wp-content/plugins/mad4b-site-control-plane/docs/APPROVAL-CONSOLE-V2.md'
      - '.github/workflows/mad4b-approval-console-v2.yml'

permissions:
  contents: read

concurrency:
  group: mad4b-approval-console-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  approval-console-v2-contract:
    name: Approval Console v2 contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Lint approval runtime
        run: |
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-schema.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-approval-tickets.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-approval-repository.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-approval-decision-admin.php
      - name: Guard dbDelta installed-site upgrade visibility
        run: python3 wp-content/plugins/mad4b-site-control-plane/tests/schema-dbdelta-upgrade-contract.py
      - name: Guard read model, schema hot path and authority boundary
        run: python3 wp-content/plugins/mad4b-site-control-plane/tests/approval-console-v2-contract.py
