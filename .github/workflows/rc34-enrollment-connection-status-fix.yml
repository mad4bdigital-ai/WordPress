name: RC34 Enrollment Connection Status Fix

on:
  push:
    branches:
      - feat/dynamic-wordpress-skills-20260909
    paths:
      - .github/workflows/rc34-enrollment-connection-status-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynamic-wordpress-skills-20260909
          fetch-depth: 2

      - name: Guard exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'e8dda86d484c92f0a81c1b8d57b64400899e0a38'

      - name: Add enrollment transport to connection diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-connection-status.php')
          text = path.read_text(encoding='utf-8')

          def replace_exact(old, new, count=1):
              global text
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'expected {count} occurrence(s), found {actual}: {old!r}')
              text = text.replace(old, new, count)

          replace_exact(
              "count( MAD4B_SCP_Servers::expected_server_ids() ) : 6;",
              "count( MAD4B_SCP_Servers::expected_server_ids() ) : 7;"
          )
          replace_exact(
              "array( 'mad4b-read', 'mad4b-chatgpt', 'mad4b-content', 'mad4b-write', 'mad4b-admin', 'mad4b-breakglass' );",
              "array( 'mad4b-read', 'mad4b-chatgpt', 'mad4b-enrollment', 'mad4b-content', 'mad4b-write', 'mad4b-admin', 'mad4b-breakglass' );"
          )
          replace_exact(
              "\t\t\t'mad4b-chatgpt' => array( 'MAD4B_SCP_Servers', 'can_chatgpt_transport' ),\n\t\t\t'mad4b-content' => array( 'MAD4B_SCP_Servers', 'can_content_transport' ),",
              "\t\t\t'mad4b-chatgpt' => array( 'MAD4B_SCP_Servers', 'can_chatgpt_transport' ),\n\t\t\t'mad4b-enrollment' => array( 'MAD4B_SCP_Servers', 'can_enrollment_transport' ),\n\t\t\t'mad4b-content' => array( 'MAD4B_SCP_Servers', 'can_content_transport' ),"
          )
          replace_exact(
              "\t\tif ( 'mad4b-chatgpt' === $id ) return 'chatgpt-read';\n\t\tif ( 'mad4b-content' === $id ) return 'content';",
              "\t\tif ( 'mad4b-chatgpt' === $id ) return 'chatgpt-read';\n\t\tif ( 'mad4b-enrollment' === $id ) return 'enrollment';\n\t\tif ( 'mad4b-content' === $id ) return 'content';"
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify connection contracts
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          php -l "$root/includes/class-mad4b-scp-connection-status.php"
          python3 "$root/tests/connection-readiness-contract.py"
          grep -Fq "'mad4b-enrollment' => array( 'MAD4B_SCP_Servers', 'can_enrollment_transport' )" "$root/includes/class-mad4b-scp-connection-status.php"
          grep -Fq "if ( 'mad4b-enrollment' === \$id ) return 'enrollment';" "$root/includes/class-mad4b-scp-connection-status.php"
          git diff --check

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MAD4B'
          git config user.email 'mad4b.digital@gmail.com'
          git add wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-connection-status.php
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(connection): recognize enrollment transport'
          git push origin HEAD:feat/dynamic-wordpress-skills-20260909
