          unzip -p "$control_zip" 'mad4b-site-control-plane/config/functional-gap-policy.json' > "$stage/functional-gap-policy.from-zip.json"
          SOURCE_SHA="$SOURCE_SHA" python3 - "$stage/functional-gap-evidence.from-zip.json" "$stage/functional-gap-policy.from-zip.json" <<'PY'
          import hashlib,json,os,sys
          evidence=json.load(open(sys.argv[1],encoding='utf-8'))
          policy_raw=open(sys.argv[2],'rb').read()
          policy=json.loads(policy_raw)
          assert evidence.get('contract')=='mad4b.functional-gap-contract-evidence.v1'
          assert policy.get('contract')=='mad4b.functional-gap-policy.v1'
          assert evidence.get('source_commit_sha')==os.environ['SOURCE_SHA']
          assert evidence.get('policy_sha256')==hashlib.sha256(policy_raw).hexdigest()
          assert policy.get('promotion_authorized') is False
          assert all(row.get('promotion_authorized') is False for row in evidence.get('families',{}).values())
          print('provenance-bound zero-touch policy/evidence: PASS')
          PY

      - name: Verify package boundaries, provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          stage='/tmp/mad4b-install-kit'
          plugin='wp-content/plugins/mad4b-site-control-plane'
          main="$plugin/mad4b-site-control-plane.php"
          expected_version="$(sed -nE 's/^ \* Version: ([^ ]+).*/\1/p' "$main" | head -n1)"
          runtime_release="$(sed -nE 's/^release=(.+)$/\1/p' "$plugin/MAD4B-RUNTIME-BUILD.txt" | head -n1)"
          test -n "$expected_version"
          test -n "$runtime_release"
          test "$expected_version" = "$runtime_release"
          export MAD4B_EXPECTED_VERSION="$expected_version"

          control_zip="$(find "$stage" -maxdepth 1 -name 'mad4b-site-control-plane-*.zip' -print -quit)"
          test -n "$control_zip"
          unzip -tqq "$control_zip"
          unzip -l "$control_zip" | grep -Fq 'mad4b-site-control-plane/config/certified-providers.json'
          unzip -l "$control_zip" | grep -Fq 'mad4b-site-control-plane/config/site-profile-presets.json'
          unzip -l "$control_zip" | grep -Fq 'mad4b-site-control-plane/config/functional-gap-contract-evidence.generated.json'
          unzip -l "$control_zip" | grep -Fq 'mad4b-site-control-plane/config/functional-gap-policy.json'
          unzip -l "$control_zip" | grep -Fq 'mad4b-site-control-plane/mad4b-site-control-plane.php'
          unzip -l "$control_zip" | grep -Fq 'mad4b-site-control-plane/MAD4B-BUILD-PROVENANCE.json'
          unzip -l "$control_zip" | grep -Fq 'mad4b-site-control-plane/includes/class-mad4b-scp-staging-write-authority.php'
          unzip -l "$control_zip" | grep -Fq 'mad4b-site-control-plane/includes/class-mad4b-scp-full-staging-authority.php'
          unzip -l "$control_zip" | grep -Fq 'mad4b-site-control-plane/includes/class-mad4b-scp-staging-write-planning-guard.php'
          unzip -l "$control_zip" | grep -Fq 'mad4b-site-control-plane/includes/class-mad4b-scp-write-runtime-certification.php'
          unzip -l "$control_zip" | grep -Fq 'mad4b-site-control-plane/includes/class-mad4b-scp-rest-compatibility.php'
          unzip -l "$control_zip" | grep -Fq 'mad4b-site-control-plane/skill-seeds/wordpress-site-diagnostics/SKILL.md'
          if unzip -l "$control_zip" | grep -Fq 'mad4b-site-control-plane/tests/'; then
            echo 'Development tests must not ship in the staging plugin ZIP.' >&2
            exit 1
          fi
          if zipinfo -1 "$control_zip" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe absolute/parent path found in distributable ZIP.' >&2
            exit 1
          fi

          unzip -p "$control_zip" 'mad4b-site-control-plane/MAD4B-BUILD-PROVENANCE.json' > "$stage/MAD4B-BUILD-PROVENANCE.from-zip.json"
          cmp --silent "$stage/MAD4B-BUILD-PROVENANCE.json" "$stage/MAD4B-BUILD-PROVENANCE.from-zip.json"
          grep -Fq "\"source_commit_sha\": \"$SOURCE_SHA\"" "$stage/MAD4B-BUILD-PROVENANCE.json"
          grep -Fq '"contract": "mad4b.build-provenance.v1"' "$stage/MAD4B-BUILD-PROVENANCE.json"

          python3 - "$stage" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          stage = Path(sys.argv[1])
          p = json.loads((stage / 'MAD4B-BUILD-PROVENANCE.json').read_text(encoding='utf-8'))
          if p.get('source_commit_sha') != os.environ['SOURCE_SHA']:
              raise SystemExit('provenance source SHA mismatch')
          if p.get('control_plane_version') != os.environ['MAD4B_EXPECTED_VERSION']:
              raise SystemExit('provenance control-plane version mismatch')
          lines = []
          root = stage / 'package' / 'mad4b-site-control-plane'
          for entry in p.get('package_files', []):
              rel = entry['path']
              path = root / rel
              raw = path.read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              if len(raw) != int(entry['bytes']) or digest != entry['sha256']:
                  raise SystemExit(f'provenance file mismatch: {rel}')
              lines.append(f"{rel}\0{len(raw)}\0{digest}\n".encode())
          digest = hashlib.sha256(b''.join(sorted(lines))).hexdigest()
          if digest != p.get('package_manifest_digest'):
              raise SystemExit('provenance package manifest digest mismatch')
          adapter_sha = hashlib.sha256((stage / 'mcp-adapter-0.6.1.zip').read_bytes()).hexdigest()
          payload = f"mad4b.build-fingerprint.v1\n{p['control_plane_version']}\n{p['source_commit_sha']}\n{digest}\n0.6.1\n{adapter_sha}\n".encode()
          fingerprint = hashlib.sha256(payload).hexdigest()
          if fingerprint != p.get('build_fingerprint'):
              raise SystemExit('provenance build fingerprint mismatch')
          if (stage / 'BUILD-FINGERPRINT.txt').read_text().strip() != fingerprint:
              raise SystemExit('outer build fingerprint mismatch')
          rows={entry['path']:entry for entry in p.get('package_files', [])}
          for required in ('config/functional-gap-policy.json','config/functional-gap-contract-evidence.generated.json'):
              if required not in rows:
                  raise SystemExit(f'zero-touch provenance row missing: {required}')
          policy_raw=(root/'config/functional-gap-policy.json').read_bytes()
          evidence=json.loads((root/'config/functional-gap-contract-evidence.generated.json').read_text(encoding='utf-8'))
          policy_sha=hashlib.sha256(policy_raw).hexdigest()
          if evidence.get('policy_contract')!='mad4b.functional-gap-policy.v1':
              raise SystemExit('embedded evidence policy contract mismatch')
          if evidence.get('policy_sha256')!=policy_sha:
              raise SystemExit('embedded evidence policy SHA mismatch')
          print('provenance-bound zero-touch policy/evidence: PASS')
          print('provenance-bound General Distribution kit: PASS')
          PY

          grep -Fq "\"commit\": \"$SOURCE_SHA\"" "$stage/install-manifest.json"
          grep -Fq '"contract": "mad4b.site-control-plane.general-distribution-kit.v1"' "$stage/install-manifest.json"
          grep -Fq '"release_class": "general-distribution-release-candidate"' "$stage/install-manifest.json"
          grep -Fq '"tenant_binding_source": "explicit_site_profile_enrollment"' "$stage/install-manifest.json"
          grep -Fq '"runtime_authority_host_hardcoded": false' "$stage/install-manifest.json"
          grep -Fq '"runtime_provenance_bound": true' "$stage/install-manifest.json"
          grep -Fq '"tenant_neutral_runtime_authority": true' "$stage/install-manifest.json"
          grep -Fq '"zero_authority_fresh_install": true' "$stage/install-manifest.json"
          grep -Fq '"empty_tenant_presets": true' "$stage/install-manifest.json"
          grep -Fq '"explicit_site_profile_enrollment_required": true' "$stage/install-manifest.json"
          grep -Fq '"functional_gap_repository_evidence_embedded": true' "$stage/install-manifest.json"
          grep -Fq '"functional_gap_policy_bound_to_build_provenance": true' "$stage/install-manifest.json"
          grep -Fq '"contract": "mad4b.functional-gap-zero-touch.v1"' "$stage/install-manifest.json"
          grep -Fq '"promotion_authorized": false' "$stage/install-manifest.json"
          grep -Fq '"runtime_shell_required": false' "$stage/install-manifest.json"
          grep -Fq '"functional_gap_runtime_evidence_requires_no_shell": true' "$stage/install-manifest.json"
          grep -Fq '"all_runtime_eligible_nonreadonly_content_admin_actions_projected_to_mad4b_write": true' "$stage/install-manifest.json"
          grep -Fq '"provider_uncertified_write_actions_excluded_from_governed_write_surfaces": true' "$stage/install-manifest.json"
          grep -Fq '"normal_remote_writes_require_exact_one_time_approval": true' "$stage/install-manifest.json"
          grep -Fq '"context_ai_review_may_use_explicit_standing_delegation": true' "$stage/install-manifest.json"
          grep -Fq '"context_ai_review_standing_delegation_staging_only": true' "$stage/install-manifest.json"
          grep -Fq '"context_ai_review_standing_delegation_exact_agent_grant_budget_audit_required": true' "$stage/install-manifest.json"
          grep -Fq '"context_ai_review_standing_delegation_production_authorized": false' "$stage/install-manifest.json"
          grep -Fq '"approval_plan_bootstrap_governed_by_nhi_grant_budget": true' "$stage/install-manifest.json"
          grep -Fq '"local_rest_isolation_certified": true' "$stage/install-manifest.json"
          grep -Fq '"external_wpml_live_acceptance_required": true' "$stage/install-manifest.json"
          grep -Fq '"external_wpml_acceptance_not_claimed_by_local_runtime": true' "$stage/install-manifest.json"
          grep -Fq '"production_mutation_auto_enabled": false' "$stage/install-manifest.json"
          grep -Fq '"sbom_format": "CycloneDX-1.5"' "$stage/install-manifest.json"
          test -s "$stage/MAD4B-SBOM.cdx.json"
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.5"' "$stage/MAD4B-SBOM.cdx.json" >/dev/null
          grep -Fq 'mad4b-site-control-plane-general-distribution-kit-{exact_head_sha}' "$stage/package/mad4b-site-control-plane/config/staging-deployment-handoff.json"
          grep -Fq "Current plugin version: **${expected_version}**." "$stage/package/mad4b-site-control-plane/README.md"
          grep -Fq 'nine MAD4B custom servers' "$stage/package/mad4b-site-control-plane/README.md"
          if grep -Fq 'Egypt Tour Gates' "$stage/package/mad4b-site-control-plane/README.md" || grep -Fq 'staging.egypttourgates.com' "$stage/package/mad4b-site-control-plane/README.md"; then
            echo 'General Distribution README retained tenant-specific identity.' >&2
            exit 1
          fi
          grep -Fq '"elementor_bounded_reversible_write_requires_exact_provider_certification": true' "$stage/install-manifest.json"
          ( cd "$stage" && sha256sum --check --strict SHA256SUMS )

      - name: Attest General Distribution release subjects
        id: release_attest
        uses: actions/attest@v4
        with:
          subject-path: |
            /tmp/mad4b-install-kit/mad4b-site-control-plane-*.zip
            /tmp/mad4b-install-kit/mcp-adapter-0.6.1.zip
            /tmp/mad4b-install-kit/MAD4B-BUILD-PROVENANCE.json
            /tmp/mad4b-install-kit/install-manifest.json
            /tmp/mad4b-install-kit/SHA256SUMS

      - name: Persist release attestation evidence
        shell: bash
        env:
          ATTESTATION_ID: ${{ steps.release_attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.release_attest.outputs.attestation-url }}
          ATTESTATION_BUNDLE: ${{ steps.release_attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          stage='/tmp/mad4b-install-kit'
          test -n "$ATTESTATION_ID"
          test -n "$ATTESTATION_URL"
          test -f "$ATTESTATION_BUNDLE"
          cp "$ATTESTATION_BUNDLE" "$stage/RELEASE-ATTESTATION.sigstore.json"
          export RELEASE_ATTESTATION_BUNDLE_SHA256="$(sha256sum "$stage/RELEASE-ATTESTATION.sigstore.json" | awk '{print $1}')"
          if [ "$GITHUB_REF" = 'refs/heads/master' ] && { [ "$GITHUB_EVENT_NAME" = 'push' ] || [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; }; then
            export RELEASE_ATTESTATION_TRUST_ROLE='release_package_attestation'
            export RELEASE_ATTESTATION_TRUSTED_ROOT='true'
          else
            export RELEASE_ATTESTATION_TRUST_ROLE='candidate_build_attestation'
            export RELEASE_ATTESTATION_TRUSTED_ROOT='false'
          fi
          python3 - "$stage" <<'PY'
          import json, os, sys
          from pathlib import Path

          stage = Path(sys.argv[1])
          trusted_root = os.environ['RELEASE_ATTESTATION_TRUSTED_ROOT'] == 'true'
          locator = {
              'contract': 'mad4b.release-attestation-locator.v1',
              'trust_role': os.environ['RELEASE_ATTESTATION_TRUST_ROLE'],
              'trusted_release_root': trusted_root,
              'provider': 'github_actions_sigstore',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'source_commit_sha': os.environ['SOURCE_SHA'],
              'signer_ref': os.environ.get('GITHUB_REF', ''),
              'signer_event': os.environ.get('GITHUB_EVENT_NAME', ''),
              'attestation_id': os.environ['ATTESTATION_ID'],
              'attestation_url': os.environ['ATTESTATION_URL'],
              'bundle_file': 'RELEASE-ATTESTATION.sigstore.json',
              'bundle_sha256': os.environ['RELEASE_ATTESTATION_BUNDLE_SHA256'],
              'runtime_self_attestation_authoritative': False,
              'verification_boundary': 'external_release_verifier',
          }
          (stage / 'RELEASE-ATTESTATION-LOCATOR.json').write_text(
              json.dumps(locator, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          test "$(jq -r '.source_commit_sha' "$stage/RELEASE-ATTESTATION-LOCATOR.json")" = "$SOURCE_SHA"
          test "$(jq -r '.provider' "$stage/RELEASE-ATTESTATION-LOCATOR.json")" = 'github_actions_sigstore'
          test "$(jq -r '.runtime_self_attestation_authoritative' "$stage/RELEASE-ATTESTATION-LOCATOR.json")" = 'false'
          test "$(jq -r '.signer_ref' "$stage/RELEASE-ATTESTATION-LOCATOR.json")" = "$GITHUB_REF"
          test "$(jq -r '.signer_event' "$stage/RELEASE-ATTESTATION-LOCATOR.json")" = "$GITHUB_EVENT_NAME"
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            test "$(jq -r '.trust_role' "$stage/RELEASE-ATTESTATION-LOCATOR.json")" = 'candidate_build_attestation'
            test "$(jq -r '.trusted_release_root' "$stage/RELEASE-ATTESTATION-LOCATOR.json")" = 'false'
          fi

      - name: Verify trusted master release root externally
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stage='/tmp/mad4b-install-kit'
          control_archive="$(find "$stage" -maxdepth 1 -type f -name 'mad4b-site-control-plane-*.zip' -print -quit)"
          test -n "$control_archive"
          test -f "$stage/RELEASE-ATTESTATION.sigstore.json"
          test -f "$stage/RELEASE-ATTESTATION-LOCATOR.json"
          test -f "$stage/install-manifest.json"

          jq -e '
            .trust_role == "release_package_attestation"
            and .trusted_release_root == true
            and .signer_ref == "refs/heads/master"
            and (.signer_event == "push" or .signer_event == "workflow_dispatch")
            and .runtime_self_attestation_authoritative == false
            and .verification_boundary == "external_release_verifier"
          ' "$stage/RELEASE-ATTESTATION-LOCATOR.json" >/dev/null

          python3 tools/verify_release_root_trust.py \
            --artifact "$control_archive" \
            --bundle "$stage/RELEASE-ATTESTATION.sigstore.json" \
            --install-manifest "$stage/install-manifest.json" \
            --expected-source-sha "$SOURCE_SHA" \
            --trusted-signer-digest "$GITHUB_SHA" \
            --output "$stage/RELEASE-ROOT-TRUST-VERIFICATION.json"

          jq -e '
            .contract == "mad4b.release-root-trust-verification.v1"
            and .verified == true
            and .attestation_verified == true
            and .runtime_self_attestation_authoritative == false
            and .verification_boundary == "external_release_verifier"
            and .source_commit_sha == env.SOURCE_SHA
            and .trusted_signer_ref == "refs/heads/master"
            and (.trusted_signer_event == "push" or .trusted_signer_event == "workflow_dispatch")
            and .trusted_runner_environment == "github-hosted"
          ' "$stage/RELEASE-ROOT-TRUST-VERIFICATION.json" >/dev/null

      - name: Upload reviewed General Distribution installation kit
