          test "$api_digest" = "$expected_digest"
          test "$(jq -r '.workflow_run.head_sha' <<<"$api")" = "$SOURCE_SHA"
          control_zip="$(find "$stage" -maxdepth 1 -name 'mad4b-site-control-plane-*.zip' -print -quit)"
          python3 - "$stage" "$ARTIFACT_ID" "$expected_digest" "$(basename "$control_zip")" <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          stage=Path(sys.argv[1])
          receipt={
              'contract':'mad4b.github-artifact-receipt.v1',
              'repository':os.environ.get('GITHUB_REPOSITORY',''),
              'source_commit_sha':os.environ['SOURCE_SHA'],
              'workflow':os.environ.get('GITHUB_WORKFLOW',''),
              'workflow_run_id':os.environ.get('GITHUB_RUN_ID',''),
              'distribution_artifact_id':int(sys.argv[2]),
              'distribution_artifact_name':'mad4b-site-control-plane-general-distribution-kit-'+os.environ['SOURCE_SHA'],
              'distribution_artifact_sha256':sys.argv[3],
              'control_plane_archive':sys.argv[4],
              'control_plane_archive_sha256':hashlib.sha256((stage/sys.argv[4]).read_bytes()).hexdigest(),
              'mcp_adapter_sha256':hashlib.sha256((stage/'mcp-adapter-0.6.1.zip').read_bytes()).hexdigest(),
              'sbom_sha256':hashlib.sha256((stage/'MAD4B-SBOM.cdx.json').read_bytes()).hexdigest(),
              'build_fingerprint':(stage/'BUILD-FINGERPRINT.txt').read_text().strip(),
              'package_manifest_digest':(stage/'PACKAGE-MANIFEST-DIGEST.txt').read_text().strip(),
              'github_api_verified':True,
              'runtime_binding_note':'Runtime binds installed bytes through package_manifest_digest/build_fingerprint; outer artifact digest is verified externally to avoid recursive self-hashing.',
          }
          (stage/'MAD4B-GITHUB-ARTIFACT-RECEIPT.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Upload GitHub artifact receipt
        uses: actions/upload-artifact@v4
        with:
          name: mad4b-site-control-plane-github-artifact-receipt-${{ env.SOURCE_SHA }}
          path: /tmp/mad4b-install-kit/MAD4B-GITHUB-ARTIFACT-RECEIPT.json
          if-no-files-found: error
          retention-days: 30
