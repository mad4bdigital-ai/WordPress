          policy=json.loads(policy_raw)
          assert evidence.get('contract')=='mad4b.functional-gap-contract-evidence.v1'
          assert policy.get('contract')=='mad4b.functional-gap-policy.v1'
          assert evidence.get('source_commit_sha')==os.environ['SOURCE_SHA']
          assert evidence.get('policy_sha256')==hashlib.sha256(policy_raw).hexdigest()
          assert policy.get('promotion_authorized') is False
          assert all(row.get('promotion_authorized') is False for row in evidence.get('families',{}).values())
          print('provenance-bound zero-touch policy/evidence: PASS')
          PY

      - name: Verify package boundaries, provenance and checksums
