  release-verdict:
    name: Repository release verdict
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Wait for exact-head critical checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          critical=(
            'Control-plane contract guard'
            'Dynamic Skills contract'
            'Dynamic Skills + governed write generic Staging runtime'
            'Dynamic Skills + write authority Production fail-closed runtime'
            'ChatGPT refresh request hotpath contract'
            'ChatGPT tools/list catalog performance contract'
            'Full Staging authority contract'
            'Governed execution fence (latest)'
            'One-time approval execution lifecycle (8.3)'
            'OAuth bridge runtime (latest)'
            'Verify parent artifact retention'
          )
          printf '%s\n' "${critical[@]}" > /tmp/mad4b-critical-checks.txt
          for attempt in $(seq 1 120); do
            gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100&page=1" > /tmp/checks-1.json
            gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100&page=2" > /tmp/checks-2.json
            set +e
            python3 - /tmp/mad4b-critical-checks.txt /tmp/checks-1.json /tmp/checks-2.json <<'PY'
import json,sys
required=[x.strip() for x in open(sys.argv[1],encoding='utf-8') if x.strip()]
runs=[]
for path in sys.argv[2:]: runs.extend(json.load(open(path,encoding='utf-8')).get('check_runs',[]))
latest={}
for row in sorted(runs,key=lambda x:int(x.get('id',0))): latest[row.get('name','')]=row
failed=[]; pending=[]
for name in required:
    row=latest.get(name)
    if not row or row.get('status')!='completed': pending.append(name); continue
    if row.get('conclusion')!='success': failed.append((name,row.get('conclusion')))
if failed:
    print('critical failures:',failed); raise SystemExit(1)
if pending:
    print('critical pending:',len(pending),pending[:5]); raise SystemExit(2)
print('all exact-head critical checks passed:',len(required))
PY
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then break; fi
            if [ "$rc" -eq 1 ]; then exit 1; fi
            if [ "$attempt" -eq 120 ]; then echo 'Timed out waiting for exact-head critical checks.' >&2; exit 1; fi
            sleep 10
          done

      - name: Emit repository release verdict
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100&page=1" > /tmp/checks-1.json
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100&page=2" > /tmp/checks-2.json
          artifact_name="mad4b-site-control-plane-general-distribution-kit-$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=100" > /tmp/artifacts.json
          python3 - /tmp/mad4b-critical-checks.txt /tmp/checks-1.json /tmp/checks-2.json /tmp/artifacts.json <<'PY'
import json,os,sys
required=[x.strip() for x in open(sys.argv[1],encoding='utf-8') if x.strip()]
runs=[]
for path in sys.argv[2:4]: runs.extend(json.load(open(path,encoding='utf-8')).get('check_runs',[]))
latest={}
for row in sorted(runs,key=lambda x:int(x.get('id',0))): latest[row.get('name','')]=row
critical={name:{'status':latest[name].get('status'),'conclusion':latest[name].get('conclusion'),'details_url':latest[name].get('details_url','')} for name in required}
live=latest.get('Live ETG managed browser acceptance')
if live and live.get('conclusion')=='success': live_state='accepted'
elif live and live.get('conclusion') in ('failure','cancelled','timed_out','action_required'): live_state='failed'
else: live_state='external_pending'
artifacts=json.load(open(sys.argv[4],encoding='utf-8')).get('artifacts',[])
exact=[a for a in artifacts if not a.get('expired') and (a.get('workflow_run') or {}).get('head_sha')==os.environ['SOURCE_SHA']]
exact=sorted(exact,key=lambda a:int(a.get('id',0)),reverse=True)
artifact=exact[0] if exact else {}
if not artifact: raise SystemExit('exact-head distribution artifact not found')
digest=str(artifact.get('digest',''))
if digest.startswith('sha256:'): digest=digest[7:]
if len(digest)!=64: raise SystemExit('distribution artifact digest missing/invalid')
verdict={
  'contract':'mad4b.repository-release-verdict.v1',
  'source_commit_sha':os.environ['SOURCE_SHA'],
  'critical_checks':critical,
  'critical_check_count':len(critical),
  'repository_release_ready':all(v['status']=='completed' and v['conclusion']=='success' for v in critical.values()),
  'distribution_artifact':{'id':artifact.get('id'),'name':artifact.get('name'),'sha256':digest,'workflow_run_id':(artifact.get('workflow_run') or {}).get('id'),'expired':artifact.get('expired',False)},
  'live_etg_managed_browser_acceptance':live_state,
  'live_performance_acceptance':'external_pending',
  'live_rollback_drill':'external_pending',
  'ready_for_review_authorized':False,
  'merge_authorized':False,
  'production_authorized':False,
  'owner_attestation_required_for_exact_head':True,
  'attestation_stale_on_descendant':True
}
open('MAD4B-RELEASE-VERDICT.json','w',encoding='utf-8').write(json.dumps(verdict,indent=2,sort_keys=True)+'\n')
print(json.dumps(verdict,indent=2,sort_keys=True))
PY

      - name: Upload exact-head release verdict
        uses: actions/upload-artifact@v4
        with:
          name: mad4b-release-verdict-${{ env.SOURCE_SHA }}
          path: MAD4B-RELEASE-VERDICT.json
          if-no-files-found: error
          retention-days: 30
