      - name: Verify GitHub artifact digest and emit distribution receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload_kit.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_kit.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          stage='/tmp/mad4b-install-kit'
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          api="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          api_digest="$(jq -r '.digest // ""' <<<"$api")"
          expected_digest="$ARTIFACT_DIGEST"
