          grep -Fq '"tenant_neutral_runtime_authority": true' "$stage/install-manifest.json"
          grep -Fq '"zero_authority_fresh_install": true' "$stage/install-manifest.json"
          grep -Fq '"empty_tenant_presets": true' "$stage/install-manifest.json"
          grep -Fq '"explicit_site_profile_enrollment_required": true' "$stage/install-manifest.json"
          grep -Fq '"functional_gap_repository_evidence_embedded": true' "$stage/install-manifest.json"
          grep -Fq '"functional_gap_policy_bound_to_build_provenance": true' "$stage/install-manifest.json"
          grep -Fq '"contract": "mad4b.functional-gap-zero-touch.v1"' "$stage/install-manifest.json"
          grep -Fq '"promotion_authorized": false' "$stage/install-manifest.json"
          grep -Fq '"runtime_shell_required": false' "$stage/install-manifest.json"
          grep -Fq '"functional_gap_runtime_evidence_requires_no_shell": true' "$stage/install-manifest.json"
          grep -Fq '"all_runtime_eligible_nonreadonly_content_admin_actions_projected_to_mad4b_write": true' "$stage/install-manifest.json"
          grep -Fq '"provider_uncertified_write_actions_excluded_from_governed_write_surfaces": true' "$stage/install-manifest.json"
          grep -Fq '"normal_remote_writes_require_exact_one_time_approval": true' "$stage/install-manifest.json"
          grep -Fq '"context_ai_review_may_use_explicit_standing_delegation": true' "$stage/install-manifest.json"
          grep -Fq '"context_ai_review_standing_delegation_staging_only": true' "$stage/install-manifest.json"
          grep -Fq '"context_ai_review_standing_delegation_exact_agent_grant_budget_audit_required": true' "$stage/install-manifest.json"
          grep -Fq '"context_ai_review_standing_delegation_production_authorized": false' "$stage/install-manifest.json"
