name: MAD4B Control Plane Package

on:
  pull_request:
    paths:
      - 'plugins/mad4b-wordpress/**'
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - 'wp-content/plugins/mcp-adapter.zip'
      - 'wp-content/plugins/*.zip'
      - 'tools/capture-functional-gap-contract-evidence.py'
      - 'wp-content/plugins/mad4b-site-control-plane/config/functional-gap-policy.json'
      - '.github/workflows/mad4b-control-plane-package.yml'
      - '.github/workflows/mad4b-live-acceptance-evidence.yml'
      - '.github/workflows/mad4b-release-verdict.yml'
      - '.github/workflows/feature-007-critical-kernel.yml'
  push:
    branches:
      - master
    paths:
      - 'plugins/mad4b-wordpress/**'
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - 'wp-content/plugins/mcp-adapter.zip'
      - 'wp-content/plugins/*.zip'
      - 'tools/capture-functional-gap-contract-evidence.py'
      - 'wp-content/plugins/mad4b-site-control-plane/config/functional-gap-policy.json'
      - '.github/workflows/mad4b-control-plane-package.yml'
      - '.github/workflows/mad4b-live-acceptance-evidence.yml'
      - '.github/workflows/mad4b-release-verdict.yml'
      - '.github/workflows/feature-007-critical-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  # Keep one active package run per PR/ref. A newer exact-head candidate cancels
  # superseded package work instead of allowing stale runs to remain live.
  group: mad4b-control-plane-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build reviewed General Distribution installation kit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Packaging exact source: $SOURCE_SHA"

      - name: Verify release-evidence trigger symmetry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/mad4b-control-plane-package.yml').read_text(encoding='utf-8').splitlines()

          def block(name):
              marker = f'  {name}:'
              start = lines.index(marker) + 1
              out = []
              for line in lines[start:]:
                  if line.startswith('  ') and not line.startswith('    ') and line.strip():
                      break
                  out.append(line)
              return out

          def paths_from(section):
              values = []
              in_paths = False
              for raw in section:
                  stripped = raw.strip()
                  if stripped == 'paths:':
                      in_paths = True
                      continue
                  if in_paths and stripped.startswith('- '):
                      values.append(stripped[2:].strip("'\""))
                  elif in_paths and stripped and not raw.startswith('      '):
                      break
              return values

          required = {
              '.github/workflows/mad4b-control-plane-package.yml',
              '.github/workflows/mad4b-live-acceptance-evidence.yml',
              '.github/workflows/mad4b-release-verdict.yml',
              '.github/workflows/feature-007-critical-kernel.yml',
          }
          for trigger in ('pull_request', 'push'):
              values = paths_from(block(trigger))
              missing = required - set(values)
              duplicates = sorted({value for value in values if values.count(value) > 1})
              if missing:
                  raise SystemExit(f'{trigger}: missing release-evidence cross-trigger(s): {sorted(missing)}')
              if duplicates:
                  raise SystemExit(f'{trigger}: duplicate path trigger(s): {duplicates}')
          if not any(line.strip() == '- master' for line in block('push')):
              raise SystemExit('master package push trigger missing')
          print('package release-evidence trigger symmetry: PASS')
          PY

      - name: Verify release candidate identity coherence
        shell: bash
        run: |
          set -euo pipefail
          python3 wp-content/plugins/mad4b-site-control-plane/tests/release-candidate-identity-contract.py

      - name: Verify Feature 007 release root-trust contract
        shell: bash
        run: |
          set -euo pipefail
          python3 wp-content/plugins/mad4b-site-control-plane/tests/release-root-trust-contract.py

      - name: Reject distributable symlinks and secret-like files
        shell: bash
        run: |
          set -euo pipefail
          plugin='wp-content/plugins/mad4b-site-control-plane'
          symlink="$(find "$plugin" -type l -print -quit)"
          if [ -n "$symlink" ]; then
            echo "Symlink is forbidden in the distributable Control Plane: $symlink" >&2
            exit 1
          fi
          suspicious="$(find "$plugin" -type f \( \
            -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.p12' -o \
            -name '*.pfx' -o -name '*.key' -o -name 'id_rsa' -o -name 'id_ed25519' \
          \) -print -quit)"
          if [ -n "$suspicious" ]; then
            echo "Secret-like file is forbidden in the distributable Control Plane: $suspicious" >&2
            exit 1
          fi
          if grep -RIlE --exclude-dir=tests -- '-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----' "$plugin" | grep -q .; then
            echo 'Embedded private-key material is forbidden in the distributable Control Plane.' >&2
            exit 1
          fi

      - name: PHP lint distributable plugin
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find wp-content/plugins/mad4b-site-control-plane -type f -name '*.php' -print0)

      - name: Verify canonical Skill seed package
        shell: bash
        run: |
          set -euo pipefail
          seed='wp-content/plugins/mad4b-site-control-plane/skill-seeds'
          expected=(
            wordpress-site-diagnostics
            wordpress-connection-diagnostics
            elementor-dynamic-content
            jetengine-content-modeling
            wordpress-archive-audit
            wordpress-change-safety
            wordpress-release-orchestration
            wordpress-browser-acceptance
            wordpress-content-authoring
          )
          test -d "$seed"
          test "$(find "$seed" -mindepth 2 -maxdepth 2 -type f -name SKILL.md | wc -l)" = '9'
          for name in "${expected[@]}"; do
            cmp --silent "$seed/$name/SKILL.md" "plugins/mad4b-wordpress/skills/$name/SKILL.md"
          done

      - name: Verify certified MCP Adapter asset
        shell: bash
        run: |
          set -euo pipefail
          expected='1c3cd47c32e99b4e7d8690a44a7890256e92a8b96f61776cbe1894e5483cf676'
          echo "$expected  wp-content/plugins/mcp-adapter.zip" | sha256sum --check --strict
          test "$(stat -c '%s' wp-content/plugins/mcp-adapter.zip)" = '455463'
          unzip -tqq wp-content/plugins/mcp-adapter.zip

      - name: Generate exact functional-gap repository evidence
        shell: bash
        run: |
          set -euo pipefail
          out='wp-content/plugins/mad4b-site-control-plane/config/functional-gap-contract-evidence.generated.json'
          python3 tools/capture-functional-gap-contract-evidence.py "$out"
          python3 - "$out" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          policy_path=Path('wp-content/plugins/mad4b-site-control-plane/config/functional-gap-policy.json')
          policy_raw=policy_path.read_bytes()
          policy=json.loads(policy_raw)
          expected={
              family for family,row in policy.get('families',{}).items()
              if row.get('repository_evidence') is True
          }
          if data.get('contract')!='mad4b.functional-gap-contract-evidence.v1':
              raise SystemExit('functional-gap evidence contract mismatch')
          if data.get('source_commit_sha')!=os.environ['SOURCE_SHA']:
              raise SystemExit('functional-gap evidence exact source mismatch')
          if data.get('policy_contract')!=policy.get('contract'):
              raise SystemExit('functional-gap evidence policy contract mismatch')
          if data.get('policy_sha256')!=hashlib.sha256(policy_raw).hexdigest():
              raise SystemExit('functional-gap evidence policy SHA mismatch')
          if set(data.get('families',{}))!=expected:
              raise SystemExit('functional-gap evidence family set mismatch')
          for family,row in data['families'].items():
              if row.get('promotion_authorized') is not False or row.get('evidence_only') is not True:
                  raise SystemExit(f'{family}: generated evidence became authorizing')
              for artifact in row.get('artifacts',[]):
                  tree=artifact.get('package_tree') or {}
                  if len(tree.get('tree_sha256',''))!=64 or int(tree.get('file_count',0))<1:
                      raise SystemExit(f'{family}: generated package tree evidence missing')
          print('build-embedded functional-gap evidence: PASS')
          PY


      - name: Verify tenant-neutral General Distribution kit invariants
        shell: bash
        run: |
          set -euo pipefail
          plugin='wp-content/plugins/mad4b-site-control-plane'
          write="$plugin/includes/class-mad4b-scp-staging-write-authority.php"
          planning="$plugin/includes/class-mad4b-scp-staging-write-planning-guard.php"
          cert="$plugin/includes/class-mad4b-scp-write-runtime-certification.php"
          rest="$plugin/includes/class-mad4b-scp-rest-compatibility.php"
          servers="$plugin/includes/class-mad4b-scp-servers.php"
          profile="$plugin/includes/class-mad4b-scp-site-profile.php"
          presets="$plugin/config/site-profile-presets.json"
          test -f "$write" -a -f "$planning" -a -f "$cert" -a -f "$rest" -a -f "$servers" -a -f "$profile" -a -f "$presets"
          grep -Fq "const CONTRACT = 'mad4b.governed-write-authority.v2'" "$write"
          grep -Fq "MAD4B_SCP_Site_Profile::origin_enrolled()" "$write"
          grep -Fq "MAD4B_SCP_Site_Profile::write_enabled()" "$write"
          grep -Fq "site_profile_unconfigured" "$write"
          grep -Fq "site_profile_write_disabled" "$write"
          grep -Fq "'production_auto_enable' => false" "$write"
          grep -Fq "'breakglass_auto_enable' => false" "$write"
          grep -Fq "'all_remote_writes_require_exact_approval' => false" "$write"
          grep -Fq "'normal_remote_writes_require_exact_approval' => true" "$write"
          grep -Fq "'remote_write_approval_policy' => 'exact_approval_with_bounded_standing_exceptions'" "$write"
          grep -Fq "'remote_write_prior_approval_exceptions' => array( self::CANDIDATE_BOOTSTRAP_ABILITY, 'mad4b/context-ai-review' )" "$write"
          grep -Fq "const CANDIDATE_BOOTSTRAP_ABILITY = 'mad4b/acceptance-target-provision'" "$write"
          grep -Fq "MAD4B_SCP_Agent_Registry::grant_ability" "$write"
          grep -Fq "'mad4b/database-raw-query' === \$ability_name" "$servers"
          grep -Fq "public static function blocked_write_tools" "$servers"
          grep -Fq "provider_runtime_contract_not_certified" "$servers"
          grep -Fq "mad4b.staging-write-planning-guard.v2" "$planning"
          grep -Fq "remote_planner_requires_exact_mad4b_write_grant" "$planning"
          grep -Fq "creates_pending_ticket_only" "$planning"
          grep -Fq "mad4b.write-runtime-certification.v3" "$cert"
          grep -Fq "approval_planner_bootstrap_exception" "$cert"
          grep -Fq "provider_uncertified_write_tools_safely_unmounted" "$cert"
          grep -Fq "mcp_recovery_scoped_to_mad4b_routes" "$cert"
          grep -Fq "external_wpml_acceptance_required" "$cert"
          grep -Fq "external_wpml_acceptance_verified" "$cert"
          if grep -Fq "\$checks['wpml_query_parameters_preserved']" "$cert" || grep -Fq "\$checks['wpml_internal_probe_ready_or_not_active']" "$cert"; then
            echo 'Local write certification must not depend on in-process WPML route availability.' >&2
            exit 1
          fi
          grep -Fq "mad4b.rest-compatibility.v2" "$rest"
          grep -Fq "hook_inventory( 'rest_enabled' )" "$rest"
          grep -Fq "hook_inventory( 'rest_authentication_errors' )" "$rest"
          if grep -Fq "add_filter( 'rest_enabled'" "$rest" || grep -Fq "add_filter( 'rest_authentication_errors'" "$rest"; then
            echo 'Control Plane REST compatibility code must not globally modify REST access.' >&2
            exit 1
          fi

          # The distributable binary and public package are tenant-neutral.
          # Fresh installation must carry no tenant preset and no implicit authority.
          if grep -Fq 'staging.egypttourgates.com' "$write" || grep -Fq 'egypttourgates.com' "$write"; then
            echo 'Governed write authority must remain tenant-neutral.' >&2
            exit 1
          fi
          python3 - "$presets" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1], encoding='utf-8'))
          if p.get('contract') != 'mad4b.site-profile-presets.v2':
              raise SystemExit('site profile preset contract mismatch')
          profiles = p.get('profiles', [])
          if not isinstance(profiles, list) or profiles:
              raise SystemExit('public General Distribution package must not bundle tenant presets')
          print('tenant-neutral empty public preset catalog: PASS')
          PY

      - name: Build provenance-bound control-plane ZIP and manifest
        shell: bash
        run: |
          set -euo pipefail
          plugin='wp-content/plugins/mad4b-site-control-plane'
          main="$plugin/mad4b-site-control-plane.php"
          version="$(sed -nE 's/^ \* Version: ([^ ]+).*/\1/p' "$main" | head -n1)"
          test -n "$version"

          stage="/tmp/mad4b-install-kit"
          rm -rf "$stage"
          mkdir -p "$stage/package/mad4b-site-control-plane"
          cp -a "$plugin"/. "$stage/package/mad4b-site-control-plane/"
          rm -rf "$stage/package/mad4b-site-control-plane/tests"
          cp wp-content/plugins/mcp-adapter.zip "$stage/mcp-adapter-0.6.1.zip"

          export MAD4B_CONTROL_VERSION="$version"
          export MAD4B_CONTROL_STAGE="$stage/package/mad4b-site-control-plane"
          export MAD4B_ADAPTER_SHA="$(sha256sum "$stage/mcp-adapter-0.6.1.zip" | awk '{print $1}')"
          test "$MAD4B_ADAPTER_SHA" = '1c3cd47c32e99b4e7d8690a44a7890256e92a8b96f61776cbe1894e5483cf676'

          python3 wp-content/plugins/mad4b-site-control-plane/tests/build-deterministic-control-plane-package.py \
            --root "$MAD4B_CONTROL_STAGE" \
            --output-zip "$stage/mad4b-site-control-plane-${version}.zip" \
            --version "$version" \
            --source-sha "$SOURCE_SHA" \
            --adapter-version "0.6.1" \
            --adapter-sha "$MAD4B_ADAPTER_SHA" \
            --provenance-output "$stage/MAD4B-BUILD-PROVENANCE.json" \
            --build-fingerprint-output "$stage/BUILD-FINGERPRINT.txt" \
            --manifest-digest-output "$stage/PACKAGE-MANIFEST-DIGEST.txt" \
            --receipt-output "$stage/CANONICAL-PACKAGE-RECEIPT.json"

          php -r '
          define("ABSPATH", rtrim($argv[1], "/") . "/");
          define("MAD4B_SCP_DIR", rtrim($argv[1], "/") . "/");
          if (!function_exists("sanitize_key")) {
              function sanitize_key($key) {
                  $key = strtolower((string) $key);
                  $key = preg_replace("/[^a-z0-9_\\-]/", "", $key);
                  return (string) $key;
              }
          }
          require MAD4B_SCP_DIR . "includes/class-mad4b-scp-functional-gap-evidence.php";
          $status = MAD4B_SCP_Functional_Gap_Evidence::package_integrity_status();
          if (empty($status["valid"])) {
              fwrite(STDERR, "Packaged runtime provenance verifier failed: " . json_encode($status, JSON_UNESCAPED_SLASHES) . PHP_EOL);
              exit(1);
          }
          if (($status["integrity_level"] ?? "") !== "self_consistent_package") {
              fwrite(STDERR, "Packaged runtime integrity level mismatch." . PHP_EOL);
              exit(2);
          }
          echo "mad4b.functional-gap-package-integrity.v1: PASS files=" . (int)($status["verified_file_count"] ?? 0) . " bytes=" . (int)($status["verified_bytes"] ?? 0) . PHP_EOL;
          ' "$MAD4B_CONTROL_STAGE"


          control_sha="$(sha256sum "$stage/mad4b-site-control-plane-${version}.zip" | awk '{print $1}')"
          adapter_sha="$MAD4B_ADAPTER_SHA"
          build_fingerprint="$(tr -d '\r\n' < "$stage/BUILD-FINGERPRINT.txt")"
          package_digest="$(tr -d '\r\n' < "$stage/PACKAGE-MANIFEST-DIGEST.txt")"
          export CONTROL_SHA="$control_sha" ADAPTER_SHA="$adapter_sha" BUILD_FINGERPRINT="$build_fingerprint" PACKAGE_DIGEST="$package_digest"

          python3 - "$stage" "$version" <<'PY'
          import json, os, sys, uuid
          from pathlib import Path
          stage = Path(sys.argv[1])
          version = sys.argv[2]
          source_sha = os.environ['SOURCE_SHA']
          bom = {
              'bomFormat': 'CycloneDX',
              'specVersion': '1.5',
              'serialNumber': 'urn:uuid:' + str(uuid.uuid5(uuid.NAMESPACE_URL, 'https://github.com/' + os.environ.get('GITHUB_REPOSITORY','') + '/commit/' + source_sha)),
              'version': 1,
              'metadata': {
                  'component': {
                      'type': 'application',
                      'name': 'mad4b-site-control-plane',
                      'version': version,
                      'hashes': [{'alg': 'SHA-256', 'content': os.environ['CONTROL_SHA']}],
                      'properties': [
                          {'name': 'mad4b:source_commit_sha', 'value': source_sha},
                          {'name': 'mad4b:build_fingerprint', 'value': os.environ['BUILD_FINGERPRINT']},
                          {'name': 'mad4b:package_manifest_digest', 'value': os.environ['PACKAGE_DIGEST']},
                      ],
                  }
              },
              'components': [
                  {
                      'type': 'library',
                      'name': 'wordpress-mcp-adapter',
                      'version': '0.6.1',
                      'hashes': [{'alg': 'SHA-256', 'content': os.environ['ADAPTER_SHA']}],
                  }
              ],
          }
          (stage / 'MAD4B-SBOM.cdx.json').write_text(json.dumps(bom, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          sbom_sha="$(sha256sum "$stage/MAD4B-SBOM.cdx.json" | awk '{print $1}')"
          export SBOM_SHA="$sbom_sha"

          printf '%s  %s\n' "$control_sha" "mad4b-site-control-plane-${version}.zip" > "$stage/SHA256SUMS"
          printf '%s  %s\n' "$adapter_sha" 'mcp-adapter-0.6.1.zip' >> "$stage/SHA256SUMS"
          printf '%s  %s\n' "$sbom_sha" 'MAD4B-SBOM.cdx.json' >> "$stage/SHA256SUMS"
          printf '%s  %s\n' "$(sha256sum "$stage/MAD4B-BUILD-PROVENANCE.json" | awk '{print $1}')" 'MAD4B-BUILD-PROVENANCE.json' >> "$stage/SHA256SUMS"
          printf '%s  %s\n' "$(sha256sum "$stage/BUILD-FINGERPRINT.txt" | awk '{print $1}')" 'BUILD-FINGERPRINT.txt' >> "$stage/SHA256SUMS"
          printf '%s  %s\n' "$(sha256sum "$stage/PACKAGE-MANIFEST-DIGEST.txt" | awk '{print $1}')" 'PACKAGE-MANIFEST-DIGEST.txt' >> "$stage/SHA256SUMS"
          printf '%s  %s\n' "$(sha256sum "$stage/CANONICAL-PACKAGE-RECEIPT.json" | awk '{print $1}')" 'CANONICAL-PACKAGE-RECEIPT.json' >> "$stage/SHA256SUMS"
          python3 - "$stage" "$version" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          stage = Path(sys.argv[1])
          version = sys.argv[2]
          config_root = stage / 'package' / 'mad4b-site-control-plane' / 'config'
          policy_raw = (config_root / 'functional-gap-policy.json').read_bytes()
          evidence_raw = (config_root / 'functional-gap-contract-evidence.generated.json').read_bytes()
          receipt_raw = (stage / 'CANONICAL-PACKAGE-RECEIPT.json').read_bytes()
          policy = json.loads(policy_raw)
          evidence = json.loads(evidence_raw)
          receipt = json.loads(receipt_raw)
          if receipt.get('contract') != 'mad4b.deterministic-control-plane-package.v1':
              raise SystemExit('canonical package receipt contract mismatch')
          if receipt.get('archive_format_contract') != 'mad4b.deterministic-zip.v1' or receipt.get('archive_compression') != 'stored':
              raise SystemExit('canonical archive format mismatch')
          if receipt.get('source_commit_sha') != os.environ['SOURCE_SHA']:
              raise SystemExit('canonical package receipt source mismatch')
          if receipt.get('archive_sha256') != os.environ['CONTROL_SHA']:
              raise SystemExit('canonical package receipt archive SHA mismatch')
          if receipt.get('build_fingerprint') != os.environ['BUILD_FINGERPRINT']:
              raise SystemExit('canonical package receipt build fingerprint mismatch')
          if receipt.get('package_manifest_digest') != os.environ['PACKAGE_DIGEST']:
              raise SystemExit('canonical package receipt manifest mismatch')
          data = {
              'contract': 'mad4b.site-control-plane.general-distribution-kit.v1',
              'repository': os.environ.get('GITHUB_REPOSITORY'),
              'commit': os.environ.get('SOURCE_SHA'),
              'release_class': 'general-distribution-release-candidate',
              'tenant_binding_required': True,
              'tenant_binding_source': 'explicit_site_profile_enrollment',
              'runtime_authority_host_hardcoded': False,
              'build_fingerprint': os.environ['BUILD_FINGERPRINT'],
              'package_manifest_digest': os.environ['PACKAGE_DIGEST'],
              'control_plane': {
                  'version': version,
                  'archive': f'mad4b-site-control-plane-{version}.zip',
                  'sha256': os.environ['CONTROL_SHA'],
                  'provenance_contract': 'mad4b.build-provenance.v1',
              },
              'canonical_package': {
                  'contract': receipt.get('contract', ''),
                  'archive_format_contract': receipt.get('archive_format_contract', ''),
                  'archive_compression': receipt.get('archive_compression', ''),
                  'archive_sha256': receipt.get('archive_sha256', ''),
                  'receipt_sha256': hashlib.sha256(receipt_raw).hexdigest(),
                  'producer_metadata_external': bool(receipt.get('producer_metadata_external')),
                  'deterministic_archive': bool(receipt.get('deterministic_archive')),
              },
              'mcp_adapter': {
                  'version': '0.6.1',
                  'archive': 'mcp-adapter-0.6.1.zip',
                  'sha256': os.environ['ADAPTER_SHA'],
                  'official_release_sha256': '1c3cd47c32e99b4e7d8690a44a7890256e92a8b96f61776cbe1894e5483cf676',
              },
              'supply_chain': {
                  'sbom_format': 'CycloneDX-1.5',
                  'sbom_file': 'MAD4B-SBOM.cdx.json',
                  'sbom_sha256': os.environ['SBOM_SHA'],
                  'github_artifact_digest_receipt_external': True,
                  'runtime_package_manifest_is_canonical_installed_bytes_identity': True,
              },
              'functional_gap_zero_touch': {
                  'contract': 'mad4b.functional-gap-zero-touch.v1',
                  'policy_contract': policy.get('contract', ''),
                  'policy_sha256': hashlib.sha256(policy_raw).hexdigest(),
                  'evidence_contract': evidence.get('contract', ''),
                  'evidence_sha256': hashlib.sha256(evidence_raw).hexdigest(),
                  'promotion_authorized': False,
                  'runtime_shell_required': False,
              },
              'install_order': ['mcp-adapter-0.6.1.zip', f'mad4b-site-control-plane-{version}.zip'],
              'reviewed_invariants': {
                  'exact_source_bound': True,
                  'runtime_provenance_bound': True,
                  'php_linted': True,
                  'symlinks_denied': True,
                  'secret_like_files_denied': True,
                  'canonical_skill_seed_parity': True,
                  'development_tests_excluded': True,
                  'tenant_neutral_runtime_authority': True,
                  'zero_authority_fresh_install': True,
                  'empty_tenant_presets': True,
                  'explicit_site_profile_enrollment_required': True,
                  'functional_gap_repository_evidence_embedded': True,
                  'functional_gap_policy_bound_to_build_provenance': True,
                  'functional_gap_runtime_evidence_requires_no_shell': True,
                  'all_runtime_eligible_nonreadonly_content_admin_actions_projected_to_mad4b_write': True,
                  'provider_uncertified_write_actions_excluded_from_governed_write_surfaces': True,
