name: MAD4B Page Dependency Cache Contract
on:
  pull_request:
    paths:
      - 'wp-content/mu-plugins/mad4b-page-dependency-cache.php'
      - 'tests/test_mad4b_page_dependency_cache_v1.php'
      - 'docs/MAD4B-PAGE-DEPENDENCY-CACHE-V1.md'
      - '.github/workflows/mad4b-page-dependency-cache-v1.yml'
  push:
    branches: [master]
    paths:
      - 'wp-content/mu-plugins/mad4b-page-dependency-cache.php'
      - 'tests/test_mad4b_page_dependency_cache_v1.php'
      - '.github/workflows/mad4b-page-dependency-cache-v1.yml'
permissions:
  contents: read
jobs:
  page-dependency-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax
        run: |
          php -l wp-content/mu-plugins/mad4b-page-dependency-cache.php
          php -l tests/test_mad4b_page_dependency_cache_v1.php
      - name: Isolated graph/selector tests
        shell: bash
        run: |
          set -euo pipefail
          MAD4B_PAGE_DEP_FILE="$PWD/wp-content/mu-plugins/mad4b-page-dependency-cache.php" \
          php tests/test_mad4b_page_dependency_cache_v1.php
