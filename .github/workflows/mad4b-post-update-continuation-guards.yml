name: MAD4B Post Update Continuation Guards

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - 'tools/connection-edge-acceptance.mjs'
      - '.github/workflows/connection-edge-acceptance.yml'
      - '.github/workflows/mad4b-post-update-continuation-guards.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-post-update-continuation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Continuation authorization guards (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify delegated authority and atomic consumption
        run: php wp-content/plugins/mad4b-site-control-plane/tests/post-update-continuation-guards-runtime.php
      - name: Verify bootstrap self-update continuation classification
        run: php wp-content/plugins/mad4b-site-control-plane/tests/self-update-continuation-policy-runtime.php
      - name: Verify runtime maintenance preflight classifications
        run: php wp-content/plugins/mad4b-site-control-plane/tests/runtime-maintenance-lease-runtime.php
      - name: Verify actual MCP catalog and credential-free discovery evidence
        run: php wp-content/plugins/mad4b-site-control-plane/tests/mcp-catalog-evidence-runtime.php
      - name: Verify bounded MCP registration diagnostic rendering
        run: php wp-content/plugins/mad4b-site-control-plane/tests/mcp-registration-diagnostics-admin-runtime.php
      - name: Verify preflight evidence survives Adapter rejection
        run: php wp-content/plugins/mad4b-site-control-plane/tests/mcp-preflight-registration-failure-runtime.php
      - name: Verify failed catalogs block connection readiness
        run: php wp-content/plugins/mad4b-site-control-plane/tests/connection-catalog-readiness-runtime.php
      - name: Verify peer bounds precede expensive inventory traversal
        run: php wp-content/plugins/mad4b-site-control-plane/tests/mcp-peer-inventory-bounds-runtime.php
      - name: Verify projection notices avoid catalog rebuilds and permission checks
        run: php wp-content/plugins/mad4b-site-control-plane/tests/projection-registration-lifecycle.php
      - name: Materialize the bundled official MCP Adapter
        run: python3 wp-content/plugins/mad4b-site-control-plane/tests/materialize-packaged-plugin.py --archive wp-content/plugins/mcp-adapter.zip --plugins-dir "$RUNNER_TEMP/offline-mcp" --slug mcp-adapter
      - name: Verify production required schemas against real official DTOs
        run: php wp-content/plugins/mad4b-site-control-plane/tests/mcp-official-required-preflight-runtime.php "$RUNNER_TEMP/offline-mcp/mcp-adapter"
      - name: Verify canonical identity and lifecycle contracts
        run: python3 wp-content/plugins/mad4b-site-control-plane/tests/connection-continuation-contract.py
      - name: Verify external discovery acceptance failures
        run: node wp-content/plugins/mad4b-site-control-plane/tests/connection-edge-acceptance-runtime.mjs
