name: ETG Staging Public HTTP Evidence

on:
  pull_request:
    paths:
      - 'tools/etg-staging-public-http-smoke.py'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-frontend-origin-diagnostic.php'
      - '.github/workflows/etg-staging-public-http-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etg-staging-public-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    name: ETG public fixed-route observation only
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout exact repository SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce safe source script syntax
        run: python3 -m py_compile tools/etg-staging-public-http-smoke.py
      - name: Collect read-only independent external observations
        run: python3 tools/etg-staging-public-http-smoke.py
      - name: Preserve evidence independent of release decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etg-staging-public-http-${{ github.sha }}
          path: etg-staging-public-smoke.json
          if-no-files-found: warn
          retention-days: 14
