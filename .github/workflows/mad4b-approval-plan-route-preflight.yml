name: MAD4B Approval Plan Live Route Preflight

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-adaptive-operation-router.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-staging-write-planning-guard.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/approval-plan-route-preflight-runtime.php'
      - '.github/workflows/mad4b-approval-plan-route-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-approval-route-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  read-only-approval-preflight:
    name: Fail-closed pending-ticket route (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Enforce syntax and pure, no-ticket preflight
        shell: bash
        run: |
          set -euo pipefail
          root=wp-content/plugins/mad4b-site-control-plane
          php -l "$root/includes/class-mad4b-scp-adaptive-operation-router.php"
          php -l "$root/includes/class-mad4b-scp-staging-write-planning-guard.php"
          php -l "$root/tests/approval-plan-route-preflight-runtime.php"
          php "$root/tests/approval-plan-route-preflight-runtime.php"
