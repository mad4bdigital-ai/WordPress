name: MAD4B Acceptance Core

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-acceptance-provider-registry.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-acceptance-planner.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-acceptance-verdict-reducer.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-acceptance-runner.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-acceptance-core.php'
      - 'wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/acceptance-core-contract.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/runtime-acceptance-core-etg-smoke.php'
      - 'wp-content/plugins/jet-engine.zip'
      - 'wp-content/plugins/jet-smart-filters.zip'
      - 'tools/normalize-premium-provider-package.py'
      - '.github/workflows/mad4b-acceptance-core.yml'
  push:
    branches: [master]
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-acceptance-provider-registry.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-acceptance-planner.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-acceptance-verdict-reducer.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-acceptance-runner.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-acceptance-core.php'
      - 'wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/acceptance-core-contract.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/runtime-acceptance-core-etg-smoke.php'
      - 'wp-content/plugins/jet-engine.zip'
      - 'wp-content/plugins/jet-smart-filters.zip'
      - 'tools/normalize-premium-provider-package.py'
      - '.github/workflows/mad4b-acceptance-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-acceptance-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  ETG_ACCEPTANCE_HEAD: d6381ef5ca4d9816fd9da61748f3c6b640cbf2bf
  ETG_ACCEPTANCE_TREE: 314c2d13fce5777079acd6a0f5c97b70221dfd7a

jobs:
  contract:
    name: Acceptance Core PHP ${{ matrix.php }} contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact PR head checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint Acceptance Core
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-acceptance-provider-registry.php \
            wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-acceptance-planner.php \
            wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-acceptance-verdict-reducer.php \
            wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-acceptance-runner.php \
            wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-acceptance-core.php \
            wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php \
            wp-content/plugins/mad4b-site-control-plane/tests/acceptance-core-contract.php \
            wp-content/plugins/mad4b-site-control-plane/tests/runtime-acceptance-core-etg-smoke.php; do
              php -l "$file"
          done
      - name: Run fail-closed provider orchestration contract
        run: php wp-content/plugins/mad4b-site-control-plane/tests/acceptance-core-contract.php

  exact-etg-runtime:
    name: Exact ETG Acceptance Provider runtime
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - name: Verify exact PR head checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Materialize exact ETG semantic-acceptance candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$ETG_ACCEPTANCE_HEAD" --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$ETG_ACCEPTANCE_HEAD"
          test "$(git rev-parse "$ETG_ACCEPTANCE_HEAD^{tree}")" = "$ETG_ACCEPTANCE_TREE"
          git checkout "$ETG_ACCEPTANCE_HEAD" -- wp-content/plugins/etg-dynamic-filter-seo-bridge
          grep -Fq "Version: 0.4.0-alpha.13" wp-content/plugins/etg-dynamic-filter-seo-bridge/etg-dynamic-filter-seo-bridge.php
          test -s wp-content/plugins/etg-dynamic-filter-seo-bridge/includes/Acceptance/LiveAcceptanceProvider.php
          printf '%s\n' "{\"contract\":\"etg.dfsb.embedded-build-identity.v1\",\"git_sha\":\"$ETG_ACCEPTANCE_HEAD\",\"tree_sha\":\"$ETG_ACCEPTANCE_TREE\",\"plugin_version\":\"0.4.0-alpha.13\"}" > wp-content/plugins/etg-dynamic-filter-seo-bridge/build-identity.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring
          coverage: none
      - name: Install WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar --info
      - name: Provision disposable WordPress 6.9
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-acceptance-wordpress
          rm -rf "$WP_PATH"
          mkdir -p "$WP_PATH"
          php /tmp/wp-cli.phar core download --path="$WP_PATH" --version=6.9 --force
          php /tmp/wp-cli.phar config create --path="$WP_PATH" --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar config set WP_ENVIRONMENT_TYPE development --path="$WP_PATH"
          php /tmp/wp-cli.phar config set MAD4B_MCP_PROVIDER_ISOLATION_ENABLED true --raw --path="$WP_PATH"
          php /tmp/wp-cli.phar config set MAD4B_MCP_PROVIDER_ISOLATION_RUNTIME_SUPPRESSION_APPROVED true --raw --path="$WP_PATH"
          php /tmp/wp-cli.phar core install --path="$WP_PATH" --url='http://mad4b-acceptance.test' --title='MAD4B Acceptance Runtime' --admin_user='mad4b-ci-admin' --admin_password='ci-only-not-a-secret' --admin_email='ci@example.invalid' --skip-email
      - name: Normalize exact premium provider packages
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/mad4b-acceptance-providers
          rm -rf "$out"
          mkdir -p "$out"
          python3 tools/normalize-premium-provider-package.py --provider jetengine --input wp-content/plugins/jet-engine.zip --output "$out/jet-engine.zip" --expected-version 3.8.15 --report "$out/jetengine-normalization.json"
          python3 tools/normalize-premium-provider-package.py --provider jetsmartfilters --input wp-content/plugins/jet-smart-filters.zip --output "$out/jet-smart-filters.zip" --expected-version 3.8.5 --report "$out/jetsmartfilters-normalization.json"
          unzip -tqq "$out/jet-engine.zip"
          unzip -tqq "$out/jet-smart-filters.zip"
      - name: Install exact providers, ETG and MAD4B Control Plane
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-acceptance-wordpress
          python3 "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/materialize-packaged-plugin.py" --archive "wp-content/plugins/mcp-adapter.zip" --plugins-dir "$WP_PATH/wp-content/plugins" --slug mcp-adapter
          python3 "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/materialize-packaged-plugin.py" --archive "wp-content/plugins/elementor.zip" --plugins-dir "$WP_PATH/wp-content/plugins" --slug elementor
          python3 "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/materialize-packaged-plugin.py" --archive "/tmp/mad4b-acceptance-providers/jet-engine.zip" --plugins-dir "$WP_PATH/wp-content/plugins" --slug jet-engine
          python3 "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/materialize-packaged-plugin.py" --archive "/tmp/mad4b-acceptance-providers/jet-smart-filters.zip" --plugins-dir "$WP_PATH/wp-content/plugins" --slug jet-smart-filters
          cp -R wp-content/plugins/etg-dynamic-filter-seo-bridge "$WP_PATH/wp-content/plugins/etg-dynamic-filter-seo-bridge"
          cp -R wp-content/plugins/mad4b-site-control-plane "$WP_PATH/wp-content/plugins/mad4b-site-control-plane"
          php /tmp/wp-cli.phar plugin activate mcp-adapter --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate elementor --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate jet-engine --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate jet-smart-filters --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate etg-dynamic-filter-seo-bridge --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate mad4b-site-control-plane --path="$WP_PATH"
      - name: Complete exact ETG guarded full boot
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-acceptance-wordpress
          php /tmp/wp-cli.phar eval '
            $ok = \ETG\DynamicFilterSEOBridge\Runtime\BootGuard::run( static function () {
                \ETG\DynamicFilterSEOBridge\Bootstrap::instance()->boot();
            } );
            if ( ! $ok ) throw new RuntimeException( "ETG guarded full boot failed." );
            $status = \ETG\DynamicFilterSEOBridge\Runtime\BootGuard::status();
            if ( empty( $status["boot_ok"] ) ) throw new RuntimeException( "ETG Safe Boot did not close to boot_ok: " . wp_json_encode( $status ) );
            echo "etg-safe-boot=PASS\n";
          ' --path="$WP_PATH" --user=mad4b-ci-admin
      - name: Prove generic Acceptance Core discovers and safely orchestrates exact ETG provider
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file \
            "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-acceptance-core-etg-smoke.php" \
            --path=/tmp/mad4b-acceptance-wordpress --user=mad4b-ci-admin
      - name: Upload provider normalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mad4b-acceptance-provider-normalization-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/mad4b-acceptance-providers/*-normalization.json
          if-no-files-found: error
          retention-days: 14
