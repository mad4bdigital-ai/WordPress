name: MAD4B Commercial Source Intake Regression
on:
  pull_request:
    paths:
      - 'tests/test_package_commercial_source_intake_non_regression.py'
      - 'tests/rate-season-effective-window-hermetic.php'
      - 'tests/test_accommodation_stay_margin_forward_nonregression.py'
      - 'ops/pricing-unified-checkpoints/tests/verify-accommodation*'
      - 'wp-content/mu-plugins/mad4b-accommodation-weight-policies-v1.php'
      - 'wp-content/mu-plugins/mad4b-unified-pricing-policy-registry-v1.php'
      - 'wp-content/mu-plugins/assets/mad4b-accommodation-*'
      - '.github/workflows/mad4b-commercial-source-intake.yml'
      - 'wp-content/plugins/mad4b-pricing-registry/**'
      - 'wp-content/plugins/mad4b-commerce/**'
      - 'wp-content/mu-plugins/mad4b-package-*'
      - 'wp-content/mu-plugins/assets/mad4b-package-*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mad4b-commercial-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 tests/test_package_commercial_source_intake_non_regression.py
      - name: Verify live-forward accommodation margin stays preview-only
        run: python3 tests/test_accommodation_stay_margin_forward_nonregression.py
      - name: Check accommodation PHP and admin JavaScript syntax
        run: |
          php -l wp-content/mu-plugins/mad4b-accommodation-weight-policies-v1.php
          php -l wp-content/mu-plugins/mad4b-unified-pricing-policy-registry-v1.php
          php -l ops/pricing-unified-checkpoints/tests/verify-accommodation-stay-margin-20261121.php
          node --check wp-content/mu-plugins/assets/mad4b-accommodation-stay-margin-v1.js
      - name: Verify single effective Season covers entire booking window
        run: php tests/rate-season-effective-window-hermetic.php
