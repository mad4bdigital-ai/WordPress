name: ETG DFSB CI Hardening Once

on:
  push:
    branches: [feat/etg-dynamic-filter-seo-bridge]
    paths:
      - '.github/workflows/etg-dfsb-ci-hardening-once.yml'
      - '.github/etg-ci-hardening.py'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard bounded orchestration ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE='5c36550a0903be74448786711a7e071fa1e7a3c9'
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          ACTUAL=$(git diff --name-only "$BASE...HEAD" | LC_ALL=C sort)
          EXPECTED=$(printf '%s\n' '.github/etg-ci-hardening.py' '.github/workflows/etg-dfsb-ci-hardening-once.yml' | LC_ALL=C sort)
          test "$ACTUAL" = "$EXPECTED"
      - name: Patch permanent CI contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/etg-ci-hardening.py
          git diff --check
          ACTUAL=$(git diff --name-only | LC_ALL=C sort)
          EXPECTED=$(printf '%s\n' '.github/workflows/etg-dfsb-ci.yml' '.github/workflows/etg-dfsb-jetengine-ci.yml' | LC_ALL=C sort)
          test "$ACTUAL" = "$EXPECTED"
      - name: Commit permanent CI hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MAD4B'
          git config user.email 'mad4b.digital@gmail.com'
          git add .github/workflows/etg-dfsb-ci.yml .github/workflows/etg-dfsb-jetengine-ci.yml
          git commit -m 'test(ci): bind live evidence regressions and trigger symmetry'
          git push origin HEAD:feat/etg-dynamic-filter-seo-bridge
