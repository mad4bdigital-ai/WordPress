name: WPL Auth Hardening Audit

on:
  push:
    branches:
      - fix/wpl-client-db-lifecycle-cleanup-20260906
    paths:
      - '.github/workflows/wpl-auth-hardening-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory remaining WPL transport debt
        shell: bash
        run: |
          set -euo pipefail
          echo '=== branch ==='
          git rev-parse HEAD
          echo '=== WPL_SERVER_API_KEY references ==='
          grep -R -n --include='*.php' 'WPL_SERVER_API_KEY' wp-content/plugins/wpl-client || true
          echo '=== direct WPL URL references ==='
          grep -R -n --include='*.php' 'WPL_SERVER_API_URL' wp-content/plugins/wpl-client || true
          echo '=== direct HTTP functions in installer/admin ==='
          grep -n -E 'wp_remote_(get|post|request)|download_url' wp-content/plugins/wpl-client/includes/class-wpl-installer.php wp-content/plugins/wpl-client/includes/class-wpl-client-admin.php || true
          echo '=== TLS weakening ==='
          grep -R -n --include='*.php' -E 'sslverify.*false|SSL_VERIFYPEER.*false|SSL_VERIFYHOST.*false|DEFAULT@SECLEVEL=1|CURL_SSLVERSION_TLSv1' wp-content/plugins/wpl-client || true
