name: RC34 Exact Site Binding Hardening

on:
  push:
    branches:
      - feat/dynamic-wordpress-skills-20260909
    paths:
      - .github/workflows/rc34-exact-site-binding-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynamic-wordpress-skills-20260909
          fetch-depth: 3

      - name: Guard exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '5ace615f3adaefce36041e3eb594e5203bececaa'

      - name: Require exact home and site URL binding for governed write eligibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('wp-content/plugins/mad4b-site-control-plane')
          authority = root / 'includes/class-mad4b-scp-staging-write-authority.php'
          live_truth = root / 'includes/class-mad4b-scp-live-truth.php'
          test = root / 'tests/live-acceptance-evidence-contract.py'

          def replace_exact(path, old, new, count=1):
              text = path.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old[:120]!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              authority,
              "\t\t$origin_enrolled = class_exists( 'MAD4B_SCP_Site_Profile' ) && MAD4B_SCP_Site_Profile::origin_enrolled();\n\t\t$write_enabled = class_exists( 'MAD4B_SCP_Site_Profile' ) && MAD4B_SCP_Site_Profile::write_enabled();\n\t\t$eligible = $configured && $origin_enrolled && $write_enabled;",
              "\t\t$origin_enrolled = class_exists( 'MAD4B_SCP_Site_Profile' ) && MAD4B_SCP_Site_Profile::origin_enrolled();\n\t\t$site_urls_match = class_exists( 'MAD4B_SCP_Site_Profile' ) && MAD4B_SCP_Site_Profile::site_urls_match_enrollment();\n\t\t$exact_profile_bound = $origin_enrolled && $site_urls_match;\n\t\t$write_enabled = class_exists( 'MAD4B_SCP_Site_Profile' ) && MAD4B_SCP_Site_Profile::write_enabled();\n\t\t$eligible = $configured && $exact_profile_bound && $write_enabled;"
          )
          replace_exact(
              authority,
              "\t\t} elseif ( ! $write_enabled ) $blocker = 'site_profile_write_disabled';",
              "\t\t} elseif ( ! $site_urls_match ) $blocker = 'site_profile_site_urls_mismatch';\n\t\telseif ( ! $write_enabled ) $blocker = 'site_profile_write_disabled';"
          )
          replace_exact(
              authority,
              "\t\t\t'site_profile_digest' => class_exists( 'MAD4B_SCP_Site_Profile' ) ? MAD4B_SCP_Site_Profile::profile_digest() : '',\n\t\t\t'eligible' => $eligible,",
              "\t\t\t'site_profile_digest' => class_exists( 'MAD4B_SCP_Site_Profile' ) ? MAD4B_SCP_Site_Profile::profile_digest() : '',\n\t\t\t'profile_origin_enrolled' => $origin_enrolled,\n\t\t\t'profile_site_urls_match' => $site_urls_match,\n\t\t\t'exact_profile_bound' => $exact_profile_bound,\n\t\t\t'profile_write_enabled' => $write_enabled,\n\t\t\t'eligible' => $eligible,"
          )

          replace_exact(
              live_truth,
              "\t\t$profile_origin_enrolled = $profile_available && MAD4B_SCP_Site_Profile::origin_enrolled();\n\t\t$profile_write_enabled = $profile_available && MAD4B_SCP_Site_Profile::write_enabled();",
              "\t\t$profile_origin_enrolled = $profile_available && MAD4B_SCP_Site_Profile::origin_enrolled();\n\t\t$profile_site_urls_match = $profile_available && MAD4B_SCP_Site_Profile::site_urls_match_enrollment();\n\t\t$exact_profile_bound = $profile_origin_enrolled && $profile_site_urls_match;\n\t\t$profile_write_enabled = $profile_available && MAD4B_SCP_Site_Profile::write_enabled();"
          )
          replace_exact(
              live_truth,
              "\t\t\t'profile_origin_enrolled' => $profile_origin_enrolled,\n\t\t\t'profile_write_enabled' => $profile_write_enabled,",
              "\t\t\t'profile_origin_enrolled' => $profile_origin_enrolled,\n\t\t\t'profile_site_urls_match' => $profile_site_urls_match,\n\t\t\t'exact_profile_bound' => $exact_profile_bound,\n\t\t\t'profile_write_enabled' => $profile_write_enabled,"
          )
          replace_exact(
              live_truth,
              "\t\t$checks['site_profile_bound'] = ! empty( $authority['profile_origin_enrolled'] );",
              "\t\t$checks['site_profile_bound'] = ! empty( $authority['exact_profile_bound'] );"
          )

          text = test.read_text(encoding='utf-8')
          text = text.replace(
              "write = (root / 'includes/class-mad4b-scp-staging-write-authority.php').read_text(encoding='utf-8')\n",
              "write = (root / 'includes/class-mad4b-scp-staging-write-authority.php').read_text(encoding='utf-8')\n"
          )
          anchor = "# Positive reachability is a mandatory regression, not only false-pass checks.\n"
          regression = '''# Governed write eligibility requires the same exact site binding as the\n# environment guard: profile origin/environment plus both home_url and site_url.\nfor marker in [\n    "$site_urls_match = class_exists( 'MAD4B_SCP_Site_Profile' ) && MAD4B_SCP_Site_Profile::site_urls_match_enrollment();",\n    "$exact_profile_bound = $origin_enrolled && $site_urls_match;",\n    "$eligible = $configured && $exact_profile_bound && $write_enabled;",\n    "'site_profile_site_urls_mismatch'",\n    "'profile_site_urls_match' => $site_urls_match",\n    "'exact_profile_bound' => $exact_profile_bound",\n]:\n    if marker not in write:\n        raise SystemExit('Exact governed-write site binding hardening missing: ' + marker)\nif "$eligible = $configured && $origin_enrolled && $write_enabled;" in write:\n    raise SystemExit('Governed write eligibility must not ignore site_url/home_url parity.')\nfor marker in [\n    "$profile_site_urls_match = $profile_available && MAD4B_SCP_Site_Profile::site_urls_match_enrollment();",\n    "$exact_profile_bound = $profile_origin_enrolled && $profile_site_urls_match;",\n    "'profile_site_urls_match' => $profile_site_urls_match",\n    "'exact_profile_bound' => $exact_profile_bound",\n    "$checks['site_profile_bound'] = ! empty( $authority['exact_profile_bound'] );",\n]:\n    if marker not in live_truth:\n        raise SystemExit('Live write truth exact binding diagnostic missing: ' + marker)\n\n'''
          if regression not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('regression insertion anchor missing or ambiguous')
              text = text.replace(anchor, regression + anchor, 1)
          # Update the earlier expected site_profile_bound expression to the stricter exact binding.
          old = "    \"$checks['site_profile_bound'] = ! empty( $authority['profile_origin_enrolled'] );\","
          new = "    \"$checks['site_profile_bound'] = ! empty( $authority['exact_profile_bound'] );\","
          if text.count(old) != 1:
              raise SystemExit('live truth site_profile_bound regression marker drifted')
          text = text.replace(old, new, 1)
          test.write_text(text, encoding='utf-8')
          PY

      - name: Verify focused contracts
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          php -l "$root/includes/class-mad4b-scp-staging-write-authority.php"
          php -l "$root/includes/class-mad4b-scp-live-truth.php"
          python3 "$root/tests/live-acceptance-evidence-contract.py"
          git diff --check
          grep -Fq "site_urls_match_enrollment()" "$root/includes/class-mad4b-scp-staging-write-authority.php"
          grep -Fq "site_profile_site_urls_mismatch" "$root/includes/class-mad4b-scp-staging-write-authority.php"

      - name: Commit exact site binding hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MAD4B'
          git config user.email 'mad4b.digital@gmail.com'
          git add \
            wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-staging-write-authority.php \
            wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-live-truth.php \
            wp-content/plugins/mad4b-site-control-plane/tests/live-acceptance-evidence-contract.py
          test -n "$(git status --porcelain)"
          git commit -m 'fix(governance): require exact site URL binding for writes'
          git push origin HEAD:feat/dynamic-wordpress-skills-20260909
