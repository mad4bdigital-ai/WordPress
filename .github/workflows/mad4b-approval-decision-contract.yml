name: MAD4B Approval Decision Contract

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mcp-adapter.zip'
      # Release Verdict requires this check for every full Control Plane runtime release.
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - 'wp-content/plugins/*.zip'
      - 'plugins/mad4b-wordpress/**'
      - 'tools/capture-functional-gap-contract-evidence.py'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-approval-tickets.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-approval-decision-admin.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-plugin.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/adapters/class-mad4b-scp-approval-handoff-adapter.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-staging-write-planning-guard.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-servers.php'
      - 'wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/approval-decision-runtime.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/approval-decision-admin-post-lifecycle-runtime.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/approval-handoff-runtime.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/approval-decision-contract.py'
      - '.github/workflows/mad4b-approval-decision-contract.yml'
  push:
    branches:
      - master
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - 'wp-content/plugins/mcp-adapter.zip'
      - 'wp-content/plugins/*.zip'
      - 'plugins/mad4b-wordpress/**'
      - 'tools/capture-functional-gap-contract-evidence.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-approval-decision-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  approval-decision:
    name: Human approval decision (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint approval decision runtime
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-approval-tickets.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-approval-decision-admin.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-plugin.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/adapters/class-mad4b-scp-approval-handoff-adapter.php
          php -l wp-content/plugins/mad4b-site-control-plane/tests/approval-decision-runtime.php
          php -l wp-content/plugins/mad4b-site-control-plane/tests/approval-decision-admin-post-lifecycle-runtime.php
          php -l wp-content/plugins/mad4b-site-control-plane/tests/approval-handoff-runtime.php

      - name: Execute fail-closed human decision matrix
        shell: bash
        run: |
          set -euo pipefail
          php wp-content/plugins/mad4b-site-control-plane/tests/approval-decision-runtime.php

      - name: Execute admin-post authority lifecycle regression
        shell: bash
        run: |
          set -euo pipefail
          php wp-content/plugins/mad4b-site-control-plane/tests/approval-decision-admin-post-lifecycle-runtime.php

      - name: Execute exact candidate handoff regression
        shell: bash
        run: |
          set -euo pipefail
          php wp-content/plugins/mad4b-site-control-plane/tests/approval-handoff-runtime.php

      - name: Enforce independent approval architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 wp-content/plugins/mad4b-site-control-plane/tests/approval-decision-contract.py
