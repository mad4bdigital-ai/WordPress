name: RC34 Enrollment Control Surface Patch

on:
  push:
    branches:
      - feat/dynamic-wordpress-skills-20260909
    paths:
      - .github/workflows/rc34-enrollment-control-surface-patch.yml
      - .github/scripts/rc34-enrollment-patch.py.part*

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynamic-wordpress-skills-20260909
          fetch-depth: 3

      - name: Guard exact source parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'a8c85e4517dcadf74f4329302ce4c77d681ca807'

      - name: Reconstruct and apply bounded enrollment patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/scripts/rc34-enrollment-patch.py.part* > /tmp/rc34-enrollment-patch.b64
          base64 --decode /tmp/rc34-enrollment-patch.b64 > /tmp/rc34-enrollment-patch.py
          python3 -m py_compile /tmp/rc34-enrollment-patch.py
          python3 /tmp/rc34-enrollment-patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-site-profile-enrollment.php')
          text = path.read_text(encoding='utf-8')
          path.write_text(text.replace('\\t', '\t'), encoding='utf-8')
          PY

      - name: Verify focused contracts
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          for file in \
            "$root/mad4b-site-control-plane.php" \
            "$root/includes/class-mad4b-scp-site-profile-enrollment.php" \
            "$root/includes/class-mad4b-scp-servers.php" \
            "$root/includes/class-mad4b-scp-transport-context.php" \
            "$root/includes/class-mad4b-scp-mcp-request-scope.php" \
            "$root/bootstrap/mad4b-mcp-adapter-mu-bootstrap.php" \
            "$root/includes/class-mad4b-scp-rest-compatibility.php" \
            "$root/includes/class-mad4b-scp-oauth-request-context-guard.php" \
            "$root/includes/class-mad4b-scp-oauth-jwt-header-guard.php" \
            "$root/includes/class-mad4b-scp-oauth-subject-user-bridge.php" \
            "$root/includes/class-mad4b-scp-oauth-subject-gate.php" \
            "$root/includes/class-mad4b-scp-oauth-resource-bridge.php" \
            "$root/includes/class-mad4b-scp-local-oauth-server.php" \
            "$root/includes/class-mad4b-scp-oauth-challenge-alignment.php" \
            "$root/tests/site-profile-feature-reenrollment-runtime.php"; do
            php -l "$file"
          done
          python3 "$root/tests/site-profile-feature-reenrollment-contract.py"
          php "$root/tests/site-profile-feature-reenrollment-runtime.php"
          git diff --check

      - name: Commit source patch only
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/mad4b-general-distribution-foundation.yml
          git config user.name 'MAD4B'
          git config user.email 'mad4b.digital@gmail.com'
          git add wp-content/plugins/mad4b-site-control-plane
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -q '^\.github/'; then
            echo 'Writer must not push workflow files with the Actions token.' >&2
            exit 1
          fi
          git commit -m 'feat(governance): add bounded profile enrollment surface'
          git push origin HEAD:feat/dynamic-wordpress-skills-20260909
