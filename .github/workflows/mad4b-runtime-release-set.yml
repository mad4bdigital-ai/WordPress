name: MAD4B Runtime Release Set

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - 'wp-content/plugins/mcp-adapter.zip'
      - 'wp-content/plugins/*.zip'
      - 'plugins/mad4b-wordpress/**'
      - 'tools/capture-functional-gap-contract-evidence.py'
      - '.github/workflows/mad4b-runtime-release-set.yml'
      - '.github/workflows/mad4b-control-plane-package.yml'
      - '.github/workflows/mad4b-release-verdict.yml'
  push:
    branches:
      - master
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - 'wp-content/plugins/mcp-adapter.zip'
      - 'wp-content/plugins/*.zip'
      - 'plugins/mad4b-wordpress/**'
      - 'tools/capture-functional-gap-contract-evidence.py'
      - '.github/workflows/mad4b-runtime-release-set.yml'
      - '.github/workflows/mad4b-control-plane-package.yml'
      - '.github/workflows/mad4b-release-verdict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-runtime-release-set-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  selected-head-php-compatibility:
    name: Selected HEAD browser / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint and exercise governed update UI
        shell: bash
        run: |
          set -euo pipefail
          P=wp-content/plugins/mad4b-site-control-plane
          php "$P/tests/runtime-update-recovery-runtime.php"
          php "$P/tests/dynamic-first-party-enrollment-runtime.php"
          php "$P/tests/native-update-routing-runtime.php"
          php "$P/tests/drive-scan-continuation-runtime.php"
          php "$P/tests/context-scan-completeness-runtime.php"
          php "$P/tests/read-callback-boundary-runtime.php"
          php "$P/tests/gateway-regression-runtime.php"
          php "$P/tests/post-manual-update-guidance-runtime.php"
          php "$P/tests/recovery-route-matrix-runtime.php"
          php -l "$P/includes/class-mad4b-scp-runtime-components-admin-ui.php"
          php -l "$P/includes/class-mad4b-scp-recovery-route-matrix.php"
          php "$P/tests/plugin-operation-readiness-runtime.php"
          php "$P/tests/adaptive-operation-router-runtime.php"
          php -l "$P/includes/class-mad4b-scp-selected-head-update.php"
          php -l "$P/includes/class-mad4b-scp-staging-selected-head-admin.php"
          php -l "$P/includes/class-mad4b-scp-staging-source-selector.php"
          php -l "$P/includes/class-mad4b-scp-plugin-update-popup.php"
          php "$P/tests/staging-source-selector-runtime.php"
          php "$P/tests/staging-selected-head-admin-runtime.php"
          php "$P/tests/staging-selected-head-execution-runtime.php"
          php "$P/tests/plugin-update-popup-runtime.php"

  contract:
    name: Runtime release-set contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Immutable historical Feature 007 source reviews need the fixed
          # reviewed-base blobs for exact SHA/size comparison. A shallow
          # checkout makes the reviews falsely fail as unreviewed source.
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify runtime release-set source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 wp-content/plugins/mad4b-site-control-plane/tests/runtime-release-set-contract.py
          python3 wp-content/plugins/mad4b-site-control-plane/tests/mcp-adapter-compatibility-contract.py
          python3 -m json.tool wp-content/plugins/mad4b-site-control-plane/config/runtime-release-policy.json >/dev/null
          python3 -m json.tool wp-content/plugins/mad4b-site-control-plane/config/certified-provider-profiles.json >/dev/null
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-runtime-release-set.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-provider-contracts.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-mcp-class-provenance.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-plugin-package.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-self-update.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-cross-plugin-deployment.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-cross-plugin-admin.php
          php wp-content/plugins/mad4b-site-control-plane/tests/cross-plugin-deployment-runtime.php
          php wp-content/plugins/mad4b-site-control-plane/tests/cross-plugin-admin-environment-runtime.php
          php wp-content/plugins/mad4b-site-control-plane/tests/cross-plugin-popup-inline-runtime.php
          python3 wp-content/plugins/mad4b-site-control-plane/tests/integration-pr415-pr416-pr420-pr421-contract.py
          node --check wp-content/plugins/mad4b-site-control-plane/assets/plugin-update-dialog.js
          python3 -m json.tool wp-content/plugins/mad4b-site-control-plane/config/cross-plugin-sources.json >/dev/null
          python3 wp-content/plugins/mad4b-site-control-plane/tests/cross-plugin-artifact-builder-contract.py
          python3 -m py_compile tools/mad4b-cross-plugin-package.py

          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-staging-selected-head-admin.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-staging-source-selector.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-plugin-update-popup.php
          php wp-content/plugins/mad4b-site-control-plane/tests/staging-source-selector-runtime.php
          php wp-content/plugins/mad4b-site-control-plane/tests/staging-selected-head-admin-runtime.php
          php wp-content/plugins/mad4b-site-control-plane/tests/plugin-update-popup-runtime.php
          php wp-content/plugins/mad4b-site-control-plane/tests/self-update-auto-update-state-runtime.php
          python3 wp-content/plugins/mad4b-site-control-plane/tests/self-update-dual-channel-contract.py
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-mcp-adapter-metadata-bridge.php

      - name: Verify exact upstream MCP Adapter release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/mad4b-adapter.env
          import json, re, shlex
          from pathlib import Path
          root=Path('wp-content/plugins/mad4b-site-control-plane/config')
          policy=json.loads((root/'runtime-release-policy.json').read_text(encoding='utf-8'))
          profiles=json.loads((root/'certified-provider-profiles.json').read_text(encoding='utf-8'))
          if policy.get('contract')!='mad4b.runtime-release-policy.v1' or policy.get('exact_provider_profile_required') is not True:
              raise SystemExit('MCP Adapter certified release policy missing')
          if policy.get('pair_certification_required') is not True:
              raise SystemExit('MCP Adapter pair certification cannot be disabled')
          catalog=(profiles.get('providers') or {}).get('mcp_adapter') or {}
          def certified(version,profile):
              if not re.fullmatch(r'[0-9]+[.][0-9]+[.][0-9]+',str(version)) or not isinstance(profile,dict):
                  return False
              evidence=profile.get('evidence') or {}
              sha=str(profile.get('archive_sha256') or '')
              size=profile.get('archive_bytes')
              url=str(profile.get('package_url') or '')
              authority=str(profile.get('certification_authority') or '')
              if (profile.get('version')!=version or not re.fullmatch(r'[a-f0-9]{64}',sha)
                  or type(size) is not int or size<1 or not isinstance(evidence,dict)
                  or evidence.get('mutation_authority') is not False
                  or evidence.get('release_asset_sha256')!=sha
                  or evidence.get('release_asset_bytes')!=size
                  or evidence.get('source_tag') not in (version,'v'+version)):
                  return False
              if (not isinstance(profile.get('critical_files'),dict) or not profile['critical_files']
                  or (profile.get('runtime_surface') or {}).get('contract')!='mad4b.mcp-runtime-surface.v1'):
                  return False
              official_github=f'https://github.com/WordPress/mcp-adapter/releases/download/v{version}/mcp-adapter.zip'
              official_wp=f'https://downloads.wordpress.org/plugin/mcp-adapter.{version}.zip'
              return ((url==official_github and authority==f'github.com/WordPress/mcp-adapter/releases/tag/v{version}')
                  or (url==official_wp and authority.startswith('https://wordpress.org/plugins/mcp-adapter/')
                      and version in authority))
          if policy.get('adapter_release_target_source')=='certified_runtime_release_set.mcp_adapter':
              if policy.get('installed_adapter_version_gate') is not False or 'target_adapter_version' in policy:
                  raise SystemExit('runtime release set must not pin the installed MCP Adapter version')
              candidates=[v for v,p in catalog.items() if certified(v,p)]
              if not candidates:
                  raise SystemExit('no official fully certified MCP Adapter artifact is available')
              version=max(candidates,key=lambda v:tuple(map(int,v.split('.'))))
          else:
              version=str(policy.get('target_adapter_version') or '')
          profile=catalog.get(version) or {}
          if not certified(version,profile):
              raise SystemExit('selected MCP Adapter artifact is not source-certified')
          for key,value in {
              'VERSION':version,
              'SHA':profile['archive_sha256'],
              'BYTES':str(profile['archive_bytes']),
              'URL':profile['package_url'],
          }.items():
              print(f'{key}={shlex.quote(str(value))}')
          PY
          source /tmp/mad4b-adapter.env
          curl --fail --location --silent --show-error "$URL" -o /tmp/mcp-adapter.zip
          test "$(stat -c '%s' /tmp/mcp-adapter.zip)" = "$BYTES"
          echo "$SHA  /tmp/mcp-adapter.zip" | sha256sum --check --strict
          python3 wp-content/plugins/mad4b-site-control-plane/tests/mcp-runtime-surface-profile.py \
            --archive /tmp/mcp-adapter.zip \
            --profile wp-content/plugins/mad4b-site-control-plane/config/certified-provider-profiles.json \
            --version "$VERSION"
          python3 wp-content/plugins/mad4b-site-control-plane/tests/mcp-adapter-protocol-matrix.py /tmp/mcp-adapter.zip "$VERSION"
          python3 - "$VERSION" "$SHA" "$BYTES" <<'PY'
          import hashlib, json, sys, zipfile
          from pathlib import Path

          root=Path('wp-content/plugins/mad4b-site-control-plane/config')
          profiles=json.loads((root/'certified-provider-profiles.json').read_text(encoding='utf-8'))
          version,expected_sha,expected_bytes=sys.argv[1:]
          profile=((profiles.get('providers') or {}).get('mcp_adapter') or {}).get(version) or {}
          if (profile.get('version')!=version or profile.get('archive_sha256')!=expected_sha
              or str(profile.get('archive_bytes'))!=expected_bytes):
              raise SystemExit('MCP Adapter selected release identity changed after download')
          critical=profile.get('critical_files') or {}
          if not critical:
              raise SystemExit('critical file manifest missing')

          with zipfile.ZipFile('/tmp/mcp-adapter.zip') as archive:
              names=archive.namelist()
              mains=[name for name in names if name.endswith('/mcp-adapter.php') or name == 'mcp-adapter.php']
              if len(mains) != 1:
                  raise SystemExit(f'unexpected MCP Adapter archive roots: {mains}')
              main=mains[0]
              prefix=main[:-len('mcp-adapter.php')]
              failures=[]
              for rel,expected in sorted(critical.items()):
                  name=prefix+rel
                  if name not in names:
                      failures.append(f'{rel}:missing')
                      continue
                  actual=hashlib.sha256(archive.read(name)).hexdigest()
                  if actual.lower()!=str(expected).lower():
                      failures.append(f'{rel}:sha256:{actual}')
              if failures:
                  raise SystemExit('MCP Adapter exact critical-file certification failed: '+', '.join(failures[:20]))
              text=archive.read(main).decode('utf-8', errors='replace')
              version_lines=[line for line in text.splitlines() if line.lstrip().startswith('* Version:')]
              if len(version_lines)!=1 or version_lines[0].split(':',1)[1].strip()!=version:
                  raise SystemExit('MCP Adapter plugin header version mismatch')
          print(f'mad4b.mcp-adapter-upstream-certification.v1: PASS version={version} files={len(critical)}')
          PY
