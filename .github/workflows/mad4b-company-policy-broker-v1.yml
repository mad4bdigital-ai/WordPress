name: MAD4B Policy Broker Planning Contract
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'wp-content/mu-plugins/mad4b-company-policy-broker-bridge.php'
      - 'tests/test_mad4b_company_policy_broker_bridge_v1.php'
      - 'docs/MAD4B-POLICY-BROKER-BRIDGE-V1.md'
      - '.github/workflows/mad4b-company-policy-broker-v1.yml'
  push:
    branches: [master]
    paths:
      - 'wp-content/mu-plugins/mad4b-company-policy-broker-bridge.php'
      - 'tests/test_mad4b_company_policy_broker_bridge_v1.php'
      - '.github/workflows/mad4b-company-policy-broker-v1.yml'
permissions:
  contents: read
jobs:
  broker-plan-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Syntax and gated planning fixtures
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/mu-plugins/mad4b-company-policy-broker-bridge.php
          php -l tests/test_mad4b_company_policy_broker_bridge_v1.php
          MAD4B_BROKER_BRIDGE_FILE="$PWD/wp-content/mu-plugins/mad4b-company-policy-broker-bridge.php" \
            php tests/test_mad4b_company_policy_broker_bridge_v1.php
