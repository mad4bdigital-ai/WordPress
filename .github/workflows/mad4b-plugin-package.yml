name: MAD4B Plugin Package

on:
  pull_request:
    paths:
      - '.github/workflows/mad4b-plugin-package.yml'
      - 'wp-content/plugins/mad4b-site-control-plane/**'
      - 'wp-content/plugins/mcp-adapter.zip'
      - 'wp-content/plugins/*.zip'
      - 'tools/capture-functional-gap-contract-evidence.py'
      - 'wp-content/plugins/mad4b-site-control-plane/config/functional-gap-policy.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-plugin-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build installable plugin ZIP
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify certified MCP dependency disk integrity contract
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          php -l "$root/includes/class-mad4b-scp-dependency-manager.php"
          php -l "$root/tests/dependency-mcp-adapter-integrity-runtime.php"
          php "$root/tests/dependency-mcp-adapter-integrity-runtime.php"
          python3 "$root/tests/dependency-certified-runtime-contract.py"

      - name: Resolve exact certified MCP Adapter package
        shell: bash
        run: |
          set -euo pipefail
          eval "$(python3 - <<'PY'
          import json, shlex
          from pathlib import Path
          root=Path('wp-content/plugins/mad4b-site-control-plane/config')
          policy=json.loads((root/'runtime-release-policy.json').read_text(encoding='utf-8'))
          profiles=json.loads((root/'certified-provider-profiles.json').read_text(encoding='utf-8'))
          if policy.get('contract')!='mad4b.runtime-release-policy.v1':
              raise SystemExit('runtime release policy contract mismatch')
          version=str(policy.get('target_adapter_version') or '')
          profile=((profiles.get('providers') or {}).get('mcp_adapter') or {}).get(version) or {}
          if profile.get('version')!=version:
              raise SystemExit('target MCP Adapter profile missing')
          sha=str(profile.get('archive_sha256') or '').lower()
          size=int(profile.get('archive_bytes') or 0)
          url=str(profile.get('package_url') or '')
          if len(sha)!=64 or size<1 or not url.startswith('https://github.com/WordPress/mcp-adapter/releases/download/v'):
              raise SystemExit('target MCP Adapter profile identity invalid')
          values={
              'MCP_ADAPTER_VERSION':version,
              'MCP_ADAPTER_SHA':sha,
              'MCP_ADAPTER_BYTES':str(size),
              'MCP_ADAPTER_URL':url,
              'MCP_ADAPTER_STAGE_PATH':'/tmp/mad4b-plugin-package-mcp-adapter.zip',
          }
          for key,value in values.items():
              print(f'{key}={shlex.quote(value)}')
          PY
          )"
          {
            echo "MCP_ADAPTER_VERSION=$MCP_ADAPTER_VERSION"
            echo "MCP_ADAPTER_SHA=$MCP_ADAPTER_SHA"
            echo "MCP_ADAPTER_BYTES=$MCP_ADAPTER_BYTES"
            echo "MCP_ADAPTER_URL=$MCP_ADAPTER_URL"
            echo "MCP_ADAPTER_STAGE_PATH=$MCP_ADAPTER_STAGE_PATH"
          } >> "$GITHUB_ENV"
          curl --fail --location --silent --show-error "$MCP_ADAPTER_URL" --output "$MCP_ADAPTER_STAGE_PATH"
          test "$(stat -c '%s' "$MCP_ADAPTER_STAGE_PATH")" = "$MCP_ADAPTER_BYTES"
          echo "$MCP_ADAPTER_SHA  $MCP_ADAPTER_STAGE_PATH" | sha256sum --check --strict
          unzip -tqq "$MCP_ADAPTER_STAGE_PATH"

      - name: Verify general-distribution package contract
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          main="$root/mad4b-site-control-plane.php"
          bootstrap="$root/bootstrap/mad4b-mcp-adapter-mu-bootstrap.php"
          certified="$root/config/certified-providers.json"

          test -f "$main"
          test -f "$bootstrap"
          test -f "$certified"
          test -f "$MCP_ADAPTER_STAGE_PATH"
          grep -Fq 'Plugin Name: MAD4B Site Control Plane' "$main"
          grep -Fq 'MAD4B_SCP_Dependency_Manager::boot();' "$main"
          grep -Fq "const BUNDLED_ARCHIVE = 'dependencies/mcp-adapter.zip';" "$root/includes/class-mad4b-scp-dependency-manager.php"

          if grep -Fq 'Requires Plugins: mcp-adapter' "$main"; then
            echo 'General-distribution package must not hard-block activation through Requires Plugins; use the explicit Dependency Manager.' >&2
            exit 1
          fi

          if grep -Eq '^[[:space:]]*\*[[:space:]]*Plugin Name:' "$bootstrap"; then
            echo 'MU bootstrap source must not expose a regular-plugin header inside the distributable plugin.' >&2
            exit 1
          fi

          headers=()
          while IFS= read -r -d '' file; do
            if grep -Eq '^[[:space:]]*\*[[:space:]]*Plugin Name:' "$file"; then
              headers+=("$file")
            fi
          done < <(find "$root" -mindepth 1 -maxdepth 2 -type f -name '*.php' -print0)
          if [ "${#headers[@]}" -ne 1 ] || [ "${headers[0]:-}" != "$main" ]; then
            printf 'Expected exactly one WordPress activation candidate (%s); found:\n' "$main" >&2
            printf '  %s\n' "${headers[@]:-none}" >&2
            exit 1
          fi

          expected_sha="$(php -r '$j=json_decode(file_get_contents($argv[1]),true); echo strtolower((string)($j["providers"]["mcp_adapter"]["archive_sha256"]??""));' "$certified")"
          test -n "$expected_sha"
          test "$expected_sha" = "$MCP_ADAPTER_SHA"
          observed_sha="$(sha256sum "$MCP_ADAPTER_STAGE_PATH" | awk '{print $1}')"
          test "$observed_sha" = "$MCP_ADAPTER_SHA"

      - name: Generate exact functional-gap repository evidence
        shell: bash
        run: |
          set -euo pipefail
          out='wp-content/plugins/mad4b-site-control-plane/config/functional-gap-contract-evidence.generated.json'
          python3 tools/capture-functional-gap-contract-evidence.py "$out"
          python3 - "$out" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          policy_path=Path('wp-content/plugins/mad4b-site-control-plane/config/functional-gap-policy.json')
          policy_raw=policy_path.read_bytes()
          policy=json.loads(policy_raw)
          expected={
              family for family,row in policy.get('families',{}).items()
              if row.get('repository_evidence') is True
          }
          if data.get('contract')!='mad4b.functional-gap-contract-evidence.v1':
              raise SystemExit('functional-gap evidence contract mismatch')
          if data.get('source_commit_sha')!=os.environ['SOURCE_SHA']:
              raise SystemExit('functional-gap evidence exact source mismatch')
          if data.get('policy_contract')!=policy.get('contract'):
              raise SystemExit('functional-gap evidence policy contract mismatch')
          if data.get('policy_sha256')!=hashlib.sha256(policy_raw).hexdigest():
              raise SystemExit('functional-gap evidence policy SHA mismatch')
          if set(data.get('families',{}))!=expected:
              raise SystemExit('functional-gap evidence family set mismatch')
          for family,row in data['families'].items():
              if row.get('promotion_authorized') is not False or row.get('evidence_only') is not True:
                  raise SystemExit(f'{family}: generated evidence became authorizing')
              for artifact in row.get('artifacts',[]):
                  tree=artifact.get('package_tree') or {}
                  if len(tree.get('tree_sha256',''))!=64 or int(tree.get('file_count',0))<1:
                      raise SystemExit(f'{family}: generated package tree evidence missing')
          print('build-embedded functional-gap evidence: PASS')
          PY


      - name: Build WordPress installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/stage
          cp -R wp-content/plugins/mad4b-site-control-plane dist/stage/mad4b-site-control-plane
          rm -rf dist/stage/mad4b-site-control-plane/tests
          mkdir -p dist/stage/mad4b-site-control-plane/dependencies
          cp "$MCP_ADAPTER_STAGE_PATH" dist/stage/mad4b-site-control-plane/dependencies/mcp-adapter.zip

          expected_sha="$(php -r '$j=json_decode(file_get_contents($argv[1]),true); echo strtolower((string)($j["providers"]["mcp_adapter"]["archive_sha256"]??""));' dist/stage/mad4b-site-control-plane/config/certified-providers.json)"
          embedded_sha="$(sha256sum dist/stage/mad4b-site-control-plane/dependencies/mcp-adapter.zip | awk '{print $1}')"
          test "$expected_sha" = "$embedded_sha"

          (
            cd dist/stage
            zip -qr ../mad4b-site-control-plane.zip mad4b-site-control-plane
          )
          sha256sum dist/mad4b-site-control-plane.zip > dist/mad4b-site-control-plane.zip.sha256
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > dist/SOURCE_HEAD.txt
          printf '%s\n' "$embedded_sha" > dist/MCP_ADAPTER_SHA256.txt

      - name: Verify embedded zero-touch functional-gap evidence
        shell: bash
        run: |
          set -euo pipefail
          zip='dist/mad4b-site-control-plane.zip'
          test -f "$zip"
          unzip -l "$zip" | grep -Fq 'mad4b-site-control-plane/includes/class-mad4b-scp-full-staging-authority.php'
          unzip -p "$zip" 'mad4b-site-control-plane/config/functional-gap-contract-evidence.generated.json' > /tmp/mad4b-functional-gap-package-evidence.json
          unzip -p "$zip" 'mad4b-site-control-plane/config/functional-gap-policy.json' > /tmp/mad4b-functional-gap-package-policy.json
          python3 - /tmp/mad4b-functional-gap-package-evidence.json /tmp/mad4b-functional-gap-package-policy.json <<'PY'
          import hashlib,json,os,sys
          evidence=json.load(open(sys.argv[1],encoding='utf-8'))
          policy_raw=open(sys.argv[2],'rb').read()
          policy=json.loads(policy_raw)
          assert evidence.get('source_commit_sha')==os.environ['SOURCE_SHA']
          assert evidence.get('policy_sha256')==hashlib.sha256(policy_raw).hexdigest()
          assert policy.get('promotion_authorized') is False
          print('plugin package zero-touch evidence: PASS')
          PY

      - name: Upload packaging validation evidence only
        uses: actions/upload-artifact@v4
        with:
          name: mad4b-plugin-package-validation-evidence
          path: |
            dist/mad4b-site-control-plane.zip.sha256
            dist/SOURCE_HEAD.txt
            dist/MCP_ADAPTER_SHA256.txt
          if-no-files-found: error
          retention-days: 14
