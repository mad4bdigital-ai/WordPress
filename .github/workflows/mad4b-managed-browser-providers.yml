name: MAD4B Managed Browser Providers

on:
  pull_request:
    paths:
      - 'tools/browser-acceptance/**'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-site-capability-discovery.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-browser-acceptance-core.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/site-capability-discovery-contract.php'
      - 'wp-content/plugins/mad4b-site-control-plane/skill-seeds/wordpress-browser-acceptance/**'
      - 'plugins/mad4b-wordpress/skills/wordpress-browser-acceptance/**'
      - '.github/workflows/mad4b-managed-browser-providers.yml'
      - 'docs/MAD4B-MANAGED-BROWSER-PROVIDERS.md'
  workflow_dispatch:
    inputs:
      provider:
        description: 'Browser provider: auto uses governed adaptive priority/fallback'
        type: choice
        required: true
        default: auto
        options:
          - auto
          - cloudflare
          - browserbase
          - browserless
          - steel
      profile:
        description: 'MAD4B Browser Acceptance profile ID'
        type: string
        required: false
        default: ''
      allow_credit_fallback:
        description: 'Allow auto mode to consume one-time/credit-based providers such as Steel'
        type: boolean
        required: true
        default: false
      live:
        description: 'Run live through a just-in-time MAD4B MCP access token'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: mad4b-managed-browser-providers-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

jobs:
  php-compatibility:
    name: Browser Core PHP ${{ matrix.php }} full-tree lint and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove immutable checked-out HEAD before executing test or live browser
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "Candidate drift: checkout is not exact authorized HEAD" >&2
            exit 3
          }
          test -z "$(git status --porcelain=v1)" || {
            echo "Candidate checkout already contains unexpected changes" >&2
            exit 3
          }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every Control Plane PHP file, fail closed on syntax errors
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/plugins/mad4b-site-control-plane -type f -name '*.php' -print0 |
            xargs -0 -r -n1 php -l
      - name: Core and native browser contract fixtures
        run: |
          php wp-content/plugins/mad4b-site-control-plane/tests/browser-acceptance-core-contract.php
          php wp-content/plugins/mad4b-site-control-plane/tests/native-capability-browser-provider-contract.php

  contract:
    name: Browser provider contract
    needs: php-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove immutable checked-out HEAD before executing test or live browser
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "Candidate drift: checkout is not exact authorized HEAD" >&2
            exit 3
          }
          test -z "$(git status --porcelain=v1)" || {
            echo "Candidate checkout already contains unexpected changes" >&2
            exit 3
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install runtime dependencies
        run: npm install --no-save playwright-core @browserbasehq/sdk steel-sdk
      - name: Provider selection and plan-boundary tests
        run: |
          node tools/browser-acceptance/test-provider-selection.mjs
          node tools/browser-acceptance/test-site-provider-configuration.mjs
          node tools/browser-acceptance/test-site-adapter-resolver.mjs
          node tools/browser-acceptance/test-declarative-capability-driver.mjs
          node tools/browser-acceptance/test-browser-attestation.mjs
          node tools/browser-acceptance/test-site-neutral-boundaries.mjs
          php wp-content/plugins/mad4b-site-control-plane/tests/site-capability-discovery-contract.php
          php wp-content/plugins/mad4b-site-control-plane/tests/capability-atlas-contract.php
          php wp-content/plugins/mad4b-site-control-plane/tests/native-capability-browser-provider-contract.php
          php wp-content/plugins/mad4b-site-control-plane/tests/browser-acceptance-admin-setup-contract.php
          php wp-content/plugins/mad4b-site-control-plane/tests/staging-browser-site-selection-contract.php
          node tools/browser-acceptance/test-scheduler.mjs
          node tools/browser-acceptance/test-network-policy.mjs
          node tools/browser-acceptance/test-plan-boundary.mjs
          node tools/browser-acceptance/test-pagination.mjs
          node tools/browser-acceptance/test-provider-preflight.mjs
          node tools/browser-acceptance/test-mcp-bridge.mjs
          node tools/browser-acceptance/test-evidence-assembler.mjs
          node tools/browser-acceptance/test-worker-environment.mjs
          node tools/browser-acceptance/test-workflow-signing-wiring.mjs
          node tools/browser-acceptance/test-receipt.mjs
          node tools/browser-acceptance/test-plan-consumption-ledger.mjs
          node tools/browser-acceptance/test-evidence-envelope.mjs
          node tools/browser-acceptance/test-filter-selection.mjs
      - name: PHP 8.3 syntax check for bounded site discovery
        run: |
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-site-capability-discovery.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-capability-atlas.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-native-capability-browser-provider.php
          php -l wp-content/plugins/mad4b-site-control-plane/tests/native-capability-browser-provider-contract.php
          php -l wp-content/plugins/mad4b-site-control-plane/tests/capability-atlas-contract.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-browser-acceptance-core.php
          php -l wp-content/plugins/mad4b-site-control-plane/tests/site-capability-discovery-contract.php
      - name: Syntax-check executable browser surfaces
        run: |
          node --check tools/browser-acceptance/providers.mjs
          node --check tools/browser-acceptance/scheduler.mjs
          node --check tools/browser-acceptance/network-policy.mjs
          node --check tools/browser-acceptance/provider-preflight.mjs
          node --check tools/browser-acceptance/mcp-bridge.mjs
          node --check tools/browser-acceptance/etg-driver.mjs
          node --check tools/browser-acceptance/run-etg-browser-acceptance.mjs
          node --check tools/browser-acceptance/run-live-etg-browser-acceptance.mjs
          node --check tools/browser-acceptance/receipt.mjs
          node --check tools/browser-acceptance/plan-consumption-ledger.mjs
          node --check tools/browser-acceptance/test-plan-consumption-ledger.mjs
          node --check tools/browser-acceptance/site-provider-configuration.mjs
          node --check tools/browser-acceptance/test-site-provider-configuration.mjs
          node --check tools/browser-acceptance/evidence-assembler.mjs
          node --check tools/browser-acceptance/worker-environment.mjs
          node --check tools/browser-acceptance/test-evidence-assembler.mjs
          node --check tools/browser-acceptance/test-worker-environment.mjs
          node --check tools/browser-acceptance/test-workflow-signing-wiring.mjs
          node --check tools/browser-acceptance/declarative-capability-driver.mjs
          node --check tools/browser-acceptance/browser-attestation.mjs
          node --check tools/browser-acceptance/test-browser-attestation.mjs
          node --check tools/browser-acceptance/test-declarative-capability-driver.mjs
          node --check tools/browser-acceptance/site-adapter-resolver.mjs
          node --check tools/browser-acceptance/test-site-adapter-resolver.mjs
          node --check tools/browser-acceptance/site-driver-registry.mjs
          node --check tools/browser-acceptance/run-site-browser-acceptance.mjs
          node --check tools/browser-acceptance/run-live-site-browser-acceptance.mjs
      - name: Generate non-secret provider preflight
        run: node tools/browser-acceptance/provider-preflight.mjs > browser-provider-preflight.json
      - uses: actions/upload-artifact@v4
        with:
          name: mad4b-browser-provider-preflight-${{ github.sha }}
          path: browser-provider-preflight.json
          retention-days: 14
      - name: Deny arbitrary execution inputs and long-lived OAuth shortcuts
        shell: bash
        run: |
          set -euo pipefail
          runner=tools/browser-acceptance/run-etg-browser-acceptance.mjs
          live=tools/browser-acceptance/run-live-site-browser-acceptance.mjs
          driver=tools/browser-acceptance/etg-driver.mjs
          ! grep -Eq -- '--url|--selector|--javascript|--taxonomy|--term' "$runner" "$live"
          ! grep -Eqi -- 'refresh[_ -]?token|client[_ -]?secret' "$live"
          grep -Fq 'delete childEnv.MAD4B_MCP_ACCESS_TOKEN' "$live"
          grep -Fq 'plan.cases' "$driver"
          grep -Fq 'plan.origin' "$driver"
          grep -Fq 'plan.challenge' "$driver"


  readiness:
    name: Non-secret managed-browser provider readiness (no session)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact source for manual preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain=v1)"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Contract-only provider preflight with ephemeral scoped provider credentials
        env:
          MAD4B_BROWSER_PROVIDER: ${{ inputs.provider }}
          MAD4B_BROWSER_ALLOW_CREDIT_FALLBACK: ${{ inputs.allow_credit_fallback }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BROWSER_RUN_API_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_RUN_API_TOKEN }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          BROWSERLESS_REGION: ${{ vars.BROWSERLESS_REGION }}
          STEEL_API_KEY: ${{ secrets.STEEL_API_KEY }}
        run: |
          node --check tools/browser-acceptance/provider-preflight.mjs
          node tools/browser-acceptance/test-provider-preflight.mjs
          node tools/browser-acceptance/provider-preflight.mjs > managed-browser-readiness.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-browser-readiness-${{ github.sha }}
          path: managed-browser-readiness.json
          if-no-files-found: warn
          retention-days: 7

  live:
    name: Live site-aware managed browser acceptance
    needs: contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAD4B_BROWSER_PROVIDER: ${{ inputs.provider }}
      MAD4B_BROWSER_PROFILE_ID: ${{ inputs.profile }}
      MAD4B_BROWSER_ALLOW_CREDIT_FALLBACK: ${{ inputs.allow_credit_fallback }}
      MAD4B_MCP_RESOURCE: ${{ vars.MAD4B_MCP_RESOURCE }}
      BROWSERLESS_REGION: ${{ vars.BROWSERLESS_REGION }}
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove immutable checked-out HEAD before executing test or live browser
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "Candidate drift: checkout is not exact authorized HEAD" >&2
            exit 3
          }
          test -z "$(git status --porcelain=v1)" || {
            echo "Candidate checkout already contains unexpected changes" >&2
            exit 3
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright-core @browserbasehq/sdk steel-sdk
      - name: Require just-in-time MCP bearer and at least one browser provider
        env:
          MAD4B_MCP_ACCESS_TOKEN: ${{ secrets.MAD4B_MCP_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BROWSER_RUN_API_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_RUN_API_TOKEN }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          STEEL_API_KEY: ${{ secrets.STEEL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MAD4B_MCP_RESOURCE:-}" || { echo 'MAD4B_MCP_RESOURCE repository variable is missing.' >&2; exit 2; }
          test -n "${MAD4B_MCP_ACCESS_TOKEN:-}" || { echo 'A short-lived MAD4B_MCP_ACCESS_TOKEN secret is required for this live run.' >&2; exit 2; }
          if [ -z "${CLOUDFLARE_BROWSER_RUN_API_TOKEN:-}" ] && [ -z "${BROWSERBASE_API_KEY:-}" ] && [ -z "${BROWSERLESS_TOKEN:-}" ] && [ -z "${STEEL_API_KEY:-}" ]; then
            echo 'No managed browser provider credential is configured.' >&2
            exit 2
          fi
      - name: Generate fresh plan, execute browser, and reduce evidence through MAD4B MCP
        env:
          MAD4B_MCP_ACCESS_TOKEN: ${{ secrets.MAD4B_MCP_ACCESS_TOKEN }}
          MAD4B_BROWSER_EVIDENCE_SIGNING_KEY_PEM_BASE64: ${{ secrets.MAD4B_BROWSER_EVIDENCE_SIGNING_KEY_PEM_BASE64 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BROWSER_RUN_API_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_RUN_API_TOKEN }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          STEEL_API_KEY: ${{ secrets.STEEL_API_KEY }}
        run: |
          node tools/browser-acceptance/run-live-site-browser-acceptance.mjs \
            --profile "$MAD4B_BROWSER_PROFILE_ID" \
            --browser-provider "$MAD4B_BROWSER_PROVIDER" \
            --out browser-evidence.json \
            --attempts-out browser-provider-attempts.json \
            --result-out browser-acceptance-result.json \
            --receipt-out browser-execution-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mad4b-browser-provider-evidence-${{ github.sha }}
          path: |
            browser-evidence.json
            browser-provider-attempts.json
            browser-acceptance-result.json
            browser-execution-receipt.json
          if-no-files-found: warn
          retention-days: 14
