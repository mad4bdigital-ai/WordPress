name: WPL Client state inventory

on:
  push:
    branches:
      - fix/wpl-client-db-lifecycle-cleanup-20260906
    paths:
      - .github/workflows/wpl-client-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory plugin persistence and lifecycle calls
        shell: bash
        run: |
          set -euo pipefail
          echo '=== OPTIONS ==='
          grep -RhoE "(get|add|update|delete)_option[[:space:]]*\([[:space:]]*['\"][^'\"]+" wp-content/plugins/wpl-client --include='*.php' | sort -u || true
          echo '=== TRANSIENTS ==='
          grep -RhoE "(get|set|delete)_transient[[:space:]]*\([[:space:]]*['\"][^'\"]+" wp-content/plugins/wpl-client --include='*.php' | sort -u || true
          echo '=== USER META ==='
          grep -RhoE "(get|add|update|delete)_user_meta[[:space:]]*\([^\n]*['\"]_?wpl_[^'\"]+" wp-content/plugins/wpl-client --include='*.php' | sort -u || true
          echo '=== CRON / DB / LIFECYCLE ==='
          grep -RnE "wp_(schedule|clear)_|register_(activation|deactivation|uninstall)_hook|\$wpdb|wpl_bg_install_job" wp-content/plugins/wpl-client --include='*.php' || true
