name: MAD4B Staging Transport Diagnostic

on:
  push:
    branches:
      - gov/staging-transport-diagnostic-20260930

permissions:
  contents: read

jobs:
  probe:
    name: External Staging transport probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORIGIN: https://staging.egypttourgates.com
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v4
      - name: Record DNS resolution
        shell: bash
        run: |
          set -u
          echo "DNS:"
          getent ahostsv4 staging.egypttourgates.com || true
          echo
          echo "Resolver:"
          cat /etc/resolv.conf || true
      - name: Probe TLS and HTTP surfaces
        shell: bash
        run: |
          set -u
          probe() {
            local label="$1"
            local url="$2"
            echo "===== $label ====="
            rm -f /tmp/headers /tmp/body /tmp/curl.err
            set +e
            metrics="$(curl               --silent --show-error               --connect-timeout 5               --max-time 20               --max-redirs 0               --output /tmp/body               --dump-header /tmp/headers               --write-out 'http_code=%{http_code} remote_ip=%{remote_ip} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} size=%{size_download}\n'               "$url" 2>/tmp/curl.err)"
            rc=$?
            set -e
            echo "curl_rc=$rc"
            printf '%s' "$metrics"
            echo "--- headers ---"
            sed -n '1,30p' /tmp/headers 2>/dev/null || true
            echo "--- curl stderr ---"
            sed -n '1,40p' /tmp/curl.err 2>/dev/null || true
            echo "--- body prefix ---"
            head -c 500 /tmp/body 2>/dev/null | tr '\n' ' ' || true
            echo
            echo
          }
          set -e
          probe "origin" "$ORIGIN/"
          probe "wp-json" "$ORIGIN/wp-json/"
          probe "mcp-discovery" "$ORIGIN/wp-json/mcp/mad4b-chatgpt"
          probe "connection-admin-unauthenticated" "$ORIGIN/wp-admin/admin.php?page=mad4b-control-plane-connection"
          probe "chatgpt-admin-unauthenticated" "$ORIGIN/wp-admin/admin.php?page=mad4b-control-plane-chatgpt"
          probe "runtime-build" "$ORIGIN/wp-content/plugins/mad4b-site-control-plane/MAD4B-RUNTIME-BUILD.txt"
          probe "mcp-discovery-rest-route" "$ORIGIN/?rest_route=/mcp/mad4b-chatgpt"

      - name: Read governed update-channel pointer
        shell: bash
        run: |
          set -euo pipefail
          base='https://github.com/mad4bdigital-ai/WordPress/releases/download/mad4b-site-control-plane-update-channel'
          curl -fsSL --connect-timeout 5 --max-time 20 "$base/mad4b-site-control-plane-update-pointer.json" -o /tmp/update-pointer.json
          cat /tmp/update-pointer.json
          manifest_asset="$(jq -r '.manifest_asset' /tmp/update-pointer.json)"
          test -n "$manifest_asset"
          curl -fsSL --connect-timeout 5 --max-time 20 "$base/$manifest_asset" -o /tmp/update-manifest.json
          cat /tmp/update-manifest.json
          printf '\npointer_sha256=%s\n' "$(sha256sum /tmp/update-pointer.json | awk '{print $1}')"
          printf 'manifest_sha256=%s\n' "$(sha256sum /tmp/update-manifest.json | awk '{print $1}')"

      - name: Probe MCP discovery per resolved edge
        shell: bash
        run: |
          set -u
          for ip in 191.101.104.122 212.1.212.203; do
            echo "===== edge $ip ====="
            set +e
            curl \
              --silent --show-error \
              --resolve "staging.egypttourgates.com:443:$ip" \
              --connect-timeout 5 \
              --max-time 15 \
              --output /tmp/edge-body \
              --dump-header /tmp/edge-headers \
              --write-out 'curl_rc_placeholder http_code=%{http_code} remote_ip=%{remote_ip} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} size=%{size_download}\n' \
              "$ORIGIN/wp-json/mcp/mad4b-chatgpt" 2>/tmp/edge-err
            rc=$?
            set -e
            echo "curl_rc=$rc"
            sed -n '1,20p' /tmp/edge-headers 2>/dev/null || true
            sed -n '1,20p' /tmp/edge-err 2>/dev/null || true
            echo
          done
