name: RC32 Subdirectory OAuth Generalization v2

on:
  push:
    branches:
      - feat/dynamic-wordpress-skills-20260909
    paths:
      - '.github/workflows/rc32-subdirectory-oauth-generalization-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynamic-wordpress-skills-20260909
          fetch-depth: 0

      - name: Guard exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/dynamic-wordpress-skills-20260909)"
          test "$(git rev-parse HEAD^)" = "76fe8aff8a0c92e54bbb0cac0f5a0b06543952a9"

      - name: Apply guarded subdirectory portability patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          old_workflow = Path('.github/workflows/rc32-subdirectory-oauth-generalization.yml').read_text(encoding='utf-8')
          start_token = "          python3 - <<'PY'\n"
          end_token = "\n          PY\n\n      - name: Validate patch before push"
          start = old_workflow.find(start_token)
          end = old_workflow.find(end_token, start + len(start_token))
          if start < 0 or end < 0:
              raise SystemExit('unable to recover guarded v1 patch body')
          patch_body = textwrap.dedent(old_workflow[start + len(start_token):end])
          patch_body = patch_body.replace("if contract.count(marker) != 1:", "if contract.count(marker) < 1:", 1)
          exec(compile(patch_body, '<rc32-subdirectory-oauth-v1-body>', 'exec'), {})

          root = Path('wp-content/plugins/mad4b-site-control-plane')
          continuity_path = root / 'includes/class-mad4b-scp-upgrade-continuity.php'
          continuity = continuity_path.read_text(encoding='utf-8')
          old_known = """\tpublic static function is_known_oauth_protocol_path( $path ) {\n\t\t$path = self::normalize_path( $path );\n\t\t$known = array(\n\t\t\t'/oauth/mcp/authorize',\n\t\t\t'/oauth/mcp/token',\n\t\t\t'/oauth/mcp/jwks',\n\t\t\t'/oauth/mcp/revoke',\n\t\t\t'/.well-known/oauth-authorization-server/oauth/mcp',\n\t\t);\n\t\treturn in_array( $path, $known, true );\n\t}\n"""
          new_known = """\tpublic static function is_known_oauth_protocol_path( $path ) {\n\t\t$path = self::normalize_path( $path );\n\t\tif ( ! class_exists( 'MAD4B_SCP_Local_OAuth_Server' ) ) return false;\n\t\t$urls = array(\n\t\t\tMAD4B_SCP_Local_OAuth_Server::authorize_url(),\n\t\t\tMAD4B_SCP_Local_OAuth_Server::token_url(),\n\t\t\tMAD4B_SCP_Local_OAuth_Server::jwks_url(),\n\t\t\tMAD4B_SCP_Local_OAuth_Server::revocation_url(),\n\t\t\tMAD4B_SCP_Local_OAuth_Server::metadata_url(),\n\t\t);\n\t\tforeach ( $urls as $url ) {\n\t\t\t$candidate = wp_parse_url( (string) $url, PHP_URL_PATH );\n\t\t\tif ( is_string( $candidate ) && hash_equals( self::normalize_path( $candidate ), $path ) ) return true;\n\t\t}\n\t\treturn false;\n\t}\n"""
          if continuity.count(old_known) != 1:
              raise SystemExit('upgrade continuity OAuth path anchor drifted')
          continuity = continuity.replace(old_known, new_known, 1)
          continuity_path.write_text(continuity, encoding='utf-8')

          runtime_path = root / 'tests/upgrade-continuity-runtime.php'
          runtime = runtime_path.read_text(encoding='utf-8')
          require_anchor = "require dirname(__DIR__).'/includes/class-mad4b-scp-site-profile.php';\nrequire dirname(__DIR__).'/includes/class-mad4b-scp-upgrade-continuity.php';"
          require_replacement = """require dirname(__DIR__).'/includes/class-mad4b-scp-site-profile.php';\nfinal class MAD4B_SCP_Local_OAuth_Server {\n    private static function base(){return rtrim($GLOBALS['home'],'/');}\n    public static function authorize_url(){return self::base().'/oauth/mcp/authorize';}\n    public static function token_url(){return self::base().'/oauth/mcp/token';}\n    public static function jwks_url(){return self::base().'/oauth/mcp/jwks';}\n    public static function revocation_url(){return self::base().'/oauth/mcp/revoke';}\n    public static function metadata_url(){\n        $issuer=self::base().'/oauth/mcp';$parts=parse_url($issuer);\n        $origin=$parts['scheme'].'://'.$parts['host'].(isset($parts['port'])?':'.$parts['port']:'');\n        return $origin.'/.well-known/oauth-authorization-server/'.ltrim(rtrim($parts['path'],'/'),'/');\n    }\n}\nrequire dirname(__DIR__).'/includes/class-mad4b-scp-upgrade-continuity.php';"""
          if runtime.count(require_anchor) != 1:
              raise SystemExit('upgrade runtime class anchor drifted')
          runtime = runtime.replace(require_anchor, require_replacement, 1)

          old_path_tests = """// Known OAuth paths are intercepted deterministically instead of theme 404s.\nok(MAD4B_SCP_Upgrade_Continuity::is_known_oauth_protocol_path('/oauth/mcp/authorize'),'authorize path recognized');\nok(MAD4B_SCP_Upgrade_Continuity::is_known_oauth_protocol_path('/.well-known/oauth-authorization-server/oauth/mcp/'),'metadata path recognized');\nok(!MAD4B_SCP_Upgrade_Continuity::is_known_oauth_protocol_path('/unrelated'),'unrelated path ignored');\n"""
          new_path_tests = """// Known OAuth paths are derived from the live local authority instead of assuming domain-root WordPress.\nok(MAD4B_SCP_Upgrade_Continuity::is_known_oauth_protocol_path('/oauth/mcp/authorize'),'authorize path recognized');\nok(MAD4B_SCP_Upgrade_Continuity::is_known_oauth_protocol_path('/.well-known/oauth-authorization-server/oauth/mcp/'),'metadata path recognized');\nok(!MAD4B_SCP_Upgrade_Continuity::is_known_oauth_protocol_path('/unrelated'),'unrelated path ignored');\n$GLOBALS['home']='https://staging.example.test/wordpress';\nok(MAD4B_SCP_Upgrade_Continuity::is_known_oauth_protocol_path('/wordpress/oauth/mcp/authorize'),'subdirectory authorize path recognized');\nok(MAD4B_SCP_Upgrade_Continuity::is_known_oauth_protocol_path('/wordpress/oauth/mcp/token'),'subdirectory token path recognized');\nok(MAD4B_SCP_Upgrade_Continuity::is_known_oauth_protocol_path('/.well-known/oauth-authorization-server/wordpress/oauth/mcp'),'subdirectory metadata path recognized');\nok(!MAD4B_SCP_Upgrade_Continuity::is_known_oauth_protocol_path('/oauth/mcp/authorize'),'domain-root OAuth path rejected for subdirectory site');\n$GLOBALS['home']='https://staging.example.test';\n"""
          if runtime.count(old_path_tests) != 1:
              raise SystemExit('upgrade runtime path assertions anchor drifted')
          runtime = runtime.replace(old_path_tests, new_path_tests, 1)
          runtime_path.write_text(runtime, encoding='utf-8')
          PY

      - name: Validate source and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          php -l "$root/includes/class-mad4b-scp-local-oauth-server.php"
          php -l "$root/includes/class-mad4b-scp-upgrade-continuity.php"
          php -l "$root/tests/runtime-local-oauth-standalone-smoke.php"
          php -l "$root/tests/upgrade-continuity-runtime.php"
          python3 "$root/tests/local-oauth-standalone-contract.py"
          php "$root/tests/upgrade-continuity-runtime.php"
          grep -Fq "site_base_url" "$root/includes/class-mad4b-scp-local-oauth-server.php"
          grep -Fq "Subdirectory OAuth endpoints drifted" "$root/tests/runtime-local-oauth-standalone-smoke.php"
          ! grep -Fq "self::AUTHORIZE_PATH === \$path" "$root/includes/class-mad4b-scp-local-oauth-server.php"

      - name: Commit branch-only fix and remove both staging workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MAD4B'
          git config user.email 'mad4b.digital@gmail.com'
          git rm .github/workflows/rc32-subdirectory-oauth-generalization.yml \
                 .github/workflows/rc32-subdirectory-oauth-generalization-v2.yml
          git add wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-local-oauth-server.php \
                  wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-upgrade-continuity.php \
                  wp-content/plugins/mad4b-site-control-plane/tests/local-oauth-standalone-contract.py \
                  wp-content/plugins/mad4b-site-control-plane/tests/runtime-local-oauth-standalone-smoke.php \
                  wp-content/plugins/mad4b-site-control-plane/tests/upgrade-continuity-runtime.php
          test -n "$(git status --porcelain)"
          git commit -m 'fix(rc32): preserve OAuth paths on subdirectory installs'
          git push origin HEAD:feat/dynamic-wordpress-skills-20260909
