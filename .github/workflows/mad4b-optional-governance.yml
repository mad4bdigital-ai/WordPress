name: MAD4B Optional Governance Policy
on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-optional-governance.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-optional-governance-remote.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-admin-settings-persistence.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-server-write-catalog.php'
      - 'wp-content/plugins/mad4b-site-control-plane/config/remote-operation-catalog.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/optional-governance-runtime.php'
      - 'wp-content/plugins/mad4b-site-control-plane/config/optional-governance-catalog.json'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-operator-control-center.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-operator-workspace.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-admin-navigation-manifest.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-managed-skills-lease.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-servers.php'
      - 'wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php'
      - '.github/workflows/mad4b-optional-governance.yml'
permissions:
  contents: read
jobs:
  optional-policy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: |
          set -euo pipefail
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-optional-governance.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-optional-governance-remote.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-admin-settings-persistence.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-server-write-catalog.php
          php -l wp-content/plugins/mad4b-site-control-plane/config/remote-operation-catalog.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-operator-control-center.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-operator-workspace.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-admin-navigation-manifest.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-managed-skills-lease.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-servers.php
          php -l wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php
          php wp-content/plugins/mad4b-site-control-plane/tests/optional-governance-runtime.php
