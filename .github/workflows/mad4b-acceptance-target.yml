name: MAD4B Acceptance Target

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/adapters/class-mad4b-scp-acceptance-target-adapter.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/adapters/class-mad4b-scp-adapter-base.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/acceptance-target-contract.py'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/acceptance-target-runtime.php'
      - '.github/workflows/mad4b-acceptance-target.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-acceptance-target-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance-target-contract:
    name: Governed acceptance target contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: PHP lint acceptance target
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/plugins/mad4b-site-control-plane/includes/adapters/class-mad4b-scp-acceptance-target-adapter.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/adapters/class-mad4b-scp-adapter-base.php
          php -l wp-content/plugins/mad4b-site-control-plane/tests/acceptance-target-runtime.php

      - name: Verify bounded source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 wp-content/plugins/mad4b-site-control-plane/tests/acceptance-target-contract.py

      - name: Prove provision discovery and cleanup
        shell: bash
        run: |
          set -euo pipefail
          php wp-content/plugins/mad4b-site-control-plane/tests/acceptance-target-runtime.php
