name: MAD4B Provider Native Handoff
on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-provider-qualification-bridge/includes/class-mad4b-provider-native-handoff.php'
      - 'wp-content/plugins/mad4b-provider-qualification-bridge/tests/native-handoff-contract.php'
      - '.github/workflows/mad4b-provider-native-handoff.yml'
  push:
    paths:
      - 'wp-content/plugins/mad4b-provider-qualification-bridge/includes/class-mad4b-provider-native-handoff.php'
      - 'wp-content/plugins/mad4b-provider-qualification-bridge/tests/native-handoff-contract.php'
      - '.github/workflows/mad4b-provider-native-handoff.yml'
jobs:
  native-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Native provider handoff syntax and behavior
        run: |
          ROOT=wp-content/plugins/mad4b-provider-qualification-bridge
          php -l "$ROOT/includes/class-mad4b-provider-native-handoff.php"
          php -l "$ROOT/tests/native-handoff-contract.php"
          php "$ROOT/tests/native-handoff-contract.php"
