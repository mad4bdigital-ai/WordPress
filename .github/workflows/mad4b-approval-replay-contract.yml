name: MAD4B Approval Replay Contract

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-approval-tickets.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-authorization.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-identity-context.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-live-acceptance-finalizer.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/approval-ticket-replay-runtime.php'
      - '.github/workflows/mad4b-approval-replay-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-approval-replay-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay-contract:
    name: One-time approval execution lifecycle (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Execute double-permission and replay regression
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          php -l "$root/includes/class-mad4b-scp-approval-tickets.php"
          php -l "$root/includes/class-mad4b-scp-authorization.php"
          php -l "$root/includes/class-mad4b-scp-identity-context.php"
          php -l "$root/tests/approval-ticket-replay-runtime.php"
          php "$root/tests/approval-ticket-replay-runtime.php"

      - name: Verify permission preflights are non-consuming and execution claims are terminal
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane/includes'
          tickets="$root/class-mad4b-scp-approval-tickets.php"
          authz="$root/class-mad4b-scp-authorization.php"
          finalizer="$root/class-mad4b-scp-live-acceptance-finalizer.php"

          require_literal() {
            local label="$1"
            local needle="$2"
            local file="$3"
            if ! grep -Fq -- "$needle" "$file"; then
              echo "Missing approval lifecycle invariant: $label :: $needle :: $file" >&2
              exit 1
            fi
          }

          require_literal 'validate-exact-present' 'public static function validate_exact' "$tickets"
          require_literal 'authorize-exact-present' 'public static function authorize_exact' "$tickets"
          require_literal 'terminal-statuses-replay-denied' "array( 'used', 'executing', 'failed' )" "$tickets"
          require_literal 'claim-approved-to-executing' "SET status = 'executing'" "$tickets"
          require_literal 'finalize-claim-present' 'public static function finalize_claim' "$tickets"
          require_literal 'final-terminal-statuses' "array( 'used', 'failed' )" "$tickets"

          require_literal 'execution-boundary-contract' "const EXECUTION_BOUNDARY_CONTRACT = 'mad4b.authorization-execution-boundary.v1'" "$authz"
          require_literal 'readonly-preflight-caller' 'MAD4B_SCP_Approval_Tickets::authorize_exact' "$authz"
          require_literal 'claim-mutation-present' 'public static function claim_mutation' "$authz"
          require_literal 'terminal-claim-caller' 'MAD4B_SCP_Approval_Tickets::claim_exact' "$authz"
          require_literal 'target-fingerprint-binding' 'self::target_fingerprint' "$authz"
          require_literal 'ticket-class-binding' 'MAD4B_SCP_Impact_Policy::ticket_class_for' "$authz"
          require_literal 'execution-side-effects-marked' "\$decision['execution_side_effects'] = true;" "$authz"
          require_literal 'execution-boundary-meta' "'mad4b_execution_boundary'" "$authz"
          require_literal 'authorization-boot' "if ( function_exists( 'add_filter' ) ) MAD4B_SCP_Authorization::boot();" "$authz"

          if grep -Fq 'consume_exact(' "$authz"; then
            echo 'Authorization permission/execution contract must not use legacy consume_exact().' >&2
            exit 1
          fi

          require_literal 'replay-denial-observer' "'mad4b_approval_replay_denied' === (string) \$summary['reason_code']" "$finalizer"
          require_literal 'replay-denial-acceptance-event' "'mad4b/live-acceptance-replay-denied-observed'" "$finalizer"
