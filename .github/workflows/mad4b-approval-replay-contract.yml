name: MAD4B Approval Replay Contract

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-approval-tickets.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-authorization.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-identity-context.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-live-acceptance-finalizer.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/approval-ticket-replay-runtime.php'
      - '.github/workflows/mad4b-approval-replay-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-approval-replay-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay-contract:
    name: One-time approval execution lifecycle (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Execute double-permission and replay regression
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          php -l "$root/includes/class-mad4b-scp-approval-tickets.php"
          php -l "$root/includes/class-mad4b-scp-authorization.php"
          php -l "$root/includes/class-mad4b-scp-identity-context.php"
          php -l "$root/tests/approval-ticket-replay-runtime.php"
          php "$root/tests/approval-ticket-replay-runtime.php"

      - name: Verify permission checks are non-consuming and execution claims are terminal
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane/includes'
          tickets="$root/class-mad4b-scp-approval-tickets.php"
          authz="$root/class-mad4b-scp-authorization.php"
          finalizer="$root/class-mad4b-scp-live-acceptance-finalizer.php"

          grep -Fq 'public static function validate_exact' "$tickets"
          grep -Fq "array( 'used', 'executing', 'failed' )" "$tickets"
          grep -Fq "SET status = 'executing'" "$tickets"
          grep -Fq 'public static function finalize_claim' "$tickets"
          grep -Fq "array( 'used', 'failed' )" "$tickets"

          grep -Fq "const EXECUTION_BOUNDARY_CONTRACT = 'mad4b.approval-execution-boundary.v1'" "$authz"
          grep -Fq 'MAD4B_SCP_Approval_Tickets::validate_exact' "$authz"
          grep -Fq 'public static function claim_mutation' "$authz"
          grep -Fq 'MAD4B_SCP_Approval_Tickets::claim_exact' "$authz"
          grep -Fq "'execution_side_effects' => false" "$authz"
          grep -Fq "'mad4b_execution_boundary'" "$authz"
          grep -Fq "if ( function_exists( 'add_filter' ) ) MAD4B_SCP_Authorization::boot();" "$authz"

          if grep -Fq 'consume_exact(' "$authz"; then
            echo 'Authorization permission/execution contract must not use legacy consume_exact().' >&2
            exit 1
          fi

          grep -Fq "'mad4b_approval_replay_denied' === (string) \$summary['reason_code']" "$finalizer"
          grep -Fq "'mad4b/live-acceptance-replay-denied-observed'" "$finalizer"
