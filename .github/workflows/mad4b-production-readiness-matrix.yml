name: MAD4B Production Readiness Matrix

# Every PR head is evaluated, including source changes outside the checklist.
# Reports are read-only and do not certify live site or authorize a deployment.
on:
  pull_request:
  push:
    branches: [master, 'develop/production-readiness-*', 'develop/readiness-registry-*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mad4b-readiness-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  production-matrix-contract:
    name: Production readiness matrix contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact checkout identity
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          python3 --version
      - name: Validate audit matrix and policy bindings
        run: |
          set -euo pipefail
          python3 tools/production_readiness_matrix.py validate
          python3 tools/production_readiness_matrix.py self-test
      - name: Test dynamic coverage fail-closed scenarios
        run: |
          set -euo pipefail
          python3 tools/production_readiness_registry.py self-test
          python3 tests/production_readiness_registry_contract.py
      - name: Resolve immutable PR base and enforce capability coverage
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$PR_BASE_SHA"
          if [[ ! "$BASE_SHA" =~ ^[a-f0-9]{40}$ || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA" --depth=1
          fi
          git merge-base --is-ancestor "$BASE_SHA" "$EXACT_HEAD" || {
            echo 'Reviewed base is not an ancestor of exact PR head'; exit 1;
          }
          python3 tools/production_readiness_registry.py evaluate \
            --base-sha "$BASE_SHA" \
            --head-sha "$EXACT_HEAD" \
            --out artifacts/production-readiness
          cat artifacts/production-readiness/capability-impact.md >> "$GITHUB_STEP_SUMMARY"
      - name: Generate exact-head read-only evaluation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/production_readiness_matrix.py render \
            --head-sha "$EXACT_HEAD" \
            --repo "$GITHUB_REPOSITORY" \
            --out artifacts/production-readiness
          cat artifacts/production-readiness/readiness.md >> "$GITHUB_STEP_SUMMARY"
      - name: Assert report is not Production authorization
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("artifacts/production-readiness/readiness.json").read_text())
          assert p["contract"] == "mad4b.production-readiness-evaluation.v1"
          assert p["decision"] == "NO-GO"
          assert p["authorizing"] is False and p["mutation_performed"] is False
          assert p["production_ready"] is False and p["production_authorized"] is False
          assert p["totals"]["controls"] >= 170 and p["totals"]["domains"] >= 21
          assert p["totals"]["production_stages"] >= 14
          assert p["totals"]["feature_workstreams"] >= 23
          assert len(p["independent_signoffs"]) >= 11
          assert all(s["status"] == "PENDING_EXTERNAL_SIGNED_APPROVAL"
                     for s in p["independent_signoffs"])
          assert p["historical_observations_non_authoritative"] is True
          print("PRODUCTION_MATRIX_NON_AUTHORIZING: PASS")
          PY
      - name: Upload generated matrix reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mad4b-production-readiness-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/production-readiness/
          retention-days: 30
          if-no-files-found: warn
