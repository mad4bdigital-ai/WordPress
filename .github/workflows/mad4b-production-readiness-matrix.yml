name: MAD4B Production Readiness Matrix

# Every PR head is evaluated, including source changes outside the checklist.
# Reports are read-only and do not certify live site or authorize a deployment.
on:
  pull_request:
  push:
    branches: [master, 'develop/production-readiness-*', 'develop/readiness-registry-*']
    # Run a new read-only evaluation when an explicit readiness release-candidate tag is pushed.
    tags: ['readiness/v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mad4b-readiness-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  production-matrix-contract:
    name: Production readiness matrix contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact checkout identity
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          python3 --version
      - name: Exercise the fail-closed Git tag trigger contract
        run: |
          set -euo pipefail
          python3 tools/readiness_tag_policy.py self-test
      - name: Exercise governed comment dispatcher security contract
        run: |
          set -euo pipefail
          python3 tests/readiness_comment_dispatch_contract.py
      - name: Verify exact governed readiness tag and master ancestry
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        env:
          TAG_REF: ${{ github.ref }}
          EXACT_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 tools/readiness_tag_policy.py verify \
            --ref "$TAG_REF" \
            --head-sha "$EXACT_HEAD" \
            --out artifacts/production-readiness
          cat artifacts/production-readiness/tag-trigger-evidence.md >> "$GITHUB_STEP_SUMMARY"
      - name: Validate audit matrix and policy bindings
        run: |
          set -euo pipefail
          python3 tools/production_readiness_matrix.py validate
          python3 tools/production_readiness_matrix.py self-test
          python3 tools/readiness_csv.py
      - name: Inventory existing source capabilities without baseline certification
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/readiness_baseline.py self-test
          python3 tools/readiness_baseline.py render \
            --head-sha "$EXACT_HEAD" \
            --out artifacts/production-readiness
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("artifacts/production-readiness/baseline-inventory.json").read_text())
          assert p["contract"] == "mad4b.baseline-capability-inventory.v1"
          assert p["authorizing"] is False and p["production_authorized"] is False
          assert p["total_observed"] >= p["reviewed_source_entries"]
          assert all(x["live_site_verified"] is False and
                     x["production_authorized"] is False for x in p["records"])
          print("BASELINE_REVIEW_GAPS_NOT_AUTOCERTIFIED: PASS")
          PY

      - name: Test dynamic coverage fail-closed scenarios
        run: |
          set -euo pipefail
          python3 tools/production_readiness_registry.py self-test
          python3 tests/production_readiness_registry_contract.py
      - name: Resolve immutable PR base and enforce capability coverage
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$PR_BASE_SHA"
          if [[ ! "$BASE_SHA" =~ ^[a-f0-9]{40}$ || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA" --depth=1
          fi
          if ! git merge-base --is-ancestor "$BASE_SHA" "$EXACT_HEAD"; then
            # Base branch can advance while a stacked PR is open. Compare
            # against the immutable fork point rather than fail or trust a
            # mutable base head that is not in the PR ancestry.
            BASE_SHA="$(git merge-base "$BASE_SHA" "$EXACT_HEAD")"
            test -n "$BASE_SHA"
          fi
          echo "Readiness compared exact head $EXACT_HEAD against fork $BASE_SHA"
          # On missing coverage, retain the exact-head gap report artifact,
          # preserve nonzero exit status, and never continue to certification.
          set +e
          python3 tools/production_readiness_registry.py evaluate \
            --base-sha "$BASE_SHA" \
            --head-sha "$EXACT_HEAD" \
            --out artifacts/production-readiness
          COVERAGE_RESULT=$?
          set -e
          if test -f artifacts/production-readiness/capability-impact.md; then
            cat artifacts/production-readiness/capability-impact.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$COVERAGE_RESULT"
      - name: Setup PHP for mapped WordPress runtime regressions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Provision authentic isolated WordPress for mapped native source tests
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-readiness-wordpress
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          mkdir -p "$WP_PATH"
          php /tmp/wp-cli.phar core download --path="$WP_PATH" --version=latest
          php /tmp/wp-cli.phar config create --path="$WP_PATH" --dbname=wordpress \
            --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core install --path="$WP_PATH" \
            --url='https://readiness-ci.example.invalid' --title='MAD4B CI Readiness' \
            --admin_user=mad4b-ci-admin --admin_password='disposable-ci-only' \
            --admin_email='ci@example.invalid' --skip-email
          php /tmp/wp-cli.phar config set WP_ENVIRONMENT_TYPE staging --type=constant --path="$WP_PATH"
          python3 wp-content/plugins/mad4b-site-control-plane/tests/materialize-packaged-plugin.py \
            --archive wp-content/plugins/mcp-adapter.zip \
            --plugins-dir "$WP_PATH/wp-content/plugins" --slug mcp-adapter
          cp -R wp-content/plugins/mad4b-site-control-plane "$WP_PATH/wp-content/plugins/"
          php /tmp/wp-cli.phar plugin activate mcp-adapter --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate mad4b-site-control-plane --path="$WP_PATH"
          # Isolated OAuth-only Site Profile; leave all Write/production grants off.
          php /tmp/wp-cli.phar eval '
          $result = MAD4B_SCP_Site_Profile::save_current_site( array(
            "expected_revision" => 0,
            "display_name" => "MAD4B Readiness CI",
            "chatgpt_app_id" => "",
            "oauth_user_ids" => array( get_current_user_id() ),
            "oauth_enabled" => true,
            "skills_enabled" => false,
            "write_enabled" => false,
            "production_write_confirmed" => false,
            "provider_isolation_enabled" => false,
            "managed_runtime_enabled" => false,
            "acceptance_enabled" => false
          ) );
          if ( is_wp_error( $result ) || empty( $result["configured"] )
            || empty( $result["origin_match"] ) || empty( $result["environment_match"] ) )
            throw new RuntimeException("Disposable OAuth Site Profile binding failed");
          if ( MAD4B_SCP_Staging_Write_Authority::eligible() )
            throw new RuntimeException("OAuth-only CI unexpectedly gained Write authority");
          ' --path="$WP_PATH" --user=mad4b-ci-admin
          php /tmp/wp-cli.phar eval '
          $status = MAD4B_SCP_Staging_OAuth_Autoconfig::bootstrap();
          if ( empty( $status["configured"] ) || ! empty( $status["blocker"] )
            || (int) ( $status["wp_user_id"] ?? 0 ) !== 1 )
            throw new RuntimeException("Disposable OAuth bootstrap denied: ".wp_json_encode($status));
          if ( MAD4B_SCP_Staging_Write_Authority::eligible() )
            throw new RuntimeException("OAuth bootstrap must not grant Write");
          ' --path="$WP_PATH" --user=mad4b-ci-admin
          # Explicit fixture identity for Brand Integrity positive checks on
          # this ephemeral DB only. No source approvals, assets, or grants.
          php /tmp/wp-cli.phar eval '
          $site = MAD4B_SCP_Site_Profile::status();
          if ( empty($site["configured"]) || empty($site["origin_match"])
            || empty($site["environment_match"]) || empty($site["site_uuid"])
            || wp_get_environment_type() !== "staging" )
            throw new RuntimeException("Unbound CI site cannot construct Brand fixture");
          if ( get_option(MAD4B_SCP_Context_Authority::PROFILE_OPTION, false) !== false )
            throw new RuntimeException("Existing Brand identity must never be replaced");
          $record = array(
            "contract" => MAD4B_SCP_Context_Authority::PROFILE_CONTRACT,
            "site_uuid" => $site["site_uuid"],
            "brand_id" => "readiness-test-brand",
            "brand_name" => "MAD4B Readiness TEST",
            "revision" => 1,
            "status" => "test_only",
            "context_policy" => "staging_test_only_no_external_authority",
            "context_fingerprint" => MAD4B_SCP_Context_Authority::context_fingerprint(),
            "review_policy" => array("mode"=>"human_only"),
          );
          if ( ! add_option(MAD4B_SCP_Context_Authority::PROFILE_OPTION, $record, "", false)
            || MAD4B_SCP_Context_Authority::profile() !== $record )
            throw new RuntimeException("Disposable Brand identity failed exact readback");
          if ( MAD4B_SCP_Context_Authority::assets() !== array()
            || MAD4B_SCP_Staging_Write_Authority::eligible()
            || get_option("mad4b_scp_context_sources_v1", array()) !== array() )
            throw new RuntimeException("CI Brand fixture acquired unexpected source or Write authority");
          ' --path="$WP_PATH" --user=mad4b-ci-admin
          # Only this disposable CI site gets a synthetic tour post-type/record.
          # The tested Brand Integrity engine remains the real original plugin.
          mkdir -p "$WP_PATH/wp-content/mu-plugins"
          cat > "$WP_PATH/wp-content/mu-plugins/ci-tour-type.php" <<'PHP_TOUR'
          <?php
          add_action('init', static function() {
              if (!post_type_exists('tours-and-activities')) {
                  register_post_type('tours-and-activities', array('public'=>true));
              }
          }, 1);
          PHP_TOUR
          php /tmp/wp-cli.phar post create --path="$WP_PATH" \
            --post_type=tours-and-activities --post_status=publish \
            --post_title='Discover Egypt and the Giza Pyramids' --porcelain >/dev/null
          php /tmp/wp-cli.phar plugin is-active mcp-adapter --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin is-active mad4b-site-control-plane --path="$WP_PATH"
          echo 'READINESS_DISPOSABLE_WORDPRESS_PROVISIONED: PASS'

      - name: Execute required mapped regression tests, not merely check filenames
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Materialize only the certified, already-vendored official Adapter.
          # Exact archive size + SHA256 are required before offline DTO tests.
          python3 - <<'PY_MCP_CERT'
          import hashlib, json
          from pathlib import Path
          root=Path("wp-content/plugins/mad4b-site-control-plane")
          cert=json.loads((root/"config/certified-providers.json").read_text())["providers"]["mcp_adapter"]
          archive=Path("wp-content/plugins/mcp-adapter.zip")
          if archive.is_symlink() or not archive.is_file():
              raise SystemExit("Bundled MCP Adapter archive unavailable or symlinked")
          if archive.stat().st_size != int(cert["release_asset_bytes"]):
              raise SystemExit("Bundled MCP Adapter archive byte length differs from certified source")
          if hashlib.sha256(archive.read_bytes()).hexdigest()!=cert["archive_sha256"]:
              raise SystemExit("Bundled MCP Adapter SHA256 differs from certified source")
          print("READINESS_MCP_OFFICIAL_ARCHIVE_PIN: PASS")
          PY_MCP_CERT
          python3 wp-content/plugins/mad4b-site-control-plane/tests/materialize-packaged-plugin.py \
            --archive wp-content/plugins/mcp-adapter.zip \
            --plugins-dir /tmp/mad4b-readiness-certified-mcp-adapter --slug mcp-adapter
          test -f /tmp/mad4b-readiness-certified-mcp-adapter/mcp-adapter/vendor/autoload.php
          python3 tools/readiness_test_execution.py self-test
          python3 tools/readiness_test_execution.py evaluate \
            --head-sha "$EXACT_HEAD" \
            --impact artifacts/production-readiness/capability-impact.json \
            --out artifacts/production-readiness
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("artifacts/production-readiness/executed-regressions.json").read_text())
          impact=json.loads(Path("artifacts/production-readiness/capability-impact.json").read_text())
          assert report["contract"] == "mad4b.readiness-executed-regressions.v1"
          assert report["authorizing"] is False and report["production_authorized"] is False
          assert report["exact_head_sha"] == impact["exact_head_sha"]
          assert sorted(x["path"] for x in report["tests"]) == sorted(impact["required_regression_tests"])
          assert report["passed_count"] == report["required_count"]
          print("MAPPED_REGRESSION_EXECUTION_GATE: PASS")
          PY
      - name: Verify per-control history stays non-authorizing
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("artifacts/production-readiness/control-history.json").read_text())
          assert p["contract"] == "mad4b.readiness-control-head-history.v1"
          assert p["authorizing"] is False
          assert p["all_live_evidence_unverified"] is True
          assert len(p["controls"]) >= 170
          delta=json.loads(Path("artifacts/production-readiness/control-delta.json").read_text())
          assert delta["contract"] == "mad4b.readiness-control-delta.v1"
          assert delta["authorizing"] is False and delta["production_authorized"] is False
          assert sum(delta["counts"].values()) == len(p["controls"])
          assert all(x["live_evidence_status"] == "UNVERIFIED"
                     and x["authorizing"] is False for x in delta["revisions"])
          assert all(x["live_evidence_status"] == "UNVERIFIED" and
                     x["production_authorized"] is False
                     for x in p["controls"])
          print("PER_CONTROL_HISTORY_NON_AUTHORIZING: PASS")
          PY
      - name: Generate exact-head read-only evaluation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/production_readiness_matrix.py render \
            --head-sha "$EXACT_HEAD" \
            --repo "$GITHUB_REPOSITORY" \
            --out artifacts/production-readiness
          cat artifacts/production-readiness/readiness.md >> "$GITHUB_STEP_SUMMARY"
      - name: Assert report is not Production authorization
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("artifacts/production-readiness/readiness.json").read_text())
          assert p["contract"] == "mad4b.production-readiness-evaluation.v1"
          assert p["decision"] == "NO-GO"
          assert p["authorizing"] is False and p["mutation_performed"] is False
          assert p["production_ready"] is False and p["production_authorized"] is False
          assert p["totals"]["controls"] >= 170 and p["totals"]["domains"] >= 21
          assert p["totals"]["production_stages"] >= 14
          assert p["totals"]["feature_workstreams"] >= 23
          assert len(p["independent_signoffs"]) >= 11
          assert all(s["status"] == "PENDING_EXTERNAL_SIGNED_APPROVAL"
                     for s in p["independent_signoffs"])
          assert p["historical_observations_non_authoritative"] is True
          print("PRODUCTION_MATRIX_NON_AUTHORIZING: PASS")
          PY
      - name: Validate evidence envelope and quality indicator guardrails
        run: |
          set -euo pipefail
          python3 tools/readiness_evidence.py
          python3 tools/readiness_quality.py self-test

      - name: Generate non-authorizing five-KPI scorecard
        run: |
          set -euo pipefail
          python3 tools/readiness_quality.py evaluate \
            --impact artifacts/production-readiness/capability-impact.json \
            --readiness artifacts/production-readiness/readiness.json \
            --out artifacts/production-readiness
          cat artifacts/production-readiness/quality-scorecard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check quality result never impersonates independent release evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("artifacts/production-readiness/quality-scorecard.json").read_text())
          assert p["contract"] == "mad4b.readiness-quality-report.v1"
          assert p["production_decision"] == "NO-GO"
          assert p["authorizing"] is False and p["production_authorized"] is False
          assert len(p["metrics"]) == 5
          assert all(metric["measured_value"] is None or
                     metric["provenance"] == "EXACT_HEAD_SOURCE_DIFF_ONLY"
                     for metric in p["metrics"])
          assert p["data_trust"] == "REPOSITORY_ONLY_WITHOUT_SIGNED_SITE_OR_PRODUCTION_AUDIT"
          print("FIVE_KPI_READINESS_NON_AUTHORIZING: PASS")
          PY

      - name: Upload generated matrix reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mad4b-production-readiness-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/production-readiness/
          retention-days: 30
          if-no-files-found: warn
