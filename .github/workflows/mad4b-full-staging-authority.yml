name: MAD4B Full Staging Authority Contract

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-full-staging-authority.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-developer-runtime.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-developer-authority.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-servers.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-local-oauth-server.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-local-oauth-consent-ui.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/full-staging-authority-contract.py'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/local-oauth-consent-ui-contract.php'
      - '.github/workflows/mad4b-full-staging-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Full Staging authority contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Syntax and contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-full-staging-authority.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-developer-runtime.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-developer-authority.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-servers.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-local-oauth-server.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-local-oauth-consent-ui.php
          python3 wp-content/plugins/mad4b-site-control-plane/tests/full-staging-authority-contract.py
          php wp-content/plugins/mad4b-site-control-plane/tests/local-oauth-consent-ui-contract.php
