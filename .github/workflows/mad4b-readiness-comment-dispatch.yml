name: MAD4B Governed Readiness Comment Dispatch

# Trusted default-branch receiver. Never execute pull-request code here.
on:
  issue_comment:
    types: [created]
  commit_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: write

concurrency:
  group: mad4b-readiness-comment-${{ github.event.issue.number || github.event.comment.commit_id }}
  cancel-in-progress: false

jobs:
  request-readiness-rerun:
    name: Owner-comment exact-head readiness rerun
    if: startsWith(github.event.comment.body, '/run-production-readiness ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch dispatcher only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify bounded read-only rerun contract
        run: python3 tests/readiness_comment_dispatch_contract.py
      - name: Authorize exact-head comment and rerun matching PR workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/readiness_comment_dispatch.py
