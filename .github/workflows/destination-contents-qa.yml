name: MAD4B Destination Contents QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'wp-content/mu-plugins/mad4b-destination-contents-widget.php'
      - 'wp-content/mu-plugins/assets/mad4b-destination-contents-native.js'
      - 'wp-content/mu-plugins/assets/mad4b-destination-contents-native.css'
      - 'wp-content/mu-plugins/assets/class-mad4b-destination-contents-widget.php'
      - 'tests/destination-contents/**'
      - '.github/workflows/destination-contents-qa.yml'
jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - name: Test native TOC source order, missing anchors, responsive updates and dynamic replacement
        run: node tests/destination-contents/contents.spec.cjs
      - name: Lint JavaScript and PHP
        run: |
          node --check wp-content/mu-plugins/assets/mad4b-destination-contents-native.js
          php -l wp-content/mu-plugins/mad4b-destination-contents-widget.php
          php -l wp-content/mu-plugins/assets/class-mad4b-destination-contents-widget.php
