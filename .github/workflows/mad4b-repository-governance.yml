name: MAD4B Repository Governance

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-repository-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Repository governance policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Verify governance bootstrap tool contract
        shell: bash
        run: |
          set -euo pipefail
          python3 wp-content/plugins/mad4b-site-control-plane/tests/repository-governance-bootstrap-tool-contract.py

      - name: Verify repository governance bootstrap is retired
        shell: bash
        run: |
          set -euo pipefail
          python3 wp-content/plugins/mad4b-site-control-plane/tests/repository-governance-bootstrap-retirement-contract.py

      - name: Verify repository-owned feature boundary root of trust
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/verify_feature_boundary.py
          python3 tools/verify_feature_boundary.py --self-test
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.github/mad4b-feature-boundary-grants.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          if data.get('contract')!='mad4b.feature-boundary-grants.v1':
              raise SystemExit('feature-boundary grants contract mismatch')
          if data.get('repository_governance_contract')!='mad4b.repository-governance-policy.v1':
              raise SystemExit('feature-boundary repository policy binding mismatch')
          immutable=set(data.get('immutable_global_paths') or [])
          required={
              '.github/mad4b-repository-governance-policy.json',
              '.github/mad4b-feature-boundary-grants.json',
              '.github/mad4b-master-ruleset-template.json',
              '.github/workflows/mad4b-feature-boundary.yml',
              '.github/workflows/mad4b-release-verdict.yml',
              '.github/workflows/mad4b-repository-governance.yml',
              '.github/workflows/mad4b-owner-attestation-rerun.yml',
              'tools/Apply-Mad4bMasterRuleset.ps1',
              'tools/verify_feature_boundary.py',
              'tools/verify_repository_governance.py',
              'tools/verify_repository_owner_attestation.py',
          }
          if not required.issubset(immutable):
              raise SystemExit('feature-boundary immutable root incomplete')
          if '007' not in (data.get('features') or {}):
              raise SystemExit('Feature 007 grant missing')
          PY
          safety=(json.loads(Path('.github/mad4b-repository-governance-policy.json').read_text(encoding='utf-8')).get('single_owner_safety') or {})
          if safety.get('attestation_command')!='OWNER_ATTEST_SINGLE_OWNER':
              raise SystemExit('single-owner attestation command drift')
          if safety.get('authorized_owner_logins')!=['mad4bdigital-ai']:
              raise SystemExit('single-owner authorized login drift')
          if safety.get('owner_attestation_remains_exact_sha_scoped') is not True or safety.get('attestation_stale_on_descendant') is not True:
              raise SystemExit('single-owner exact-head staleness contract drift')

          boundary=Path('.github/workflows/mad4b-feature-boundary.yml').read_text(encoding='utf-8')
          for required_marker in [
              '  pull_request_target:',
              '    contents: read',
              'persist-credentials: false',
              'Checkout trusted base',
              'git fetch --no-tags --depth=1 origin "$HEAD_SHA"',
              'python3 tools/verify_feature_boundary.py',
              'Repository-owned feature boundary',
          ]:
              if required_marker not in boundary:
                  raise SystemExit('trusted feature-boundary workflow marker missing: ' + required_marker)
          if '  pull_request:\n' in boundary:
              raise SystemExit('feature-boundary root must not execute from PR HEAD via pull_request')
          for forbidden_permission in ['contents: write','actions: write','pull-requests: write','issues: write']:
              if forbidden_permission in boundary:
                  raise SystemExit('feature-boundary workflow unexpectedly has write permission: ' + forbidden_permission)

          owner_verifier=Path('tools/verify_repository_owner_attestation.py').read_text(encoding='utf-8')
          for required_marker in ['OWNER_ATTEST_SINGLE_OWNER','live_head != expected_head','authorized_owner_logins','stale_on_descendant']:
              if required_marker not in owner_verifier:
                  raise SystemExit('owner attestation verifier marker missing: ' + required_marker)

          print('mad4b.feature-boundary-grants.v1: PASS')
          print('mad4b.repository-owner-attestation.v1: PASS')
          print('mad4b.feature-boundary-trusted-invocation.v1: PASS')
          PY

      - name: Verify active master repository governance
        id: governance
        shell: bash
        run: |
          set -uo pipefail
          stdout=/tmp/mad4b-repository-governance.stdout
          stderr=/tmp/mad4b-repository-governance.stderr
          status=/tmp/mad4b-repository-governance-status.json
          rm -f "$stdout" "$stderr" "$status"

          set +e
          python3 tools/verify_repository_governance.py \
            --repository "$GITHUB_REPOSITORY" \
            --policy .github/mad4b-repository-governance-policy.json \
            --output "$status" >"$stdout" 2>"$stderr"
          rc=$?
          set -e

          cat "$stdout" || true
          cat "$stderr" >&2 || true

          if [ ! -s "$status" ]; then
            GOVERNANCE_RC="$rc" python3 - "$status" "$stderr" <<'PY'
          import json, os, sys
          from pathlib import Path
          status_path=Path(sys.argv[1])
          stderr_path=Path(sys.argv[2])
          reason=stderr_path.read_text(encoding='utf-8',errors='replace').strip()
          data={
              'contract':'mad4b.repository-governance-status.v1',
              'repository':os.environ.get('GITHUB_REPOSITORY',''),
              'target_ref':'refs/heads/master',
              'ready':False,
              'verification_exit_code':int(os.environ.get('GOVERNANCE_RC','1')),
              'failure_reason':reason or 'repository governance verification failed without diagnostic text',
          }
          status_path.write_text(json.dumps(data,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          fi

          echo "verification_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Upload governance status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mad4b-repository-governance-status-${{ env.SOURCE_SHA }}
          path: /tmp/mad4b-repository-governance-status.json
          if-no-files-found: ignore
          retention-days: 30
