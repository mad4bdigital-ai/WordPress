name: MAD4B RC22 Release Audit

on:
  pull_request:
    paths:
      - '.github/workflows/mad4b-release-rc22-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Audit rc.21 release references
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/dynamic-wordpress-skills-20260909'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact head and enumerate release references
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          echo 'Files containing 0.4.0-rc.21:'
          git grep -l '0.4.0-rc.21' || true
          count="$(git grep -l '0.4.0-rc.21' | wc -l | tr -d ' ')"
          echo "reference_file_count=${count}"
          test "$count" -gt 0
