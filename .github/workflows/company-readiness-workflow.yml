name: Company readiness workflow
on:
  pull_request:
    paths:
      - 'ops/company-readiness-workflow/**'
      - '.github/workflows/company-readiness-workflow.yml'
  push:
    branches: [master]
    paths:
      - 'ops/company-readiness-workflow/**'
      - '.github/workflows/company-readiness-workflow.yml'
jobs:
  bounded-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python script syntax
        run: python3 -m py_compile ops/company-readiness-workflow/orchestrate.py
      - name: Policy self-test: deny unqualified distribution
        run: python3 ops/company-readiness-workflow/orchestrate.py --selftest
      - name: Install PHP CLI
        run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
      - name: MU plugin syntax
        run: |
          php -l ops/company-readiness-workflow/staging-mu/241-mad4b-company-brand-readiness-hub.php
          php -l ops/company-readiness-workflow/staging-mu/242-mad4b-company-readiness-workflow.php
      - name: Source-neutral activation Python syntax
        run: |
          python3 -m py_compile ops/company-readiness-workflow/design-activation/wayfa-wpml-resolve.py
          python3 -m py_compile ops/company-readiness-workflow/design-activation/wayfa-design-activate.py
      - name: Schema-first and conditional resolution contract tests
        run: |
          python3 ops/company-readiness-workflow/design-activation/test_config_compatibility.py
          python3 -m py_compile ops/company-readiness-workflow/design-activation/wayfa-schema-compatibility.py
          python3 -m py_compile ops/company-readiness-workflow/design-activation/wayfa-template-diff-resolver.py
      - name: Source-neutral activation PHP syntax
        run: |
          php -l ops/company-readiness-workflow/design-activation/wayfa-wpml-resolve.php
          php -l ops/company-readiness-workflow/design-activation/wayfa-design-activate.php
      - name: Require tenant isolation and exact plan gates
        run: |
          grep -q "wayfatours_production" ops/company-readiness-workflow/design-activation/wayfa-design-activate.php
          grep -q "MAD4B_DESIGN_EXPECTED_PLAN" ops/company-readiness-workflow/design-activation/wayfa-design-activate.php
          grep -q "source_trids_reused.*false" ops/company-readiness-workflow/design-activation/wayfa-wpml-resolve.php
      - name: No automatic tenant change or credential files
        run: |
          ! grep -E 'auto_publish[[:space:]]*=[[:space:]]*True|checkout_enabled_by_workflow[[:space:]]*:[[:space:]]*True' ops/company-readiness-workflow/orchestrate.py
