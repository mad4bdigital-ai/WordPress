name: Company readiness workflow
on:
  pull_request:
    paths:
      - 'ops/company-readiness-workflow/**'
      - '.github/workflows/company-readiness-workflow.yml'
  push:
    branches: [master]
    paths:
      - 'ops/company-readiness-workflow/**'
      - '.github/workflows/company-readiness-workflow.yml'
jobs:
  bounded-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python script syntax
        run: python3 -m py_compile ops/company-readiness-workflow/orchestrate.py
      - name: Policy self-test: deny unqualified distribution
        run: python3 ops/company-readiness-workflow/orchestrate.py --selftest
      - name: Install PHP CLI
        run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
      - name: MU plugin syntax
        run: |
          php -l ops/company-readiness-workflow/staging-mu/241-mad4b-company-brand-readiness-hub.php
          php -l ops/company-readiness-workflow/staging-mu/242-mad4b-company-readiness-workflow.php
      - name: No automatic tenant change or credential files
        run: |
          ! grep -E 'auto_publish[[:space:]]*=[[:space:]]*True|checkout_enabled_by_workflow[[:space:]]*:[[:space:]]*True' ops/company-readiness-workflow/orchestrate.py
