permissions:
  contents: read

concurrency:
  group: mad4b-context-authority-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Keep incident coverage observable even when the separate, mandatory
  # Context architecture job fails before reaching its PHP runtime steps.
  recovery-incident-regressions:
    name: Context recovery regressions (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify pending revoke, exact callback, source scope and MCP inventory
        shell: bash
        run: |
          set -euo pipefail
          tests=wp-content/plugins/mad4b-site-control-plane/tests
          for fixture in \
            google-revocation-remote-runtime \
            context-oauth-lifecycle-runtime \
            context-google-retry-admission-runtime \
            deployment-binding-claim-context-runtime \
            deployment-binding-native-runtime \
            brand-core-remote-recovery-runtime \
            operational-integrity-local-runtime \
            mcp-peer-admin-rest-lifecycle-runtime \
            mcp-peer-inventory-bounds-runtime; do
            php -l "$tests/$fixture.php"
            php "$tests/$fixture.php"
          done

  context-authority:
    name: Context Authority (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: zip, mbstring

      - name: Lint Context Authority runtime
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-context-authority.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-google-drive-context.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-context-preflight.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-context-intelligence.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-context-admin-ui.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/adapters/class-mad4b-scp-context-adapter.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-skill-registry.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-skill-abilities.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-skills-admin-ui.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-skill-snapshot-identity.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-skill-exporter.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-authorization.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-staging-write-authority.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-staging-write-planning-guard.php
          php -l wp-content/plugins/mad4b-site-control-plane/tests/context-authority-runtime.php
          php -l wp-content/plugins/mad4b-site-control-plane/tests/context-native-owner-transfer-runtime.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-deployment-binding-native.php
