name: MAD4B Unified Agent Connection
on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-unified-agent-connection.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-chatgpt-connection-admin-ui.php'
      - 'wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/unified-agent-connection-contract.py'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/unified-agent-connection-runtime.php'
      - '.github/workflows/mad4b-unified-agent-connection.yml'
permissions:
  contents: read
concurrency:
  group: mad4b-unified-agent-connection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unified-agent-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4','8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: |
          set -euo pipefail
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-unified-agent-connection.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-chatgpt-connection-admin-ui.php
          php -l wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php
          python3 wp-content/plugins/mad4b-site-control-plane/tests/unified-agent-connection-contract.py
          php wp-content/plugins/mad4b-site-control-plane/tests/unified-agent-connection-runtime.php
          python3 wp-content/plugins/mad4b-site-control-plane/tests/context-ai-only-review-contract.py
