name: MAD4B Remote Resolve Live Bridge Source Tests
on:
  pull_request:
    paths:
      - 'ops/company-readiness-workflow/remote-resolve-live-v3/**'
      - '.github/workflows/mad4b-remote-resolve-live.yml'
  push:
    branches:
      - feat/remote-resolve-live-evidence-bridge-20261102
    paths:
      - 'ops/company-readiness-workflow/remote-resolve-live-v3/**'
      - '.github/workflows/mad4b-remote-resolve-live.yml'
jobs:
  read_only_source_tests:
    name: Remote Resolve exact-site source contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Python compile and unit contracts
        run: |
          python3 -m py_compile ops/company-readiness-workflow/remote-resolve-live-v3/live_status_bridge.py
          python3 -m unittest discover -s ops/company-readiness-workflow/remote-resolve-live-v3 -p 'test_*.py' -v
      - name: Reject privileged operations in the bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('ops/company-readiness-workflow/remote-resolve-live-v3/live_status_bridge.py').read_text()
          for term in ('import subprocess','import paramiko','os.system(', 'subprocess.run(', 'WP_CLI::', 'update_option(', 'grant_issued=True'):
              assert term not in source, term
          assert 'controller_issued_grants": False' in source
          assert 'controller_mutated_production": False' in source
          PY
