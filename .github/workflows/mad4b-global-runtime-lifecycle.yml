name: MAD4B Global Runtime Lifecycle
on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-global-runtime-lifecycle.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-provider-installed-artifact.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-provider-compatibility-certification.php'
      - 'wp-content/plugins/mad4b-site-control-plane/config/provider-capability-contracts.json'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/provider-installed-artifact-contract.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-scheduler-admission.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-scheduler-backlog.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-remote-work-queue.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-adaptive-operation-router.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-recovery-route-resolver.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/global-runtime-native-lanes-contract.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-capability-dependency-planner.php'
      - 'wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/global-runtime-lifecycle-contract.php'
      - 'wp-content/plugins/mad4b-lifecycle-orchestrator/**'
      - '.github/workflows/mad4b-global-runtime-lifecycle.yml'
  push:
    branches: [master]
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-global-runtime-lifecycle.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-provider-installed-artifact.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-provider-compatibility-certification.php'
      - 'wp-content/plugins/mad4b-site-control-plane/config/provider-capability-contracts.json'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/provider-installed-artifact-contract.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-scheduler-admission.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-scheduler-backlog.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-remote-work-queue.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-adaptive-operation-router.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-recovery-route-resolver.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/global-runtime-native-lanes-contract.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-capability-dependency-planner.php'
      - 'wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/global-runtime-lifecycle-contract.php'
      - '.github/workflows/mad4b-global-runtime-lifecycle.yml'
permissions:
  contents: read
concurrency:
  group: mad4b-mad4b-global-runtime-lifecycle-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  global-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Shared lifecycle policy source and runtime contract
        run: |
          set -euo pipefail
          ROOT=wp-content/plugins/mad4b-site-control-plane
          php -l "$ROOT/includes/class-mad4b-scp-global-runtime-lifecycle.php"
          php -l "$ROOT/mad4b-site-control-plane.php"
          php -l "$ROOT/includes/class-mad4b-scp-capability-dependency-planner.php"
          php "$ROOT/tests/global-runtime-lifecycle-contract.php"
          php "$ROOT/tests/global-runtime-native-lanes-contract.php"
          php -l "$ROOT/includes/class-mad4b-scp-provider-installed-artifact.php"
          php -l "$ROOT/includes/class-mad4b-scp-provider-compatibility-certification.php"
          php "$ROOT/tests/provider-installed-artifact-contract.php"
          php -r 'json_decode(file_get_contents("wp-content/plugins/mad4b-site-control-plane/config/provider-capability-contracts.json"), true, 512, JSON_THROW_ON_ERROR);'
          for file in scheduler-admission scheduler-backlog remote-work-queue adaptive-operation-router recovery-route-resolver; do
            php -l "$ROOT/includes/class-mad4b-scp-$file.php"
          done
          php -l wp-content/plugins/mad4b-lifecycle-orchestrator/class-mad4b-unified-governed-lifecycle-policy.php
          php wp-content/plugins/mad4b-lifecycle-orchestrator/tests/unified-policy-source-contract.php
