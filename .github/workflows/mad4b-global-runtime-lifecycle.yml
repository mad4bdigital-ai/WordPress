name: MAD4B Global Runtime Lifecycle
on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-global-runtime-lifecycle.php'
      - 'wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/global-runtime-lifecycle-contract.php'
      - 'wp-content/plugins/mad4b-lifecycle-orchestrator/**'
      - '.github/workflows/mad4b-global-runtime-lifecycle.yml'
  push:
    branches: [master]
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-global-runtime-lifecycle.php'
      - 'wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/global-runtime-lifecycle-contract.php'
      - '.github/workflows/mad4b-global-runtime-lifecycle.yml'
permissions:
  contents: read
jobs:
  global-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Shared lifecycle policy source and runtime contract
        run: |
          set -euo pipefail
          ROOT=wp-content/plugins/mad4b-site-control-plane
          php -l "$ROOT/includes/class-mad4b-scp-global-runtime-lifecycle.php"
          php -l "$ROOT/mad4b-site-control-plane.php"
          php "$ROOT/tests/global-runtime-lifecycle-contract.php"
          php -l wp-content/plugins/mad4b-lifecycle-orchestrator/class-mad4b-unified-governed-lifecycle-policy.php
          php wp-content/plugins/mad4b-lifecycle-orchestrator/tests/unified-policy-source-contract.php
