name: DFSB Governed Owner-Comment Signed Review Dispatch

# Trusted master receiver only. Never evaluate or checkout pull-request code.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: write

concurrency:
  group: dfsb-owner-review-dispatch-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  owner-signed-review-command:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'mad4bdigital-ai' &&
      github.event.sender.login == 'mad4bdigital-ai' &&
      startsWith(github.event.comment.body, '/run-dfsb-release-review ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted master dispatcher only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify owner command security contract
        run: python3 tests/dfsb-owner-command-dispatch-contract.py
      - name: Authorize exact reviewed source and dispatch review signing only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/dfsb-neutral/owner_command_dispatch.py
