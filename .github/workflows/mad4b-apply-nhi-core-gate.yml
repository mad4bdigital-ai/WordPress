name: MAD4B Core NHI Gate

on:
  pull_request:
    paths:
      - '.github/workflows/mad4b-apply-nhi-core-gate.yml'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-abilities.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-servers.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-authorization.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-agent-registry.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-mutation-manager.php'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mad4b-core-nhi-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Wire reversible mutation abilities deterministically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          abilities = Path('wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-abilities.php')
          s = abilities.read_text('utf-8')

          audit_registration = "\t\t$this->add( 'mad4b/audit-tail', 'Read Audit Trail', 'mad4b-admin', 'audit_tail', 'admin', $this->schema(\n\t\t\tarray( 'limit' => array( 'type' => 'integer', 'minimum' => 1, 'maximum' => 200, 'default' => 50 ) )\n\t\t), false, true, false, true );"
          mutation_registration = """\t\t$this->add( 'mad4b/mutation-get', 'Get Mutation Evidence', 'mad4b-admin', 'mutation_get', 'admin', $this->schema(
\t\t\tarray( 'mutation_id' => array( 'type' => 'string', 'minLength' => 36, 'maxLength' => 64 ) ), array( 'mutation_id' )
\t\t), false, true, false, true );
\t\t$this->add( 'mad4b/mutation-undo', 'Undo Verified Mutation', 'mad4b-admin', 'mutation_undo', 'admin', $this->schema(
\t\t\tarray(
\t\t\t\t'mutation_id' => array( 'type' => 'string', 'minLength' => 36, 'maxLength' => 64 ),
\t\t\t\t'reason' => array( 'type' => 'string', 'minLength' => 3, 'maxLength' => 500 ),
\t\t\t), array( 'mutation_id', 'reason' )
\t\t), false, false, true, false );"""
          if "'mad4b/mutation-get'" not in s:
              if s.count(audit_registration) != 1:
                  raise SystemExit('Unexpected audit-tail registration marker.')
              s = s.replace(audit_registration, audit_registration + "\n" + mutation_registration, 1)

          manager_method = """\tpublic function content_update_post( $input ) {
\t\tif ( ! class_exists( 'MAD4B_SCP_Mutation_Manager' ) ) return new WP_Error( 'mad4b_mutation_manager_unavailable', 'Reversible mutation manager is unavailable.' );
\t\treturn MAD4B_SCP_Mutation_Manager::execute_post_update( $input );
\t}

\tpublic function mutation_get( $input ) {
\t\t$record = MAD4B_SCP_Mutation_Manager::get( isset( $input['mutation_id'] ) ? (string) $input['mutation_id'] : '' );
\t\tif ( ! $record ) return new WP_Error( 'mad4b_mutation_missing', 'Mutation record was not found.' );
\t\tunset( $record['rollback_payload'], $record['rollback_payload_sha256'] );
\t\tif ( isset( $record['subject_fingerprint'] ) ) $record['subject_fingerprint'] = substr( (string) $record['subject_fingerprint'], 0, 16 );
\t\treturn array( 'mutation' => $record );
\t}

\tpublic function mutation_undo( $input ) {
\t\tif ( ! class_exists( 'MAD4B_SCP_Mutation_Manager' ) ) return new WP_Error( 'mad4b_mutation_manager_unavailable', 'Reversible mutation manager is unavailable.' );
\t\t$result = MAD4B_SCP_Mutation_Manager::undo_post_mutation( isset( $input['mutation_id'] ) ? (string) $input['mutation_id'] : '' );
\t\tif ( ! is_wp_error( $result ) && is_array( $result ) ) $result['reason'] = sanitize_text_field( (string) $input['reason'] );
\t\treturn $result;
\t}

"""
          if 'MAD4B_SCP_Mutation_Manager::execute_post_update' not in s:
              pattern = re.compile(r"\tpublic function content_update_post\( \$input \) \{.*?\n\t\}\n\n(?=\tpublic function plugin_activate)", re.S)
              matches = list(pattern.finditer(s))
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one legacy content_update_post block, got {len(matches)}.')
              s = pattern.sub(manager_method, s, count=1)

          abilities.write_text(s, encoding='utf-8')

          servers = Path('wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-servers.php')
          q = servers.read_text('utf-8')
          old_admin = "'mad4b/plugin-activate', 'mad4b/plugin-deactivate', 'mad4b/filesystem-write', 'mad4b/filesystem-patch', 'mad4b/database-update', 'mad4b/audit-tail'"
          new_admin = "'mad4b/plugin-activate', 'mad4b/plugin-deactivate', 'mad4b/filesystem-write', 'mad4b/filesystem-patch', 'mad4b/database-update', 'mad4b/audit-tail', 'mad4b/mutation-get', 'mad4b/mutation-undo'"
          if "'mad4b/mutation-undo'" not in q:
              if q.count(old_admin) != 1:
                  raise SystemExit('Unexpected admin server tool list shape.')
              q = q.replace(old_admin, new_admin, 1)
          servers.write_text(q, encoding='utf-8')
          PY

      - name: Verify exact mutation and NHI contracts
        shell: bash
        run: |
          set -euo pipefail
          root='wp-content/plugins/mad4b-site-control-plane'
          abilities="$root/includes/class-mad4b-scp-abilities.php"
          servers="$root/includes/class-mad4b-scp-servers.php"
          adapter="$root/includes/adapters/class-mad4b-scp-adapter-base.php"
          authz="$root/includes/class-mad4b-scp-authorization.php"
          registry="$root/includes/class-mad4b-scp-agent-registry.php"
          manager="$root/includes/class-mad4b-scp-mutation-manager.php"
          php -l "$abilities"
          php -l "$servers"
          php -l "$adapter"
          php -l "$authz"
          php -l "$registry"
          php -l "$manager"
          grep -Fq "authorize_mutation( \$ability_name, \$server_id, 'core', \$input )" "$abilities"
          grep -Fq "authorize_mutation( \$ability_name, 'mad4b-' . sanitize_key( \$surface )" "$adapter"
          grep -Fq "MAD4B_SCP_Mutation_Manager::execute_post_update" "$abilities"
          grep -Fq "mad4b/mutation-get" "$servers"
          grep -Fq "mad4b/mutation-undo" "$servers"
          grep -Fq "mad4b_undo_state_drift" "$manager"
          grep -Fq "exact_grant" "$authz"
          grep -Fq "mad4b_wildcard_grant_denied" "$registry"

      - name: Publish patch without force push
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Mutation/NHI wiring already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-abilities.php \
                  wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-servers.php
          git commit -m 'feat(mcp): expose governed mutation evidence and undo'
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort || true
              echo 'Mutation wiring conflicts with newer branch changes; refusing overwrite.' >&2
              exit 1
            fi
            if git push origin "HEAD:${BRANCH}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo 'Unable to publish mutation wiring after three non-force retries.' >&2
          exit 1
