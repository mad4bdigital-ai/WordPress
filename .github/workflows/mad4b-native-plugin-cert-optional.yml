name: MAD4B Native Plugin Update Without Package Certificate

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-plugin-transaction.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/plugin-transaction-native-cert-optional.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-plugin-update-recovery.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/plugin-update-recovery-native-cert-optional.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-cross-plugin-deployment.php'
      - 'wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-cross-plugin-lifecycle.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/cross-plugin-deployment-runtime.php'
      - '.github/workflows/mad4b-native-plugin-cert-optional.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-replacement-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate native update policy
        run: |
          set -euo pipefail
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-plugin-transaction.php
          php -l wp-content/plugins/mad4b-site-control-plane/tests/plugin-transaction-native-cert-optional.php
          php wp-content/plugins/mad4b-site-control-plane/tests/plugin-transaction-native-cert-optional.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-plugin-update-recovery.php
          php -l wp-content/plugins/mad4b-site-control-plane/tests/plugin-update-recovery-native-cert-optional.php
          php wp-content/plugins/mad4b-site-control-plane/tests/plugin-update-recovery-native-cert-optional.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-cross-plugin-deployment.php
          php -l wp-content/plugins/mad4b-site-control-plane/includes/class-mad4b-scp-cross-plugin-lifecycle.php
          php wp-content/plugins/mad4b-site-control-plane/tests/cross-plugin-deployment-runtime.php
          php wp-content/plugins/mad4b-site-control-plane/tests/cross-plugin-lifecycle-gates-runtime.php
