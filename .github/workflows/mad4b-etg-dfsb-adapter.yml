name: MAD4B ETG DFSB Adapter

on:
  pull_request:
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/adapters/class-mad4b-scp-etg-dfsb-adapter.php'
      - 'wp-content/plugins/mad4b-site-control-plane/config/adapter-support-catalog.json'
      - 'wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/etg-dfsb-adapter-contract.py'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/runtime-etg-dfsb-mcp-smoke.php'
      - '.github/workflows/mad4b-etg-dfsb-adapter.yml'
  push:
    branches: [master]
    paths:
      - 'wp-content/plugins/mad4b-site-control-plane/includes/adapters/class-mad4b-scp-etg-dfsb-adapter.php'
      - 'wp-content/plugins/mad4b-site-control-plane/config/adapter-support-catalog.json'
      - 'wp-content/plugins/mad4b-site-control-plane/mad4b-site-control-plane.php'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/etg-dfsb-adapter-contract.py'
      - 'wp-content/plugins/mad4b-site-control-plane/tests/runtime-etg-dfsb-mcp-smoke.php'
      - '.github/workflows/mad4b-etg-dfsb-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-etg-dfsb-adapter-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  ETG_HEAD: 162ee66bdf8a8a472f5b547253064ade5842bf05

jobs:
  contract:
    name: ETG DFSB read-only MCP contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify read-only adapter contract
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/plugins/mad4b-site-control-plane/includes/adapters/class-mad4b-scp-etg-dfsb-adapter.php
          python3 wp-content/plugins/mad4b-site-control-plane/tests/etg-dfsb-adapter-contract.py

  php-compatibility:
    name: ETG adapter PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint adapter
        run: php -l wp-content/plugins/mad4b-site-control-plane/includes/adapters/class-mad4b-scp-etg-dfsb-adapter.php

  exact-alpha13-runtime:
    name: Exact ETG Alpha13 MCP runtime
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Materialize exact ETG Alpha13 candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$ETG_HEAD" --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$ETG_HEAD"
          git checkout "$ETG_HEAD" -- wp-content/plugins/etg-dynamic-filter-seo-bridge
          grep -Fq "Version: 0.4.0-alpha.13" wp-content/plugins/etg-dynamic-filter-seo-bridge/etg-dynamic-filter-seo-bridge.php
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring
          coverage: none
      - name: Install WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar --info
      - name: Provision disposable WordPress 6.9
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-etg-wordpress
          rm -rf "$WP_PATH"
          mkdir -p "$WP_PATH"
          php /tmp/wp-cli.phar core download --path="$WP_PATH" --version=6.9 --force
          php /tmp/wp-cli.phar config create --path="$WP_PATH" --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core install --path="$WP_PATH" --url='http://mad4b-etg.test' --title='MAD4B ETG MCP Runtime' --admin_user='mad4b-ci-admin' --admin_password='ci-only-not-a-secret' --admin_email='ci@example.invalid' --skip-email
      - name: Install exact providers, ETG and MAD4B control plane
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH=/tmp/mad4b-etg-wordpress
          unzip -q wp-content/plugins/mcp-adapter.zip -d "$WP_PATH/wp-content/plugins"
          unzip -q wp-content/plugins/elementor.zip -d "$WP_PATH/wp-content/plugins"
          unzip -q wp-content/plugins/jet-engine.zip -d "$WP_PATH/wp-content/plugins"
          unzip -q wp-content/plugins/jet-smart-filters.zip -d "$WP_PATH/wp-content/plugins"
          cp -R wp-content/plugins/etg-dynamic-filter-seo-bridge "$WP_PATH/wp-content/plugins/etg-dynamic-filter-seo-bridge"
          cp -R wp-content/plugins/mad4b-site-control-plane "$WP_PATH/wp-content/plugins/mad4b-site-control-plane"
          php /tmp/wp-cli.phar plugin activate mcp-adapter --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate elementor --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate jet-engine --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate jet-smart-filters --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate etg-dynamic-filter-seo-bridge --path="$WP_PATH"
          php /tmp/wp-cli.phar plugin activate mad4b-site-control-plane --path="$WP_PATH"
      - name: Prove ETG services are exposed only through mad4b-read
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file \
            "$GITHUB_WORKSPACE/wp-content/plugins/mad4b-site-control-plane/tests/runtime-etg-dfsb-mcp-smoke.php" \
            --path=/tmp/mad4b-etg-wordpress --user=mad4b-ci-admin
